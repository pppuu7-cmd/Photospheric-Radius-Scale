name: RTK Route-B U1 universal-matter FLRW PPN DOF trilemma

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-universal-matter-flrw-ppn-dof-trilemma-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run universal-matter trilemma theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_universal_matter_flrw_ppn_dof_trilemma_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_universal_matter_flrw_ppn_dof_trilemma_provenance.txt
          python3 rtk/route_b_u1_universal_matter_flrw_ppn_dof_trilemma_gate.py | tee u1_universal_matter_flrw_ppn_dof_trilemma.log
          grep -q '^RTK_ROUTE_B_U1_UNIVERSAL_MATTER_FLRW_PPN_DOF_TRILEMMA ' u1_universal_matter_flrw_ppn_dof_trilemma.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_universal_matter_flrw_ppn_dof_trilemma_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_UNIVERSAL_MATTER_FLRW_PPN_DOF_TRILEMMA'
          assert r['status_scope']=='BLACK_SCOPED_PUBLISHED_UNIVERSAL_MATTER_NO_COMPENSATOR_CLASS'
          print('U1_UNIVERSAL_MATTER_TRILEMMA_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-universal-matter-flrw-ppn-dof-trilemma
          path: |
            u1_universal_matter_flrw_ppn_dof_trilemma.log
            u1_universal_matter_flrw_ppn_dof_trilemma_result.json
            u1_universal_matter_flrw_ppn_dof_trilemma_provenance.txt
          if-no-files-found: error
