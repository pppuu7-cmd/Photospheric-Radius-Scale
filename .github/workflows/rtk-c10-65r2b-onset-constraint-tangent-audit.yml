name: RTK C10.65r2b onset constraint tangent audit

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - 'research/theory_targets/RTK_C10_65R2B_ONSET_CONSTRAINT_TANGENT_AUDIT_TARGET_v1.json'
      - 'research/shadow/rtk_c10_65r2b_onset_constraint_tangent_audit.py'
      - '.github/workflows/rtk-c10-65r2b-onset-constraint-tangent-audit.yml'

permissions:
  contents: write

jobs:
  tangent-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install high precision dependency
        run: python3 -m pip install --disable-pip-version-check 'mpmath==1.3.0'
      - name: Record starting provenance
        run: git rev-parse HEAD | tee c10_65r2b_repo_head.txt
      - name: Verify unchanged r2 parent target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_65R2_IN_CLASS_FIRST_RHS_DIAGNOSTIC_PARITY_TARGET_v1.json'))
          b=json.load(open('research/theory_targets/RTK_C10_65R2B_ONSET_CONSTRAINT_TANGENT_AUDIT_TARGET_v1.json'))
          assert t['status']=='FROZEN_BEFORE_IMPLEMENTATION'
          assert b['status']=='FROZEN_BEFORE_EXECUTION'
          assert b['r2_frozen_target_unchanged'] is True
          assert t['frozen_checks']['max_C_vs_local_python_first_rhs_relative']==5e-9
          PY
      - name: Execute pre-registered tangent discriminator
        run: |
          set -euo pipefail
          python3 -m py_compile research/shadow/rtk_c10_65r2b_onset_constraint_tangent_audit.py
          python3 research/shadow/rtk_c10_65r2b_onset_constraint_tangent_audit.py | tee c10_65r2b.log
          grep -Eq '^C10_65R2B_(TANGENT_PASS_SCOPED|NON_TANGENT_RESOLVED_SCOPED) ' c10_65r2b.log
      - name: Add immutable provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,datetime
          p='research/theory_results/RTK_C10_65R2B_ONSET_CONSTRAINT_TANGENT_AUDIT_RESULT_v1.json'
          d=json.load(open(p)); d['provenance']={'repo_head_at_job_start':open('c10_65r2b_repo_head.txt').read().strip(),'workflow':'rtk-c10-65r2b-onset-constraint-tangent-audit.yml','worker':'research/shadow/rtk_c10_65r2b_onset_constraint_tangent_audit.py','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'threshold_changed':False,'class_upstream_sha':'36cf283628c4a3330ec9fd3d84239bf775f77317'}
          open(p,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - name: Persist scoped result
        run: |
          set -euo pipefail
          cp research/theory_results/RTK_C10_65R2B_ONSET_CONSTRAINT_TANGENT_AUDIT_RESULT_v1.json /tmp/r2b.json
          for attempt in 1 2 3 4 5; do
            git fetch origin rtk-class-build
            git reset --hard origin/rtk-class-build
            cp /tmp/r2b.json research/theory_results/RTK_C10_65R2B_ONSET_CONSTRAINT_TANGENT_AUDIT_RESULT_v1.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/theory_results/RTK_C10_65R2B_ONSET_CONSTRAINT_TANGENT_AUDIT_RESULT_v1.json
            git commit -m 'Record C10.65r2b tangent audit' || exit 0
            if git push origin HEAD:rtk-class-build; then exit 0; fi
          done
          exit 1
