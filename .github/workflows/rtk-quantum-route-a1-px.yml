name: RTK Route A1 long-wave P(X) reconstruction

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rtk-quantum-route-a1-px.yml'

permissions:
  contents: read

jobs:
  symbolic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - name: Install pinned SymPy
        run: python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Verify thermodynamics, P(X) cubic theorem, and dust-limit asymptotics
        run: |
          set -euo pipefail
          echo "RTK_SOURCE_SHA=$(git rev-parse HEAD)" | tee route_a1_px_provenance.txt
          python3 rtk/quantum_route_a1_px_reconstruction.py | tee route_a1_px_audit.log
          grep -q RTK_ROUTE_A1_PX_RECONSTRUCTION_PASS route_a1_px_audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-a1-px-reconstruction
          path: |
            route_a1_px_provenance.txt
            route_a1_px_audit.log
          if-no-files-found: error
