name: RTK C10.65s4a3 targeted endpoint materialization repair
on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths: ['.github/workflows/rtk-c10-65s4a3-targeted-endpoint-materialization-repair.yml','research/triggers/RTK_C10_65S4A3_TRIGGER_v1.txt','research/shadow/rtk_c10_65s4a3_targeted_endpoint_materialization_repair.py']
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
    steps:
      - uses: actions/checkout@v4
        with: {ref: rtk-class-build, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.3'}
      - name: Verify frozen contract
        run: |
          set -euo pipefail
          git rev-parse HEAD > s4a3_head.txt
          python3 - <<'PY'
          import json
          L=lambda p:json.load(open(p))
          t=L('research/theory_targets/RTK_C10_65S4A3_TARGETED_ENDPOINT_MATERIALIZATION_REPAIR_TARGET_v1.json');g=L('research/theory_results/RTK_C10_65S4A2_EXACT_ONSET_GEOMETRY_AUDIT_RESULT_v1.json');s=L('research/theory_results/RTK_C10_65S4A_MODERATE_K_ONSET_STATE_DOMAIN_PREFLIGHT_RESULT_v1.json');s1=L('research/theory_results/RTK_C10_65S4A1_EXACT_ONSET_SAMPLING_REPAIR_RESULT_v1.json')
          assert t['status']=='FROZEN_BEFORE_IMPLEMENTATION';assert g['classification']=='C10_65S4A2_EXACT_ONSET_GEOMETRY_AUDIT_PASS_SCOPED';assert g['provenance']['github_actions_run_id']==33009457306
          assert s['classification']=='C10_65S4A_MODERATE_K_ONSET_STATE_DOMAIN_PREFLIGHT_FAIL_SCOPED';assert s['provenance']['github_actions_run_id']==33008706959;assert s['provenance']['historical_failed_attempt_run_id']==33008095108
          assert s1['classification']=='C10_65S4A1_EXACT_ONSET_SAMPLING_REPAIR_PASS_SCOPED';assert t['immutable_s4a_scientific_contract']['scientific_thresholds_changed'] is False
          print('C10_65S4A3_FROZEN_CONTRACT_VERIFIED')
          PY
      - name: Prepare pinned CLASS tree and repair
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_s4a3
          git -C class_s4a3 reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_s4a3/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_s4a3/include/
          for s in apply_rtk_class_patch.py upgrade_rtk_inputs.py upgrade_rtk_nonlocal_initial_conditions.py upgrade_rtk_initial_conditions.py upgrade_rtk_matter_sources.py upgrade_rtk_gamma_root.py upgrade_rtk_spectra_endpoint.py apply_rtk_c10_source_export_patch.py apply_rtk_c10_65a_species_control_patch.py apply_rtk_c10_65e_tca_coefficient_export_patch.py apply_rtk_c10_65r0_opt_in_local_environment_export_patch.py apply_rtk_c10_65r1_in_class_completed_projector_parity_patch.py stabilize_rtk_c10_65r1_conditioned_projector.py apply_rtk_c10_65s1_readonly_state_observer_patch.py apply_rtk_c10_65s4a3_targeted_endpoint_materialization_patch.py; do python3 "rtk/$s" class_s4a3; done
          make -C class_s4a3 -j2 class
      - name: Execute frozen s4a3 audit
        run: |
          set -euo pipefail
          python3 -m py_compile research/shadow/rtk_c10_65s4a3_targeted_endpoint_materialization_repair.py rtk/apply_rtk_c10_65s4a3_targeted_endpoint_materialization_patch.py
          python3 research/shadow/rtk_c10_65s4a3_targeted_endpoint_materialization_repair.py --class-tree class_s4a3 --patch rtk/apply_rtk_c10_65s4a3_targeted_endpoint_materialization_patch.py --output research/theory_results/RTK_C10_65S4A3_TARGETED_ENDPOINT_MATERIALIZATION_REPAIR_RESULT_v1.json | tee s4a3.log
          grep -q '^C10_65S4A3_TARGETED_ENDPOINT_MATERIALIZATION_REPAIR_PASS_SCOPED' s4a3.log
      - name: Add immutable provenance
        if: always()
        run: |
          set -euo pipefail
          p=research/theory_results/RTK_C10_65S4A3_TARGETED_ENDPOINT_MATERIALIZATION_REPAIR_RESULT_v1.json; [ -f "$p" ] || exit 0
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('research/theory_results/RTK_C10_65S4A3_TARGETED_ENDPOINT_MATERIALIZATION_REPAIR_RESULT_v1.json');d=json.loads(p.read_text());d['provenance']={'repo_head_at_job_start':pathlib.Path('s4a3_head.txt').read_text().strip(),'class_upstream_sha':os.environ['RTK_CLASS_UPSTREAM_SHA'],'workflow':'rtk-c10-65s4a3-targeted-endpoint-materialization-repair.yml','patch':'rtk/apply_rtk_c10_65s4a3_targeted_endpoint_materialization_patch.py','analyzer':'research/shadow/rtk_c10_65s4a3_targeted_endpoint_materialization_repair.py','github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'threshold_changed':False};p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          c=pathlib.Path('research/checkpoints/RTK_C10_65S4A3_TARGETED_ENDPOINT_REPAIR_2026-08-26T2030Z.md');c.write_text('# RTK C10.65s4a3 targeted endpoint materialization repair\n\nClassification: `'+d['classification']+'`. Historical C10.65s4a failures 33008095108 and 33008706959 remain preserved. Earlier s4a3 implementation-only failed runs 33010618236, 33010775420 and 33010968444 are not scientific failures. The repair is sampling-only and only applies to k=1e-3,3e-3 Mpc^-1. Regression k and dormant execution retain the original unsplit evolver path. No dy, metric, state, tolerance, approximation-criterion, or scientific-threshold mutation.\n\nNext only if PASS: retry the unchanged frozen C10.65s4a scientific analyzer with s4a3 enabled solely at the two new k anchors.\n')
          PY
      - name: Persist result and checkpoint
        if: always()
        run: |
          set -euo pipefail
          p=research/theory_results/RTK_C10_65S4A3_TARGETED_ENDPOINT_MATERIALIZATION_REPAIR_RESULT_v1.json;c=research/checkpoints/RTK_C10_65S4A3_TARGETED_ENDPOINT_REPAIR_2026-08-26T2030Z.md;[ -f "$p" ] || exit 0
          cp "$p" /tmp/r.json;cp "$c" /tmp/c.md
          for n in 1 2 3 4 5;do git fetch origin rtk-class-build;git reset --hard origin/rtk-class-build;cp /tmp/r.json "$p";cp /tmp/c.md "$c";git config user.name github-actions[bot];git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add "$p" "$c";git commit -m 'Record C10.65s4a3 targeted endpoint repair' || exit 0;git push origin HEAD:rtk-class-build && exit 0;done;exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c10-65s4a3-targeted-endpoint-repair
          path: |
            s4a3.log
            research/theory_results/RTK_C10_65S4A3_TARGETED_ENDPOINT_MATERIALIZATION_REPAIR_RESULT_v1.json
