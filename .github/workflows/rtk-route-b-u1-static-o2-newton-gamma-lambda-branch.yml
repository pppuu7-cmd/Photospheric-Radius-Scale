name: RTK Route-B U1 static O2 Newton gamma lambda branch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-static-o2-newton-gamma-lambda-branch-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run static O2 lambda-branch theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_static_o2_newton_gamma_lambda_branch_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_static_o2_newton_gamma_lambda_branch_provenance.txt
          python3 rtk/route_b_u1_static_o2_newton_gamma_lambda_branch_gate.py | tee u1_static_o2_newton_gamma_lambda_branch.log
          grep -q '^RTK_ROUTE_B_U1_STATIC_O2_NEWTON_GAMMA_LAMBDA_BRANCH_PASS ' u1_static_o2_newton_gamma_lambda_branch.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_static_o2_newton_gamma_lambda_branch_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_STATIC_O2_NEWTON_GAMMA_LAMBDA_BRANCH_PASS'
          assert 'gamma_PPN=1' in r['solutions']
          assert 'lambda_HL>1' in r['lambda_result']
          assert any('does not certify beta_PPN' in x for x in r['non_claims'])
          print('U1_STATIC_O2_NEWTON_GAMMA_LAMBDA_BRANCH_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-static-o2-newton-gamma-lambda-branch
          path: |
            u1_static_o2_newton_gamma_lambda_branch.log
            u1_static_o2_newton_gamma_lambda_branch_result.json
            u1_static_o2_newton_gamma_lambda_branch_provenance.txt
            rtk/route_b_u1_static_o2_newton_gamma_lambda_branch_gate.py
          if-no-files-found: error
