name: RTK C9 scalar intrinsic-curvature UV carrier

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c9-rtk-scalar-intrinsic-curvature-uv-carrier-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run intrinsic-curvature UV carrier theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/c9_rtk_scalar_intrinsic_curvature_uv_carrier_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee c9_rtk_scalar_intrinsic_curvature_uv_carrier_provenance.txt
          python3 rtk/c9_rtk_scalar_intrinsic_curvature_uv_carrier_gate.py | tee c9_rtk_scalar_intrinsic_curvature_uv_carrier.log
          grep -q '^RTK_C9_RTK_SCALAR_INTRINSIC_CURVATURE_UV_CARRIER_PASS ' c9_rtk_scalar_intrinsic_curvature_uv_carrier.log
          python3 - <<'PY'
          import json
          r=json.load(open('c9_rtk_scalar_intrinsic_curvature_uv_carrier_result.json'))
          assert r['classification']=='RTK_C9_RTK_SCALAR_INTRINSIC_CURVATURE_UV_CARRIER_PASS'
          assert 'do not create a quadratic tensor' in r['tensor_statement']
          print('C9_RTK_SCALAR_INTRINSIC_CURVATURE_UV_CARRIER_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c9-rtk-scalar-intrinsic-curvature-uv-carrier
          path: |
            c9_rtk_scalar_intrinsic_curvature_uv_carrier.log
            c9_rtk_scalar_intrinsic_curvature_uv_carrier_result.json
            c9_rtk_scalar_intrinsic_curvature_uv_carrier_provenance.txt
            rtk/c9_rtk_scalar_intrinsic_curvature_uv_carrier_gate.py
          if-no-files-found: error
