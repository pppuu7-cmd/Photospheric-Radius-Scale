name: RTK C10.65i coupled coefficient nullity with symbolic C2

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - 'research/theory_targets/RTK_C10_65I_COUPLED_COEFFICIENT_NULLITY_WITH_SYMBOLIC_C2_TARGET_v1.json'
      - 'research/shadow/rtk_c10_65i_coupled_coefficient_nullity_with_symbolic_c2.py'
      - '.github/workflows/rtk-c10-65i-coupled-coefficient-nullity-with-symbolic-c2.yml'

permissions:
  contents: write

jobs:
  nullity-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install symbolic and numeric dependencies
        run: python3 -m pip install --disable-pip-version-check 'sympy==1.14.0' 'numpy==2.3.2'
      - name: Execute frozen C10.65i audit
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee c10_65i_repo_head.txt
          python3 -m py_compile research/shadow/rtk_c10_65i_coupled_coefficient_nullity_with_symbolic_c2.py
          python3 research/shadow/rtk_c10_65i_coupled_coefficient_nullity_with_symbolic_c2.py | tee c10_65i.log
          grep -q '^C10_65I_COUPLED_COEFFICIENT_NULLITY_REMAINING_TEMPORAL_AMPLITUDES_8_SCOPED ' c10_65i.log
      - name: Add immutable provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='research/theory_results/RTK_C10_65I_COUPLED_COEFFICIENT_NULLITY_WITH_SYMBOLIC_C2_RESULT_v1.json'
          d=json.load(open(p))
          d['provenance']={
            'repo_head_at_job_start':open('c10_65i_repo_head.txt').read().strip(),
            'workflow':'rtk-c10-65i-coupled-coefficient-nullity-with-symbolic-c2.yml',
            'worker':'research/shadow/rtk_c10_65i_coupled_coefficient_nullity_with_symbolic_c2.py',
            'numpy':'2.3.2','sympy':'1.14.0'
          }
          open(p,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - name: Persist result
        run: |
          set -euo pipefail
          cp research/theory_results/RTK_C10_65I_COUPLED_COEFFICIENT_NULLITY_WITH_SYMBOLIC_C2_RESULT_v1.json /tmp/c10_65i_result.json
          for attempt in 1 2 3 4 5; do
            git fetch origin rtk-class-build
            git reset --hard origin/rtk-class-build
            cp /tmp/c10_65i_result.json research/theory_results/RTK_C10_65I_COUPLED_COEFFICIENT_NULLITY_WITH_SYMBOLIC_C2_RESULT_v1.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/theory_results/RTK_C10_65I_COUPLED_COEFFICIENT_NULLITY_WITH_SYMBOLIC_C2_RESULT_v1.json
            git commit -m 'Record C10.65i coupled coefficient nullity audit' || exit 0
            if git push origin HEAD:rtk-class-build; then exit 0; fi
          done
          exit 1
