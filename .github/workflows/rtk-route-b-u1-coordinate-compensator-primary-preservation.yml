name: RTK Route-B U1 coordinate-compensator primary preservation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-coordinate-compensator-primary-preservation-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run coordinate-compensator theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_coordinate_compensator_primary_preservation_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_coordinate_compensator_primary_preservation_provenance.txt
          python3 rtk/route_b_u1_coordinate_compensator_primary_preservation_gate.py | tee u1_coordinate_compensator_primary_preservation.log
          grep -q '^RTK_ROUTE_B_U1_COORDINATE_COMPENSATOR_PRIMARY_PRESERVATION_PASS ' u1_coordinate_compensator_primary_preservation.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_coordinate_compensator_primary_preservation_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_COORDINATE_COMPENSATOR_PRIMARY_PRESERVATION_PASS'
          assert r['status_scope']=='YELLOW_CONSTRUCTIVE_DEGENERACY_RESCUE_FULL_CROSSBLOCK_RANK_PENDING'
          assert r['primary_degeneracy']['d_pnu_d_dotSigma']=='0'
          print('U1_COORDINATE_COMPENSATOR_PRIMARY_PRESERVATION_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-coordinate-compensator-primary-preservation
          path: |
            u1_coordinate_compensator_primary_preservation.log
            u1_coordinate_compensator_primary_preservation_result.json
            u1_coordinate_compensator_primary_preservation_provenance.txt
            rtk/route_b_u1_coordinate_compensator_primary_preservation_gate.py
          if-no-files-found: error
