name: RTK C9 HMT lambda1 S3 spatial FP signed phase
on:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/rtk-c9-hmt-lambda1-s3-spatial-fp-signed-phase-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen target ancestry and immutability
        run: |
          git cat-file -e de512708872f214afb26857bee4f707b03c3ea86^{commit}
          git merge-base --is-ancestor de512708872f214afb26857bee4f707b03c3ea86 HEAD
          python - <<'PY'
          import json, subprocess
          p='research/theory_targets/RTK_C9_HMT_LAMBDA1_S3_SPATIAL_FP_SIGNED_PHASE_TARGET_v1.json'
          d=json.load(open(p))
          assert d['scientific_parent_head']=='83ae30fee6d77a3ea42ede57823bedc2875abfdf'
          assert d['frozen_operator']=='M^i_j=nabla^2 delta^i_j+R^i_j'
          assert d['frozen_pass_criteria']['combined_phase']=='+1'
          assert d['scope_guards']['threshold_changed'] is False
          assert d['scope_guards']['no_DSIR'] is True
          frozen=json.loads(subprocess.check_output(['git','show','de512708872f214afb26857bee4f707b03c3ea86:'+p],text=True))
          assert frozen==d
          PY
      - name: Run signed phase audit
        run: |
          python -m py_compile research/shadow/rtk_c9_hmt_lambda1_s3_spatial_fp_signed_phase.py
          python research/shadow/rtk_c9_hmt_lambda1_s3_spatial_fp_signed_phase.py
      - name: Enforce scoped classification
        run: |
          python - <<'PY'
          import json
          p='research/theory_results/RTK_C9_HMT_LAMBDA1_S3_SPATIAL_FP_SIGNED_PHASE_RESULT_v1.json'
          d=json.load(open(p)); c=d['scientific_checks']; f=d['findings']
          assert d['classification']=='RTK_C9_HMT_LAMBDA1_S3_SPATIAL_FP_PRINCIPAL_CUT_PHASE_TRIVIAL_COMBINED_PASS_SCOPED'
          for k in ['signed_transverse_spectrum_consistent','signed_longitudinal_spectrum_consistent','zeta_negative_T0_exact_minus5','zeta_negative_L0_exact_minus5','principal_cut_transverse_phase_minus1','principal_cut_longitudinal_phase_minus1','principal_cut_combined_phase_plus1','minusM_four_negative_modes_even_sign_plus1']:
            assert c[k] is True, k
          assert f['nonzero_spatial_FP_principal_cut_phase_assigned'] is True
          assert f['combined_nonzero_spatial_FP_phase_is_trivial_under_frozen_cut'] is True
          for k in ['phase_is_convention_independent_observable','complete_signed_spatial_FP_factor_combined_with_zero_mode_quotient','full_FP_determinant_computed','full_FS_determinant_computed','full_gravitational_Hessian_determinant_computed','complete_HMT_gauge_fixed_constraint_matrix_constructed','full_HMT_one_loop_evaluable','full_C9_closed','ordinary_projectable_parent_beta_functions_imported','unresolved_HMT_matter_coefficients_chosen','soft_s_retest_allowed','production_k003_unblocked','threshold_changed']:
            assert f[k] is False, k
          assert f['no_DSIR'] is True
          PY
      - name: Persist result checkpoint provenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C9_HMT_LAMBDA1_S3_SPATIAL_FP_SIGNED_PHASE_RESULT_v1.json research/checkpoints/RTK_C9_HMT_LAMBDA1_S3_SPATIAL_FP_SIGNED_PHASE_2026-08-28.md research/provenance/RTK_C9_HMT_LAMBDA1_S3_SPATIAL_FP_SIGNED_PHASE_PROVENANCE_v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record C9 HMT spatial FP signed-phase audit'
            git push origin HEAD:rtk-class-build
          fi
