name: RTK Route-B U1 flat TT all-q stability

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-flat-tt-allq-stability-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run flat TT all-q stability theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_flat_tt_allq_stability_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_flat_tt_allq_stability_provenance.txt
          python3 rtk/route_b_u1_flat_tt_allq_stability_gate.py | tee u1_flat_tt_allq_stability.log
          grep -q '^RTK_ROUTE_B_U1_FLAT_TT_ALLQ_STABILITY_PASS ' u1_flat_tt_allq_stability.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_flat_tt_allq_stability_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_FLAT_TT_ALLQ_STABILITY_PASS'
          assert 'gamma3>-2 sqrt(gamma5)' in r['exact_positive_domain']
          assert 'c_T^2=1' in r['ir_speed']
          assert any('does not freeze gamma3' in x for x in r['non_claims'])
          print('U1_FLAT_TT_ALLQ_STABILITY_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-flat-tt-allq-stability
          path: |
            u1_flat_tt_allq_stability.log
            u1_flat_tt_allq_stability_result.json
            u1_flat_tt_allq_stability_provenance.txt
            rtk/route_b_u1_flat_tt_allq_stability_gate.py
          if-no-files-found: error
