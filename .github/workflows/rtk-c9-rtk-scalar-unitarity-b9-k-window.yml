name: RTK C9 scalar unitarity B9 k-window

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c9-rtk-scalar-unitarity-b9-k-window-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install pinned numerical runtime
        run: python -m pip install --disable-pip-version-check 'numpy==2.5.2'
      - name: Run B9 momentum-window unitarity margin gate
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/c9_rtk_scalar_unitarity_b9_k_window_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee c9_rtk_scalar_unitarity_b9_k_window_provenance.txt
          python3 rtk/c9_rtk_scalar_unitarity_b9_k_window_gate.py | tee c9_rtk_scalar_unitarity_b9_k_window.log
          grep -q '^RTK_C9_RTK_SCALAR_UNITARITY_B9_K_WINDOW_PASS ' c9_rtk_scalar_unitarity_b9_k_window.log
          python3 - <<'PY'
          import json
          r=json.load(open('c9_rtk_scalar_unitarity_b9_k_window_result.json'))
          assert r['classification']=='RTK_C9_RTK_SCALAR_UNITARITY_B9_K_WINDOW_PASS'
          assert r['minimum_margin']['margin_kunit_over_kphys']>1e15
          assert r['monotonic_kunit_violations_on_grid']==0
          print('C9_RTK_SCALAR_UNITARITY_B9_K_WINDOW_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c9-rtk-scalar-unitarity-b9-k-window
          path: |
            c9_rtk_scalar_unitarity_b9_k_window.log
            c9_rtk_scalar_unitarity_b9_k_window_result.json
            c9_rtk_scalar_unitarity_b9_k_window_provenance.txt
            rtk/c9_rtk_scalar_unitarity_b9_k_window_gate.py
          if-no-files-found: error
