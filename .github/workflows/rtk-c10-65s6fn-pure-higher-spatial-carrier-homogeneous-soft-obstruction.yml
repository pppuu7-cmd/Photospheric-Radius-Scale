name: RTK C10.65s6fN pure higher-spatial carrier soft obstruction

on:
  push:
    branches: [ rtk-class-build ]
    paths:
      - 'research/theory_targets/RTK_C10_65S6FN_PURE_HIGHER_SPATIAL_CARRIER_HOMOGENEOUS_SOFT_OBSTRUCTION_TARGET_v1.json'
      - 'research/shadow/rtk_c10_65s6fn_pure_higher_spatial_carrier_homogeneous_soft_obstruction.py'
      - '.github/workflows/rtk-c10-65s6fn-pure-higher-spatial-carrier-homogeneous-soft-obstruction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Execute frozen s6fN theorem
        run: |
          set -euo pipefail
          python research/shadow/rtk_c10_65s6fn_pure_higher_spatial_carrier_homogeneous_soft_obstruction.py | tee /tmp/s6fn.log
      - name: Add immutable provenance
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('research/theory_results/RTK_C10_65S6FN_PURE_HIGHER_SPATIAL_CARRIER_HOMOGENEOUS_SOFT_OBSTRUCTION_RESULT_v1.json')
          x=json.loads(p.read_text())
          x['provenance']={
            'github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),
            'repo_head_at_job_start':os.environ['GITHUB_SHA'],
            'frozen_target_commit':'e54b9c22d32b4d078826d03d6460cdd3bbabd30c',
            'workflow':'rtk-c10-65s6fn-pure-higher-spatial-carrier-homogeneous-soft-obstruction.yml',
            'threshold_changed':False
          }
          p.write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          PY
      - name: Persist result and checkpoint
        run: |
          set -euo pipefail
          ts=$(date -u +%Y-%m-%dT%H%MZ)
          cpfile="research/checkpoints/RTK_C10_65S6FN_HIGHER_SPATIAL_SOFT_OBSTRUCTION_${ts}.md"
          python - <<'PY' > "$cpfile"
          import json
          from pathlib import Path
          x=json.loads(Path('research/theory_results/RTK_C10_65S6FN_PURE_HIGHER_SPATIAL_CARRIER_HOMOGENEOUS_SOFT_OBSTRUCTION_RESULT_v1.json').read_text())
          print('# RTK C10.65s6fN pure higher-spatial carrier homogeneous-soft theorem')
          print()
          print('Classification:',x['classification'])
          print('Decision:',x['decision'])
          print()
          print('Frozen target commit: `e54b9c22d32b4d078826d03d6460cdd3bbabd30c`.')
          print('No new operator coefficient, numerical scale, production output, or post-result threshold was used.')
          print()
          print('Theorem: homogeneous conformal weight = `1-2n`; it has no zero for integer n>=1.')
          print('n=2 source-lock:',x['theorem']['n2_predicted_K3_s'],'= archived',x['theorem']['n2_archived_K3_s'])
          print()
          print('Interpretation:',x['interpretation'])
          print()
          print('Next gate:',x['next_gate'])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/theory_results/RTK_C10_65S6FN_PURE_HIGHER_SPATIAL_CARRIER_HOMOGENEOUS_SOFT_OBSTRUCTION_RESULT_v1.json "$cpfile"
          git commit -m "Record C10.65s6fN higher-spatial carrier obstruction" || exit 0
          git pull --rebase origin rtk-class-build
          git push origin HEAD:rtk-class-build
