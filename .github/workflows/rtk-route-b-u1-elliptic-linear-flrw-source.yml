name: RTK Route-B U1 elliptic linear FLRW source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-elliptic-linear-flrw-source-trigger.txt'

permissions:
  contents: write

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Verify frozen target
        run: |
          python3 - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_ROUTE_B_U1_ELLIPTIC_LINEAR_FLRW_SOURCE_TARGET_v1.json'))
          assert t['classification']=='RTK_ROUTE_B_U1_ELLIPTIC_LINEAR_FLRW_SOURCE_TARGET_V1_FROZEN'
          assert t['status']=='FROZEN_BEFORE_LINEAR_FLRW_SOURCE_RESULT'
          print('LINEAR_FLRW_SOURCE_TARGET_PASS')
          PY
      - name: Run exact linear source theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_elliptic_linear_flrw_source_gate.py
          git rev-parse HEAD | tee u1_elliptic_linear_flrw_source_source.txt
          python3 rtk/route_b_u1_elliptic_linear_flrw_source_gate.py | tee u1_elliptic_linear_flrw_source.log
          grep -q '^RTK_ROUTE_B_U1_ELLIPTIC_LINEAR_FLRW_SOURCE_PASS ' u1_elliptic_linear_flrw_source.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_elliptic_linear_flrw_source_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_ELLIPTIC_LINEAR_FLRW_SOURCE_PASS'
          assert r['fourier_result']['delta_J_A_total']=='-a1_eff delta H0'
          assert 'second order' in r['perturbative_order_guard']
          print('LINEAR_FLRW_SOURCE_RESULT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-elliptic-linear-flrw-source
          path: |
            u1_elliptic_linear_flrw_source.log
            u1_elliptic_linear_flrw_source_result.json
            u1_elliptic_linear_flrw_source_source.txt
            research/theory_targets/RTK_ROUTE_B_U1_ELLIPTIC_LINEAR_FLRW_SOURCE_TARGET_v1.json
            rtk/route_b_u1_elliptic_linear_flrw_source_gate.py
          if-no-files-found: error
      - name: Persist result
        if: success()
        run: |
          set -euo pipefail
          cp u1_elliptic_linear_flrw_source_result.json /tmp/result.json
          git fetch origin rtk-class-build
          git reset --hard origin/rtk-class-build
          mkdir -p research/theory_results
          cp /tmp/result.json research/theory_results/RTK_ROUTE_B_U1_ELLIPTIC_LINEAR_FLRW_SOURCE_RESULT_v1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_ROUTE_B_U1_ELLIPTIC_LINEAR_FLRW_SOURCE_RESULT_v1.json
          git commit -m 'Record elliptic linear FLRW source result'
          git push origin HEAD:rtk-class-build
