name: RTK Route-B U1 family-I FLRW A-constraint obstruction

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-family1-flrw-A-constraint-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run FLRW A-constraint theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_family1_flrw_A_constraint_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_family1_flrw_A_constraint_provenance.txt
          python3 rtk/route_b_u1_family1_flrw_A_constraint_gate.py | tee u1_family1_flrw_A_constraint.log
          grep -q '^RTK_ROUTE_B_U1_FAMILY1_FLRW_A_CONSTRAINT_OBSTRUCTION ' u1_family1_flrw_A_constraint.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_family1_flrw_A_constraint_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_FAMILY1_FLRW_A_CONSTRAINT_OBSTRUCTION'
          assert r['status_scope']=='BLACK_SCOPED_CURRENT_UNIVERSAL_FAMILY1_MATTER_FRAME_FLRW'
          assert r['fixed_rtk_scalar_A_source'].startswith('0')
          print('U1_FAMILY1_FLRW_A_CONSTRAINT_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-family1-flrw-A-constraint
          path: |
            u1_family1_flrw_A_constraint.log
            u1_family1_flrw_A_constraint_result.json
            u1_family1_flrw_A_constraint_provenance.txt
          if-no-files-found: error
