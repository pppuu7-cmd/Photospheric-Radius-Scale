name: RTK C10.65s4e moderate-k trajectory-sampled constraints
on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths: ['research/triggers/RTK_C10_65S4E_TRIGGER_v1.txt']
permissions: {contents: write, actions: read}
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with: {ref: rtk-class-build, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.3'}
      - name: Verify frozen parents and criteria
        run: |
          set -euo pipefail
          git rev-parse HEAD > s4e_head.txt
          python3 - <<'PY'
          import json
          L=lambda p:json.load(open(p))
          t=L('research/theory_targets/RTK_C10_65S4E_MODERATE_K_TRAJECTORY_SAMPLED_CONSTRAINT_TARGET_v1.json')
          d=L('research/theory_results/RTK_C10_65S4D_MODERATE_K_ONE_ACCEPTED_STEP_PRODUCTION_CANARY_RESULT_v1.json')
          s=L('research/theory_results/RTK_C10_65S3B_TRAJECTORY_SAMPLED_CONSTRAINT_RESULT_v1.json')
          e=L('research/theory_results/RTK_C10_65S2E_CURRENT_STATE_DERIVATIVE_SLIP_CLOSURE_RESULT_v1.json')
          assert t['status']=='FROZEN_BEFORE_EXECUTION'
          assert t['sample_elapsed_tau_Mpc']==[1e-9,3e-9,1e-8,3e-8,1e-7,3e-7,1e-6]
          assert t['constraint_policy']['max_abs_normalized_each_sample']==1e-10
          assert t['constraint_policy']['max_abs_normalized_change_from_onset']==1e-10
          assert t['domain']['k_Mpc_inv']==[0.001,0.003]
          assert d['classification']=='C10_65S4D_MODERATE_K_ONE_ACCEPTED_STEP_PRODUCTION_CANARY_PASS_SCOPED'
          assert s['classification']=='C10_65S3B_TRAJECTORY_SAMPLED_CONSTRAINT_PASS_SCOPED'
          assert e['classification']=='C10_65S2E_CURRENT_STATE_DERIVATIVE_SLIP_CLOSURE_FAIL_SCOPED'
          print('C10_65S4E_FROZEN_PARENTS_VERIFIED')
          PY
      - name: Prepare pinned control and moderate-k production tree
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_control
          git -C class_control reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_control/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_control/include/
          for x in apply_rtk_class_patch.py upgrade_rtk_inputs.py upgrade_rtk_nonlocal_initial_conditions.py upgrade_rtk_initial_conditions.py upgrade_rtk_matter_sources.py upgrade_rtk_gamma_root.py upgrade_rtk_spectra_endpoint.py apply_rtk_c10_source_export_patch.py apply_rtk_c10_65a_species_control_patch.py apply_rtk_c10_65e_tca_coefficient_export_patch.py apply_rtk_c10_65r0_opt_in_local_environment_export_patch.py apply_rtk_c10_65r1_in_class_completed_projector_parity_patch.py stabilize_rtk_c10_65r1_conditioned_projector.py; do python3 "rtk/$x" class_control; done
          make -C class_control -j2 class
          cp -a class_control class_s4e
          python3 rtk/apply_rtk_c10_65s2_production_canary_patch_v3.py class_s4e
          python3 rtk/apply_rtk_c10_65s4d_moderate_k_seed_width_patch.py class_s4e
          python3 - <<'PY'
          from pathlib import Path
          s=Path('class_s4e/source/rtk_c10_65s2_class_bridge.c').read_text()
          assert 'static const s2seed S[2]' in s and 'for(i=0;i<2;i++)' in s
          for z in ['1.0000000000000001e-05','3.0000000000000001e-05']: assert z not in s
          print('C10_65S4E_MODERATE_DOMAIN_SOURCE_GUARD_PASS')
          PY
          make -C class_s4e clean
          make -C class_s4e -j2 class
      - name: Write frozen-domain inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          L=lambda p:json.load(open(p));t=L('research/theory_targets/RTK_C10_65S4E_MODERATE_K_TRAJECTORY_SAMPLED_CONSTRAINT_TARGET_v1.json');p=L('research/state/current.json')['final_replay_result']['rtk']['params'];d=t['domain'];ks=', '.join(format(float(x),'.17g') for x in d['k_Mpc_inv'])
          common=f'''h = {p['h']!r}\nT_cmb = 2.7255\nOmega_b = {p['Ob']!r}\nOmega_khronon = {p['Om']!r}\nlambda_D = {p['lam']!r}\nOmega_Lambda = 0.\nmodel = 2.\nN_ur = 3.046\nN_ncdm = 0\nOmega_k = 0.\nOmega_fld = 0.\nOmega_scf = 0.\nrecombination = RECFAST\nreio_parametrization = reio_camb\nz_reio = {p['zre']!r}\noutput = mPk,dTk,vTk\ngauge = newtonian\nA_s = {p['As']!r}\nn_s = {p['ns']!r}\nP_k_max_1/Mpc = 0.0031\nz_pk = 0\nk_output_values = {ks}\nwrite parameters = no\nbackground_verbose = 0\nperturbations_verbose = 0\nspectra_verbose = 0\nevolver = 0\nl_max_ur = 17\nc10_65r0_diag = 0\nc10_65r1_diag = 0\nc10_65r1_lambda_HL = {float(d['lambda_HL']):.17g}\nc10_65r1_Mc = {float(d['M_c_Mpc_inv']):.17g}\n'''
          for q in ('class_control/output','class_s4e/output'):pathlib.Path(q).mkdir(exist_ok=True)
          pathlib.Path('class_control/control.ini').write_text(common+'root = output/control_\n')
          extra=f'''c10_65s2_lambda_HL = {float(d['lambda_HL']):.17g}\nc10_65s2_Mc = {float(d['M_c_Mpc_inv']):.17g}\nc10_65s2_a_on = {float(d['a_on']):.17g}\n'''
          pathlib.Path('class_s4e/off.ini').write_text(common+'c10_65s2_canary = 0\n'+extra+'root = output/off_\n')
          pathlib.Path('class_s4e/on.ini').write_text(common+'c10_65s2_canary = 1\n'+extra+'root = output/on_\n')
          PY
      - name: Verify exact dormant OFF identity
        run: |
          set -euo pipefail
          (cd class_control && ./class control.ini)>s4e_control.log 2>&1
          (cd class_s4e && env -u RTK_C10_65S2_OBSERVER_FILE ./class off.ini)>s4e_off.log 2>&1
          python3 - <<'PY'
          import glob,hashlib,json,pathlib
          def dig(p):return hashlib.sha256(('\n'.join(x.strip() for x in pathlib.Path(p).read_text().splitlines() if x.strip() and not x.lstrip().startswith('#'))+'\n').encode()).hexdigest()
          A=sorted(glob.glob('class_control/output/control_*perturbations*'));B=sorted(glob.glob('class_s4e/output/off_*perturbations*'));assert len(A)==len(B)==2,(A,B);rec=[];ok=True
          for x,y in zip(A,B):
              a,b=dig(x),dig(y);z=a==b;ok &= z;rec.append({'control':x,'off':y,'control_sha256':a,'off_sha256':b,'identical':z})
          pathlib.Path('s4e_off_identity.json').write_text(json.dumps({'all_two_numeric_rows_sha256_identical':bool(ok),'records':rec},indent=2,sort_keys=True)+'\n');assert ok
          PY
      - name: Recover s4d boundary observer
        run: |
          set -euo pipefail
          mkdir -p s4d_parent
          gh run download 33015496671 --repo pppuu7-cmd/Photospheric-Radius-Scale --name rtk-c10-65s4d-moderate-k-one-step-production-canary --dir s4d_parent
          test -s s4d_parent/s4d_observer.csv
      - name: Execute seven frozen moderate-k trajectory endpoints
        run: |
          set -euo pipefail
          mapfile -t widths < <(python3 - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_65S4E_MODERATE_K_TRAJECTORY_SAMPLED_CONSTRAINT_TARGET_v1.json'))
          for x in t['sample_elapsed_tau_Mpc']:print(format(float(x),'.17g'))
          PY
          )
          test "${#widths[@]}" -eq 7
          printf '[\n' > s4e_manifest.json
          for i in "${!widths[@]}";do
            w="${widths[$i]}"
            python3 rtk/apply_rtk_c10_65s4e_sample_interval_patch.py class_s4e --width "$w" </dev/null
            make -C class_s4e -j2 class </dev/null >/dev/null
            f="$(pwd)/s4e_observer_${i}.csv";rm -f "$f"
            (cd class_s4e && RTK_C10_65S2_OBSERVER_FILE="$f" ./class on.ini </dev/null)>"s4e_on_${i}.log" 2>&1
            test -s "$f"
            [ "$i" -eq 0 ] || printf ',\n' >> s4e_manifest.json
            printf '{"width":%.17g,"observer":"%s"}' "$w" "$f" >> s4e_manifest.json
          done
          printf '\n]\n' >> s4e_manifest.json
          python3 - <<'PY'
          import json,glob
          m=json.load(open('s4e_manifest.json'));assert len(m)==7;assert len(glob.glob('s4e_observer_*.csv'))==7
          print('C10_65S4E_SEVEN_SAMPLE_MANIFEST_PASS')
          PY
      - name: Analyze frozen moderate-k trajectory samples
        run: |
          set -euo pipefail
          python3 research/shadow/rtk_c10_65s4e_moderate_k_trajectory_sample_analyzer.py --manifest s4e_manifest.json --s4d-observer s4d_parent/s4d_observer.csv --off-identity s4e_off_identity.json --patch rtk/apply_rtk_c10_65s4e_sample_interval_patch.py --bridge class_s4e/source/rtk_c10_65s2_class_bridge.c --output research/theory_results/RTK_C10_65S4E_MODERATE_K_TRAJECTORY_SAMPLED_CONSTRAINT_RESULT_v1.json | tee s4e.log
      - name: Add provenance
        if: always()
        run: |
          set -euo pipefail
          p=research/theory_results/RTK_C10_65S4E_MODERATE_K_TRAJECTORY_SAMPLED_CONSTRAINT_RESULT_v1.json;[ -f "$p" ] || exit 0
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          p=pathlib.Path('research/theory_results/RTK_C10_65S4E_MODERATE_K_TRAJECTORY_SAMPLED_CONSTRAINT_RESULT_v1.json');d=json.loads(p.read_text());d['provenance']={'repo_head_at_job_start':pathlib.Path('s4e_head.txt').read_text().strip(),'class_upstream_sha':os.environ['RTK_CLASS_UPSTREAM_SHA'],'workflow':'rtk-c10-65s4e-moderate-k-trajectory-sampling.yml','github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'sample_interval_patch':'rtk/apply_rtk_c10_65s4e_sample_interval_patch.py','analyzer':'research/shadow/rtk_c10_65s4e_moderate_k_trajectory_sample_analyzer.py','base_production_patch':'rtk/apply_rtk_c10_65s2_production_canary_patch_v3.py','domain_patch':'rtk/apply_rtk_c10_65s4d_moderate_k_seed_width_patch.py','s4d_parent_run_id':33015496671,'s3b_method_parent':'C10_65S3B_TRAJECTORY_SAMPLED_CONSTRAINT_PASS_SCOPED','observer_hashes':[hashlib.sha256(pathlib.Path(x).read_bytes()).hexdigest() for x in sorted(pathlib.Path('.').glob('s4e_observer_*.csv'))],'threshold_changed':False};p.write_text(json.dumps(d,indent=2,sort_keys=True,allow_nan=False)+'\n')
          PY
      - name: Persist result and checkpoint
        if: always()
        run: |
          set -euo pipefail
          p=research/theory_results/RTK_C10_65S4E_MODERATE_K_TRAJECTORY_SAMPLED_CONSTRAINT_RESULT_v1.json;[ -f "$p" ] || exit 0
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('research/theory_results/RTK_C10_65S4E_MODERATE_K_TRAJECTORY_SAMPLED_CONSTRAINT_RESULT_v1.json');d=json.loads(p.read_text());c=pathlib.Path('research/checkpoints/RTK_C10_65S4E_MODERATE_K_TRAJECTORY_SAMPLED_RESULT_2026-08-26T2235Z.md');c.write_text(f"# RTK C10.65s4e moderate-k trajectory-sampled result\n\nClassification: `{d['classification']}`.\n\nSeven prospectively frozen elapsed conformal times were evaluated as independent restarts on k=1e-3 and 3e-3 Mpc^-1. Maximum absolute normalized A/H/M residual: `{d['max_abs_normalized_constraint']:.17e}`; maximum normalized change from onset: `{d['max_abs_normalized_constraint_change']:.17e}`; frozen bound: `{d['frozen_bound']:.17e}`. Thresholds were not changed.\n\nThis is sampled finite-short-trajectory evidence only; it is not a continuous-time supremum, long-time stability, broad-k validation, same-full-action closure, radiative-naturalness closure, or spectra/likelihood evidence.\n")
          PY
          cp "$p" /tmp/s4e_r.json;cp research/checkpoints/RTK_C10_65S4E_MODERATE_K_TRAJECTORY_SAMPLED_RESULT_2026-08-26T2235Z.md /tmp/s4e_c.md
          for n in 1 2 3 4 5;do git fetch origin rtk-class-build;git reset --hard origin/rtk-class-build;cp /tmp/s4e_r.json "$p";cp /tmp/s4e_c.md research/checkpoints/RTK_C10_65S4E_MODERATE_K_TRAJECTORY_SAMPLED_RESULT_2026-08-26T2235Z.md;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add "$p" research/checkpoints/RTK_C10_65S4E_MODERATE_K_TRAJECTORY_SAMPLED_RESULT_2026-08-26T2235Z.md;git commit -m 'Record C10.65s4e moderate-k trajectory result' || exit 0;git push origin HEAD:rtk-class-build && exit 0;done;exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c10-65s4e-moderate-k-trajectory-sampling
          path: |
            s4e_manifest.json
            s4e_observer_*.csv
            s4e_on_*.log
            s4e_off_identity.json
            s4e.log
            research/theory_results/RTK_C10_65S4E_MODERATE_K_TRAJECTORY_SAMPLED_CONSTRAINT_RESULT_v1.json
      - name: Enforce scientific classification
        if: always()
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('research/theory_results/RTK_C10_65S4E_MODERATE_K_TRAJECTORY_SAMPLED_CONSTRAINT_RESULT_v1.json'));assert d['checks']['threshold_changed'] is False;assert d['classification']=='C10_65S4E_MODERATE_K_TRAJECTORY_SAMPLED_CONSTRAINT_PASS_SCOPED',d
          print(d['classification'])
          PY
