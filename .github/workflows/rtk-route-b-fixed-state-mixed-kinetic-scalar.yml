name: RTK Route-B fixed-state mixed-kinetic scalar gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-fixed-state-mixed-kinetic-scalar-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run fixed-state mixed-kinetic theorem
        run: |
          set -euo pipefail
          echo "RTK_SOURCE_SHA=$(git rev-parse HEAD)" | tee rtk_fixed_state_mixed_kinetic_provenance.txt
          python -m py_compile rtk/route_b_fixed_state_mixed_kinetic_scalar_gate.py
          python rtk/route_b_fixed_state_mixed_kinetic_scalar_gate.py | tee rtk_fixed_state_mixed_kinetic.log
          grep -q '^RTK_ROUTE_B_FIXED_STATE_MIXED_KINETIC_SCALAR_GATE_PASS ' rtk_fixed_state_mixed_kinetic.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-fixed-state-mixed-kinetic-scalar-gate
          path: |
            rtk_fixed_state_mixed_kinetic.log
            rtk_fixed_state_mixed_kinetic_provenance.txt
          if-no-files-found: error
