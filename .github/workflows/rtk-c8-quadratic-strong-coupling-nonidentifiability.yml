name: RTK C8 quadratic strong-coupling nonidentifiability

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c8-quadratic-strong-coupling-nonidentifiability-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Run exact C8 no-inference theorem
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
          python3 -m py_compile rtk/c8_quadratic_strong_coupling_nonidentifiability.py
          python3 rtk/c8_quadratic_strong_coupling_nonidentifiability.py | tee c8_quadratic_strong_coupling_nonidentifiability.log
          grep -q RTK_C8_QUADRATIC_STRONG_COUPLING_NONIDENTIFIABILITY_PASS c8_quadratic_strong_coupling_nonidentifiability.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c8-quadratic-strong-coupling-nonidentifiability
          path: c8_quadratic_strong_coupling_nonidentifiability.log
          if-no-files-found: warn
