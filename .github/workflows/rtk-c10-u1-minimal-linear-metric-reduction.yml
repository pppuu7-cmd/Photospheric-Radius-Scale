name: RTK C10 U1 minimal linear metric reduction

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/rtk-c10-u1-minimal-linear-metric-reduction-trigger.txt'
      - 'rtk/route_b_u1_minimal_linear_metric_reduction_gate.py'
      - 'research/theory_targets/RTK_C10_U1_MINIMAL_LINEAR_METRIC_REDUCTION_TARGET_v1.json'
      - '.github/workflows/rtk-c10-u1-minimal-linear-metric-reduction.yml'

permissions:
  contents: write

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Verify frozen target and run theorem
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'sympy==1.14.0'
          python3 - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_U1_MINIMAL_LINEAR_METRIC_REDUCTION_TARGET_v1.json'))
          assert t['status']=='FROZEN_BEFORE_EXECUTABLE_RESULT'
          assert t['pass_classification']=='C10_U1_MINIMAL_LINEAR_METRIC_REDUCTION_PASS_K_GT_0_SCOPED'
          print('C10_MINIMAL_METRIC_REDUCTION_TARGET_PASS')
          PY
          git rev-parse HEAD | tee c10_u1_minimal_metric_reduction_provenance.txt
          python3 -m py_compile rtk/route_b_u1_minimal_linear_metric_reduction_gate.py
          python3 rtk/route_b_u1_minimal_linear_metric_reduction_gate.py | tee c10_u1_minimal_metric_reduction.log
          grep -q '^C10_U1_MINIMAL_LINEAR_METRIC_REDUCTION_PASS_K_GT_0_SCOPED ' c10_u1_minimal_metric_reduction.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c10-u1-minimal-linear-metric-reduction
          path: |
            c10_u1_minimal_metric_reduction.log
            c10_u1_minimal_metric_reduction_provenance.txt
            u1_minimal_linear_metric_reduction_result.json
          if-no-files-found: error
      - name: Persist result
        if: success()
        run: |
          set -euo pipefail
          cp u1_minimal_linear_metric_reduction_result.json /tmp/result.json
          for attempt in 1 2 3 4 5; do
            git fetch origin rtk-class-build
            git reset --hard origin/rtk-class-build
            cp /tmp/result.json research/theory_results/RTK_C10_U1_MINIMAL_LINEAR_METRIC_REDUCTION_RESULT_v1.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/theory_results/RTK_C10_U1_MINIMAL_LINEAR_METRIC_REDUCTION_RESULT_v1.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist C10 minimal linear U1 metric reduction result'
            if git push origin HEAD:rtk-class-build; then exit 0; fi
          done
          exit 1
