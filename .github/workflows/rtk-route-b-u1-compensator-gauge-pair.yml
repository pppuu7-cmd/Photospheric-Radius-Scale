name: RTK Route-B U1 compensator gauge-pair preservation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-compensator-gauge-pair-trigger.txt'

permissions:
  contents: read

concurrency:
  group: rtk-route-b-u1-compensator-gauge-pair
  cancel-in-progress: false

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run gauge-pair theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_compensator_gauge_pair_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_compensator_gauge_pair_provenance.txt
          python3 rtk/route_b_u1_compensator_gauge_pair_gate.py | tee u1_compensator_gauge_pair.log
          grep -q '^RTK_ROUTE_B_U1_COMPENSATOR_GAUGE_PAIR_PASS ' u1_compensator_gauge_pair.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_compensator_gauge_pair_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_COMPENSATOR_GAUGE_PAIR_PASS'
          assert r['status_scope']=='GREEN_SCOPED_U1_GAUGE_PAIR_PRESERVED_FULL_DOF_PENDING'
          assert r['constraints']['class'].startswith('two first-class')
          print('U1_COMPENSATOR_GAUGE_PAIR_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-compensator-gauge-pair
          path: |
            u1_compensator_gauge_pair.log
            u1_compensator_gauge_pair_result.json
            u1_compensator_gauge_pair_provenance.txt
            rtk/route_b_u1_compensator_gauge_pair_gate.py
          if-no-files-found: error
