name: RTK Route-B U1 flat-lapse UV Wilson compression

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-flat-lapse-uv-wilson-compression-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run flat-lapse UV Wilson compression theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_flat_lapse_uv_wilson_compression_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_flat_lapse_uv_wilson_compression_provenance.txt
          python3 rtk/route_b_u1_flat_lapse_uv_wilson_compression_gate.py | tee u1_flat_lapse_uv_wilson_compression.log
          grep -q '^RTK_ROUTE_B_U1_FLAT_LAPSE_UV_WILSON_COMPRESSION_PASS ' u1_flat_lapse_uv_wilson_compression.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_flat_lapse_uv_wilson_compression_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_FLAT_LAPSE_UV_WILSON_COMPRESSION_PASS'
          assert r['q2_wilson_combination']=='beta2+beta4 only'
          assert r['q3_wilson_combination']=='beta8 only'
          print('U1_FLAT_LAPSE_UV_WILSON_COMPRESSION_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-flat-lapse-uv-wilson-compression
          path: |
            u1_flat_lapse_uv_wilson_compression.log
            u1_flat_lapse_uv_wilson_compression_result.json
            u1_flat_lapse_uv_wilson_compression_provenance.txt
            rtk/route_b_u1_flat_lapse_uv_wilson_compression_gate.py
          if-no-files-found: error
