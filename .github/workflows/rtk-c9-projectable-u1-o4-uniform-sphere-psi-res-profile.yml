name: RTK C9 projectable O4 uniform-sphere Psi_res profile

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c9-projectable-u1-o4-uniform-sphere-psi-res-profile-trigger.txt'

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install pinned numerical runtime
        run: python -m pip install --disable-pip-version-check 'numpy==2.5.2'
      - name: Run uniform-sphere Psi_res real-space profile
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/c9_projectable_u1_o4_uniform_sphere_psi_res_profile_scan.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee c9_projectable_u1_o4_uniform_sphere_psi_res_profile_provenance.txt
          python3 rtk/c9_projectable_u1_o4_uniform_sphere_psi_res_profile_scan.py | tee c9_projectable_u1_o4_uniform_sphere_psi_res_profile.log
          grep -q '^RTK_C9_PROJECTABLE_U1_O4_UNIFORM_SPHERE_PSI_RES_PROFILE_COMPLETE ' c9_projectable_u1_o4_uniform_sphere_psi_res_profile.log
          python3 - <<'PY'
          import json
          r=json.load(open('c9_projectable_u1_o4_uniform_sphere_psi_res_profile_result.json'))
          assert r['classification']=='RTK_C9_PROJECTABLE_U1_O4_UNIFORM_SPHERE_PSI_RES_PROFILE_COMPLETE'
          assert r['max_derivative_relative_error']<0.03
          assert r['max_resolution_scaled_difference']<0.08
          print('C9_PROJECTABLE_O4_UNIFORM_SPHERE_PSI_RES_PROFILE_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c9-projectable-o4-uniform-sphere-psi-res-profile
          path: |
            c9_projectable_u1_o4_uniform_sphere_psi_res_profile.log
            c9_projectable_u1_o4_uniform_sphere_psi_res_profile_result.json
            c9_projectable_u1_o4_uniform_sphere_psi_res_profile_provenance.txt
            rtk/c9_projectable_u1_o4_uniform_sphere_psi_res_profile_scan.py
          if-no-files-found: error
