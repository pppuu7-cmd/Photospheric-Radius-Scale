name: RTK Route-B two-auxiliary positive cancellation gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-two-auxiliary-positive-cancellation-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run two-auxiliary positivity theorem
        run: |
          set -euo pipefail
          echo "RTK_SOURCE_SHA=$(git rev-parse HEAD)" | tee rtk_two_aux_positive_cancellation_provenance.txt
          python -m py_compile rtk/route_b_two_auxiliary_positive_cancellation_gate.py
          python rtk/route_b_two_auxiliary_positive_cancellation_gate.py | tee rtk_two_aux_positive_cancellation.log
          grep -q '^RTK_ROUTE_B_TWO_AUXILIARY_POSITIVE_CANCELLATION_GATE_PASS ' rtk_two_aux_positive_cancellation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-two-auxiliary-positive-cancellation-gate
          path: |
            rtk_two_aux_positive_cancellation.log
            rtk_two_aux_positive_cancellation_provenance.txt
          if-no-files-found: error
