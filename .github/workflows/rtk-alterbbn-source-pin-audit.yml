name: RTK AlterBBN published-source pin audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-alterbbn-source-pin-audit-trigger.txt'

permissions:
  contents: read

concurrency:
  group: rtk-alterbbn-source-pin-audit
  cancel-in-progress: true

jobs:
  discover-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1

      - name: Resolve and download the published AlterBBN v2.2 archive
        run: |
          set -euo pipefail
          mkdir -p output/alterbbn_source_pin
          python3 - <<'PY'
          import json, subprocess, hashlib, pathlib, os
          out=pathlib.Path('output/alterbbn_source_pin')
          base='https://data.mendeley.com'
          dataset='k7j3b9zyvf'; version='1'; expected='alterbbn_v2.2.tar.xz'
          public_files=f'{base}/public-api/datasets/{dataset}/files?folder_id=root&version={version}'

          def curl(name,url,headers=()):
              body=out/f'{name}.body'; hdr=out/f'{name}.headers'
              cmd=['curl','-L','-sS','--retry','3','--retry-delay','2','--connect-timeout','15','--max-time','180','-D',str(hdr),'-o',str(body),'-w','%{http_code}']
              for h in headers: cmd += ['-H',h]
              cmd.append(url)
              cp=subprocess.run(cmd,text=True,capture_output=True)
              b=body.read_bytes() if body.exists() else b''
              ft=subprocess.run(['file','-b',str(body)],text=True,capture_output=True).stdout.strip() if body.exists() else None
              return {'name':name,'url':url,'curl_returncode':cp.returncode,'http_code':cp.stdout.strip() if cp.returncode==0 else 'curl_error','bytes':len(b),'sha256':hashlib.sha256(b).hexdigest() if b else None,'file_type':ft}

          landing=curl('landing',f'{base}/datasets/{dataset}/{version}')
          listing=curl('public_files',public_files,('Accept: application/vnd.mendeley-public-dataset.1+json',))
          if listing['http_code']!='200':
              raise RuntimeError(f'public file-list endpoint failed: {listing}')
          try: payload=json.loads((out/'public_files.body').read_text())
          except Exception as exc: raise RuntimeError(f'public file-list is not JSON: {exc}')

          # Recursively find file dictionaries because the public API response
          # shape is an implementation detail and may be a list or a wrapper.
          dicts=[]
          def walk(x):
              if isinstance(x,dict):
                  dicts.append(x)
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(payload)
          matches=[d for d in dicts if d.get('filename')==expected]
          if len(matches)!=1:
              raise RuntimeError(f'expected exactly one {expected}, found {len(matches)}')
          meta=matches[0]
          details=meta.get('content_details') if isinstance(meta.get('content_details'),dict) else {}
          download=details.get('download_url') or meta.get('download_url')
          if not isinstance(download,str) or not download.startswith('http'):
              raise RuntimeError(f'published file metadata lacks download_url: {meta}')

          archive=curl('alterbbn_v2_2_archive',download)
          archive_path=out/'alterbbn_v2_2_archive.body'
          if archive['http_code']!='200' or archive['bytes']<100000:
              raise RuntimeError(f'archive download failed or implausibly small: {archive}')
          # Verify XZ and that it is a readable tar archive before accepting a pin.
          if 'xz compressed' not in (archive.get('file_type') or '').lower():
              raise RuntimeError(f'published object is not detected as xz: {archive}')
          cp=subprocess.run(['tar','-tJf',str(archive_path)],text=True,capture_output=True)
          if cp.returncode:
              raise RuntimeError('published xz object is not a readable tar archive: '+cp.stderr)
          members=[x for x in cp.stdout.splitlines() if x.strip()]
          if len(members)<10:
              raise RuntimeError(f'archive contains suspiciously few members: {len(members)}')
          (out/'archive_members.txt').write_text('\n'.join(members)+'\n')
          # Persist the archive under its published name as an artifact, while
          # the digest below is the scientific source identity used later.
          published_path=out/expected
          published_path.write_bytes(archive_path.read_bytes())

          result={
            'classification':'ALTERBBN_PUBLISHED_SOURCE_PIN_PASS',
            'status':'PINNED_ARCHIVE_FOUND',
            'doi':'10.17632/k7j3b9zyvf.1',
            'dataset_id':dataset,
            'dataset_version':1,
            'published_filename':expected,
            'public_file_list_endpoint':public_files,
            'public_file_metadata':meta,
            'download_url':download,
            'archive_sha256':archive['sha256'],
            'archive_bytes':archive['bytes'],
            'archive_file_type':archive['file_type'],
            'archive_member_count':len(members),
            'archive_member_head':members[:30],
            'landing_sha256':landing['sha256'],
            'public_file_list_sha256':listing['sha256'],
            'warning':'Published source identity only. No BBN abundance calculation has been executed yet.'
          }
          (out/'summary.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print('RTK_ALTERBBN_SOURCE_PIN_PASS',json.dumps(result,sort_keys=True))
          PY

      - name: Fail closed unless immutable archive pin is complete
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('output/alterbbn_source_pin/summary.json')
          s=json.load(open(p))
          assert s['classification']=='ALTERBBN_PUBLISHED_SOURCE_PIN_PASS'
          assert s['status']=='PINNED_ARCHIVE_FOUND'
          assert s['doi']=='10.17632/k7j3b9zyvf.1'
          assert s['published_filename']=='alterbbn_v2.2.tar.xz'
          a=pathlib.Path('output/alterbbn_source_pin/alterbbn_v2.2.tar.xz')
          h=hashlib.sha256(a.read_bytes()).hexdigest()
          assert h==s['archive_sha256']
          print('RTK_ALTERBBN_SOURCE_PIN_AUDIT_COMPLETE',h,s['archive_member_count'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-alterbbn-source-pin-audit
          path: output/alterbbn_source_pin/
          if-no-files-found: error
