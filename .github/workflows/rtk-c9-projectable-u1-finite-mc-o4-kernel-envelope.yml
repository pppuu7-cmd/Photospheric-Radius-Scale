name: RTK C9 projectable finite-Mc O4 kernel envelope

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c9-projectable-u1-finite-mc-o4-kernel-envelope-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run O4 kernel envelope theorem
        run: |
          set -euo pipefail
          python3 rtk/c9_projectable_u1_finite_mc_o4_kernel_envelope_gate.py | tee c9_projectable_u1_finite_mc_o4_kernel_envelope.log
          grep -q '^RTK_C9_PROJECTABLE_U1_FINITE_MC_O4_KERNEL_ENVELOPE_PASS ' c9_projectable_u1_finite_mc_o4_kernel_envelope.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c9-projectable-u1-finite-mc-o4-kernel-envelope
          path: |
            c9_projectable_u1_finite_mc_o4_kernel_envelope.log
            c9_projectable_u1_finite_mc_o4_kernel_envelope_result.json
            rtk/c9_projectable_u1_finite_mc_o4_kernel_envelope_gate.py
          if-no-files-found: error
