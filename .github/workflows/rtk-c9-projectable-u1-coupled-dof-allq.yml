name: RTK C9 projectable U1 coupled DOF all-q

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c9-projectable-u1-coupled-dof-allq-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run projectable coupled all-q DOF theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/c9_projectable_u1_coupled_dof_allq_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee c9_projectable_u1_coupled_dof_allq_provenance.txt
          python3 rtk/c9_projectable_u1_coupled_dof_allq_gate.py | tee c9_projectable_u1_coupled_dof_allq.log
          grep -q '^RTK_C9_PROJECTABLE_U1_COUPLED_DOF_ALLQ_PASS ' c9_projectable_u1_coupled_dof_allq.log
          python3 - <<'PY'
          import json
          r=json.load(open('c9_projectable_u1_coupled_dof_allq_result.json'))
          assert r['classification']=='RTK_C9_PROJECTABLE_U1_COUPLED_DOF_ALLQ_PASS'
          assert r['total_count']['physical_carrier_dof'].startswith('3 =')
          assert 'lambda>1' in r['allq_pair_rank']
          print('C9_PROJECTABLE_U1_COUPLED_DOF_ALLQ_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c9-projectable-u1-coupled-dof-allq
          path: |
            c9_projectable_u1_coupled_dof_allq.log
            c9_projectable_u1_coupled_dof_allq_result.json
            c9_projectable_u1_coupled_dof_allq_provenance.txt
            rtk/c9_projectable_u1_coupled_dof_allq_gate.py
          if-no-files-found: error
