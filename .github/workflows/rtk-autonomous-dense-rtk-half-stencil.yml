name: RTK autonomous dense RTK half-stencil proof gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtk-autonomous-dense-rtk-half-stencil
  cancel-in-progress: false

jobs:
  stationarity-half:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '300'
      RTK_CACHE_KEY_VERSION: 'exact-float-v1'
      RTK_STENCIL_SCALE: '0.5'
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      RTK_PANTHEON_SHA: '7eb29dc87ba223b4ec8457cd3cccba1216c36fb7'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1

      - name: Prepare pinned exact cache-safe tree
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_public
          git -C class_public reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          git clone https://github.com/dscolnic/Pantheon.git class_public/pantheon
          git -C class_public/pantheon reset --hard "$RTK_PANTHEON_SHA"
          test "$(git -C class_public rev-parse HEAD)" = "$RTK_CLASS_UPSTREAM_SHA"
          test "$(git -C class_public/pantheon rev-parse HEAD)" = "$RTK_PANTHEON_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py class_public/joint_profile_runner.py
          cp rtk/prepare_inference_core.py class_public/prepare_inference_core.py
          cp rtk/autonomous_dense_rtk_stationarity.py class_public/autonomous_dense_rtk_stationarity.py
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py

      - name: Build CLASS
        working-directory: class_public
        run: make -j2 class

      - name: Install likelihood dependencies and capture versions
        run: |
          python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' numpy scipy
          python3 -m pip freeze | sort | tee half_stencil_pip_freeze.txt
          python3 --version | tee half_stencil_python_version.txt

      - name: Download official Planck baseline
        working-directory: class_public
        run: |
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          sha256sum planck.tar.gz | tee ../half_stencil_planck_sha256.txt
          mkdir planck_data && tar -xzf planck.tar.gz -C planck_data

      - name: Run state-driven RTK 7D half-stencil Hessian
        working-directory: class_public
        run: |
          set -o pipefail
          python3 autonomous_dense_rtk_stationarity.py | tee ../autonomous_dense_rtk_half_stencil.log
          grep -q AUTO_DENSE_RTK_STATIONARITY_COMPLETE ../autonomous_dense_rtk_half_stencil.log
          python3 - <<'PY'
          import json
          s=json.load(open('output/autonomous_dense_rtk_stationarity/summary.json'))
          assert abs(float(s['stencil_scale'])-0.5)<1e-15
          print('RTK_HALF_STENCIL_SCALE_CONFIRMED')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-autonomous-dense-rtk-half-stencil
          path: |
            autonomous_dense_rtk_half_stencil.log
            half_stencil_pip_freeze.txt
            half_stencil_python_version.txt
            half_stencil_planck_sha256.txt
            class_public/output/autonomous_dense_rtk_stationarity/summary.json
            class_public/output/autonomous_dense_rtk_stationarity/provenance.json
            class_public/output/autonomous_dense_rtk_stationarity/points.jsonl
            class_public/output/autonomous_dense_rtk_stationarity/failures.jsonl
          if-no-files-found: warn
