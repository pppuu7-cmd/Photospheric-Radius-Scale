name: RTK Route-B U1 static 1PN beta lambda branch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-static-1pn-beta-lambda-branch-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run static 1PN beta lambda-branch theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_static_1pn_beta_lambda_branch_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_static_1pn_beta_lambda_branch_provenance.txt
          python3 rtk/route_b_u1_static_1pn_beta_lambda_branch_gate.py | tee u1_static_1pn_beta_lambda_branch.log
          grep -q '^RTK_ROUTE_B_U1_STATIC_1PN_BETA_LAMBDA_BRANCH_PASS ' u1_static_1pn_beta_lambda_branch.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_static_1pn_beta_lambda_branch_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_STATIC_1PN_BETA_LAMBDA_BRANCH_PASS'
          assert 'beta_PPN=1' in r['beta_result']
          assert 'lambda_HL>1' in r['beta_result']
          assert any('does not certify preferred-frame alpha1 or alpha2' in x for x in r['non_claims'])
          print('U1_STATIC_1PN_BETA_LAMBDA_BRANCH_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-static-1pn-beta-lambda-branch
          path: |
            u1_static_1pn_beta_lambda_branch.log
            u1_static_1pn_beta_lambda_branch_result.json
            u1_static_1pn_beta_lambda_branch_provenance.txt
            rtk/route_b_u1_static_1pn_beta_lambda_branch_gate.py
          if-no-files-found: error
