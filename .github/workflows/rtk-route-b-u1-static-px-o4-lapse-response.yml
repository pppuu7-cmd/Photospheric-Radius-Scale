name: RTK Route-B U1 static P(X) O4 lapse response

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-static-px-o4-lapse-response-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run fixed-action static O4 lapse-response theorem
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          sc=json.load(open('research/RTK_C8_U1_FIXED_SCALAR_ACTION_v1.json'))
          assert sc['domain']['production_branch']=='X_U > 0'
          assert sc['C_of_X_U']=='M_Pl^2/(2 X_U)'
          print('U1_STATIC_PX_O4_FIXED_ACTION_PASS')
          PY
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_static_px_o4_lapse_response_provenance.txt
          python3 -m py_compile rtk/route_b_u1_static_px_o4_lapse_response_gate.py
          python3 rtk/route_b_u1_static_px_o4_lapse_response_gate.py | tee u1_static_px_o4_lapse_response.log
          grep -q '^RTK_ROUTE_B_U1_STATIC_PX_O4_LAPSE_RESPONSE_PASS ' u1_static_px_o4_lapse_response.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_static_px_o4_lapse_response_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_STATIC_PX_O4_LAPSE_RESPONSE_PASS'
          assert r['z0']['lower_N_margin_1_minus_Ncrit']>0
          assert r['domain_budgets']['solar_surface']['C4_abs_max_for_lower_N_domain_if_abs_n4_eq_C4_U2']>1000
          print('U1_STATIC_PX_O4_ARTIFACT_PASS',r['z0']['lower_N_margin_1_minus_Ncrit'],r['domain_budgets']['solar_surface']['C4_abs_max_for_lower_N_domain_if_abs_n4_eq_C4_U2'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-static-px-o4-lapse-response
          path: |
            u1_static_px_o4_lapse_response.log
            u1_static_px_o4_lapse_response_result.json
            u1_static_px_o4_lapse_response_provenance.txt
          if-no-files-found: error
