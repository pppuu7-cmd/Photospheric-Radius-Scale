name: RTK Route-B rolling-scalar acceleration invariance

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-rolling-scalar-normalization-invariant-acceleration-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run rolling-scalar normalization theorem
        run: |
          set -euo pipefail
          echo "RTK_SOURCE_SHA=$(git rev-parse HEAD)" | tee rtk_rolling_scalar_acceleration_provenance.txt
          python -m py_compile rtk/route_b_rolling_scalar_normalization_invariant_acceleration_gate.py
          python rtk/route_b_rolling_scalar_normalization_invariant_acceleration_gate.py | tee rtk_rolling_scalar_acceleration.log
          grep -q '^RTK_ROUTE_B_ROLLING_SCALAR_NORMALIZATION_INVARIANT_ACCELERATION_GATE_PASS ' rtk_rolling_scalar_acceleration.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-rolling-scalar-normalization-invariant-acceleration
          path: |
            rtk_rolling_scalar_acceleration.log
            rtk_rolling_scalar_acceleration_provenance.txt
          if-no-files-found: error
