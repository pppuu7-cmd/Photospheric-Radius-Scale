name: RTK C9 HMT lambda1 S3 spatial FP quotient assembly
on:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/rtk-c9-hmt-lambda1-s3-spatial-fp-quotient-assembly-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install high precision dependency
        run: python -m pip install --disable-pip-version-check mpmath
      - name: Verify frozen target ancestry and immutability
        run: |
          git cat-file -e e24d6776fc068e65aeb4a0c838d21175a120a47f^{commit}
          git merge-base --is-ancestor e24d6776fc068e65aeb4a0c838d21175a120a47f HEAD
          python - <<'PY'
          import json, subprocess
          p='research/theory_targets/RTK_C9_HMT_LAMBDA1_S3_SPATIAL_FP_QUOTIENT_ASSEMBLY_TARGET_v1.json'
          d=json.load(open(p))
          assert d['scientific_parent_head']=='99119e680a8bc57be9115ed07e851b7a16a3d0ea'
          assert d['source_locks']['combined_principal_cut_phase']=='+1'
          assert d['source_locks']['hodge_extra_factor_in_orthonormal_vector_basis']=='1'
          assert d['source_locks']['residual_SO4_orbit_volume']=='16*pi^10*a^15'
          assert d['frozen_success_criteria']['classification_must_be']=='RTK_C9_HMT_LAMBDA1_S3_SPATIAL_FP_QUOTIENT_ASSEMBLED_CONVENTION_BOUND_PASS_SCOPED'
          for k in ['full_FP_determinant_computed','full_FS_determinant_computed','full_gravitational_Hessian_determinant_computed','complete_HMT_gauge_fixed_constraint_matrix_constructed','full_HMT_one_loop_evaluable','full_C9_closed','ordinary_projectable_parent_beta_functions_imported','unresolved_HMT_matter_coefficients_chosen','soft_s_retest_allowed','production_k003_unblocked','threshold_changed']:
            assert d['scope_exclusions'][k] is False, k
          assert d['scope_exclusions']['no_DSIR'] is True
          frozen=json.loads(subprocess.check_output(['git','show','e24d6776fc068e65aeb4a0c838d21175a120a47f:'+p],text=True))
          assert frozen==d
          PY
      - name: Run spatial FP quotient assembly audit
        run: |
          python -m py_compile research/shadow/rtk_c9_hmt_lambda1_s3_spatial_fp_quotient_assembly.py
          python research/shadow/rtk_c9_hmt_lambda1_s3_spatial_fp_quotient_assembly.py
      - name: Enforce scoped classification
        run: |
          python - <<'PY'
          import json
          p='research/theory_results/RTK_C9_HMT_LAMBDA1_S3_SPATIAL_FP_QUOTIENT_ASSEMBLY_RESULT_v1.json'
          d=json.load(open(p)); c=d['scientific_checks']; f=d['findings']
          assert d['classification']=='RTK_C9_HMT_LAMBDA1_S3_SPATIAL_FP_QUOTIENT_ASSEMBLED_CONVENTION_BOUND_PASS_SCOPED'
          for k in ['signed_nonzero_product_matches_certified_inputs','combined_phase_exactly_plus_one','no_extra_Hodge_factor','residual_orbit_volume_16pi10a15','quotient_scaling_a_minus15','quotient_is_convention_bound_not_observable']:
            assert c[k] is True, k
          assert f['complete_signed_spatial_FP_quotient_assembled_under_frozen_convention'] is True
          assert f['spatial_FP_quotient_is_convention_independent_observable'] is False
          for k in ['full_FP_determinant_computed','full_FS_determinant_computed','full_gravitational_Hessian_determinant_computed','complete_HMT_gauge_fixed_constraint_matrix_constructed','full_HMT_one_loop_evaluable','full_C9_closed','ordinary_projectable_parent_beta_functions_imported','unresolved_HMT_matter_coefficients_chosen','soft_s_retest_allowed','production_k003_unblocked','threshold_changed']:
            assert f[k] is False, k
          assert f['no_DSIR'] is True
          PY
      - name: Persist result checkpoint provenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C9_HMT_LAMBDA1_S3_SPATIAL_FP_QUOTIENT_ASSEMBLY_RESULT_v1.json research/checkpoints/RTK_C9_HMT_LAMBDA1_S3_SPATIAL_FP_QUOTIENT_ASSEMBLY_2026-08-28.md research/provenance/RTK_C9_HMT_LAMBDA1_S3_SPATIAL_FP_QUOTIENT_ASSEMBLY_PROVENANCE_v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record C9 HMT spatial FP quotient assembly audit'
            git push origin HEAD:rtk-class-build
          fi
