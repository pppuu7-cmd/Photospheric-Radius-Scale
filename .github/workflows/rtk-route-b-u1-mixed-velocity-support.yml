name: RTK Route-B U1 mixed velocity-support gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-mixed-velocity-support-trigger.txt'

permissions:
  contents: read

jobs:
  exact-velocity-support:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run U1 mixed velocity-support theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_mixed_velocity_support_gate.py
          python3 rtk/route_b_u1_mixed_velocity_support_gate.py | tee u1_mixed_velocity_support.log
          grep -q 'RTK_ROUTE_B_U1_MIXED_VELOCITY_SUPPORT_GATE_PASS' u1_mixed_velocity_support.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_mixed_velocity_support_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_MIXED_VELOCITY_SUPPORT_GATE_PASS'
          assert all(v=='0' for v in r['gravity_gauge_velocity_derivatives'].values())
          assert all(v=='0' for v in r['gravity_gauge_velocity_second_derivatives'].values())
          assert all(v=='0' for v in r['scalar_gravity_velocity_cross_hessian'].values())
          print('U1_MIXED_VELOCITY_SUPPORT_ARTIFACT_ASSERTIONS_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rtk-route-b-u1-mixed-velocity-support
          path: |
            u1_mixed_velocity_support.log
            u1_mixed_velocity_support_result.json
          if-no-files-found: error
