name: RTK Stage 4D1 iteration6 recenter round3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rtk-stage4d1-iteration6-recenter-r3.yml'

jobs:
  refine:
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - {mapping: k01, lambda_D: '30000', h: '0.6917622144437032', Ob: '0.04672391775486484', Om: '0.2515699879361797', As: '2.071238030700841e-09', ns: '0.9646361339412108', zre: '6.913848942357194'}
          - {mapping: eff, lambda_D: '100000', h: '0.691404915979391', Ob: '0.04675412730254765', Om: '0.25196574007695277', As: '2.0668177002887313e-09', ns: '0.964501249384642', zre: '6.791757730526572'}
          - {mapping: k01, lambda_D: '100000', h: '0.6919564234773881', Ob: '0.04669798987201768', Om: '0.25134792145646356', As: '2.0684979602174617e-09', ns: '0.9647926025136135', zre: '6.849320255807237'}
          - {mapping: eff, lambda_D: '1000000', h: '0.6910103689085433', Ob: '0.0467884883128175', Om: '0.2524415009340351', As: '2.063878696649458e-09', ns: '0.9643097830357931', zre: '6.709919328122083'}
          - {mapping: k01, lambda_D: '1000000', h: '0.6910762263594855', Ob: '0.046781849934968395', Om: '0.25233186724478246', As: '2.063915733918981e-09', ns: '0.964184650116546', zre: '6.722219802038589'}
          - {mapping: eff, lambda_D: '100000000', h: '0.6921528062600527', Ob: '0.04667254870386515', Om: '0.25109716469224874', As: '2.0672193716839053e-09', ns: '0.9648903488443551', zre: '6.829520524842707'}
          - {mapping: k01, lambda_D: '100000000', h: '0.6921890442151787', Ob: '0.04667077950486747', Om: '0.25107002451529736', As: '2.0695385259204467e-09', ns: '0.965037903848803', zre: '6.884382378924385'}
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '120'
      RTK_CACHE_KEY_VERSION: 'exact-float-v1'
    steps:
      - uses: actions/checkout@v4
        with: {ref: rtk-class-build}
      - name: Prepare cache-safe exact likelihood tree
        run: |
          set -euo pipefail
          git clone --depth 1 --branch nonlocal https://github.com/dirian/class_public.git class_public
          git clone --depth 1 https://github.com/dscolnic/Pantheon.git class_public/pantheon
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py class_public/joint_profile_runner.py
          cp rtk/prepare_inference_core.py class_public/prepare_inference_core.py
          cp rtk/stage4d1_tight_refine.py class_public/stage4d1_tight_refine.py
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py
          ! grep -q 'A_s_ad\|n_s_ad' inference_core.py
      - name: Build CLASS
        working-directory: class_public
        run: make -j2 class
      - name: Install likelihood dependencies
        run: python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' numpy scipy
      - name: Download official Planck baseline
        working-directory: class_public
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          mkdir planck_data
          tar -xzf planck.tar.gz -C planck_data
      - name: Run five-start tight Powell plus two exact polls
        working-directory: class_public
        run: |
          set -o pipefail
          python3 stage4d1_tight_refine.py planck_data '${{ matrix.lambda_D }}' '${{ matrix.mapping }}' '${{ matrix.h }}' '${{ matrix.Ob }}' '${{ matrix.Om }}' '${{ matrix.As }}' '${{ matrix.ns }}' '${{ matrix.zre }}' | tee ../round3_${{ matrix.mapping }}_${{ matrix.lambda_D }}.log
          grep -q STAGE4D1_TIGHT_PASS ../round3_${{ matrix.mapping }}_${{ matrix.lambda_D }}.log
      - uses: actions/upload-artifact@v4
        with:
          name: rtk-stage4d1-iteration6-r3-${{ matrix.mapping }}-${{ matrix.lambda_D }}
          path: |
            round3_${{ matrix.mapping }}_${{ matrix.lambda_D }}.log
            class_public/output/stage4d1_tight/${{ matrix.mapping }}/**/refine_summary.json
            class_public/output/stage4d1_tight/${{ matrix.mapping }}/**/refine_trace.csv
          if-no-files-found: error
