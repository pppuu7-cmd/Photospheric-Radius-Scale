name: RTK C9 HMT lambda1 S3 reduced scalar zeta determinant
on:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/rtk-c9-hmt-lambda1-s3-reduced-scalar-zeta-determinant-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install high-precision dependency
        run: python -m pip install --disable-pip-version-check mpmath==1.3.0
      - name: Verify frozen target ancestry
        run: |
          git cat-file -e 06ed86480e19a6b16d91307534bf1fe2d5b9d20c^{commit}
          git merge-base --is-ancestor 06ed86480e19a6b16d91307534bf1fe2d5b9d20c HEAD
      - name: Run reduced scalar spectral-zeta audit
        run: python research/shadow/rtk_c9_hmt_lambda1_s3_reduced_scalar_zeta_determinant.py
      - name: Verify scoped semantics and frozen tolerances
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          p='research/theory_results/RTK_C9_HMT_LAMBDA1_S3_REDUCED_SCALAR_ZETA_DETERMINANT_RESULT_v1.json'
          d=json.load(open(p))
          f=d['findings']; a=d['analytic_continuation']; z=d['zeta_determinant']
          assert d['classification'].endswith('PASS_SCOPED')
          assert d['target_frozen_commit']=='06ed86480e19a6b16d91307534bf1fe2d5b9d20c'
          assert a['regular_at_s0'] and a['zeta_A_0_exact']==-4
          assert Decimal(a['prime_K120_vs_K140_abs_diff']) < Decimal('1e-30')
          assert Decimal(a['crosscheck_abs_diff']) < Decimal('1e-30')
          assert f['regularized_scalar_FS_determinant_computed_for_frozen_normalization']
          assert f['finite_positive_dimensionless_determinant']
          assert f['normalization_dependence_nonzero']
          assert not z['normalization_independent']
          assert z['positive_FS_factor_used'] and not z['signed_C12_phase_assigned']
          assert not f['full_HMT_gauge_fixed_constraint_matrix_constructed']
          assert not f['complete_zero_mode_quotient_constructed']
          assert not f['full_FS_determinant_computed']
          assert not f['full_HMT_one_loop_evaluable']
          assert not f['full_C9_closed']
          assert not f['ordinary_projectable_parent_beta_functions_imported']
          assert not f['unresolved_HMT_matter_coefficients_chosen']
          assert not f['soft_s_retest_allowed']
          assert not f['production_k003_unblocked']
          assert not f['threshold_changed']
          assert f['no_DSIR']
          PY
      - name: Persist result checkpoint provenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C9_HMT_LAMBDA1_S3_REDUCED_SCALAR_ZETA_DETERMINANT_RESULT_v1.json research/checkpoints/RTK_C9_HMT_LAMBDA1_S3_REDUCED_SCALAR_ZETA_DETERMINANT_2026-08-28.md research/provenance/RTK_C9_HMT_LAMBDA1_S3_REDUCED_SCALAR_ZETA_DETERMINANT_PROVENANCE_v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record C9 HMT reduced scalar zeta determinant audit'
            git push origin HEAD:rtk-class-build
          fi
