name: RTK C10.65q numeric Bprime slip closure

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - 'research/theory_targets/RTK_C10_65Q_NUMERIC_BPRIME_SLIP_CLOSURE_TARGET_v1.json'
      - 'research/shadow/rtk_c10_65q_numeric_bprime_slip_closure.py'
      - 'research/shadow/rtk_c10_65q_numeric_bprime_slip_closure_v2.py'
      - '.github/workflows/rtk-c10-65q-numeric-bprime-slip-closure.yml'

permissions:
  contents: write

jobs:
  derivative-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install high-precision dependency
        run: python3 -m pip install --disable-pip-version-check 'mpmath==1.3.0'
      - name: Verify frozen parents
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_65Q_NUMERIC_BPRIME_SLIP_CLOSURE_TARGET_v1.json'))
          p=json.load(open('research/theory_results/RTK_C10_65P_SLIP_DERIVATIVE_TRIANGULAR_CLOSURE_RESULT_v1.json'))
          o=json.load(open('research/theory_results/RTK_C10_65O_RADIATION_SHEAR_METRIC_CLOSURE_RESULT_v1.json'))
          assert t['status']=='FROZEN_BEFORE_EXECUTION'
          assert p['classification']=='C10_65P_SLIP_DERIVATIVE_TRIANGULAR_CLOSURE_PASS_SCOPED'
          assert o['classification']=='C10_65O_RADIATION_SHEAR_METRIC_CLOSURE_PASS_SCOPED'
          PY
          git rev-parse HEAD | tee c10_65q_repo_head.txt
      - name: Prepare disposable pinned production tree
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_q
          git -C class_q reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_q/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_q/include/
          python3 rtk/apply_rtk_class_patch.py class_q
          python3 rtk/upgrade_rtk_inputs.py class_q
          python3 rtk/upgrade_rtk_nonlocal_initial_conditions.py class_q
          python3 rtk/upgrade_rtk_initial_conditions.py class_q
          python3 rtk/upgrade_rtk_matter_sources.py class_q
          python3 rtk/upgrade_rtk_gamma_root.py class_q
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_q
          python3 rtk/apply_rtk_c10_source_export_patch.py class_q
          make -C class_q -j2 class
      - name: Write four-anchor derivative input
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          f=json.load(open('research/theory_results/RTK_C10_65F_TCA_DOMAIN_PARTITION_EXACT_ONSET_PACK_RESULT_v1.json'))
          p=json.load(open('research/state/current.json'))['final_replay_result']['rtk']['params']
          kvals=', '.join(format(float(x),'.17g') for x in f['exact_anchor']['k_Mpc_inv'])
          body=f'''h = {p['h']!r}\nT_cmb = 2.7255\nOmega_b = {p['Ob']!r}\nOmega_khronon = {p['Om']!r}\nlambda_D = {p['lam']!r}\nOmega_Lambda = 0.\nmodel = 2.\nN_ur = 3.046\nN_ncdm = 0\nOmega_k = 0.\nOmega_fld = 0.\nOmega_scf = 0.\nrecombination = RECFAST\nreio_parametrization = reio_camb\nz_reio = {p['zre']!r}\noutput = mPk,dTk,vTk\ngauge = newtonian\nA_s = {p['As']!r}\nn_s = {p['ns']!r}\nP_k_max_h/Mpc = 1.0\nz_pk = 0\nk_output_values = {kvals}\nroot = output/c1065q_\nwrite parameters = yeap\nbackground_verbose = 0\nperturbations_verbose = 0\nspectra_verbose = 0\n'''
          pathlib.Path('class_q/c1065q.ini').write_text(body)
          pathlib.Path('class_q/output').mkdir(exist_ok=True)
          PY
      - name: Generate exact-onset background derivative histories
        run: |
          set -euo pipefail
          (cd class_q && ./class c1065q.ini) > c10_65q_class.log 2>&1
          find class_q/output -maxdepth 1 -type f -iname '*perturbations*' -print | sort > c10_65q_files.txt
          test "$(wc -l < c10_65q_files.txt)" -eq 4
      - name: Execute numeric derivative and slip closure
        run: |
          set -euo pipefail
          python3 -m py_compile research/shadow/rtk_c10_65q_numeric_bprime_slip_closure_v2.py
          python3 research/shadow/rtk_c10_65q_numeric_bprime_slip_closure_v2.py --glob 'class_q/output/*perturbations*' | tee c10_65q.log
          grep -q '^C10_65Q_NUMERIC_BPRIME_SLIP_CLOSURE_PASS_SCOPED ' c10_65q.log
      - name: Add immutable provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='research/theory_results/RTK_C10_65Q_NUMERIC_BPRIME_SLIP_CLOSURE_RESULT_v1.json'
          d=json.load(open(p)); d['provenance']={'repo_head_at_job_start':open('c10_65q_repo_head.txt').read().strip(),'class_upstream_sha':'36cf283628c4a3330ec9fd3d84239bf775f77317','workflow':'rtk-c10-65q-numeric-bprime-slip-closure.yml','worker':'research/shadow/rtk_c10_65q_numeric_bprime_slip_closure_v2.py','source_export_patch':'rtk/apply_rtk_c10_source_export_patch.py','mpmath':'1.3.0','v1_failure_run':32921303943,'v1_failure_reason':'mixed rounded R representations broke an exact internal-force cancellation at ~4e-24 relative; v2 reconstructs R=W_gamma/W_b from the same state used by the aggregate projector without weakening the frozen 1e-30 criterion'}
          open(p,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - name: Persist result
        run: |
          set -euo pipefail
          cp research/theory_results/RTK_C10_65Q_NUMERIC_BPRIME_SLIP_CLOSURE_RESULT_v1.json /tmp/c10_65q_result.json
          for attempt in 1 2 3 4 5; do
            git fetch origin rtk-class-build
            git reset --hard origin/rtk-class-build
            cp /tmp/c10_65q_result.json research/theory_results/RTK_C10_65Q_NUMERIC_BPRIME_SLIP_CLOSURE_RESULT_v1.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/theory_results/RTK_C10_65Q_NUMERIC_BPRIME_SLIP_CLOSURE_RESULT_v1.json
            git commit -m 'Record C10.65q numeric Bprime slip closure' || exit 0
            if git push origin HEAD:rtk-class-build; then exit 0; fi
          done
          exit 1
