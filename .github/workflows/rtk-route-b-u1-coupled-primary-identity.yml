name: RTK Route-B U1 coupled primary-identity gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-coupled-primary-identity-trigger.txt'

permissions:
  contents: read

jobs:
  exact-primary-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run coupled primary-identity survival theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_coupled_primary_identity_gate.py
          python3 rtk/route_b_u1_coupled_primary_identity_gate.py | tee u1_coupled_primary_identity.log
          grep -q 'RTK_ROUTE_B_U1_COUPLED_PRIMARY_IDENTITY_SURVIVES' u1_coupled_primary_identity.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_coupled_primary_identity_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_COUPLED_PRIMARY_IDENTITY_SURVIVES'
          assert r['combined']['pnu_total_plus_JA_total']=='0'
          assert r['combined']['dJA_total_dN']=='0'
          print('U1_COUPLED_PRIMARY_IDENTITY_ARTIFACT_ASSERTIONS_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rtk-route-b-u1-coupled-primary-identity
          path: |
            u1_coupled_primary_identity.log
            u1_coupled_primary_identity_result.json
            research/RTK_C8_U1_FAMILY1_FIXED_IR_SLICE_v1.json
          if-no-files-found: error
