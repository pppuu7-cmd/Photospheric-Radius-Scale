name: RTK C10.65s5d next-k multibranch one-step production canary
on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - 'research/triggers/RTK_C10_65S5D_TRIGGER_v1.txt'
permissions: {contents: write, actions: read}
jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with: {ref: rtk-class-build, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.3'}
      - name: Verify frozen parents and branches
        run: |
          set -euo pipefail
          git rev-parse HEAD > s5d_head.txt
          python3 - <<'PY'
          import json
          L=lambda p:json.load(open(p));t=L('research/theory_targets/RTK_C10_65S5D_NEXT_K_MULTIBRANCH_ONE_STEP_PRODUCTION_CANARY_TARGET_v1.json');a=L('research/theory_results/RTK_C10_65S5A_NEXT_K_NEAR_HORIZON_ONSET_STATE_PREFLIGHT_RESULT_v1.json');b=L('research/theory_results/RTK_C10_65S5B_NEXT_K_COMPLETED_ONSET_SEED_DOMAIN_AUDIT_RESULT_v1.json');c=L('research/theory_results/RTK_C10_65S5C_NEXT_K_OMITTED_ORDER_SENSITIVITY_RESULT_v1.json');k=L('research/theory_results/RTK_C10_65S2K_ONE_ACCEPTED_STEP_RETRY_RESULT_v1.json');e=L('research/theory_results/RTK_C10_65S2E_CURRENT_STATE_DERIVATIVE_SLIP_CLOSURE_RESULT_v1.json')
          assert t['status']=='FROZEN_BEFORE_IMPLEMENTATION';assert a['classification']==t['parents']['C10.65s5a'];assert b['classification']==t['parents']['C10.65s5b'];assert c['classification']==t['parents']['C10.65s5c'];assert k['classification']==t['parents']['C10.65s2k'];assert e['classification']==t['parents']['C10.65s2e_historical'];assert [x['id'] for x in t['domain']['branches']]==['baseline','joint_extremum','phi_extremum'];assert float(t['execution']['retry_width_Mpc'])==float(k['retry_width_Mpc']);assert t['threshold_changed'] is False
          print('C10_65S5D_FROZEN_PARENTS_BRANCHES_VERIFIED')
          PY
      - name: Prepare pinned control and three branch trees
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_control
          git -C class_control reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_control/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_control/include/
          for x in apply_rtk_class_patch.py upgrade_rtk_inputs.py upgrade_rtk_nonlocal_initial_conditions.py upgrade_rtk_initial_conditions.py upgrade_rtk_matter_sources.py upgrade_rtk_gamma_root.py upgrade_rtk_spectra_endpoint.py apply_rtk_c10_source_export_patch.py apply_rtk_c10_65a_species_control_patch.py apply_rtk_c10_65e_tca_coefficient_export_patch.py apply_rtk_c10_65r0_opt_in_local_environment_export_patch.py apply_rtk_c10_65r1_in_class_completed_projector_parity_patch.py stabilize_rtk_c10_65r1_conditioned_projector.py; do python3 "rtk/$x" class_control; done
          make -C class_control -j2 class
          for b in baseline joint_extremum phi_extremum; do
            cp -a class_control "class_$b"
            python3 rtk/apply_rtk_c10_65s2_production_canary_patch_v3.py "class_$b"
            python3 rtk/apply_rtk_c10_65s5d_branch_seed_patch.py "class_$b" "$b"
            grep -q 'static const s2seed S\[1\]' "class_$b/source/rtk_c10_65s2_class_bridge.c"
            make -C "class_$b" clean
            make -C "class_$b" -j2 class
          done
      - name: Write frozen k=0.01 inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          L=lambda p:json.load(open(p));t=L('research/theory_targets/RTK_C10_65S5D_NEXT_K_MULTIBRANCH_ONE_STEP_PRODUCTION_CANARY_TARGET_v1.json');p=L('research/state/current.json')['final_replay_result']['rtk']['params'];d=t['domain'];k=float(d['k_Mpc_inv'])
          common=f'''h = {p['h']!r}\nT_cmb = 2.7255\nOmega_b = {p['Ob']!r}\nOmega_khronon = {p['Om']!r}\nlambda_D = {p['lam']!r}\nOmega_Lambda = 0.\nmodel = 2.\nN_ur = 3.046\nN_ncdm = 0\nOmega_k = 0.\nOmega_fld = 0.\nOmega_scf = 0.\nrecombination = RECFAST\nreio_parametrization = reio_camb\nz_reio = {p['zre']!r}\noutput = mPk,dTk,vTk\ngauge = newtonian\nA_s = {p['As']!r}\nn_s = {p['ns']!r}\nP_k_max_1/Mpc = 0.0101\nz_pk = 0\nk_output_values = {k:.17g}\nwrite parameters = no\nbackground_verbose = 0\nperturbations_verbose = 0\nspectra_verbose = 0\nevolver = 0\nl_max_ur = 17\nc10_65r0_diag = 0\nc10_65r1_diag = 0\nc10_65r1_lambda_HL = {float(d['lambda_HL']):.17g}\nc10_65r1_Mc = {float(d['M_c_Mpc_inv']):.17g}\n'''
          pathlib.Path('class_control/output').mkdir(exist_ok=True);pathlib.Path('class_control/control.ini').write_text(common+'root = output/control_\n')
          extra=f'''c10_65s2_lambda_HL = {float(d['lambda_HL']):.17g}\nc10_65s2_Mc = {float(d['M_c_Mpc_inv']):.17g}\nc10_65s2_a_on = {float(d['a_on']):.17g}\n'''
          for b in ['baseline','joint_extremum','phi_extremum']:
            q=pathlib.Path('class_'+b);(q/'output').mkdir(exist_ok=True);(q/'off.ini').write_text(common+'c10_65s2_canary = 0\n'+extra+'root = output/off_\n');(q/'on.ini').write_text(common+'c10_65s2_canary = 1\n'+extra+'root = output/on_\n')
          PY
      - name: Verify exact dormant OFF rollback for every branch
        run: |
          set -euo pipefail
          (cd class_control && ./class control.ini) > s5d_control.log 2>&1
          python3 - <<'PY'
          import glob,hashlib,json,pathlib,subprocess
          def dig(p):
            q='\n'.join(x.strip() for x in pathlib.Path(p).read_text().splitlines() if x.strip() and not x.lstrip().startswith('#'))+'\n';return hashlib.sha256(q.encode()).hexdigest()
          A=glob.glob('class_control/output/control_*perturbations*');assert len(A)==1,A;ref=dig(A[0]);records=[];ok=True
          for b in ['baseline','joint_extremum','phi_extremum']:
            with open(f's5d_off_{b}.log','w') as h:subprocess.run(['./class','off.ini'],cwd='class_'+b,stdout=h,stderr=subprocess.STDOUT,check=True,env={k:v for k,v in __import__('os').environ.items() if k!='RTK_C10_65S2_OBSERVER_FILE'})
            B=glob.glob(f'class_{b}/output/off_*perturbations*');assert len(B)==1,B;sha=dig(B[0]);z=sha==ref;ok &= z;records.append({'branch':b,'control_sha256':ref,'off_sha256':sha,'identical':z})
          pathlib.Path('s5d_off_identity.json').write_text(json.dumps({'all_branches_identical':bool(ok),'records':records},indent=2,sort_keys=True)+'\n');assert ok
          PY
      - name: Execute three fixed one-step branches
        run: |
          set -euo pipefail
          mkdir -p s5d_observers
          for b in baseline joint_extremum phi_extremum; do
            rm -f "s5d_observers/$b.csv"
            (cd "class_$b" && RTK_C10_65S2_OBSERVER_FILE="$(pwd)/../s5d_observers/$b.csv" ./class on.ini) > "s5d_on_$b.log" 2>&1
            test -s "s5d_observers/$b.csv"
          done
      - name: Analyze frozen s5d
        run: |
          set -euo pipefail
          python3 research/shadow/rtk_c10_65s5d_multibranch_one_step_analyzer.py --observer-dir s5d_observers --off-identity s5d_off_identity.json --patch rtk/apply_rtk_c10_65s5d_branch_seed_patch.py --output research/theory_results/RTK_C10_65S5D_NEXT_K_MULTIBRANCH_ONE_STEP_PRODUCTION_CANARY_RESULT_v1.json | tee s5d.log
      - name: Add provenance
        if: always()
        run: |
          set -euo pipefail
          p=research/theory_results/RTK_C10_65S5D_NEXT_K_MULTIBRANCH_ONE_STEP_PRODUCTION_CANARY_RESULT_v1.json;[ -f "$p" ] || exit 0
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('research/theory_results/RTK_C10_65S5D_NEXT_K_MULTIBRANCH_ONE_STEP_PRODUCTION_CANARY_RESULT_v1.json');d=json.loads(p.read_text());d['provenance']={'repo_head_at_job_start':pathlib.Path('s5d_head.txt').read_text().strip(),'class_upstream_sha':os.environ['RTK_CLASS_UPSTREAM_SHA'],'workflow':'rtk-c10-65s5d-next-k-multibranch-one-step-production-canary.yml','github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'base_production_patch':'rtk/apply_rtk_c10_65s2_production_canary_patch_v3.py','branch_patch':'rtk/apply_rtk_c10_65s5d_branch_seed_patch.py','analyzer':'research/shadow/rtk_c10_65s5d_multibranch_one_step_analyzer.py','s5a_parent_run_id':33020948421,'s5b_parent_run_id':33021127591,'s5c_parent_run_id':33021313553,'s2k_parent_run_id':33004868239,'threshold_changed':False};p.write_text(json.dumps(d,indent=2,sort_keys=True,allow_nan=False)+'\n')
          PY
      - name: Persist result
        if: always()
        run: |
          set -euo pipefail
          p=research/theory_results/RTK_C10_65S5D_NEXT_K_MULTIBRANCH_ONE_STEP_PRODUCTION_CANARY_RESULT_v1.json;[ -f "$p" ] || exit 0;cp "$p" /tmp/r.json
          for n in 1 2 3 4 5;do git fetch origin rtk-class-build;git reset --hard origin/rtk-class-build;cp /tmp/r.json "$p";git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add "$p";git commit -m 'Record C10.65s5d multibranch production canary' || exit 0;git push origin HEAD:rtk-class-build && exit 0;done;exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c10-65s5d-next-k-multibranch-one-step-production-canary
          path: |
            s5d_*.log
            s5d_observers/*.csv
            s5d_off_identity.json
            research/theory_results/RTK_C10_65S5D_NEXT_K_MULTIBRANCH_ONE_STEP_PRODUCTION_CANARY_RESULT_v1.json
      - name: Enforce scientific classification
        if: always()
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('research/theory_results/RTK_C10_65S5D_NEXT_K_MULTIBRANCH_ONE_STEP_PRODUCTION_CANARY_RESULT_v1.json'));assert d['checks']['threshold_changed'] is False;assert d['classification']=='C10_65S5D_NEXT_K_MULTIBRANCH_ONE_STEP_PRODUCTION_CANARY_PASS_SCOPED',d
          print(d['classification'])
          PY
