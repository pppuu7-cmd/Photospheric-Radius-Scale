name: RTK Route-B U1 elliptic compensator regular-slice cross support

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-elliptic-compensator-regular-slice-cross-support-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Require frozen canonical parent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/RTK_U1_ELLIPTIC_MATTER_COMPENSATOR_CANONICAL_v1.json'))
          assert t['status']=='FROZEN_BEFORE_FULL_COUPLED_DIRAC'
          assert t['parent_canonical_run_id']==32597148540
          print('ELLIPTIC_CANONICAL_PARENT_PASS')
          PY
      - name: Run exact regular-slice cross-support theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_elliptic_compensator_regular_slice_cross_support_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_elliptic_compensator_regular_slice_cross_support_provenance.txt
          python3 rtk/route_b_u1_elliptic_compensator_regular_slice_cross_support_gate.py | tee u1_elliptic_compensator_regular_slice_cross_support.log
          grep -q '^RTK_ROUTE_B_U1_ELLIPTIC_COMPENSATOR_REGULAR_SLICE_CROSS_SUPPORT_PASS ' u1_elliptic_compensator_regular_slice_cross_support.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_elliptic_compensator_regular_slice_cross_support_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_ELLIPTIC_COMPENSATOR_REGULAR_SLICE_CROSS_SUPPORT_PASS'
          assert r['proven_cross_support']['X_piN_row']=='[0,0,0,0]'
          assert 'pfaffian_schur' in r
          print('U1_ELLIPTIC_REGULAR_SLICE_CROSS_SUPPORT_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-elliptic-compensator-regular-slice-cross-support
          path: |
            u1_elliptic_compensator_regular_slice_cross_support.log
            u1_elliptic_compensator_regular_slice_cross_support_result.json
            u1_elliptic_compensator_regular_slice_cross_support_provenance.txt
            research/RTK_U1_ELLIPTIC_MATTER_COMPENSATOR_CANONICAL_v1.json
            rtk/route_b_u1_elliptic_compensator_regular_slice_cross_support_gate.py
          if-no-files-found: error
