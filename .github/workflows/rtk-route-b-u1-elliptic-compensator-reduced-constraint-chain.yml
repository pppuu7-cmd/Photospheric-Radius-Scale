name: RTK Route-B U1 elliptic compensator reduced constraint chain

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-elliptic-compensator-reduced-constraint-chain-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Require Dirac-projected parent theorem
        run: |
          set -euo pipefail
          test -f rtk/route_b_u1_elliptic_compensator_dirac_projection_gate.py
          test -f rtk/route_b_u1_elliptic_compensator_reduced_chain_support_gate.py
          echo REDUCED_PARENT_FILES_PASS
      - name: Run reduced constraint-chain theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_elliptic_compensator_reduced_constraint_chain_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_elliptic_compensator_reduced_constraint_chain_provenance.txt
          python3 rtk/route_b_u1_elliptic_compensator_reduced_constraint_chain_gate.py | tee u1_elliptic_compensator_reduced_constraint_chain.log
          grep -q '^RTK_ROUTE_B_U1_ELLIPTIC_COMPENSATOR_REDUCED_CONSTRAINT_CHAIN_PASS ' u1_elliptic_compensator_reduced_constraint_chain.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_elliptic_compensator_reduced_constraint_chain_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_ELLIPTIC_COMPENSATOR_REDUCED_CONSTRAINT_CHAIN_PASS'
          assert r['exact_support']['{pi_N,Jhat}']=='0'
          assert r['physical_rank_basis']==['pi_N','Jhat','Hperp_hat','phi_hat']
          print('U1_ELLIPTIC_REDUCED_CONSTRAINT_CHAIN_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-elliptic-compensator-reduced-constraint-chain
          path: |
            u1_elliptic_compensator_reduced_constraint_chain.log
            u1_elliptic_compensator_reduced_constraint_chain_result.json
            u1_elliptic_compensator_reduced_constraint_chain_provenance.txt
            rtk/route_b_u1_elliptic_compensator_reduced_constraint_chain_gate.py
            rtk/route_b_u1_elliptic_compensator_dirac_projection_gate.py
            rtk/route_b_u1_elliptic_compensator_reduced_chain_support_gate.py
          if-no-files-found: error
