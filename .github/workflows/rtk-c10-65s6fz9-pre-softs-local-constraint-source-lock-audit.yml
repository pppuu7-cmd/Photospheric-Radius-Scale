name: RTK C10.65s6fZ9 pre-soft-s local constraint source-lock audit

on:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/rtk-c10-65s6fz9-pre-softs-local-constraint-source-lock-audit-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - name: Verify frozen target and parent
        run: |
          python - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_65S6FZ9_PRE_SOFTS_LOCAL_CONSTRAINT_SOURCE_LOCK_AUDIT_TARGET_v1.json'))
          p=json.load(open('research/theory_results/RTK_C10_65S6FZ8_MINIMAL_FULL_PROJECTABLE_ACTION_DOF_AUDIT_RESULT_v1.json'))
          assert p['classification']==t['parent_required']
          assert t['threshold_changed'] is False
          assert t['soft_s_retest_allowed'] is False
          assert t['production_k003_unblocked'] is False
          assert t['historical_source_commit']=='13acfdbc16d2f3117f1299b8552bcf7b1f996bd1'
          PY
      - name: Run frozen historical source-lock audit
        run: python research/shadow/rtk_c10_65s6fz9_pre_softs_local_constraint_source_lock_audit.py
      - name: Verify classification semantics
        run: |
          python - <<'PY'
          import json
          r=json.load(open('research/theory_results/RTK_C10_65S6FZ9_PRE_SOFTS_LOCAL_CONSTRAINT_SOURCE_LOCK_AUDIT_RESULT_v1.json'))
          assert r['classification'] in {
            'C10_65S6FZ9_PRE_SOFTS_LOCAL_CONSTRAINT_PARENT_FOUND_PASS_SCOPED',
            'C10_65S6FZ9_NO_PRE_SOFTS_LOCAL_CONSTRAINT_PARENT_FOUND_PASS_SCOPED'}
          assert all(r['checks'].values())
          assert r['threshold_changed'] is False
          assert r['soft_s_retest_allowed'] is False
          assert r['production_k003_unblocked'] is False
          PY
      - name: Persist result provenance and checkpoint
        run: |
          RUN_ID='${{ github.run_id }}' RUN_ATTEMPT='${{ github.run_attempt }}' HEAD_SHA='${{ github.sha }}' python - <<'PY'
          import json,os,datetime,pathlib
          rp=pathlib.Path('research/theory_results/RTK_C10_65S6FZ9_PRE_SOFTS_LOCAL_CONSTRAINT_SOURCE_LOCK_AUDIT_RESULT_v1.json')
          r=json.loads(rp.read_text())
          r['provenance']={'github_actions_run_id':int(os.environ['RUN_ID']),'github_actions_run_attempt':int(os.environ['RUN_ATTEMPT']),'trigger_head_sha':os.environ['HEAD_SHA'],'workflow':'rtk-c10-65s6fz9-pre-softs-local-constraint-source-lock-audit.yml','threshold_changed':False}
          rp.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          d=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H%MZ')
          cp=pathlib.Path(f'research/checkpoints/RTK_C10_65S6FZ9_PRE_SOFTS_LOCAL_CONSTRAINT_SOURCE_LOCK_AUDIT_{d}.md')
          cp.write_text('# RTK C10.65s6fZ9 checkpoint\n\nClassification: `'+r['classification']+'`.\n\nPinned historical source commit: `'+r['historical_source_commit']+'`. Candidate count: '+str(r['candidate_count'])+'.\n\n'+r['interpretation']+'\n\nNo soft-s retest or k=0.03 production is authorized.\n\nNext: '+r['next_gate']+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C10_65S6FZ9_PRE_SOFTS_LOCAL_CONSTRAINT_SOURCE_LOCK_AUDIT_RESULT_v1.json research/checkpoints/
          git commit -m 'Record C10.65s6fZ9 local constraint source-lock audit'
          git push origin HEAD:rtk-class-build
