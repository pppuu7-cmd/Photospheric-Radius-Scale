name: RTK C10.65s6e UV matching soft-s source-lock
# execution trigger only; frozen theorem and criteria unchanged

on:
  push:
    branches: [rtk-class-build]
    paths:
      - 'research/theory_targets/RTK_C10_65S6E_UV_MATCHING_SOFT_S_SOURCE_LOCK_TARGET_v1.json'
      - 'research/shadow/rtk_c10_65s6e_uv_matching_soft_s_source_lock.py'
      - '.github/workflows/rtk-c10-65s6e-uv-matching-soft-s-source-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy==1.13.3
      - name: Execute frozen C10.65s6e symbolic gate
        run: python research/shadow/rtk_c10_65s6e_uv_matching_soft_s_source_lock.py
      - name: Persist result and recovery checkpoint
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C10_65S6E_UV_MATCHING_SOFT_S_SOURCE_LOCK_RESULT_v1.json research/checkpoints/RTK_C10_65S6E_UV_MATCHING_SOFT_S_SOURCE_LOCK.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record C10.65s6e UV matching soft-s source-lock'
          git pull --rebase origin rtk-class-build
          git push origin HEAD:rtk-class-build
