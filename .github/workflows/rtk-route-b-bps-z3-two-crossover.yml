name: RTK Route-B BPS z3 two-crossover

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-bps-z3-two-crossover-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Run exact BPS z3 two-crossover theorem
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
          python3 -m py_compile rtk/route_b_bps_z3_two_crossover.py
          python3 rtk/route_b_bps_z3_two_crossover.py | tee route_b_bps_z3_two_crossover.log
          grep -q RTK_ROUTE_B_BPS_Z3_TWO_CROSSOVER_PASS route_b_bps_z3_two_crossover.log
          python3 - <<'PY'
          import platform,sympy
          assert platform.python_version()=='3.12.3'
          assert sympy.__version__=='1.14.0'
          print('RTK_ROUTE_B_BPS_Z3_TWO_CROSSOVER_RUNTIME_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-bps-z3-two-crossover
          path: route_b_bps_z3_two_crossover.log
          if-no-files-found: warn
