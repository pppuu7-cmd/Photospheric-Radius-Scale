name: RTK Route-B U1 elliptic compensator k0 matter rank inheritance

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-elliptic-compensator-k0-matter-rank-inheritance-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Require projected parent and RTK support theorem
        run: |
          set -euo pipefail
          test -f rtk/route_b_u1_elliptic_compensator_dirac_projection_gate.py
          test -f rtk/route_b_u1_rtk_crossblock_source_support_gate.py
          echo K0_PARENT_FILES_PASS
      - name: Run exact k0 ordinary-matter rank-inheritance theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_elliptic_compensator_k0_matter_rank_inheritance_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_elliptic_compensator_k0_matter_rank_inheritance_provenance.txt
          python3 rtk/route_b_u1_elliptic_compensator_k0_matter_rank_inheritance_gate.py | tee u1_elliptic_compensator_k0_matter_rank_inheritance.log
          grep -q '^RTK_ROUTE_B_U1_ELLIPTIC_COMPENSATOR_K0_MATTER_RANK_INHERITANCE_PASS ' u1_elliptic_compensator_k0_matter_rank_inheritance.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_elliptic_compensator_k0_matter_rank_inheritance_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_ELLIPTIC_COMPENSATOR_K0_MATTER_RANK_INHERITANCE_PASS'
          assert r['exact_k0_results']['a1_eff']=='0'
          assert 'B_gravity exactly' in r['ordinary_matter_crossblock']
          print('U1_ELLIPTIC_K0_MATTER_RANK_INHERITANCE_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-elliptic-compensator-k0-matter-rank-inheritance
          path: |
            u1_elliptic_compensator_k0_matter_rank_inheritance.log
            u1_elliptic_compensator_k0_matter_rank_inheritance_result.json
            u1_elliptic_compensator_k0_matter_rank_inheritance_provenance.txt
            rtk/route_b_u1_elliptic_compensator_k0_matter_rank_inheritance_gate.py
            rtk/route_b_u1_rtk_crossblock_source_support_gate.py
          if-no-files-found: error
