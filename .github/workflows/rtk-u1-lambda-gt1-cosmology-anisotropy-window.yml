name: RTK U1 lambda>1 cosmology anisotropy window

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-u1-lambda-gt1-cosmology-anisotropy-window-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run cosmology-anisotropy window theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/u1_lambda_gt1_cosmology_anisotropy_window_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_lambda_gt1_cosmology_anisotropy_window_provenance.txt
          python3 rtk/u1_lambda_gt1_cosmology_anisotropy_window_gate.py | tee u1_lambda_gt1_cosmology_anisotropy_window.log
          grep -q '^RTK_U1_LAMBDA_GT1_COSMOLOGY_ANISOTROPY_WINDOW_PASS ' u1_lambda_gt1_cosmology_anisotropy_window.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_lambda_gt1_cosmology_anisotropy_window_result.json'))
          assert r['classification']=='RTK_U1_LAMBDA_GT1_COSMOLOGY_ANISOTROPY_WINDOW_PASS'
          assert 'sqrt(2/3)' in r['joint_window_exists_if']
          assert 'sqrt(6)' in r['small_eps']
          print('U1_LAMBDA_GT1_COSMOLOGY_ANISOTROPY_WINDOW_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-u1-lambda-gt1-cosmology-anisotropy-window
          path: |
            u1_lambda_gt1_cosmology_anisotropy_window.log
            u1_lambda_gt1_cosmology_anisotropy_window_result.json
            u1_lambda_gt1_cosmology_anisotropy_window_provenance.txt
            rtk/u1_lambda_gt1_cosmology_anisotropy_window_gate.py
          if-no-files-found: error
