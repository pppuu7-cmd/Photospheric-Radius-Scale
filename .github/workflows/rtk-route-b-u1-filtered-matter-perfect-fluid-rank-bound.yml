name: RTK Route-B U1 filtered-matter perfect-fluid rank bound

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-filtered-matter-perfect-fluid-rank-bound-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run perfect-fluid filtered-matter rank bound theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_filtered_matter_perfect_fluid_rank_bound_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_filtered_matter_perfect_fluid_rank_bound_provenance.txt
          python3 rtk/route_b_u1_filtered_matter_perfect_fluid_rank_bound_gate.py | tee u1_filtered_matter_perfect_fluid_rank_bound.log
          grep -q '^RTK_ROUTE_B_U1_FILTERED_MATTER_PERFECT_FLUID_RANK_BOUND_PASS ' u1_filtered_matter_perfect_fluid_rank_bound.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_filtered_matter_perfect_fluid_rank_bound_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_FILTERED_MATTER_PERFECT_FLUID_RANK_BOUND_PASS'
          assert r['d3_eta0_1_specializations']['dust_w0']=='M_c^2 > rho/M_Pl^2'
          assert r['d3_eta0_1_specializations']['radiation_w1over3']=='M_c^2 > (3/2) rho/M_Pl^2'
          assert any('does not choose M_c' in z for z in r['non_claims'])
          print('U1_FILTERED_MATTER_PERFECT_FLUID_RANK_BOUND_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-filtered-matter-perfect-fluid-rank-bound
          path: |
            u1_filtered_matter_perfect_fluid_rank_bound.log
            u1_filtered_matter_perfect_fluid_rank_bound_result.json
            u1_filtered_matter_perfect_fluid_rank_bound_provenance.txt
            rtk/route_b_u1_filtered_matter_perfect_fluid_rank_bound_gate.py
          if-no-files-found: error
