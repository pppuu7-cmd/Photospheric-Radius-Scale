name: RTK Stage 4D1 iteration6 new stationarity gates

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rtk-stage4d1-iteration6-new-stationarity.yml'

jobs:
  stationarity:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {mapping: eff, lambda_D: '1000000', h: '0.6916347061671674', Ob: '0.046746356670844626', Om: '0.25174956894914075', As: '2.0658544086756353e-9', ns: '0.9644667357133481', zre: '6.767389323129575', expected_S: '1050.8505524799284', scale: '1.0'}
          - {mapping: eff, lambda_D: '1000000', h: '0.6916347061671674', Ob: '0.046746356670844626', Om: '0.25174956894914075', As: '2.0658544086756353e-9', ns: '0.9644667357133481', zre: '6.767389323129575', expected_S: '1050.8505524799284', scale: '0.5'}
          - {mapping: eff, lambda_D: '1000000', h: '0.6916347061671674', Ob: '0.046746356670844626', Om: '0.25174956894914075', As: '2.0658544086756353e-9', ns: '0.9644667357133481', zre: '6.767389323129575', expected_S: '1050.8505524799284', scale: '0.25'}
          - {mapping: k01, lambda_D: '100000', h: '0.6925611472905822', Ob: '0.0466379166270668', Om: '0.25064013930416545', As: '2.0702039106239816e-9', ns: '0.9649656917988538', zre: '6.90437754710983', expected_S: '1050.6308578446387', scale: '1.0'}
          - {mapping: k01, lambda_D: '100000', h: '0.6925611472905822', Ob: '0.0466379166270668', Om: '0.25064013930416545', As: '2.0702039106239816e-9', ns: '0.9649656917988538', zre: '6.90437754710983', expected_S: '1050.6308578446387', scale: '0.5'}
          - {mapping: k01, lambda_D: '100000', h: '0.6925611472905822', Ob: '0.0466379166270668', Om: '0.25064013930416545', As: '2.0702039106239816e-9', ns: '0.9649656917988538', zre: '6.90437754710983', expected_S: '1050.6308578446387', scale: '0.25'}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '120'
      RTK_CACHE_KEY_VERSION: 'exact-float-v1'
    steps:
      - uses: actions/checkout@v4
        with: {ref: rtk-class-build}
      - name: Prepare cache-safe exact likelihood tree
        run: |
          set -euo pipefail
          git clone --depth 1 --branch nonlocal https://github.com/dirian/class_public.git class_public
          git clone --depth 1 https://github.com/dscolnic/Pantheon.git class_public/pantheon
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py class_public/joint_profile_runner.py
          cp rtk/prepare_inference_core.py class_public/prepare_inference_core.py
          cp rtk/stage4d0_fixed_lambda_stationarity.py class_public/stage4d0_fixed_lambda_stationarity.py
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py
          ! grep -q 'A_s_ad\|n_s_ad' inference_core.py
      - name: Build CLASS
        working-directory: class_public
        run: make -j2 class
      - name: Install likelihood dependencies
        run: python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' numpy scipy
      - name: Download official Planck baseline
        working-directory: class_public
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          mkdir planck_data
          tar -xzf planck.tar.gz -C planck_data
      - name: Run 73-point Hessian stationarity stencil
        working-directory: class_public
        run: |
          set -o pipefail
          python3 stage4d0_fixed_lambda_stationarity.py planck_data '${{ matrix.lambda_D }}' '${{ matrix.mapping }}' \
            '${{ matrix.h }}' '${{ matrix.Ob }}' '${{ matrix.Om }}' '${{ matrix.As }}' '${{ matrix.ns }}' '${{ matrix.zre }}' \
            '${{ matrix.expected_S }}' '${{ matrix.scale }}' | tee ../stationarity_${{ matrix.mapping }}_${{ matrix.lambda_D }}_s${{ matrix.scale }}.log
          grep -q STAGE4D0_FIXED_LAMBDA_PASS ../stationarity_${{ matrix.mapping }}_${{ matrix.lambda_D }}_s${{ matrix.scale }}.log
      - uses: actions/upload-artifact@v4
        with:
          name: rtk-stage4d1-iteration6-stationarity-${{ matrix.mapping }}-${{ matrix.lambda_D }}-s${{ matrix.scale }}
          path: |
            stationarity_${{ matrix.mapping }}_${{ matrix.lambda_D }}_s${{ matrix.scale }}.log
            class_public/output/stage4d0_fixed_lambda/${{ matrix.mapping }}/${{ matrix.lambda_D }}/scale_*/stationarity_summary.json
            class_public/output/stage4d0_fixed_lambda/${{ matrix.mapping }}/${{ matrix.lambda_D }}/scale_*/stationarity_points.csv
          if-no-files-found: error
