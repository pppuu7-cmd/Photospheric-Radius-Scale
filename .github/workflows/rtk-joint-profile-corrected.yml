name: RTK corrected joint Planck Pantheon BOSS profile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rtk-joint-profile-corrected.yml'

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
      - name: Fetch and patch
        shell: bash
        run: |
          git clone --depth 1 --branch nonlocal https://github.com/dirian/class_public.git class_public
          git clone --depth 1 https://github.com/dscolnic/Pantheon.git class_public/pantheon
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py class_public/
          sed -i 's/A_s_ad/A_s/g; s/n_s_ad/n_s/g' class_public/joint_profile_runner.py
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          grep -q 'f"A_s = {p' class_public/joint_profile_runner.py
          grep -q 'f"n_s = {p' class_public/joint_profile_runner.py
          ! grep -q 'A_s_ad\|n_s_ad' class_public/joint_profile_runner.py
      - name: Build
        working-directory: class_public
        run: make -j2 class
      - name: Install official Planck evaluator
        run: python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' scipy
      - name: Download official Planck and profile
        working-directory: class_public
        shell: bash
        env:
          CLIPY_NOJAX: '1'
          OMP_NUM_THREADS: '2'
        run: |
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          mkdir planck_data && tar -xzf planck.tar.gz -C planck_data
          mkdir -p output/profile
          python3 joint_profile_runner.py planck_data > ../joint_profile_corrected.txt
          tail -120 ../joint_profile_corrected.txt
          grep -q JOINT_PROFILE_PASS ../joint_profile_corrected.txt
          # Corrected primordial parameters must measurably affect at least some evaluations.
          python3 - <<'PY'
          import csv
          rows=list(csv.DictReader(open('output/profile/joint_profile_history.csv')))
          def vals(model,key):
              return {(r[key],r['score']) for r in rows if r['model']==model and r.get('ok')=='True'}
          for model in ('LCDM','RTK'):
              subset=[r for r in rows if r['model']==model and r.get('ok')=='True']
              as_scores={round(float(r['score']),8) for r in subset if r.get('As')}
              if len(as_scores)<2: raise SystemExit(f'{model}: score did not vary after primordial fix')
          print('PRIMORDIAL_PROFILE_VARIATION_CONFIRMED')
          PY
      - name: Upload corrected joint profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtk-joint-profile-corrected-results
          path: |
            joint_profile_corrected.txt
            class_public/output/profile/joint_profile_history.csv
            class_public/output/profile/joint_profile_best.csv
            class_public/profile_*.log
            class_public/profile_*.ini
