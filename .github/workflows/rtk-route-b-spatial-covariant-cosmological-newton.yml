name: RTK Route-B spatial-covariant cosmological-Newton gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-spatial-covariant-cosmological-newton-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Run exact cosmological-vs-Newton normalization gate
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
          python3 -m py_compile rtk/route_b_spatial_covariant_cosmological_newton_gate.py
          python3 rtk/route_b_spatial_covariant_cosmological_newton_gate.py | tee route_b_spatial_covariant_cosmological_newton.log
          grep -q RTK_ROUTE_B_SPATIAL_COVARIANT_COSMOLOGICAL_NEWTON_GATE_PASS route_b_spatial_covariant_cosmological_newton.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-spatial-covariant-cosmological-newton
          path: route_b_spatial_covariant_cosmological_newton.log
          if-no-files-found: error
