name: RTK Route-B spatial-covariant Newton boundary

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-spatial-covariant-newton-boundary-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Run exact Newton-boundary theorem
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
          python3 -m py_compile rtk/route_b_spatial_covariant_newton_boundary.py
          python3 rtk/route_b_spatial_covariant_newton_boundary.py | tee route_b_spatial_covariant_newton_boundary.log
          grep -q RTK_ROUTE_B_SPATIAL_COVARIANT_NEWTON_BOUNDARY_PASS route_b_spatial_covariant_newton_boundary.log
          printf 'research_source_commit=%s\npython=%s\n' "$(git rev-parse HEAD)" "$(python3 --version)" > route_b_spatial_covariant_newton_boundary_provenance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-spatial-covariant-newton-boundary
          path: |
            route_b_spatial_covariant_newton_boundary.log
            route_b_spatial_covariant_newton_boundary_provenance.txt
          if-no-files-found: error
