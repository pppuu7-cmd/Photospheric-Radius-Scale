name: RTK C10.65s1 finite-state completion at onset

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - 'rtk/apply_rtk_c10_65s1_readonly_state_observer_patch.py'
      - 'research/shadow/rtk_c10_65s1_finite_state_completion_at_onset.py'
      - '.github/workflows/rtk-c10-65s1-finite-state-completion-at-onset.yml'

permissions:
  contents: write

jobs:
  finite-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with: {ref: rtk-class-build, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.3'}
      - name: Verify frozen s1 contract and parents
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee c10_65s1_head.txt
          python3 - <<'PY'
          import json
          L=lambda p: json.load(open(p))
          t=L('research/theory_targets/RTK_C10_65S1_FINITE_STATE_COMPLETION_AT_ONSET_TARGET_v1.json')
          assert t['status']=='FROZEN_BEFORE_IMPLEMENTATION'
          assert t['pinned_class_upstream_sha']=='36cf283628c4a3330ec9fd3d84239bf775f77317'
          parents=[
            ('research/theory_results/RTK_C10_65S0_DIRECT_ONSET_STATE_VECTOR_ARCHITECTURE_RESULT_v1.json','C10_65S0_DIRECT_ONSET_INITIALIZATION_ARCHITECTURE_PASS_LEGACY_AUX_EXCLUSION_REQUIRED_SCOPED'),
            ('research/theory_results/RTK_C10_65N_CONDITIONAL_COMPLETED_U1_ONSET_SEED_PREFLIGHT_RESULT_v1.json','C10_65N_CONDITIONAL_COMPLETED_U1_ONSET_SEED_PREFLIGHT_PASS_SCOPED'),
            ('research/theory_results/RTK_C10_65R2_IN_CLASS_FIRST_RHS_DIAGNOSTIC_PARITY_RESULT_v1.json','C10_65R2_IN_CLASS_FIRST_RHS_DIAGNOSTIC_PARITY_PASS_SCOPED'),
            ('research/theory_results/RTK_C10_65F_TCA_DOMAIN_PARTITION_EXACT_ONSET_PACK_RESULT_v1.json','C10_65F_TCA_DOMAIN_PARTITION_EXACT_ONSET_PACK_PASS_SCOPED')]
          for p,c in parents: assert L(p)['classification']==c,(p,L(p).get('classification'))
          PY
      - name: Prepare pinned r1 control and s1 observer trees
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_control
          git -C class_control reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_control/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_control/include/
          python3 rtk/apply_rtk_class_patch.py class_control
          python3 rtk/upgrade_rtk_inputs.py class_control
          python3 rtk/upgrade_rtk_nonlocal_initial_conditions.py class_control
          python3 rtk/upgrade_rtk_initial_conditions.py class_control
          python3 rtk/upgrade_rtk_matter_sources.py class_control
          python3 rtk/upgrade_rtk_gamma_root.py class_control
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_control
          python3 rtk/apply_rtk_c10_source_export_patch.py class_control
          python3 rtk/apply_rtk_c10_65a_species_control_patch.py class_control
          python3 rtk/apply_rtk_c10_65e_tca_coefficient_export_patch.py class_control
          python3 rtk/apply_rtk_c10_65r0_opt_in_local_environment_export_patch.py class_control
          python3 rtk/apply_rtk_c10_65r1_in_class_completed_projector_parity_patch.py class_control
          python3 rtk/stabilize_rtk_c10_65r1_conditioned_projector.py class_control
          make -C class_control -j2 class
          cp -a class_control class_s1
          python3 rtk/apply_rtk_c10_65s1_readonly_state_observer_patch.py class_s1
          make -C class_s1 clean
          make -C class_s1 -j2 class
      - name: Write four-anchor matched inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          f=json.load(open('research/theory_results/RTK_C10_65F_TCA_DOMAIN_PARTITION_EXACT_ONSET_PACK_RESULT_v1.json'))
          n=json.load(open('research/theory_results/RTK_C10_65N_CONDITIONAL_COMPLETED_U1_ONSET_SEED_PREFLIGHT_RESULT_v1.json'))
          p=json.load(open('research/state/current.json'))['final_replay_result']['rtk']['params']
          q=n['points'][0]; kvals=', '.join(format(float(x),'.17g') for x in f['exact_anchor']['k_Mpc_inv'])
          common=f'''h = {p['h']!r}\nT_cmb = 2.7255\nOmega_b = {p['Ob']!r}\nOmega_khronon = {p['Om']!r}\nlambda_D = {p['lam']!r}\nOmega_Lambda = 0.\nmodel = 2.\nN_ur = 3.046\nN_ncdm = 0\nOmega_k = 0.\nOmega_fld = 0.\nOmega_scf = 0.\nrecombination = RECFAST\nreio_parametrization = reio_camb\nz_reio = {p['zre']!r}\noutput = mPk,dTk,vTk\ngauge = newtonian\nA_s = {p['As']!r}\nn_s = {p['ns']!r}\nP_k_max_h/Mpc = 1.0\nz_pk = 0\nk_output_values = {kvals}\nwrite parameters = no\nbackground_verbose = 0\nperturbations_verbose = 0\nspectra_verbose = 0\nc10_65r0_diag = 1\nc10_65r1_diag = 1\nc10_65r1_lambda_HL = {float(q['lambda_HL']):.17g}\nc10_65r1_Mc = {float(q['M_c_Mpc_inv']):.17g}\n'''
          for d in ('class_control/output','class_s1/output'): pathlib.Path(d).mkdir(exist_ok=True)
          pathlib.Path('class_control/control.ini').write_text(common+'root = output/control_\n')
          pathlib.Path('class_s1/off.ini').write_text(common+'root = output/off_\n')
          pathlib.Path('class_s1/on.ini').write_text(common+'root = output/on_\n')
          PY
      - name: Verify exact dormant OFF-path numeric identity
        run: |
          set -euo pipefail
          (cd class_control && ./class control.ini) > c10_65s1_control.log 2>&1
          (cd class_s1 && env -u RTK_C10_65S1_OBSERVER_FILE ./class off.ini) > c10_65s1_off.log 2>&1
          python3 - <<'PY'
          import glob,hashlib,json,pathlib
          def num(p): return [x.strip() for x in pathlib.Path(p).read_text().splitlines() if x.strip() and not x.lstrip().startswith('#')]
          def dig(p): return hashlib.sha256(('\n'.join(num(p))+'\n').encode()).hexdigest()
          A=sorted(glob.glob('class_control/output/control_*perturbations*')); B=sorted(glob.glob('class_s1/output/off_*perturbations*'))
          assert len(A)==len(B)==4,(len(A),len(B))
          rows=[]; ok=True
          for a,b in zip(A,B):
            da,db=dig(a),dig(b); same=da==db; ok &= same; rows.append({'control':a,'observer_off':b,'control_sha256':da,'observer_off_sha256':db,'identical':same})
          out={'all_four_numeric_rows_sha256_identical':bool(ok),'records':rows}
          pathlib.Path('c10_65s1_off_identity.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2)); assert ok
          PY
      - name: Run read-only full-state onset observer
        run: |
          set -euo pipefail
          rm -f c10_65s1_observer.csv
          (cd class_s1 && RTK_C10_65S1_OBSERVER_FILE="$(pwd)/../c10_65s1_observer.csv" ./class on.ini) > c10_65s1_on.log 2>&1
          test -s c10_65s1_observer.csv
      - name: Execute frozen s1 analyzer
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/apply_rtk_c10_65s1_readonly_state_observer_patch.py research/shadow/rtk_c10_65s1_finite_state_completion_at_onset.py
          python3 research/shadow/rtk_c10_65s1_finite_state_completion_at_onset.py \
            --observer c10_65s1_observer.csv --off-identity c10_65s1_off_identity.json \
            --patch rtk/apply_rtk_c10_65s1_readonly_state_observer_patch.py \
            --output research/theory_results/RTK_C10_65S1_FINITE_STATE_COMPLETION_AT_ONSET_RESULT_v1.json | tee c10_65s1.log
          grep -Eq '^C10_65S1_(FINITE_STATE_COMPLETION_AT_ONSET_PASS_SCOPED|HIGHER_HIERARCHY_CONTROL_RESOLUTION_LIMITED_SCOPED) ' c10_65s1.log
      - name: Add immutable provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          p='research/theory_results/RTK_C10_65S1_FINITE_STATE_COMPLETION_AT_ONSET_RESULT_v1.json'; d=json.load(open(p))
          d['provenance']={'repo_head_at_job_start':open('c10_65s1_head.txt').read().strip(),'class_upstream_sha':'36cf283628c4a3330ec9fd3d84239bf775f77317','workflow':'rtk-c10-65s1-finite-state-completion-at-onset.yml','observer_patch':'rtk/apply_rtk_c10_65s1_readonly_state_observer_patch.py','analyzer':'research/shadow/rtk_c10_65s1_finite_state_completion_at_onset.py','github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'threshold_changed':False}
          open(p,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - name: Persist result
        run: |
          set -euo pipefail
          cp research/theory_results/RTK_C10_65S1_FINITE_STATE_COMPLETION_AT_ONSET_RESULT_v1.json /tmp/s1.json
          for attempt in 1 2 3 4 5; do
            git fetch origin rtk-class-build; git reset --hard origin/rtk-class-build
            cp /tmp/s1.json research/theory_results/RTK_C10_65S1_FINITE_STATE_COMPLETION_AT_ONSET_RESULT_v1.json
            git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/theory_results/RTK_C10_65S1_FINITE_STATE_COMPLETION_AT_ONSET_RESULT_v1.json
            git commit -m 'Record C10.65s1 finite-state onset completion' || exit 0
            if git push origin HEAD:rtk-class-build; then exit 0; fi
          done
          exit 1
