name: RTK Route-B U1 filtered-matter low-k scaling support

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-filtered-matter-lowk-scaling-support-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run filtered-matter low-k scaling/support theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_filtered_matter_lowk_scaling_support_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_filtered_matter_lowk_scaling_support_provenance.txt
          python3 rtk/route_b_u1_filtered_matter_lowk_scaling_support_gate.py | tee u1_filtered_matter_lowk_scaling_support.log
          grep -q '^RTK_ROUTE_B_U1_FILTERED_MATTER_LOWK_SCALING_SUPPORT_PASS ' u1_filtered_matter_lowk_scaling_support.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_filtered_matter_lowk_scaling_support_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_FILTERED_MATTER_LOWK_SCALING_SUPPORT_PASS'
          assert 'K=[[0,k12],[k21,k22]]' in r['sparse_support']
          assert 'sqrt(3) kappa' in r['entrywise_bound']
          assert 'does not choose M_c' in r['non_claims']
          print('U1_FILTERED_MATTER_LOWK_SCALING_SUPPORT_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-filtered-matter-lowk-scaling-support
          path: |
            u1_filtered_matter_lowk_scaling_support.log
            u1_filtered_matter_lowk_scaling_support_result.json
            u1_filtered_matter_lowk_scaling_support_provenance.txt
            rtk/route_b_u1_filtered_matter_lowk_scaling_support_gate.py
          if-no-files-found: error
