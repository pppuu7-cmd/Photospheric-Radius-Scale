name: RTK Stage 4D1 iteration6 round8 dual Hessian plus recenter

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rtk-stage4d1-iteration6-r8-dual-hessian-recenter.yml'

jobs:
  recenter:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {mapping: eff, lambda_D: '30000', h: '0.6924506094722548', Ob: '0.046662425462622975', Om: '0.2507969038353458', As: '2.0745155591708036e-9', ns: '0.9650000900570339', zre: '7.0117632549360165'}
          - {mapping: k01, lambda_D: '30000', h: '0.6925804878501572', Ob: '0.046640210737978964', Om: '0.25061563396813435', As: '2.075988394891211e-9', ns: '0.9651157251639984', zre: '7.052199706447346'}
          - {mapping: eff, lambda_D: '100000', h: '0.6928352871701494', Ob: '0.046614589522315855', Om: '0.25031718675694054', As: '2.072423548883846e-9', ns: '0.9652910047857824', zre: '6.97058557424307'}
          - {mapping: k01, lambda_D: '100000', h: '0.6924976220763568', Ob: '0.04664122774440405', Om: '0.2507075928567213', As: '2.071451357747668e-9', ns: '0.9650851978264555', zre: '6.938177992325822'}
          - {mapping: k01, lambda_D: '1000000', h: '0.6928134879947581', Ob: '0.046605852580593486', Om: '0.25031906814243876', As: '2.070806288582937e-9', ns: '0.965242912316959', zre: '6.928419913206101'}
          - {mapping: k01, lambda_D: '100000000', h: '0.6929470538529825', Ob: '0.04660340646976', Om: '0.2501842378058869', As: '2.0737950639121593e-9', ns: '0.9653004002124876', zre: '7.005725461152364'}
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '120'
      RTK_CACHE_KEY_VERSION: 'exact-float-v1'
    steps:
      - uses: actions/checkout@v4
        with: {ref: rtk-class-build}
      - name: Prepare exact cache-safe tree
        run: |
          set -euo pipefail
          git clone --depth 1 --branch nonlocal https://github.com/dirian/class_public.git class_public
          git clone --depth 1 https://github.com/dscolnic/Pantheon.git class_public/pantheon
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py class_public/joint_profile_runner.py
          cp rtk/prepare_inference_core.py class_public/prepare_inference_core.py
          cp rtk/stage4d1_tight_refine.py class_public/stage4d1_tight_refine.py
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py
          ! grep -q 'A_s_ad\|n_s_ad' inference_core.py
      - name: Build CLASS
        working-directory: class_public
        run: make -j2 class
      - name: Install exact likelihood dependencies
        run: python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' numpy scipy
      - name: Download official Planck baseline
        working-directory: class_public
        run: |
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          mkdir planck_data && tar -xzf planck.tar.gz -C planck_data
      - name: Run five-start Powell plus two exact polls
        working-directory: class_public
        run: |
          set -o pipefail
          python3 stage4d1_tight_refine.py planck_data '${{ matrix.lambda_D }}' '${{ matrix.mapping }}' \
            '${{ matrix.h }}' '${{ matrix.Ob }}' '${{ matrix.Om }}' '${{ matrix.As }}' '${{ matrix.ns }}' '${{ matrix.zre }}' | tee ../r8_${{ matrix.mapping }}_${{ matrix.lambda_D }}.log
          grep -q STAGE4D1_TIGHT_PASS ../r8_${{ matrix.mapping }}_${{ matrix.lambda_D }}.log
      - uses: actions/upload-artifact@v4
        with:
          name: rtk-stage4d1-iteration6-r8-${{ matrix.mapping }}-${{ matrix.lambda_D }}
          path: |
            r8_${{ matrix.mapping }}_${{ matrix.lambda_D }}.log
            class_public/output/stage4d1_tight/${{ matrix.mapping }}/**/refine_summary.json
            class_public/output/stage4d1_tight/${{ matrix.mapping }}/**/refine_trace.csv
          if-no-files-found: error

  hessian:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {label: eff1e6, mapping: eff, lambda_D: '1000000', scale: '1.0', h: '0.6924412470503701', Ob: '0.04666488916124337', Om: '0.2508372257635462', As: '2.070654405154798e-9', ns: '0.9648104077201295', zre: '6.905417772702634', bestS: '1050.5953463886713'}
          - {label: eff1e6, mapping: eff, lambda_D: '1000000', scale: '0.5', h: '0.6924412470503701', Ob: '0.04666488916124337', Om: '0.2508372257635462', As: '2.070654405154798e-9', ns: '0.9648104077201295', zre: '6.905417772702634', bestS: '1050.5953463886713'}
          - {label: eff1e6, mapping: eff, lambda_D: '1000000', scale: '0.25', h: '0.6924412470503701', Ob: '0.04666488916124337', Om: '0.2508372257635462', As: '2.070654405154798e-9', ns: '0.9648104077201295', zre: '6.905417772702634', bestS: '1050.5953463886713'}
          - {label: eff1e8, mapping: eff, lambda_D: '100000000', scale: '1.0', h: '0.6926515812539762', Ob: '0.04665181387457756', Om: '0.2506395506864848', As: '2.071432795803292e-9', ns: '0.965033210294227', zre: '6.924878048218663', bestS: '1050.5863153992784'}
          - {label: eff1e8, mapping: eff, lambda_D: '100000000', scale: '0.5', h: '0.6926515812539762', Ob: '0.04665181387457756', Om: '0.2506395506864848', As: '2.071432795803292e-9', ns: '0.965033210294227', zre: '6.924878048218663', bestS: '1050.5863153992784'}
          - {label: eff1e8, mapping: eff, lambda_D: '100000000', scale: '0.25', h: '0.6926515812539762', Ob: '0.04665181387457756', Om: '0.2506395506864848', As: '2.071432795803292e-9', ns: '0.965033210294227', zre: '6.924878048218663', bestS: '1050.5863153992784'}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '120'
      RTK_CACHE_KEY_VERSION: 'exact-float-v1'
    steps:
      - uses: actions/checkout@v4
        with: {ref: rtk-class-build}
      - name: Prepare exact cache-safe tree
        run: |
          set -euo pipefail
          git clone --depth 1 --branch nonlocal https://github.com/dirian/class_public.git class_public
          git clone --depth 1 https://github.com/dscolnic/Pantheon.git class_public/pantheon
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py class_public/joint_profile_runner.py
          cp rtk/prepare_inference_core.py class_public/prepare_inference_core.py
          cp rtk/stage4d0_fixed_lambda_stationarity.py class_public/stage4d0_fixed_lambda_stationarity.py
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py
          ! grep -q 'A_s_ad\|n_s_ad' inference_core.py
      - name: Build CLASS
        working-directory: class_public
        run: make -j2 class
      - name: Install exact likelihood dependencies
        run: python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' numpy scipy
      - name: Download official Planck baseline
        working-directory: class_public
        run: |
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          mkdir planck_data && tar -xzf planck.tar.gz -C planck_data
      - name: Run 73-point stationarity stencil
        working-directory: class_public
        run: |
          set -o pipefail
          python3 stage4d0_fixed_lambda_stationarity.py planck_data '${{ matrix.lambda_D }}' '${{ matrix.mapping }}' \
            '${{ matrix.h }}' '${{ matrix.Ob }}' '${{ matrix.Om }}' '${{ matrix.As }}' '${{ matrix.ns }}' '${{ matrix.zre }}' \
            '${{ matrix.bestS }}' '${{ matrix.scale }}' | tee ../hessian_${{ matrix.label }}_s${{ matrix.scale }}.log
          grep -q STAGE4D0_FIXED_LAMBDA_PASS ../hessian_${{ matrix.label }}_s${{ matrix.scale }}.log
      - uses: actions/upload-artifact@v4
        with:
          name: rtk-stage4d1-iteration6-hessian-${{ matrix.label }}-s${{ matrix.scale }}
          path: |
            hessian_${{ matrix.label }}_s${{ matrix.scale }}.log
            class_public/output/stage4d0_fixed_lambda/${{ matrix.mapping }}/${{ matrix.lambda_D }}/scale_*/stationarity_summary.json
            class_public/output/stage4d0_fixed_lambda/${{ matrix.mapping }}/${{ matrix.lambda_D }}/scale_*/stationarity_points.csv
          if-no-files-found: error
