name: RTK Route-B alignment background-silence obstruction

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-alignment-background-silence-obstruction-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run alignment/background-silence obstruction
        run: |
          set -euo pipefail
          echo "RTK_SOURCE_SHA=$(git rev-parse HEAD)" | tee rtk_alignment_background_silence_provenance.txt
          python -m py_compile rtk/route_b_alignment_background_silence_obstruction.py
          python rtk/route_b_alignment_background_silence_obstruction.py | tee rtk_alignment_background_silence.log
          grep -q '^RTK_ROUTE_B_ALIGNMENT_BACKGROUND_SILENCE_OBSTRUCTION_PASS ' rtk_alignment_background_silence.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-alignment-background-silence-obstruction
          path: |
            rtk_alignment_background_silence.log
            rtk_alignment_background_silence_provenance.txt
          if-no-files-found: error
