name: RTK C9 projectable finite-Mc Yukawa real-space

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c9-projectable-u1-finite-mc-yukawa-realspace-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run Yukawa real-space theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/c9_projectable_u1_finite_mc_yukawa_realspace_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee c9_projectable_u1_finite_mc_yukawa_realspace_provenance.txt
          python3 rtk/c9_projectable_u1_finite_mc_yukawa_realspace_gate.py | tee c9_projectable_u1_finite_mc_yukawa_realspace.log
          grep -q '^RTK_C9_PROJECTABLE_U1_FINITE_MC_YUKAWA_REALSPACE_PASS ' c9_projectable_u1_finite_mc_yukawa_realspace.log
          python3 - <<'PY'
          import json
          r=json.load(open('c9_projectable_u1_finite_mc_yukawa_realspace_result.json'))
          assert r['classification']=='RTK_C9_PROJECTABLE_U1_FINITE_MC_YUKAWA_REALSPACE_PASS'
          assert 'exp(-M_c r)' in r['point_source']['potential']
          assert 'W_{-1}' in r['exact_force_tolerance']['x_max']
          print('C9_PROJECTABLE_U1_FINITE_MC_YUKAWA_REALSPACE_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c9-projectable-u1-finite-mc-yukawa-realspace
          path: |
            c9_projectable_u1_finite_mc_yukawa_realspace.log
            c9_projectable_u1_finite_mc_yukawa_realspace_result.json
            c9_projectable_u1_finite_mc_yukawa_realspace_provenance.txt
            rtk/c9_projectable_u1_finite_mc_yukawa_realspace_gate.py
          if-no-files-found: error
