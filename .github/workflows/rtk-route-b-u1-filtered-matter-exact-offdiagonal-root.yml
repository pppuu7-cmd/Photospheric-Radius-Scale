name: RTK Route-B U1 filtered-matter exact off-diagonal root

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-filtered-matter-exact-offdiagonal-root-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run exact off-diagonal root theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_filtered_matter_exact_offdiagonal_root_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_filtered_matter_exact_offdiagonal_root_provenance.txt
          python3 rtk/route_b_u1_filtered_matter_exact_offdiagonal_root_gate.py | tee u1_filtered_matter_exact_offdiagonal_root.log
          grep -q '^RTK_ROUTE_B_U1_FILTERED_MATTER_EXACT_OFFDIAGONAL_ROOT_PASS ' u1_filtered_matter_exact_offdiagonal_root.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_filtered_matter_exact_offdiagonal_root_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_FILTERED_MATTER_EXACT_OFFDIAGONAL_ROOT_PASS'
          assert r['classification_by_Mc']['M_c^2>R']=='no off-diagonal zero for q>=0'
          assert 'not automatically det B' in r['warning']
          print('U1_FILTERED_MATTER_EXACT_OFFDIAGONAL_ROOT_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-filtered-matter-exact-offdiagonal-root
          path: |
            u1_filtered_matter_exact_offdiagonal_root.log
            u1_filtered_matter_exact_offdiagonal_root_result.json
            u1_filtered_matter_exact_offdiagonal_root_provenance.txt
            rtk/route_b_u1_filtered_matter_exact_offdiagonal_root_gate.py
          if-no-files-found: error
