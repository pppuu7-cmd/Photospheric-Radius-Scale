name: RTK AI auto-research agent

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - 'RTK clean-room fixed-lambda rediscovery grid'
      - 'RTK Stage 4D3 Round5 finest 7D stationarity'
      - 'RTK current-pair linstep1 precision rescue v3 long'
      - 'RTK agent scientific gate'
    types: [completed]

concurrency:
  group: rtk-ai-auto-research-agent
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

env:
  OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}

jobs:
  decide-and-advance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Check whether OpenAI agent is enabled
        id: preflight
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'RTK_AI_AGENT_ENABLED'
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'RTK_AI_AGENT_DISABLED: add repository secret OPENAI_API_KEY to enable autonomous scientific decisions'
          fi

      - name: Syntax-check guarded orchestrator
        if: steps.preflight.outputs.enabled == 'true'
        run: python3 -m py_compile rtk/agent/auto_research_agent.py

      - name: Analyze frontier and dispatch next earned gate
        if: steps.preflight.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 rtk/agent/auto_research_agent.py | tee rtk_agent_decision.log

      - uses: actions/upload-artifact@v4
        if: always() && steps.preflight.outputs.enabled == 'true'
        with:
          name: rtk-ai-agent-decision-${{ github.run_id }}
          path: rtk_agent_decision.log
          if-no-files-found: ignore
