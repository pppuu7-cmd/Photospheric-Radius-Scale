name: RTK Stage 4D1 iteration6 recenter tight matrix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rtk-stage4d1-iteration6-recenter-tight.yml'

jobs:
  refine:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {mapping: eff, lambda_D: '30000', h: '0.6906228450739322', Ob: '0.04682481963086287', Om: '0.2528418174171734', As: '2.0671578968084773e-9', ns: '0.9643135678758316', zre: '6.793035785007665'}
          - {mapping: k01, lambda_D: '30000', h: '0.6905158724170032', Ob: '0.0468310224770623', Om: '0.2529556570211502', As: '2.0665966599160555e-9', ns: '0.9642292987809504', zre: '6.783235438897828'}
          - {mapping: eff, lambda_D: '100000', h: '0.6901924078567909', Ob: '0.046879772514276115', Om: '0.25337161671953506', As: '2.0621866766183963e-9', ns: '0.9639168558039879', zre: '6.648554211277293'}
          - {mapping: k01, lambda_D: '100000', h: '0.6907450939837553', Ob: '0.04682418851243732', Om: '0.25274956903612916', As: '2.064491055681711e-9', ns: '0.964248474453219', zre: '6.725361444440505'}
          - {mapping: eff, lambda_D: '1000000', h: '0.6899025740387876', Ob: '0.046942911064151334', Om: '0.2538531908192155', As: '2.0594510160719244e-9', ns: '0.9634903411338158', zre: '6.555298516852542'}
          - {mapping: k01, lambda_D: '1000000', h: '0.6898981225313482', Ob: '0.046941558099616844', Om: '0.2537958441364688', As: '2.0594481052900725e-9', ns: '0.9639514740247583', zre: '6.573725615558077'}
          - {mapping: eff, lambda_D: '100000000', h: '0.6909656249737122', Ob: '0.04681773075450327', Om: '0.2525157508091431', As: '2.0626863623434738e-9', ns: '0.964209352944046', zre: '6.685968531085946'}
          - {mapping: k01, lambda_D: '100000000', h: '0.6909941767456738', Ob: '0.04681350635034124', Om: '0.2524667579283343', As: '2.064914887825843e-9', ns: '0.9640678976916522', zre: '6.742068804954269'}
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '120'
      RTK_CACHE_KEY_VERSION: 'exact-float-v1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
      - name: Prepare cache-safe exact likelihood tree
        run: |
          set -euo pipefail
          git clone --depth 1 --branch nonlocal https://github.com/dirian/class_public.git class_public
          git clone --depth 1 https://github.com/dscolnic/Pantheon.git class_public/pantheon
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py class_public/joint_profile_runner.py
          cp rtk/prepare_inference_core.py class_public/prepare_inference_core.py
          cp rtk/stage4d1_tight_refine.py class_public/stage4d1_tight_refine.py
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py
          ! grep -q 'A_s_ad\|n_s_ad' inference_core.py
      - name: Build CLASS
        working-directory: class_public
        run: make -j2 class
      - name: Install likelihood dependencies
        run: python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' numpy scipy
      - name: Download official Planck baseline
        working-directory: class_public
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          mkdir planck_data
          tar -xzf planck.tar.gz -C planck_data
      - name: Run five-start tight Powell plus two exact polls
        working-directory: class_public
        run: |
          set -o pipefail
          python3 stage4d1_tight_refine.py planck_data '${{ matrix.lambda_D }}' '${{ matrix.mapping }}' \
            '${{ matrix.h }}' '${{ matrix.Ob }}' '${{ matrix.Om }}' '${{ matrix.As }}' '${{ matrix.ns }}' '${{ matrix.zre }}' \
            | tee ../iteration6_recenter_${{ matrix.mapping }}_${{ matrix.lambda_D }}.log
          grep -q STAGE4D1_TIGHT_PASS ../iteration6_recenter_${{ matrix.mapping }}_${{ matrix.lambda_D }}.log
          find output/stage4d1_tight/${{ matrix.mapping }} -name refine_summary.json -print -exec cat {} \;
      - name: Upload exact recenter artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtk-stage4d1-iteration6-recenter-${{ matrix.mapping }}-${{ matrix.lambda_D }}
          path: |
            iteration6_recenter_${{ matrix.mapping }}_${{ matrix.lambda_D }}.log
            class_public/output/stage4d1_tight/${{ matrix.mapping }}/**/refine_summary.json
            class_public/output/stage4d1_tight/${{ matrix.mapping }}/**/refine_trace.csv
          if-no-files-found: error
