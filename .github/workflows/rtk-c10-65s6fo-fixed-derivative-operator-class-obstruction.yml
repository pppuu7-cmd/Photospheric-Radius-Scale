name: RTK C10.65s6fO fixed-derivative operator-class obstruction

on:
  push:
    branches: [rtk-class-build]
    paths:
      - 'research/theory_targets/RTK_C10_65S6FO_FIXED_DERIVATIVE_OPERATOR_CLASS_OBSTRUCTION_TARGET_v1.json'
      - 'research/shadow/rtk_c10_65s6fo_fixed_derivative_operator_class_obstruction.py'
      - '.github/workflows/rtk-c10-65s6fo-fixed-derivative-operator-class-obstruction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  symbolic-obstruction-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen branch state
        uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact-symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy

      - name: Verify frozen target predates this execution commit
        shell: bash
        run: |
          set -euo pipefail
          test -f research/theory_targets/RTK_C10_65S6FO_FIXED_DERIVATIVE_OPERATOR_CLASS_OBSTRUCTION_TARGET_v1.json
          git merge-base --is-ancestor 00249f2b28ccc5f607588df0a6d122f419ab6fbe HEAD
          python - <<'PY'
          import json
          p='research/theory_targets/RTK_C10_65S6FO_FIXED_DERIVATIVE_OPERATOR_CLASS_OBSTRUCTION_TARGET_v1.json'
          t=json.load(open(p))
          assert t['status']=='FROZEN_BEFORE_EXECUTION'
          assert t['threshold_changed'] is False
          assert t['parent_frontier']['branch_head_before_freeze']=='a07f0fadf5a85fe2726041d467ee982873997f5f'
          print('frozen target verified')
          PY

      - name: Run C10.65s6fO exact symbolic theorem
        run: python research/shadow/rtk_c10_65s6fo_fixed_derivative_operator_class_obstruction.py

      - name: Persist result and recovery checkpoint with provenance
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          EXECUTION_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RESULT='research/theory_results/RTK_C10_65S6FO_FIXED_DERIVATIVE_OPERATOR_CLASS_OBSTRUCTION_RESULT_v1.json'
          CHECKPOINT='research/checkpoints/RTK_C10_65S6FO_FIXED_DERIVATIVE_OPERATOR_CLASS_OBSTRUCTION_2026-08-27T1034Z.md'
          test -s "$RESULT"
          CLASSIFICATION=$(python -c "import json; print(json.load(open('$RESULT'))['classification'])")
          cat > "$CHECKPOINT" <<EOF
          # RTK C10.65s6fO — fixed-derivative operator-class obstruction

          - Frozen target commit: \`00249f2b28ccc5f607588df0a6d122f419ab6fbe\`
          - Pre-freeze branch head: \`a07f0fadf5a85fe2726041d467ee982873997f5f\`
          - Execution commit: \`${EXECUTION_SHA}\`
          - GitHub Actions run: \`${RUN_ID}\`
          - Classification: **${CLASSIFICATION}**
          - \`threshold_changed=false\`

          ## Exact result

          For every local metric-only pure-spatial scalar density of fixed total spatial derivative order \(d=6\), a constant homogeneous conformal rescaling \(\gamma_{ij}\to e^{2\zeta_0}\gamma_{ij}\) gives density weight

          \[
          w=3-d=-3.
          \]

          Therefore a generic hard quadratic deformation \(\Delta Q_2\) changes at hard-hard-homogeneous cubic order as

          \[
          \delta_{\zeta_0}\Delta Q_2=-3\,\Delta Q_2.
          \]

          If the already certified hard quadratic kernel is required to remain exactly unchanged, \(\Delta Q_2=0\) as a functional, so the compensating homogeneous soft response also vanishes identically. Retuning any finite combination of same-weight six-spatial-derivative metric-only operators cannot cancel the inherited s6fM nonzero homogeneous soft result without changing the certified quadratic sector.

          This also reproduces the s6fN family relation \(w=1-2n\), which gives \(-3\) for \(n=2\).

          ## Scope

          This is a **scoped operator-class obstruction**, not a no-go for RTK. It does not exclude mixed time-space derivative operators, extra fields/compensators/spurions, nonlocal structures, or a new symmetry-correlated nonlinear completion. No post-result coefficient was introduced or fitted.

          Production at \(k=0.03\,\mathrm{Mpc}^{-1}\) remains blocked. Open fundamental gates remain C9 radiative naturalness, same-full-action primordial/background closure, microscopic omitted-order/higher-UR derivation, massive-neutrino completion, and spectra/likelihood validation.

          ## Next frontier

          Do **not** add another pure metric six-spatial-derivative carrier. The next admissible gate is a source-locked inventory/identifiability test of escape classes that can change the homogeneous soft response independently of the certified hard quadratic kernel (mixed time-space structures, additional state dependence/fields, or symmetry-linked sectors), frozen before choosing any coefficient or claiming cancellation.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT" "$CHECKPOINT"
          git commit -m 'Record C10.65s6fO fixed-derivative operator-class obstruction'
          git pull --rebase origin rtk-class-build
          git push origin HEAD:rtk-class-build
