name: RTK Route A1 D4 identifiability theorem

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rtk-quantum-route-a1-d4-identifiability.yml'

permissions:
  contents: read

jobs:
  symbolic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - name: Install pinned SymPy
        run: python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Prove D4 coefficients are not identifiable from background or linear target
        run: |
          set -euo pipefail
          echo "RTK_SOURCE_SHA=$(git rev-parse HEAD)" | tee route_a1_d4_identifiability_provenance.txt
          python3 rtk/quantum_route_a1_d4_identifiability.py | tee route_a1_d4_identifiability.log
          grep -q RTK_ROUTE_A1_D4_IDENTIFIABILITY_PASS route_a1_d4_identifiability.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-a1-d4-identifiability
          path: |
            route_a1_d4_identifiability_provenance.txt
            route_a1_d4_identifiability.log
          if-no-files-found: error
