name: RTK matched component pair

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-post-axis-diagnostics-trigger.txt'

permissions:
  contents: read

jobs:
  component-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '300'
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      RTK_PANTHEON_SHA: '7eb29dc87ba223b4ec8457cd3cccba1216c36fb7'
      RTK_PLANCK_SHA256: '0b73171e3acc671c28184466a45485a2d1c1d93676b832abdfe688c7b04024e6'
      RTK_NUMPY_VERSION: '2.5.2'
      RTK_SCIPY_VERSION: '1.18.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1

      - name: Require axis-certified current RTK center
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          s=json.load(open('research/state/current.json'))
          a=s['rtk'].get('axis_result')
          assert isinstance(a,dict), 'axis_result missing'
          assert a.get('center')==s['rtk']['accepted_center'], 'axis center != accepted center'
          assert a.get('objective')==s['objective']['name'], 'axis objective mismatch'
          assert float(a.get('best_improvement_eff',1e99))<=float(s['objective']['recenter_tolerance_S'])
          print('RTK_COMPONENT_PAIR_AXIS_CERTIFIED_CENTER_PASS', (s['rtk'].get('axis_run') or {}).get('run_id'))
          PY

      - name: Prepare pinned exact likelihood tree
        run: |
          set -euo pipefail
          echo "RTK_SOURCE_SHA=$(git rev-parse HEAD)" | tee matched_component_provenance.txt
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_public
          git -C class_public reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          test "$(git -C class_public rev-parse HEAD)" = "$RTK_CLASS_UPSTREAM_SHA"
          git clone https://github.com/dscolnic/Pantheon.git class_public/pantheon
          git -C class_public/pantheon reset --hard "$RTK_PANTHEON_SHA"
          test "$(git -C class_public/pantheon rev-parse HEAD)" = "$RTK_PANTHEON_SHA"
          echo "CLASS_UPSTREAM_SHA=$(git -C class_public rev-parse HEAD)" | tee -a matched_component_provenance.txt
          echo "PANTHEON_SHA=$(git -C class_public/pantheon rev-parse HEAD)" | tee -a matched_component_provenance.txt
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_nonlocal_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          grep -q 'pba->V_prime_ini_nlde = 0.;' class_public/source/input.c
          cp rtk/joint_profile_runner.py class_public/joint_profile_runner.py
          cp rtk/prepare_inference_core.py class_public/prepare_inference_core.py
          cp rtk/matched_component_pair.py class_public/matched_component_pair.py
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py
          grep -q "if r.get('ok')" inference_core.py

      - name: Build CLASS
        working-directory: class_public
        run: make -j2 class

      - name: Install pinned likelihood dependencies and capture versions
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            'clipy-like==0.15' \
            "numpy==$RTK_NUMPY_VERSION" \
            "scipy==$RTK_SCIPY_VERSION"
          python3 - <<'PY' | tee -a matched_component_provenance.txt
          import sys,numpy,scipy,os
          assert numpy.__version__==os.environ['RTK_NUMPY_VERSION']
          assert scipy.__version__==os.environ['RTK_SCIPY_VERSION']
          print('PYTHON_VERSION='+sys.version.replace('\n',' '))
          print('NUMPY_VERSION='+numpy.__version__)
          print('SCIPY_VERSION='+scipy.__version__)
          PY

      - name: Download and verify official Planck baseline
        working-directory: class_public
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          sha256sum planck.tar.gz | tee ../planck_baseline.sha256
          echo "$RTK_PLANCK_SHA256  planck.tar.gz" | sha256sum -c -
          mkdir planck_data && tar -xzf planck.tar.gz -C planck_data

      - name: Evaluate matched component pair
        working-directory: class_public
        run: |
          set -euo pipefail
          python3 matched_component_pair.py | tee ../matched_component_pair.log
          grep -q RTK_MATCHED_COMPONENT_PAIR_COMPLETE ../matched_component_pair.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-matched-component-pair
          path: |
            matched_component_pair.log
            matched_component_provenance.txt
            planck_baseline.sha256
            class_public/output/matched_component_pair/summary.json
          if-no-files-found: error
