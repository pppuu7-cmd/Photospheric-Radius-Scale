name: RTK C9 projectable O4 single-resolvent source support

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c9-projectable-u1-o4-single-resolvent-source-support-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run O4 source-support theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/c9_projectable_u1_o4_single_resolvent_source_support_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee c9_projectable_u1_o4_single_resolvent_source_support_provenance.txt
          python3 rtk/c9_projectable_u1_o4_single_resolvent_source_support_gate.py | tee c9_projectable_u1_o4_single_resolvent_source_support.log
          grep -q '^RTK_C9_PROJECTABLE_U1_O4_SINGLE_RESOLVENT_SOURCE_SUPPORT_PASS ' c9_projectable_u1_o4_single_resolvent_source_support.log
          python3 - <<'PY'
          import json
          r=json.load(open('c9_projectable_u1_o4_single_resolvent_source_support_result.json'))
          assert r['classification']=='RTK_C9_PROJECTABLE_U1_O4_SINGLE_RESOLVENT_SOURCE_SUPPORT_PASS'
          assert r['pn_orders']['metric_O4_resolvent_kernel']==4
          assert r['pn_orders']['metric_filtered_ordinary_stress']==6
          print('C9_PROJECTABLE_U1_O4_SINGLE_RESOLVENT_SOURCE_SUPPORT_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c9-projectable-u1-o4-single-resolvent-source-support
          path: |
            c9_projectable_u1_o4_single_resolvent_source_support.log
            c9_projectable_u1_o4_single_resolvent_source_support_result.json
            c9_projectable_u1_o4_single_resolvent_source_support_provenance.txt
            rtk/c9_projectable_u1_o4_single_resolvent_source_support_gate.py
          if-no-files-found: error
