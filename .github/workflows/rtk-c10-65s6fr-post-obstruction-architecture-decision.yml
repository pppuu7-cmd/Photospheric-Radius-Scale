name: RTK C10.65s6fR post-obstruction architecture decision

on:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/rtk-c10-65s6fr-post-obstruction-architecture-decision-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute frozen C10.65s6fR decision
        run: |
          set -euo pipefail
          python research/shadow/rtk_c10_65s6fr_post_obstruction_architecture_decision.py | tee /tmp/s6fr.log
      - name: Add provenance and checkpoint
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_AT_JOB_START: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          rp=Path('research/theory_results/RTK_C10_65S6FR_POST_OBSTRUCTION_ARCHITECTURE_DECISION_RESULT_v1.json')
          d=json.loads(rp.read_text())
          d['provenance']={'workflow':'rtk-c10-65s6fr-post-obstruction-architecture-decision.yml','github_actions_run_id':int(os.environ['RUN_ID']),'github_actions_run_attempt':int(os.environ['RUN_ATTEMPT']),'repo_head_at_job_start':os.environ['HEAD_AT_JOB_START'],'threshold_changed':False}
          rp.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          cp=Path('research/checkpoints/RTK_C10_65S6FR_POST_OBSTRUCTION_ARCHITECTURE_DECISION_2026-08-27T1128Z.md')
          cp.write_text('''# RTK C10.65s6fR post-obstruction architecture decision\n\nClassification: `C10_65S6FR_REJECT_MINIMAL_BRANCH_REQUIRE_INDEPENDENT_NEW_COMPLETION_PASS_SCOPED`.\n\nParents: s6fP exact-off-shell-quadratic-preserving local metric/mixed-operator obstruction and s6fQ no-source-locked-compensator audit.\n\nDecision: do not introduce or tune a new compensator/spurion merely to cancel the already-observed soft-s obstruction. The tested minimal nonlinear branch is rejected at scoped cubic order. This is not an RTK-wide no-go.\n\n`k=0.03 Mpc^-1` production remains blocked. Any enlarged completion must be independently specified and must restart background equivalence, quadratic/linear phenomenology and degree-of-freedom certification before the soft channel or production domain is revisited.\n\nOpen fundamental gates remain C9 radiative naturalness, same-full-action primordial/background closure, microscopic omitted-order/higher-UR derivation, massive-neutrino completion and spectra/likelihood validation.\n\nNext frontier: fixed-action fundamental-closure restart contract for one independently motivated enlarged candidate, if such a candidate is proposed; otherwise retain the scoped rejection of the minimal nonlinear branch.\n''')
          PY
      - name: Commit result and checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C10_65S6FR_POST_OBSTRUCTION_ARCHITECTURE_DECISION_RESULT_v1.json research/checkpoints/RTK_C10_65S6FR_POST_OBSTRUCTION_ARCHITECTURE_DECISION_2026-08-27T1128Z.md
          git commit -m 'Record C10.65s6fR architecture decision'
          git push origin HEAD:rtk-class-build
