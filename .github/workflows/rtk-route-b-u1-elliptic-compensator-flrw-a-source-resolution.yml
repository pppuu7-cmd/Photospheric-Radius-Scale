name: RTK Route-B U1 elliptic compensator FLRW A-source resolution

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-elliptic-compensator-flrw-a-source-resolution-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run FLRW A-source resolution theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_elliptic_compensator_flrw_a_source_resolution_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_elliptic_compensator_flrw_a_source_resolution_provenance.txt
          python3 rtk/route_b_u1_elliptic_compensator_flrw_a_source_resolution_gate.py | tee u1_elliptic_compensator_flrw_a_source_resolution.log
          grep -q '^RTK_ROUTE_B_U1_ELLIPTIC_COMPENSATOR_FLRW_A_SOURCE_RESOLUTION_PASS ' u1_elliptic_compensator_flrw_a_source_resolution.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_elliptic_compensator_flrw_a_source_resolution_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_ELLIPTIC_COMPENSATOR_FLRW_A_SOURCE_RESOLUTION_PASS'
          assert 'Q-H0=0' in r['homogeneous_constraint']
          assert 'superseded' in r['interpretation']
          print('U1_ELLIPTIC_COMPENSATOR_FLRW_A_SOURCE_RESOLUTION_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-elliptic-compensator-flrw-a-source-resolution
          path: |
            u1_elliptic_compensator_flrw_a_source_resolution.log
            u1_elliptic_compensator_flrw_a_source_resolution_result.json
            u1_elliptic_compensator_flrw_a_source_resolution_provenance.txt
            rtk/route_b_u1_elliptic_compensator_flrw_a_source_resolution_gate.py
          if-no-files-found: error
