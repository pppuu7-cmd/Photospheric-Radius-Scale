name: RTK A5 LCDM t1p9 forward line v2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rtk-a5-lcdm-t1p9-forward-line-v2
  cancel-in-progress: false

jobs:
  line:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '300'
      RTK_PLANCK_DATA: 'planck_data'
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      RTK_PANTHEON_SHA: '7eb29dc87ba223b4ec8457cd3cccba1216c36fb7'
      RTK_PLANCK_SHA256: '0b73171e3acc671c28184466a45485a2d1c1d93676b832abdfe688c7b04024e6'
      RTK_NUMPY_VERSION: '2.5.2'
      RTK_SCIPY_VERSION: '1.18.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Verify conditional frozen target and persisted v1 prerequisite
        run: |
          set -euo pipefail
          git pull --ff-only origin rtk-class-build
          python3 - <<'PY'
          import json
          t=json.load(open('research/robustness/A5_LCDM_T1P9_FORWARD_LINE_CONTINUATION_TARGET_v2.json'))
          assert t['classification']=='A5_LCDM_T1P9_FORWARD_LINE_CONTINUATION_TARGET_V2_FROZEN'
          assert t['frozen_before_v1_forward_result'] is True
          p=json.load(open(t['prerequisite']['result']))
          r=t['prerequisite']
          assert p['classification']==r['required_classification']
          assert p['decision']==r['required_decision']
          assert abs(float(p['best_sample_t'])-1.9)<1e-12
          assert float(p['improvement_vs_t1p1'])>float(r['required_improvement_gt'])
          assert min(t['t_grid'])==1.9 and max(t['t_grid'])==2.9
          print('A5_T1P9_FORWARD_V2_PREREQUISITE_PASS',p['best_sample_score'])
          PY
          python3 -m py_compile rtk/a5_lcdm_t1p9_forward_line_continuation_v2.py rtk/prepare_inference_core.py

      - name: Prepare fresh pinned CLASS tree
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_public
          git -C class_public reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          git clone https://github.com/dscolnic/Pantheon.git class_public/pantheon
          git -C class_public/pantheon reset --hard "$RTK_PANTHEON_SHA"
          test "$(git -C class_public rev-parse HEAD)" = "$RTK_CLASS_UPSTREAM_SHA"
          test "$(git -C class_public/pantheon rev-parse HEAD)" = "$RTK_PANTHEON_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_nonlocal_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py rtk/prepare_inference_core.py rtk/a5_lcdm_t1p9_forward_line_continuation_v2.py class_public/
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py

      - name: Build and lock runtime
        run: |
          set -euo pipefail
          make -C class_public -j2 class
          python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' "numpy==$RTK_NUMPY_VERSION" "scipy==$RTK_SCIPY_VERSION"

      - name: Download and verify Planck baseline
        working-directory: class_public
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          echo "$RTK_PLANCK_SHA256  planck.tar.gz" | sha256sum -c -
          mkdir planck_data && tar -xzf planck.tar.gz -C planck_data

      - name: Run exact conditional forward extension
        working-directory: class_public
        run: |
          set -euo pipefail
          python3 a5_lcdm_t1p9_forward_line_continuation_v2.py | tee ../a5_t1p9_forward_v2.log
          grep -q '^A5_LCDM_T1P9_FORWARD_LINE_CONTINUATION_V2_COMPLETE ' ../a5_t1p9_forward_v2.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-a5-lcdm-t1p9-forward-line-v2
          path: |
            a5_t1p9_forward_v2.log
            output/a5_lcdm_t1p9_forward_line_v2/
          if-no-files-found: warn

      - name: Persist scientific result
        if: success()
        run: |
          set -euo pipefail
          cp output/a5_lcdm_t1p9_forward_line_v2/summary.json /tmp/a5_t1p9_v2.json
          git fetch origin rtk-class-build
          git reset --hard origin/rtk-class-build
          cp /tmp/a5_t1p9_v2.json research/robustness/A5_LCDM_T1P9_FORWARD_LINE_CONTINUATION_RESULT_v2.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/robustness/A5_LCDM_T1P9_FORWARD_LINE_CONTINUATION_RESULT_v2.json
          git commit -m 'Record A5 t1p9 forward line v2 result'
          git push origin HEAD:rtk-class-build
