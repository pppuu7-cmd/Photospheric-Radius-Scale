name: RTK AI agent regression audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'rtk/agent/**'
      - '.github/workflows/rtk-ai-auto-research-agent.yml'
      - '.github/workflows/rtk-agent-scientific-gate.yml'
      - '.github/workflows/rtk-ai-agent-regression.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and state validation
        run: |
          python3 -m py_compile rtk/agent/auto_research_agent.py
          python3 - <<'PY'
          import json
          s=json.load(open('rtk/agent/frontier_state.json'))
          assert s['schema_version']==1
          assert set(s['allowed_actions'])=={'WAIT','RECENTER','STATIONARITY','REDISCOVERY_FOLLOWUP'}
          assert s['gate_rules']['never_advance_on_failed_or_incomplete_run'] is True
          assert s['gate_rules']['never_claim_global_minimum_from_local_optimizer'] is True
          print('RTK_AI_AGENT_STATE_PASS')
          PY
      - name: Safety invariant checks
        run: |
          grep -q "ALLOWED={'WAIT','RECENTER','STATIONARITY','REDISCOVERY_FOLLOWUP'}" rtk/agent/auto_research_agent.py
          grep -q "stationarity gate not earned by poll" rtk/agent/auto_research_agent.py
          grep -q "RTK_AGENT_DISABLED_NO_OPENAI_API_KEY" rtk/agent/auto_research_agent.py
          grep -q "RTK_AI_AGENT_DISABLED" .github/workflows/rtk-ai-auto-research-agent.yml
          grep -q "Validate agent-selected action and numerical inputs" .github/workflows/rtk-agent-scientific-gate.yml
          echo RTK_AI_AGENT_REGRESSION_PASS
