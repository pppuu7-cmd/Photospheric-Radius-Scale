name: RTK Route-B U1 elliptic matter-compensator prefilter

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-elliptic-matter-compensator-prefilter-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run elliptic compensator prefilter
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_elliptic_matter_compensator_prefilter_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_elliptic_matter_compensator_prefilter_provenance.txt
          python3 rtk/route_b_u1_elliptic_matter_compensator_prefilter_gate.py | tee u1_elliptic_matter_compensator_prefilter.log
          grep -q '^RTK_ROUTE_B_U1_ELLIPTIC_MATTER_COMPENSATOR_PREFILTER_PASS ' u1_elliptic_matter_compensator_prefilter.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_elliptic_matter_compensator_prefilter_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_ELLIPTIC_MATTER_COMPENSATOR_PREFILTER_PASS'
          assert r['status_scope'].startswith('YELLOW_CONSTRUCTIVE_SCALE_SEPARATED')
          assert r['one_percent_window']['existence_condition']=='k_local/k_cos >= 99'
          print('U1_ELLIPTIC_MATTER_COMPENSATOR_PREFILTER_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-elliptic-matter-compensator-prefilter
          path: |
            u1_elliptic_matter_compensator_prefilter.log
            u1_elliptic_matter_compensator_prefilter_result.json
            u1_elliptic_matter_compensator_prefilter_provenance.txt
            rtk/route_b_u1_elliptic_matter_compensator_prefilter_gate.py
          if-no-files-found: error
