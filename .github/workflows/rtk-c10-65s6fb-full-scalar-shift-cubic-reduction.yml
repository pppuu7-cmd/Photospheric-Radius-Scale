name: RTK C10.65s6fB full scalar-shift cubic reduction

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c10-65s6fb-full-scalar-shift-cubic-reduction-trigger.txt'

permissions:
  contents: write

jobs:
  reduction-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Verify frozen s6fB target and parents
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_65S6FB_FULL_SCALAR_SHIFT_CUBIC_REDUCTION_TARGET_v1.json'))
          e=json.load(open('research/theory_results/RTK_C10_65S6E_UV_MATCHING_SOFT_S_SOURCE_LOCK_RESULT_v1.json'))
          a=json.load(open('research/theory_results/RTK_C10_65S6FA_LOCAL_ALPHA6_SOFT_S_OBSTRUCTION_RESULT_v1.json'))
          assert t['status']=='FROZEN_BEFORE_IMPLEMENTATION'
          assert e['classification']==t['parents']['s6e']
          assert a['classification']==t['parents']['s6fA']
          assert t['frozen_checks']['cancellation_classified_exactly_not_by_numeric_tolerance'] is True
          assert t['frozen_checks']['k003_production_remains_blocked'] is True
          print('C10_65S6FB_FROZEN_PARENT_PASS')
          PY
      - name: Execute full-action completeness audit
        run: |
          set -euo pipefail
          python3 -m py_compile research/shadow/rtk_c10_65s6fb_full_scalar_shift_cubic_reduction_audit.py
          python3 research/shadow/rtk_c10_65s6fb_full_scalar_shift_cubic_reduction_audit.py | tee s6fb.log
          grep -q '^C10_65S6FB_FULL_SCALAR_SHIFT_CUBIC_REDUCTION_BLOCKED_INCOMPLETE_FIXED_ACTION_SCOPED ' s6fb.log
      - name: Persist result and recovery checkpoint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          p='research/theory_results/RTK_C10_65S6FB_FULL_SCALAR_SHIFT_CUBIC_REDUCTION_RESULT_v1.json'
          r=json.load(open(p))
          r['provenance']={
            'repo_head_at_job_start':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'workflow':'rtk-c10-65s6fb-full-scalar-shift-cubic-reduction.yml',
            'archived_formula_bible_commit':'13acfdbc16d2f3117f1299b8552bcf7b1f996bd1',
            'threshold_changed':False,
          }
          open(p,'w').write(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          cat > research/checkpoints/RTK_C10_65S6FB_INCOMPLETE_FIXED_ACTION_BLOCKER_2026-08-27T0525Z.md <<'EOF'
          # RTK C10.65s6fB — incomplete fixed-action blocker

          Classification: `C10_65S6FB_FULL_SCALAR_SHIFT_CUBIC_REDUCTION_BLOCKED_INCOMPLETE_FIXED_ACTION_SCOPED`.

          The frozen s6fB target was not relaxed. It permits a ZERO or NONZERO PASS only after reducing the scalar shift from one complete fixed action and exposing every shift denominator.

          Source audit result: the canonical archived `RTK_FORMULA_BIBLE.md` at commit `13acfdbc16d2f3117f1299b8552bcf7b1f996bd1` explicitly states that the final covariant completion is not yet fixed and marks the final carrier RED. The current s6e/s6fA parents fix the bare n=2 soft-s carrier result and a local alpha6 state-function obstruction, but they do not specify the complete nonlinear shift-dependent ADM Lagrangian.

          Therefore `delta S/delta N_i=0` does not define a unique quadratic scalar-shift kernel or cubic source from the frozen inputs alone. A constructive witness is the symmetry-allowed projectable kinetic deformation

          `Delta S_mu = mu ∫ N sqrt(gamma) (K_ij K^ij - K^2/3)`.

          It leaves the explicitly named intrinsic-curvature carrier `alpha6(X) D_i R3 D^i R3` untouched while changing the finite-k scalar-shift Hessian/source unless the full action fixes or forbids its coefficient. Consequently the shift-exchange contribution and the exact reduced `q_s=0` vertex cannot be classified without inventing action data.

          This is neither an exact cancellation nor a surviving-vertex result. `k=0.03 Mpc^-1` production remains blocked.

          Next scientifically valid step: `C10.65s6fC` fixed-action closure/source lock. Specify one complete nonlinear projectable scalar action, including all shift-dependent kinetic/mixed operators and the full alpha6(X) state-function rule, and verify consistency with already certified IR/linear constraints. Then rerun the unchanged s6fB reduction target.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C10_65S6FB_FULL_SCALAR_SHIFT_CUBIC_REDUCTION_RESULT_v1.json research/checkpoints/RTK_C10_65S6FB_INCOMPLETE_FIXED_ACTION_BLOCKER_2026-08-27T0525Z.md
          git commit -m 'Record C10.65s6fB incomplete fixed-action blocker'
          git push origin HEAD:rtk-class-build
      - name: Enforce scientific blocked classification
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('research/theory_results/RTK_C10_65S6FB_FULL_SCALAR_SHIFT_CUBIC_REDUCTION_RESULT_v1.json'))
          assert r['classification']=='C10_65S6FB_FULL_SCALAR_SHIFT_CUBIC_REDUCTION_BLOCKED_INCOMPLETE_FIXED_ACTION_SCOPED'
          assert r['threshold_changed'] is False
          assert r['shift_reduction']['total_reduced_vertex']=='NOT_CLASSIFIED'
          print('C10_65S6FB_SCIENTIFIC_BLOCKER_RECORDED')
          PY
