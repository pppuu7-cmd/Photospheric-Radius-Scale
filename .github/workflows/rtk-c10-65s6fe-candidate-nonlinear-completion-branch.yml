name: RTK C10.65s6fE candidate nonlinear completion branch

on:
  push:
    branches: [rtk-class-build]
    paths:
      - 'research/theory_targets/RTK_C10_65S6FE_CANDIDATE_NONLINEAR_COMPLETION_BRANCH_TARGET_v1.json'
      - 'research/shadow/rtk_c10_65s6fe_candidate_nonlinear_completion_branch_audit.py'
      - '.github/workflows/rtk-c10-65s6fe-candidate-nonlinear-completion-branch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  branch-contract-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute frozen candidate-branch contract audit
        run: |
          set -euo pipefail
          python -m py_compile research/shadow/rtk_c10_65s6fe_candidate_nonlinear_completion_branch_audit.py
          python research/shadow/rtk_c10_65s6fe_candidate_nonlinear_completion_branch_audit.py | tee /tmp/s6fe.txt
          grep -q '^C10_65S6FE_CANDIDATE_NONLINEAR_COMPLETION_BRANCH_CONTRACT_PASS_SCOPED ' /tmp/s6fe.txt
      - name: Add immutable provenance
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('research/theory_results/RTK_C10_65S6FE_CANDIDATE_NONLINEAR_COMPLETION_BRANCH_RESULT_v1.json')
          d=json.loads(p.read_text())
          d['provenance']={'github_actions_run_id':int(os.environ['RUN_ID']),'repo_head_at_job_start':os.environ['HEAD_SHA'],'workflow':'rtk-c10-65s6fe-candidate-nonlinear-completion-branch.yml','threshold_changed':False}
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - name: Persist result and checkpoint
        run: |
          set -euo pipefail
          mkdir -p research/checkpoints
          cat > research/checkpoints/RTK_C10_65S6FE_CANDIDATE_BRANCH_CONTRACT_2026-08-27.md <<'EOF'
          # RTK C10.65s6fE candidate nonlinear completion branch

          This gate freezes one explicit hypothesis branch, `MINIMAL_PROJECTABLE_N2_S1HALF_v1`, only so the cubic scalar-shift reduction becomes conditionally well-posed. It is not inferred from the certified linear RTK stack.

          The branch keeps the projectable ADM kinetic sector `(Mstar^2/2)(K_ij K^ij-lambda_HL K^2)`, the intrinsic IR sector, and the n=2 carrier `alpha6(X) D_i R3 D^i R3`; it fixes the full local carrier rule to the archived special completion `alpha6(X)=alpha6_0 (X/X0)^(1/2)`. Additional state-dependent shear and mixed K-R/DK operators are absent by branch definition, not because lower-order data proved their absence.

          No coefficient is fitted to obtain a desired soft-s outcome. In particular, `nu(X)=0` is a hypothesis of this branch and must not be promoted to a property of RTK in general. `k=0.03 Mpc^-1` production remains blocked.

          Next gate: rerun the exact scalar-shift cubic reduction conditionally on this branch and classify the reduced q_s=0 soft-s vertex without changing the prior ZERO/NONZERO semantics.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C10_65S6FE_CANDIDATE_NONLINEAR_COMPLETION_BRANCH_RESULT_v1.json research/checkpoints/RTK_C10_65S6FE_CANDIDATE_BRANCH_CONTRACT_2026-08-27.md
          if ! git diff --cached --quiet; then git commit -m 'Record C10.65s6fE candidate branch contract'; git push origin HEAD:rtk-class-build; fi
