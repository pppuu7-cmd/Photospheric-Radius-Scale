name: RTK Route-B gradK full TT-safe basis correction

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-gradk-full-ttsafe-basis-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run corrected full TT-safe basis theorem
        run: |
          set -euo pipefail
          echo "RTK_SOURCE_SHA=$(git rev-parse HEAD)" | tee rtk_gradk_full_ttsafe_provenance.txt
          python -m py_compile rtk/route_b_gradK_full_ttsafe_basis_gate.py
          python rtk/route_b_gradK_full_ttsafe_basis_gate.py | tee rtk_gradk_full_ttsafe.log
          grep -q '^RTK_ROUTE_B_GRADK_FULL_TTSAFE_BASIS_GATE_PASS ' rtk_gradk_full_ttsafe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-gradk-full-ttsafe-basis-correction
          path: |
            rtk_gradk_full_ttsafe.log
            rtk_gradk_full_ttsafe_provenance.txt
          if-no-files-found: error
