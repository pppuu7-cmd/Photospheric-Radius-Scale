name: RTK C10.65s4a1 exact-onset sampling repair
on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths: ['research/triggers/RTK_C10_65S4A1_EXACT_ONSET_SAMPLING_REPAIR_TRIGGER_v1.txt']
permissions: {contents: write}
jobs:
  repair-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
    steps:
      - uses: actions/checkout@v4
        with: {ref: rtk-class-build, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.3'}
      - name: Verify frozen repair parent
        run: |
          set -euo pipefail
          git rev-parse HEAD > s4a1_head.txt
          python3 - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_65S4A1_EXACT_ONSET_SAMPLING_REPAIR_TARGET_v1.json'))
          p=json.load(open('research/theory_results/RTK_C10_65S4A_MODERATE_K_ONSET_STATE_DOMAIN_PREFLIGHT_RESULT_v1.json'))
          assert t['status']=='FROZEN_BEFORE_IMPLEMENTATION'
          assert p['classification']=='C10_65S4A_MODERATE_K_ONSET_STATE_DOMAIN_PREFLIGHT_FAIL_SCOPED'
          assert [k for k,v in p['checks'].items() if v is False and k!='threshold_changed']==['all_exact_onset_rows_present']
          assert p['provenance']['github_actions_run_id']==33008095108
          print('C10_65S4A1_PARENT_FAILURE_PRESERVED')
          PY
      - name: Construct pinned observer tree and apply repair
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_s4a1
          git -C class_s4a1 reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_s4a1/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_s4a1/include/
          for s in apply_rtk_class_patch.py upgrade_rtk_inputs.py upgrade_rtk_nonlocal_initial_conditions.py upgrade_rtk_initial_conditions.py upgrade_rtk_matter_sources.py upgrade_rtk_gamma_root.py upgrade_rtk_spectra_endpoint.py apply_rtk_c10_source_export_patch.py apply_rtk_c10_65a_species_control_patch.py apply_rtk_c10_65e_tca_coefficient_export_patch.py apply_rtk_c10_65r0_opt_in_local_environment_export_patch.py apply_rtk_c10_65r1_in_class_completed_projector_parity_patch.py stabilize_rtk_c10_65r1_conditioned_projector.py; do python3 "rtk/$s" class_s4a1; done
          python3 rtk/apply_rtk_c10_65s1_readonly_state_observer_patch.py class_s4a1
          python3 rtk/apply_rtk_c10_65s4a1_exact_onset_sampling_patch.py class_s4a1
          make -C class_s4a1 -j2 class
      - name: Execute frozen source and compile audit
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/apply_rtk_c10_65s4a1_exact_onset_sampling_patch.py research/shadow/rtk_c10_65s4a1_exact_onset_sampling_repair.py
          python3 research/shadow/rtk_c10_65s4a1_exact_onset_sampling_repair.py --class-tree class_s4a1 --patch rtk/apply_rtk_c10_65s4a1_exact_onset_sampling_patch.py --output research/theory_results/RTK_C10_65S4A1_EXACT_ONSET_SAMPLING_REPAIR_RESULT_v1.json | tee s4a1.log
          grep -q '^C10_65S4A1_EXACT_ONSET_SAMPLING_REPAIR_PASS_SCOPED' s4a1.log
      - name: Persist repair result
        if: always()
        run: |
          set -euo pipefail
          p='research/theory_results/RTK_C10_65S4A1_EXACT_ONSET_SAMPLING_REPAIR_RESULT_v1.json'; [ -f "$p" ] || exit 0
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('research/theory_results/RTK_C10_65S4A1_EXACT_ONSET_SAMPLING_REPAIR_RESULT_v1.json');d=json.loads(p.read_text());d['provenance']={'repo_head_at_job_start':pathlib.Path('s4a1_head.txt').read_text().strip(),'class_upstream_sha':os.environ['RTK_CLASS_UPSTREAM_SHA'],'workflow':'rtk-c10-65s4a1-exact-onset-sampling-repair.yml','patch':'rtk/apply_rtk_c10_65s4a1_exact_onset_sampling_patch.py','analyzer':'research/shadow/rtk_c10_65s4a1_exact_onset_sampling_repair.py','github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'threshold_changed':False};p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          cp "$p" /tmp/r.json
          for n in 1 2 3 4 5; do
            git fetch origin rtk-class-build; git reset --hard origin/rtk-class-build; cp /tmp/r.json "$p"
            git config user.name github-actions[bot]; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$p"; git commit -m 'Record C10.65s4a1 exact-onset sampling repair' || exit 0
            git push origin HEAD:rtk-class-build && exit 0
          done
          exit 1
