name: RTK C10.65s6fV rank-one embedding identifiability

on:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/rtk-c10-65s6fv-rank-one-embedding-identifiability-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  theorem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy==1.13.3
      - name: Execute frozen C10.65s6fV theorem
        run: |
          set -euo pipefail
          python research/shadow/rtk_c10_65s6fv_rank_one_embedding_identifiability.py | tee /tmp/s6fv.log
      - name: Add provenance and recovery checkpoint
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_AT_JOB_START: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          rp=Path('research/theory_results/RTK_C10_65S6FV_RANK_ONE_EMBEDDING_IDENTIFIABILITY_RESULT_v1.json')
          d=json.loads(rp.read_text())
          d['provenance']={
            'workflow':'rtk-c10-65s6fv-rank-one-embedding-identifiability.yml',
            'github_actions_run_id':int(os.environ['RUN_ID']),
            'github_actions_run_attempt':int(os.environ['RUN_ATTEMPT']),
            'repo_head_at_job_start':os.environ['HEAD_AT_JOB_START'],
            'threshold_changed':False
          }
          rp.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          cp=Path('research/checkpoints/RTK_C10_65S6FV_RANK_ONE_EMBEDDING_IDENTIFIABILITY_2026-08-27T1344Z.md')
          cp.write_text('''# RTK C10.65s6fV rank-one embedding identifiability theorem\n\nParent C10.65s6fU proved that a nonempty local projectable two-scalar rank-one kinematic class exists and carries at most one finite pole. C10.65s6fV asks whether that information is sufficient to select one full fixed action.\n\nFor `K=kappa v v^T`, the matrix determinant lemma gives `det(M-zK)=det(M)[1-z kappa v^T M^{-1}v]`; hence the finite pole is independent of the external/source vector. The exact response `s^T(M-zK)^{-1}s` nevertheless depends on `s`, so source direction is not fixed by pole location.\n\nA continuous same-pole potential family also exists. For `v=(1,1)`, `kappa=1`, take `M(t)=1/2[[2+t,2-t],[2-t,2+t]]`, `t>0`. Then `det M=2t`, `v^T M^{-1}v=1`, and `det(M-zvv^T)=2t(1-z)` for every positive `t`, while static/source responses vary with source choice.\n\nClassification: `C10_65S6FV_RANK_ONE_FULL_EMBEDDING_NON_IDENTIFIABLE_PASS_SCOPED`. This is not a no-go. It proves that rank-one plus one-pole data cannot uniquely source-lock the potential matrix or geometric source coupling. The next gate must audit pre-soft-s C8/C9 material for an independent action-level selection principle; absent such a principle, C10.65s6fT remains blocked. No soft-s retest was performed and `k=0.03 Mpc^-1` remains blocked.\n''')
          PY
      - name: Commit result and checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C10_65S6FV_RANK_ONE_EMBEDDING_IDENTIFIABILITY_RESULT_v1.json research/checkpoints/RTK_C10_65S6FV_RANK_ONE_EMBEDDING_IDENTIFIABILITY_2026-08-27T1344Z.md
          git commit -m 'Record C10.65s6fV rank-one embedding identifiability theorem'
          git push origin HEAD:rtk-class-build
