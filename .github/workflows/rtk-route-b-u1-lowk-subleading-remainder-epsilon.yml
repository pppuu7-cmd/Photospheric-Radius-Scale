name: RTK Route-B U1 low-k subleading remainder epsilon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-lowk-subleading-remainder-epsilon-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run low-k subleading remainder epsilon theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_lowk_subleading_remainder_epsilon_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_lowk_subleading_remainder_epsilon_provenance.txt
          python3 rtk/route_b_u1_lowk_subleading_remainder_epsilon_gate.py | tee u1_lowk_subleading_remainder_epsilon.log
          grep -q '^RTK_ROUTE_B_U1_LOWK_SUBLEADING_REMAINDER_EPSILON_PASS ' u1_lowk_subleading_remainder_epsilon.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_lowk_subleading_remainder_epsilon_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_LOWK_SUBLEADING_REMAINDER_EPSILON_PASS'
          assert 'sqrt(min(q0,sigma_min(L)/C))' in r['rank_interval_k']
          assert any('does not derive C' in z for z in r['non_claims'])
          print('U1_LOWK_SUBLEADING_REMAINDER_EPSILON_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-lowk-subleading-remainder-epsilon
          path: |
            u1_lowk_subleading_remainder_epsilon.log
            u1_lowk_subleading_remainder_epsilon_result.json
            u1_lowk_subleading_remainder_epsilon_provenance.txt
            rtk/route_b_u1_lowk_subleading_remainder_epsilon_gate.py
          if-no-files-found: error
