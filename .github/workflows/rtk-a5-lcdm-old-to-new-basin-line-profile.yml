name: RTK A5 LCDM old-to-new basin line profile

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-a5-lcdm-old-to-new-basin-line-profile-trigger.txt'

permissions:
  contents: write

concurrency:
  group: rtk-a5-lcdm-old-to-new-basin-line-profile
  cancel-in-progress: false

jobs:
  line-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '300'
      RTK_PLANCK_DATA: 'planck_data'
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      RTK_PANTHEON_SHA: '7eb29dc87ba223b4ec8457cd3cccba1216c36fb7'
      RTK_PLANCK_SHA256: '0b73171e3acc671c28184466a45485a2d1c1d93676b832abdfe688c7b04024e6'
      RTK_NUMPY_VERSION: '2.5.2'
      RTK_SCIPY_VERSION: '1.18.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Verify frozen line-profile target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/robustness/A5_LCDM_OLD_TO_NEW_BASIN_LINE_PROFILE_TARGET_v1.json'))
          assert t['classification']=='A5_LCDM_OLD_TO_NEW_BASIN_LINE_PROFILE_TARGET_V1_FROZEN'
          assert t['status']=='FROZEN_BEFORE_ANY_LINE_PROFILE_SCORE'
          assert t['objective']=='matched-ultra-linstep2+dense-BOSS'
          assert t['endpoint_replay_abs_tolerance']==2e-6
          assert 0.0 in t['t_grid'] and 1.0 in t['t_grid']
          print('A5_LCDM_BASIN_LINE_TARGET_PASS')
          PY
          python3 -m py_compile rtk/a5_lcdm_old_to_new_basin_line_profile.py rtk/prepare_inference_core.py
          git rev-parse HEAD | tee a5_lcdm_basin_line_source.txt
      - name: Prepare fresh pinned CLASS tree
        run: |
          set -euo pipefail
          rm -rf class_public
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_public
          git -C class_public reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          git clone https://github.com/dscolnic/Pantheon.git class_public/pantheon
          git -C class_public/pantheon reset --hard "$RTK_PANTHEON_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_nonlocal_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py rtk/prepare_inference_core.py rtk/a5_lcdm_old_to_new_basin_line_profile.py class_public/
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py
      - name: Build and install locked runtime
        run: |
          set -euo pipefail
          make -C class_public -j2 class
          python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' "numpy==$RTK_NUMPY_VERSION" "scipy==$RTK_SCIPY_VERSION"
          python3 -m pip freeze | sort | tee a5_lcdm_basin_line_pip_freeze.txt
      - name: Download and verify Planck baseline
        working-directory: class_public
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          echo "$RTK_PLANCK_SHA256  planck.tar.gz" | sha256sum -c -
          mkdir planck_data && tar -xzf planck.tar.gz -C planck_data
      - name: Run exact line profile
        working-directory: class_public
        run: |
          set -euo pipefail
          python3 a5_lcdm_old_to_new_basin_line_profile.py | tee ../a5_lcdm_basin_line.log
          grep -q '^A5_LCDM_OLD_TO_NEW_BASIN_LINE_PROFILE_COMPLETE ' ../a5_lcdm_basin_line.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-a5-lcdm-old-to-new-basin-line-profile
          path: |
            a5_lcdm_basin_line.log
            a5_lcdm_basin_line_source.txt
            a5_lcdm_basin_line_pip_freeze.txt
            output/a5_lcdm_old_to_new_basin_line_profile/
          if-no-files-found: warn
      - name: Persist diagnostic
        if: success()
        run: |
          set -euo pipefail
          cp output/a5_lcdm_old_to_new_basin_line_profile/summary.json /tmp/a5_line.json
          git fetch origin rtk-class-build
          git reset --hard origin/rtk-class-build
          cp /tmp/a5_line.json research/robustness/A5_LCDM_OLD_TO_NEW_BASIN_LINE_PROFILE_RESULT_v1.json
          git config user.name 'rtk-a5-basin-line'
          git config user.email 'actions@users.noreply.github.com'
          git add research/robustness/A5_LCDM_OLD_TO_NEW_BASIN_LINE_PROFILE_RESULT_v1.json
          git commit -m 'Record A5 LCDM old-to-new basin line profile'
          git push origin HEAD:rtk-class-build
