name: RTK C9 HMT lambda1 S3 spatial FP nonzero-mode zeta magnitudes
on:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/rtk-c9-hmt-lambda1-s3-spatial-fp-nonzero-mode-zeta-magnitudes-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen high-precision dependency
        run: python -m pip install --disable-pip-version-check mpmath==1.3.0
      - name: Verify frozen target ancestry and immutability
        run: |
          git cat-file -e 4191e4dd12aff1c648af391755f3e169df33d378^{commit}
          git merge-base --is-ancestor 4191e4dd12aff1c648af391755f3e169df33d378 HEAD
          python - <<'PY'
          import json, subprocess
          p='research/theory_targets/RTK_C9_HMT_LAMBDA1_S3_SPATIAL_FP_NONZERO_MODE_ZETA_MAGNITUDES_TARGET_v1.json'
          d=json.load(open(p))
          assert d['parent_head']=='5ec5fdd787571764daf723122300a34da6e09b38'
          assert d['tolerances']['high_precision_decimal_digits']==50
          assert d['tolerances']['convergent_domain_crosscheck_abs']==1e-30
          assert d['tolerances']['zeta_prime_convergence_abs']==1e-30
          assert d['frozen_semantics']['threshold_changed'] is False
          assert d['frozen_semantics']['no_DSIR'] is True
          frozen=json.loads(subprocess.check_output(['git','show','4191e4dd12aff1c648af391755f3e169df33d378:'+p], text=True))
          assert frozen==d
          PY
      - name: Syntax check analyzer
        run: python -m py_compile research/shadow/rtk_c9_hmt_lambda1_s3_spatial_fp_nonzero_mode_zeta_magnitudes.py
      - name: Run spatial FP zeta-magnitude audit
        run: python research/shadow/rtk_c9_hmt_lambda1_s3_spatial_fp_nonzero_mode_zeta_magnitudes.py
      - name: Persist result checkpoint provenance before classification enforcement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C9_HMT_LAMBDA1_S3_SPATIAL_FP_NONZERO_MODE_ZETA_MAGNITUDES_RESULT_v1.json research/checkpoints/RTK_C9_HMT_LAMBDA1_S3_SPATIAL_FP_NONZERO_MODE_ZETA_MAGNITUDES_2026-08-28.md research/provenance/RTK_C9_HMT_LAMBDA1_S3_SPATIAL_FP_NONZERO_MODE_ZETA_MAGNITUDES_PROVENANCE_v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record C9 HMT spatial FP zeta-magnitude audit'
            git push origin HEAD:rtk-class-build
          fi
      - name: Enforce frozen scientific classification
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          p='research/theory_results/RTK_C9_HMT_LAMBDA1_S3_SPATIAL_FP_NONZERO_MODE_ZETA_MAGNITUDES_RESULT_v1.json'
          d=json.load(open(p)); c=d['scientific_checks']; a=d['analytic_continuation']; z=d['zeta_determinant_magnitudes']; q=d['zero_mode_bookkeeping']; f=d['findings']
          required=[
            'transverse_zeta_regular_at_s0',
            'longitudinal_zeta_regular_at_s0',
            'transverse_zeta0_exact_minus5',
            'longitudinal_zeta0_exact_minus1',
            'transverse_prime_convergence_within_frozen_tolerance',
            'longitudinal_prime_convergence_within_frozen_tolerance',
            'transverse_convergent_domain_crosscheck_within_frozen_tolerance',
            'longitudinal_convergent_domain_crosscheck_within_frozen_tolerance',
            'transverse_determinant_magnitude_finite_positive',
            'longitudinal_determinant_magnitude_finite_positive',
            'transverse_spectral_prime_removes_exactly_l1_six_killing_modes',
            'longitudinal_l1_retained_nonzero_with_multiplicity_four',
            'transverse_normalization_scaling_witness_matches_zeta0',
            'longitudinal_normalization_scaling_witness_matches_zeta0',
          ]
          assert d['target_frozen_commit']=='4191e4dd12aff1c648af391755f3e169df33d378'
          assert all(c[k] is True for k in required), {k:c[k] for k in required}
          assert d['classification']=='RTK_C9_HMT_LAMBDA1_S3_SPATIAL_FP_NONZERO_MODE_ZETA_MAGNITUDES_FINITE_PASS_SCOPED'
          assert a['zeta_T_0_exact']==-5 and a['zeta_L_0_exact']==-1
          assert Decimal(a['transverse_prime_K120_vs_K140_abs_diff']) < Decimal('1e-30')
          assert Decimal(a['longitudinal_prime_K120_vs_K140_abs_diff']) < Decimal('1e-30')
          assert Decimal(a['transverse_crosscheck_abs_diff']) < Decimal('1e-30')
          assert Decimal(a['longitudinal_crosscheck_abs_diff']) < Decimal('1e-30')
          assert q['transverse_primed_levels']==[1] and q['transverse_removed_multiplicity']==6
          assert q['longitudinal_zero_modes']==0 and q['longitudinal_l1_eigenvalue_magnitude']==1 and q['longitudinal_l1_multiplicity']==4
          assert z['signed_or_complex_FP_phase_assigned'] is False
          assert z['normalization_independent'] is False
          assert f['spatial_FP_nonzero_mode_magnitude_factors_computed'] is True
          assert f['six_Killing_zero_modes_spectrally_primed'] is True
          assert f['transverse_and_longitudinal_magnitude_factors_kept_separate'] is True
          for k in [
            'residual_isometry_group_volume_normalized',
            'signed_or_complex_FP_phase_assigned',
            'scalar_gradient_decomposition_jacobian_inserted',
            'complete_zero_mode_measure_quotient_constructed',
            'complete_signed_spatial_FP_determinant_computed',
            'full_FP_determinant_computed',
            'full_FS_determinant_computed',
            'full_gravitational_Hessian_determinant_computed',
            'complete_HMT_gauge_fixed_constraint_matrix_constructed',
            'full_HMT_one_loop_evaluable',
            'full_C9_closed',
            'ordinary_projectable_parent_beta_functions_imported',
            'unresolved_HMT_matter_coefficients_chosen',
            'soft_s_retest_allowed',
            'production_k003_unblocked',
            'threshold_changed',
          ]:
            assert f[k] is False, k
          assert f['no_DSIR'] is True
          PY
