name: RTK C10 U1 A-source normalization

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/rtk-c10-u1-a-source-normalization-trigger.txt'
      - 'rtk/route_b_u1_A_source_normalization_gate.py'
      - 'research/theory_targets/RTK_C10_U1_A_SOURCE_NORMALIZATION_TARGET_v1.json'
      - '.github/workflows/rtk-c10-u1-a-source-normalization.yml'

permissions:
  contents: write

concurrency:
  group: rtk-c10-u1-a-source-normalization
  cancel-in-progress: false

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Verify preregistration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_U1_A_SOURCE_NORMALIZATION_TARGET_v1.json'))
          assert t['schema']=='RTK_C10_U1_A_SOURCE_NORMALIZATION_TARGET_v1'
          assert t['status']=='FROZEN_BEFORE_SYMBOLIC_RESULT'
          assert t['pass_classification']=='C10_U1_A_SOURCE_NORMALIZATION_AND_HELMHOLTZ_CONSTRAINT_PASS_SCOPED'
          print('C10_U1_A_SOURCE_TARGET_PASS')
          PY
          git rev-parse HEAD | tee c10_u1_A_source_normalization_provenance.txt
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run normalization theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_A_source_normalization_gate.py
          python3 rtk/route_b_u1_A_source_normalization_gate.py | tee c10_u1_A_source_normalization.log
          grep -q '^C10_U1_A_SOURCE_NORMALIZATION_AND_HELMHOLTZ_CONSTRAINT_PASS_SCOPED ' c10_u1_A_source_normalization.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_A_source_normalization_result.json'))
          assert r['classification']=='C10_U1_A_SOURCE_NORMALIZATION_AND_HELMHOLTZ_CONSTRAINT_PASS_SCOPED'
          assert '2(H0-Q)' in r['literature_J_A']
          assert r['high_k_limit']=='psi/psi_GR -> 1'
          print('C10_U1_A_SOURCE_NORMALIZATION_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c10-u1-a-source-normalization
          path: |
            c10_u1_A_source_normalization.log
            u1_A_source_normalization_result.json
            c10_u1_A_source_normalization_provenance.txt
          if-no-files-found: error
      - name: Persist authoritative scoped result
        if: success()
        run: |
          set -euo pipefail
          cp u1_A_source_normalization_result.json /tmp/c10_u1_A_result.json
          for attempt in 1 2 3 4 5; do
            git fetch origin rtk-class-build
            git reset --hard origin/rtk-class-build
            cp /tmp/c10_u1_A_result.json research/theory_results/RTK_C10_U1_A_SOURCE_NORMALIZATION_RESULT_v1.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/theory_results/RTK_C10_U1_A_SOURCE_NORMALIZATION_RESULT_v1.json
            if git diff --cached --quiet; then
              echo 'Result already persisted.'
              exit 0
            fi
            git commit -m 'Persist C10 U1 A-source normalization result'
            if git push origin HEAD:rtk-class-build; then
              exit 0
            fi
            echo "Push conflict on attempt $attempt; retrying from latest branch"
          done
          echo 'Unable to persist result after retries' >&2
          exit 1
