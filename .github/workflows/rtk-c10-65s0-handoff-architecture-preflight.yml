name: RTK C10.65s0 integration-safe handoff architecture

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - 'research/theory_targets/RTK_C10_65S0_INTEGRATION_SAFE_HANDOFF_ARCHITECTURE_TARGET_v1.json'
      - 'research/shadow/rtk_c10_65s0_handoff_architecture_preflight.py'
      - '.github/workflows/rtk-c10-65s0-handoff-architecture-preflight.yml'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Verify frozen parent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_65S0_INTEGRATION_SAFE_HANDOFF_ARCHITECTURE_TARGET_v1.json'))
          r=json.load(open('research/theory_results/RTK_C10_65R2_IN_CLASS_FIRST_RHS_DIAGNOSTIC_PARITY_RESULT_v1.json'))
          assert t['status']=='FROZEN_BEFORE_IMPLEMENTATION'
          assert t['class_upstream_sha']=='36cf283628c4a3330ec9fd3d84239bf775f77317'
          assert r['classification']=='C10_65R2_IN_CLASS_FIRST_RHS_DIAGNOSTIC_PARITY_PASS_SCOPED'
          PY
          git rev-parse HEAD | tee c10_65s0_repo_head.txt
      - name: Construct pinned current RTK CLASS tree
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_s0
          git -C class_s0 reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_s0/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_s0/include/
          for s in apply_rtk_class_patch.py upgrade_rtk_inputs.py upgrade_rtk_nonlocal_initial_conditions.py upgrade_rtk_initial_conditions.py upgrade_rtk_matter_sources.py upgrade_rtk_gamma_root.py upgrade_rtk_spectra_endpoint.py apply_rtk_c10_source_export_patch.py apply_rtk_c10_65a_species_control_patch.py apply_rtk_c10_65e_tca_coefficient_export_patch.py apply_rtk_c10_65r0_opt_in_local_environment_export_patch.py apply_rtk_c10_65r1_in_class_completed_projector_parity_patch.py stabilize_rtk_c10_65r1_conditioned_projector.py; do
            python3 "rtk/$s" class_s0
          done
      - name: Execute frozen architecture analyzer
        run: |
          set -euo pipefail
          python3 research/shadow/rtk_c10_65s0_handoff_architecture_preflight.py \
            --class-tree class_s0 \
            --output research/theory_results/RTK_C10_65S0_INTEGRATION_SAFE_HANDOFF_ARCHITECTURE_RESULT_v1.json | tee c10_65s0.log
          grep -q '^C10_65S0_INTEGRATION_SAFE_HANDOFF_ARCHITECTURE_PASS_SCOPED ' c10_65s0.log
      - name: Add immutable provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          p='research/theory_results/RTK_C10_65S0_INTEGRATION_SAFE_HANDOFF_ARCHITECTURE_RESULT_v1.json'
          d=json.load(open(p))
          d['provenance']={
            'repo_head_at_job_start':open('c10_65s0_repo_head.txt').read().strip(),
            'class_upstream_sha':'36cf283628c4a3330ec9fd3d84239bf775f77317',
            'workflow':'rtk-c10-65s0-handoff-architecture-preflight.yml',
            'github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),
            'threshold_changed':False
          }
          open(p,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - name: Persist result
        run: |
          set -euo pipefail
          cp research/theory_results/RTK_C10_65S0_INTEGRATION_SAFE_HANDOFF_ARCHITECTURE_RESULT_v1.json /tmp/s0.json
          for attempt in 1 2 3 4 5; do
            git fetch origin rtk-class-build
            git reset --hard origin/rtk-class-build
            cp /tmp/s0.json research/theory_results/RTK_C10_65S0_INTEGRATION_SAFE_HANDOFF_ARCHITECTURE_RESULT_v1.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/theory_results/RTK_C10_65S0_INTEGRATION_SAFE_HANDOFF_ARCHITECTURE_RESULT_v1.json
            git commit -m 'Record C10.65s0 handoff architecture preflight' || exit 0
            if git push origin HEAD:rtk-class-build; then exit 0; fi
          done
          exit 1
