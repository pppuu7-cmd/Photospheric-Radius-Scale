name: RTK C10 U1 physical metric CLASS gauge bridge

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/rtk-c10-u1-physical-metric-class-gauge-bridge-trigger.txt'
      - '.github/workflows/rtk-c10-u1-physical-metric-class-gauge-bridge.yml'
      - 'rtk/route_b_u1_physical_metric_class_gauge_bridge_gate.py'
      - 'research/theory_targets/RTK_C10_U1_PHYSICAL_METRIC_CLASS_GAUGE_BRIDGE_TARGET_v1.json'

permissions:
  contents: write

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Verify target and run physical-metric theorem
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'sympy==1.14.0'
          python3 - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_U1_PHYSICAL_METRIC_CLASS_GAUGE_BRIDGE_TARGET_v1.json'))
          assert t['status']=='FROZEN_BEFORE_EXECUTABLE_RESULT'
          print('C10_PHYSICAL_METRIC_CLASS_GAUGE_TARGET_PASS')
          PY
          git rev-parse HEAD | tee c10_physical_metric_class_gauge_provenance.txt
          python3 -m py_compile rtk/route_b_u1_physical_metric_class_gauge_bridge_gate.py
          python3 rtk/route_b_u1_physical_metric_class_gauge_bridge_gate.py | tee c10_physical_metric_class_gauge.log
          grep -q '^C10_U1_PHYSICAL_METRIC_MAP_PASS_CLASS_NEWTONIAN_DIRECT_IDENTIFICATION_BLOCKED_SCOPED ' c10_physical_metric_class_gauge.log
      - name: Persist result
        run: |
          set -euo pipefail
          cp u1_physical_metric_class_gauge_bridge_result.json /tmp/result.json
          for attempt in 1 2 3 4 5; do
            git fetch origin rtk-class-build
            git reset --hard origin/rtk-class-build
            cp /tmp/result.json research/theory_results/RTK_C10_U1_PHYSICAL_METRIC_CLASS_GAUGE_BRIDGE_RESULT_v1.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/theory_results/RTK_C10_U1_PHYSICAL_METRIC_CLASS_GAUGE_BRIDGE_RESULT_v1.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Record C10 physical metric CLASS gauge bridge'
            if git push origin HEAD:rtk-class-build; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c10-u1-physical-metric-class-gauge-bridge
          path: |
            c10_physical_metric_class_gauge.log
            c10_physical_metric_class_gauge_provenance.txt
            u1_physical_metric_class_gauge_bridge_result.json
          if-no-files-found: error
