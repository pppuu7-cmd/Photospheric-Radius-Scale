name: RTK Route A1 D5 dispersive identifiability theorem

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rtk-quantum-route-a1-d5-dispersive.yml'

permissions:
  contents: read

jobs:
  symbolic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - name: Install pinned SymPy
        run: python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Prove linear M does not identify nonlinear D5 dispersive coupling
        run: |
          set -euo pipefail
          echo "RTK_SOURCE_SHA=$(git rev-parse HEAD)" | tee route_a1_d5_dispersive_provenance.txt
          python3 rtk/quantum_route_a1_d5_dispersive_nogo.py | tee route_a1_d5_dispersive.log
          grep -q RTK_ROUTE_A1_D5_DISPERSIVE_NOGO_PASS route_a1_d5_dispersive.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-a1-d5-dispersive
          path: |
            route_a1_d5_dispersive_provenance.txt
            route_a1_d5_dispersive.log
          if-no-files-found: error
