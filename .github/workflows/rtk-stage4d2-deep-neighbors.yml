name: RTK Stage 4D2 deep finite neighbors

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rtk-stage4d2-deep-neighbors.yml'

jobs:
  refine:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - lambda_D: '20000'
            h: '0.6905146673998096'
            Ob: '0.046842449595150014'
            Om: '0.2529845098101792'
            As: '2.066396842316831e-9'
            ns: '0.9643023366035026'
            zre: '6.772038348387266'
          - lambda_D: '25000'
            h: '0.6905502309919213'
            Ob: '0.0468308138960744'
            Om: '0.25293573979567496'
            As: '2.066444115837013e-9'
            ns: '0.9643635421887894'
            zre: '6.772980133084281'
          - lambda_D: '40000'
            h: '0.6904868200114935'
            Ob: '0.046841227166592225'
            Om: '0.2530003603586838'
            As: '2.066749267941382e-9'
            ns: '0.9642644322829059'
            zre: '6.783044272867548'
          - lambda_D: '60000'
            h: '0.6905556998813828'
            Ob: '0.04684380921739893'
            Om: '0.2529350024559574'
            As: '2.0663630028650534e-9'
            ns: '0.9642801686801264'
            zre: '6.772045408673688'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
      - name: Prepare exact likelihood tree
        run: |
          git clone --depth 1 --branch nonlocal https://github.com/dirian/class_public.git class_public
          git clone --depth 1 https://github.com/dscolnic/Pantheon.git class_public/pantheon
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py class_public/joint_profile_runner.py
          cp rtk/prepare_inference_core.py class_public/prepare_inference_core.py
          cp rtk/stage4d1_cobyqa_refine.py class_public/stage4d1_cobyqa_refine.py
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
      - name: Build CLASS
        working-directory: class_public
        run: make -j2 class
      - name: Install likelihood dependencies
        run: python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' numpy scipy
      - name: Download Planck package
        working-directory: class_public
        run: |
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          mkdir planck_data
          tar -xzf planck.tar.gz -C planck_data
      - name: Run second-pass COBYQA
        working-directory: class_public
        run: |
          python3 stage4d1_cobyqa_refine.py planck_data '${{ matrix.lambda_D }}' eff \
            '${{ matrix.h }}' '${{ matrix.Ob }}' '${{ matrix.Om }}' '${{ matrix.As }}' '${{ matrix.ns }}' '${{ matrix.zre }}' \
            | tee ../deep_neighbor_${{ matrix.lambda_D }}.log
          grep -q STAGE4D1_COBYQA_PASS ../deep_neighbor_${{ matrix.lambda_D }}.log
          cat output/stage4d1_cobyqa/eff/${{ matrix.lambda_D }}/cobyqa_summary.json || find output/stage4d1_cobyqa/eff -name cobyqa_summary.json -exec cat {} \;
      - name: Upload deep-neighbor artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtk-stage4d2-deep-eff-${{ matrix.lambda_D }}
          path: |
            deep_neighbor_${{ matrix.lambda_D }}.log
            class_public/output/stage4d1_cobyqa/eff/**/cobyqa_summary.json
            class_public/output/stage4d1_cobyqa/eff/**/cobyqa_trace.csv
          if-no-files-found: error
