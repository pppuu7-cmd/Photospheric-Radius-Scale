name: RTK Stage 4D2 high-lambda tail refinements

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rtk-stage4d2-deep-neighbors.yml'

jobs:
  refine:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {mapping: eff, lambda_D: '200000', h: '0.6906274201064062', Ob: '0.046826324144271854', Om: '0.25285216262766413', As: '2.069111596683301e-9', ns: '0.9642946574432717', zre: '6.826647411438569'}
          - {mapping: eff, lambda_D: '300000', h: '0.6906274201064062', Ob: '0.046826324144271854', Om: '0.25285216262766413', As: '2.069111596683301e-9', ns: '0.9642946574432717', zre: '6.826647411438569'}
          - {mapping: eff, lambda_D: '1000000', h: '0.6906274201064062', Ob: '0.046826324144271854', Om: '0.25285216262766413', As: '2.069111596683301e-9', ns: '0.9642946574432717', zre: '6.826647411438569'}
          - {mapping: eff, lambda_D: '10000000', h: '0.6906274201064062', Ob: '0.046826324144271854', Om: '0.25285216262766413', As: '2.069111596683301e-9', ns: '0.9642946574432717', zre: '6.826647411438569'}
          - {mapping: eff, lambda_D: '100000000', h: '0.6906274201064062', Ob: '0.046826324144271854', Om: '0.25285216262766413', As: '2.069111596683301e-9', ns: '0.9642946574432717', zre: '6.826647411438569'}
          - {mapping: k01, lambda_D: '200000', h: '0.6905397901741095', Ob: '0.04683753398237637', Om: '0.2529584071658237', As: '2.0692391697144382e-9', ns: '0.9641151317062118', zre: '6.82802874142963'}
          - {mapping: k01, lambda_D: '300000', h: '0.6905397901741095', Ob: '0.04683753398237637', Om: '0.2529584071658237', As: '2.0692391697144382e-9', ns: '0.9641151317062118', zre: '6.82802874142963'}
          - {mapping: k01, lambda_D: '1000000', h: '0.6905397901741095', Ob: '0.04683753398237637', Om: '0.2529584071658237', As: '2.0692391697144382e-9', ns: '0.9641151317062118', zre: '6.82802874142963'}
          - {mapping: k01, lambda_D: '10000000', h: '0.6905397901741095', Ob: '0.04683753398237637', Om: '0.2529584071658237', As: '2.0692391697144382e-9', ns: '0.9641151317062118', zre: '6.82802874142963'}
          - {mapping: k01, lambda_D: '100000000', h: '0.6905397901741095', Ob: '0.04683753398237637', Om: '0.2529584071658237', As: '2.0692391697144382e-9', ns: '0.9641151317062118', zre: '6.82802874142963'}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '120'
      RTK_CACHE_KEY_VERSION: 'exact-float-v1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
      - name: Prepare exact likelihood tree
        run: |
          git clone --depth 1 --branch nonlocal https://github.com/dirian/class_public.git class_public
          git clone --depth 1 https://github.com/dscolnic/Pantheon.git class_public/pantheon
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py class_public/joint_profile_runner.py
          cp rtk/prepare_inference_core.py class_public/prepare_inference_core.py
          cp rtk/stage4d1_cobyqa_refine.py class_public/stage4d1_cobyqa_refine.py
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q "round(float(p\[k\]),12)" inference_core.py
      - name: Build CLASS
        working-directory: class_public
        run: make -j2 class
      - name: Install likelihood dependencies
        run: python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' numpy scipy
      - name: Download Planck package
        working-directory: class_public
        run: |
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          mkdir planck_data
          tar -xzf planck.tar.gz -C planck_data
      - name: Run exact-float high-lambda COBYQA refinement
        working-directory: class_public
        run: |
          python3 stage4d1_cobyqa_refine.py planck_data '${{ matrix.lambda_D }}' '${{ matrix.mapping }}' \
            '${{ matrix.h }}' '${{ matrix.Ob }}' '${{ matrix.Om }}' '${{ matrix.As }}' '${{ matrix.ns }}' '${{ matrix.zre }}' \
            | tee ../tail_${{ matrix.mapping }}_${{ matrix.lambda_D }}.log
          find output/stage4d1_cobyqa/${{ matrix.mapping }} -name cobyqa_summary.json -print -exec cat {} \;
      - name: Upload high-lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtk-stage4d2-tail-${{ matrix.mapping }}-${{ matrix.lambda_D }}
          path: |
            tail_${{ matrix.mapping }}_${{ matrix.lambda_D }}.log
            class_public/output/stage4d1_cobyqa/${{ matrix.mapping }}/**/cobyqa_summary.json
            class_public/output/stage4d1_cobyqa/${{ matrix.mapping }}/**/cobyqa_trace.csv
          if-no-files-found: error
