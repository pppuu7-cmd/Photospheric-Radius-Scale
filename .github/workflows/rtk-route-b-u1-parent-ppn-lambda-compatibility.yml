name: RTK Route-B U1 parent PPN lambda compatibility

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-parent-ppn-lambda-compatibility-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run parent PPN lambda compatibility theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_parent_ppn_lambda_compatibility_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_parent_ppn_lambda_compatibility_provenance.txt
          python3 rtk/route_b_u1_parent_ppn_lambda_compatibility_gate.py | tee u1_parent_ppn_lambda_compatibility.log
          grep -q '^RTK_ROUTE_B_U1_PARENT_PPN_LAMBDA_COMPATIBILITY_PASS ' u1_parent_ppn_lambda_compatibility.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_parent_ppn_lambda_compatibility_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_PARENT_PPN_LAMBDA_COMPATIBILITY_PASS'
          assert 'does not exclude lambda>1' in r['lambda_result']
          assert any('does not certify PPN parameters of the full RTK action' in x for x in r['non_claims'])
          print('U1_PARENT_PPN_LAMBDA_COMPATIBILITY_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-parent-ppn-lambda-compatibility
          path: |
            u1_parent_ppn_lambda_compatibility.log
            u1_parent_ppn_lambda_compatibility_result.json
            u1_parent_ppn_lambda_compatibility_provenance.txt
            rtk/route_b_u1_parent_ppn_lambda_compatibility_gate.py
          if-no-files-found: error
