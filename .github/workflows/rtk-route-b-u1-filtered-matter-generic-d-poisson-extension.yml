name: RTK Route-B U1 filtered-matter generic d Poisson extension

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-filtered-matter-generic-d-poisson-extension-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run generic matter d Poisson-extension theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_filtered_matter_generic_d_poisson_extension_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_filtered_matter_generic_d_poisson_extension_provenance.txt
          python3 rtk/route_b_u1_filtered_matter_generic_d_poisson_extension_gate.py | tee u1_filtered_matter_generic_d_poisson_extension.log
          grep -q '^RTK_ROUTE_B_U1_FILTERED_MATTER_GENERIC_D_POISSON_EXTENSION_PASS ' u1_filtered_matter_generic_d_poisson_extension.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_filtered_matter_generic_d_poisson_extension_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_FILTERED_MATTER_GENERIC_D_POISSON_EXTENSION_PASS'
          assert 'a_eff^2 V' in r['isotropic_extra_d']
          assert 'barotropic' in r['barotropic_limit'].lower()
          print('U1_FILTERED_MATTER_GENERIC_D_POISSON_EXTENSION_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-filtered-matter-generic-d-poisson-extension
          path: |
            u1_filtered_matter_generic_d_poisson_extension.log
            u1_filtered_matter_generic_d_poisson_extension_result.json
            u1_filtered_matter_generic_d_poisson_extension_provenance.txt
            rtk/route_b_u1_filtered_matter_generic_d_poisson_extension_gate.py
          if-no-files-found: error
