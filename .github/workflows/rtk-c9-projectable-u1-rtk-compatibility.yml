name: RTK C9 projectable U1 RTK compatibility

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c9-projectable-u1-rtk-compatibility-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run projectable U1 RTK compatibility theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/c9_projectable_u1_rtk_compatibility_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee c9_projectable_u1_rtk_compatibility_provenance.txt
          python3 rtk/c9_projectable_u1_rtk_compatibility_gate.py | tee c9_projectable_u1_rtk_compatibility.log
          grep -q '^RTK_C9_PROJECTABLE_U1_RTK_COMPATIBILITY_PASS ' c9_projectable_u1_rtk_compatibility.log
          python3 - <<'PY'
          import json
          r=json.load(open('c9_projectable_u1_rtk_compatibility_result.json'))
          assert r['classification']=='RTK_C9_PROJECTABLE_U1_RTK_COMPATIBILITY_PASS'
          assert r['c9_counterterm_annihilation']['eta1_a2_sigma'].startswith('0 identically')
          assert 'omega^2=c_a^2' in r['rtk_dispersion_exact']
          assert r['elliptic_compensator']['homogeneous_A_source'].startswith('q=0')
          print('C9_PROJECTABLE_U1_RTK_COMPATIBILITY_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c9-projectable-u1-rtk-compatibility
          path: |
            c9_projectable_u1_rtk_compatibility.log
            c9_projectable_u1_rtk_compatibility_result.json
            c9_projectable_u1_rtk_compatibility_provenance.txt
            rtk/c9_projectable_u1_rtk_compatibility_gate.py
          if-no-files-found: error
