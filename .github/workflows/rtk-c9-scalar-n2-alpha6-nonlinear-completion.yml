name: RTK C9 scalar n2 alpha6 nonlinear completion

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c9-scalar-n2-alpha6-nonlinear-completion-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run alpha6 nonlinear completion theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/c9_rtk_scalar_n2_alpha6_nonlinear_completion_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee c9_rtk_scalar_n2_alpha6_nonlinear_completion_provenance.txt
          python3 rtk/c9_rtk_scalar_n2_alpha6_nonlinear_completion_gate.py | tee c9_rtk_scalar_n2_alpha6_nonlinear_completion.log
          grep -q '^RTK_C9_RTK_SCALAR_N2_ALPHA6_NONLINEAR_COMPLETION_PASS ' c9_rtk_scalar_n2_alpha6_nonlinear_completion.log
          python3 - <<'PY'
          import json
          r=json.load(open('c9_rtk_scalar_n2_alpha6_nonlinear_completion_result.json'))
          assert r['classification']=='RTK_C9_RTK_SCALAR_N2_ALPHA6_NONLINEAR_COMPLETION_PASS'
          assert r['special_completion']['s1']=='1/2'
          assert 'does not cure the soft-s warning' in r['interpretation']
          print('C9_RTK_SCALAR_N2_ALPHA6_NONLINEAR_COMPLETION_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c9-scalar-n2-alpha6-nonlinear-completion
          path: |
            c9_rtk_scalar_n2_alpha6_nonlinear_completion.log
            c9_rtk_scalar_n2_alpha6_nonlinear_completion_result.json
            c9_rtk_scalar_n2_alpha6_nonlinear_completion_provenance.txt
            rtk/c9_rtk_scalar_n2_alpha6_nonlinear_completion_gate.py
          if-no-files-found: error
