name: RTK C10 neutral finite-onset memory
# Research resume trigger: execute frozen C10.62b gate on 2026-08-26.

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - 'research/theory_targets/RTK_C10_NEUTRAL_FINITE_ONSET_MEMORY_TARGET_v1.json'
      - 'research/shadow/rtk_c10_neutral_finite_onset_memory.py'
      - '.github/workflows/rtk-c10-neutral-finite-onset-memory.yml'

permissions:
  contents: write

jobs:
  memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Verify frozen parents
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_NEUTRAL_FINITE_ONSET_MEMORY_TARGET_v1.json'))
          p=json.load(open('research/theory_results/RTK_C10_DIAGNOSTIC_COMPLETION_ONSET_PROTOCOL_RESULT_v1.json'))
          s=json.load(open('research/theory_results/RTK_C10_PHYSICAL_CLASS_SOURCE_EXPORT_RESULT_v1.json'))
          assert t['status']=='FROZEN_BEFORE_EXECUTION'
          assert p['classification']=='C10_DIAGNOSTIC_COMPLETION_ONSET_PROTOCOL_PASS_SCOPED'
          assert s['classification']=='C10_PHYSICAL_CLASS_SOURCE_EXPORT_PASS'
          print('C10_NEUTRAL_MEMORY_TARGET_AND_PARENTS_PASS')
          PY
          git rev-parse HEAD | tee c10_neutral_memory_repo_head.txt
      - name: Prepare disposable pinned production tree
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_export
          git -C class_export reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          test "$(git -C class_export rev-parse HEAD)" = "$RTK_CLASS_UPSTREAM_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_export/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_export/include/
          python3 rtk/apply_rtk_class_patch.py class_export
          python3 rtk/upgrade_rtk_inputs.py class_export
          python3 rtk/upgrade_rtk_nonlocal_initial_conditions.py class_export
          python3 rtk/upgrade_rtk_initial_conditions.py class_export
          python3 rtk/upgrade_rtk_matter_sources.py class_export
          python3 rtk/upgrade_rtk_gamma_root.py class_export
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_export
          python3 rtk/apply_rtk_c10_source_export_patch.py class_export
          make -C class_export -j2 class
      - name: Write pinned historical RTK source-export input
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          t=json.load(open('research/theory_results/RTK_C10_PHYSICAL_CLASS_SOURCE_EXPORT_RESULT_v1.json'))
          p=json.load(open('research/state/current.json'))['final_replay_result']['rtk']['params']
          kvals=', '.join(format(float(x),'.17g') for x in t['actual_k_values_Mpc_inv'])
          body=f'''h = {p['h']!r}
          T_cmb = 2.7255
          Omega_b = {p['Ob']!r}
          Omega_khronon = {p['Om']!r}
          lambda_D = {p['lam']!r}
          Omega_Lambda = 0.
          model = 2.
          N_ur = 3.046
          N_ncdm = 0
          Omega_k = 0.
          Omega_fld = 0.
          Omega_scf = 0.
          recombination = RECFAST
          reio_parametrization = reio_camb
          z_reio = {p['zre']!r}
          output = mPk,dTk,vTk
          gauge = newtonian
          A_s = {p['As']!r}
          n_s = {p['ns']!r}
          P_k_max_h/Mpc = 1.0
          z_pk = 0
          k_output_values = {kvals}
          root = output/c10mem_
          write parameters = yeap
          background_verbose = 0
          perturbations_verbose = 0
          spectra_verbose = 0
          '''
          pathlib.Path('class_export/memory_export.ini').write_text(body)
          pathlib.Path('class_export/output').mkdir(exist_ok=True)
          PY
      - name: Regenerate read-only production histories
        run: |
          set -euo pipefail
          (cd class_export && ./class memory_export.ini) > c10_neutral_memory_class.log 2>&1
          grep 'RTK_LOG_GAMMA_ROOT' c10_neutral_memory_class.log | tail -1 || true
          find class_export/output -maxdepth 1 -type f -iname '*perturbations*' -print | sort | tee c10_neutral_memory_files.txt
          test "$(wc -l < c10_neutral_memory_files.txt)" -eq 9
      - name: Run preregistered neutral memory transfer
        run: |
          set -euo pipefail
          python3 -m py_compile research/shadow/rtk_c10_neutral_finite_onset_memory.py
          python3 research/shadow/rtk_c10_neutral_finite_onset_memory.py \
            --glob 'class_export/output/*perturbations*' \
            --output c10_neutral_finite_onset_memory_result.json | tee c10_neutral_memory.log
          grep -q '^C10_NEUTRAL_FINITE_ONSET_MEMORY_' c10_neutral_memory.log
      - name: Add immutable provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='c10_neutral_finite_onset_memory_result.json'; d=json.load(open(p))
          d['provenance']={
            'repo_head_at_job_start':open('c10_neutral_memory_repo_head.txt').read().strip(),
            'class_upstream_sha':'36cf283628c4a3330ec9fd3d84239bf775f77317',
            'workflow':'rtk-c10-neutral-finite-onset-memory.yml',
            'source_export_patch':'rtk/apply_rtk_c10_source_export_patch.py',
            'worker':'research/shadow/rtk_c10_neutral_finite_onset_memory.py'
          }
          open(p,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - name: Persist result
        run: |
          set -euo pipefail
          cp c10_neutral_finite_onset_memory_result.json /tmp/result.json
          for attempt in 1 2 3 4 5; do
            git fetch origin rtk-class-build
            git reset --hard origin/rtk-class-build
            cp /tmp/result.json research/theory_results/RTK_C10_NEUTRAL_FINITE_ONSET_MEMORY_RESULT_v1.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/theory_results/RTK_C10_NEUTRAL_FINITE_ONSET_MEMORY_RESULT_v1.json
            git commit -m 'Record C10.62b neutral finite-onset memory result' || exit 0
            if git push origin HEAD:rtk-class-build; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c10-neutral-finite-onset-memory
          path: |
            c10_neutral_memory_class.log
            c10_neutral_memory.log
            c10_neutral_memory_files.txt
            c10_neutral_finite_onset_memory_result.json
            class_export/memory_export.ini
          if-no-files-found: warn
