name: RTK Route-B background-silent companion gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-background-silent-companion-gate-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run background-silent companion theorem
        run: |
          set -euo pipefail
          echo "RTK_SOURCE_SHA=$(git rev-parse HEAD)" | tee rtk_background_silent_companion_provenance.txt
          python -m py_compile rtk/route_b_background_silent_companion_gate.py
          python rtk/route_b_background_silent_companion_gate.py | tee rtk_background_silent_companion.log
          grep -q '^RTK_ROUTE_B_BACKGROUND_SILENT_COMPANION_GATE_PASS ' rtk_background_silent_companion.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-background-silent-companion-gate
          path: |
            rtk_background_silent_companion.log
            rtk_background_silent_companion_provenance.txt
          if-no-files-found: error
