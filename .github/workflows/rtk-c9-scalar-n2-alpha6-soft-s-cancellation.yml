name: RTK C9 scalar n2 alpha6 soft-s cancellation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c9-scalar-n2-alpha6-soft-s-cancellation-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run alpha6 soft-s cancellation obstruction theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/c9_rtk_scalar_n2_alpha6_soft_s_cancellation_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee c9_rtk_scalar_n2_alpha6_soft_s_cancellation_provenance.txt
          python3 rtk/c9_rtk_scalar_n2_alpha6_soft_s_cancellation_gate.py | tee c9_rtk_scalar_n2_alpha6_soft_s_cancellation.log
          grep -q '^RTK_C9_RTK_SCALAR_N2_ALPHA6_SOFT_S_CANCELLATION_OBSTRUCTION_PASS ' c9_rtk_scalar_n2_alpha6_soft_s_cancellation.log
          python3 - <<'PY'
          import json
          r=json.load(open('c9_rtk_scalar_n2_alpha6_soft_s_cancellation_result.json'))
          assert r['classification']=='RTK_C9_RTK_SCALAR_N2_ALPHA6_SOFT_S_CANCELLATION_OBSTRUCTION_PASS'
          assert r['status_scope'].startswith('YELLOW_LOCAL_ALPHA6_STATE_DEPENDENCE_CANNOT_CANCEL_SOFT_S')
          assert r['necessary_cancellation_magnitude']=='|1-2s1|=3H/[2 omega(k)]'
          print('C9_RTK_SCALAR_N2_ALPHA6_SOFT_S_CANCELLATION_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c9-scalar-n2-alpha6-soft-s-cancellation
          path: |
            c9_rtk_scalar_n2_alpha6_soft_s_cancellation.log
            c9_rtk_scalar_n2_alpha6_soft_s_cancellation_result.json
            c9_rtk_scalar_n2_alpha6_soft_s_cancellation_provenance.txt
            rtk/c9_rtk_scalar_n2_alpha6_soft_s_cancellation_gate.py
          if-no-files-found: error
