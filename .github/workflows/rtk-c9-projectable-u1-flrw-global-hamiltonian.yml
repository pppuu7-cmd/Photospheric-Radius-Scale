name: RTK C9 projectable U1 FLRW global Hamiltonian

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c9-projectable-u1-flrw-global-hamiltonian-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run projectable FLRW background theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/c9_projectable_u1_flrw_global_hamiltonian_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee c9_projectable_u1_flrw_global_hamiltonian_provenance.txt
          python3 rtk/c9_projectable_u1_flrw_global_hamiltonian_gate.py | tee c9_projectable_u1_flrw_global_hamiltonian.log
          grep -q '^RTK_C9_PROJECTABLE_U1_FLRW_GLOBAL_HAMILTONIAN_PASS ' c9_projectable_u1_flrw_global_hamiltonian.log
          python3 - <<'PY'
          import json
          r=json.load(open('c9_projectable_u1_flrw_global_hamiltonian_result.json'))
          assert r['classification']=='RTK_C9_PROJECTABLE_U1_FLRW_GLOBAL_HAMILTONIAN_PASS'
          assert 'G_cos/G_N=2/(3lambda-1)' in r['cosmological_Newton_ratio']
          assert 'Q-H0=0' in r['A_constraint']['matter_plus_aux_source']
          print('C9_PROJECTABLE_U1_FLRW_GLOBAL_HAMILTONIAN_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c9-projectable-u1-flrw-global-hamiltonian
          path: |
            c9_projectable_u1_flrw_global_hamiltonian.log
            c9_projectable_u1_flrw_global_hamiltonian_result.json
            c9_projectable_u1_flrw_global_hamiltonian_provenance.txt
            rtk/c9_projectable_u1_flrw_global_hamiltonian_gate.py
          if-no-files-found: error
