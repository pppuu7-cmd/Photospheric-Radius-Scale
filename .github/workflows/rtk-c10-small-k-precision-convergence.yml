name: RTK C10 small-k precision convergence

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/workflows/rtk-c10-small-k-precision-convergence.yml'
      - 'research/theory_targets/RTK_C10_SMALL_K_PRECISION_CONVERGENCE_TARGET_v1.json'
      - 'research/shadow/rtk_c10_small_k_precision_convergence.py'
      - 'rtk/apply_rtk_c10_direct_regularity_export_patch.py'

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Verify frozen convergence target and parent failure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_SMALL_K_PRECISION_CONVERGENCE_TARGET_v1.json'))
          p=json.load(open(t['parent_confirmatory_result']))
          s=json.load(open('research/state/current.json'))['final_replay_result']
          assert t['status']=='FROZEN_BEFORE_ULTRA_AND_TIGHT_EXECUTION'
          assert p['classification']==t['parent_required_classification']
          assert s['status']=='PASS'
          assert abs(float(s['rtk']['expected_score_eff'])-1050.249912429787)<1e-12
          assert t['precision_tiers']['historical_ultra']['perturb_sampling_stepsize']==0.0125
          assert t['precision_tiers']['historical_ultra']['tol_perturb_integration']==3e-7
          assert t['precision_tiers']['tight_diagnostic']['perturb_sampling_stepsize']==0.003125
          assert t['precision_tiers']['tight_diagnostic']['tol_perturb_integration']==7.5e-8
          print('C10_SMALL_K_PRECISION_TARGET_PASS')
          PY
          git rev-parse HEAD | tee c10_small_k_precision_repo_head.txt

      - name: Prepare disposable pinned RT-CLASS diagnostic tree
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_conv
          git -C class_conv reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_conv/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_conv/include/
          python3 rtk/apply_rtk_class_patch.py class_conv
          python3 rtk/upgrade_rtk_inputs.py class_conv
          python3 rtk/upgrade_rtk_nonlocal_initial_conditions.py class_conv
          python3 rtk/upgrade_rtk_initial_conditions.py class_conv
          python3 rtk/upgrade_rtk_matter_sources.py class_conv
          python3 rtk/upgrade_rtk_gamma_root.py class_conv
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_conv
          python3 rtk/apply_rtk_c10_source_export_patch.py class_conv
          python3 rtk/apply_rtk_c10_direct_regularity_export_patch.py class_conv
          grep -q 'RTK_C10_DIRECT_REGULARITY_EXPORT_V1' class_conv/source/perturbations.c
          make -C class_conv -j2 class

      - name: Write historical-ultra and tighter diagnostic inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          t=json.load(open('research/theory_targets/RTK_C10_SMALL_K_PRECISION_CONVERGENCE_TARGET_v1.json'))
          p=json.load(open('research/state/current.json'))['final_replay_result']['rtk']['params']
          kvals=', '.join(format(float(x),'.17g') for x in t['k_ladder_Mpc_inv'])
          common=f'''h = {p['h']!r}
          T_cmb = 2.7255
          Omega_b = {p['Ob']!r}
          Omega_khronon = {p['Om']!r}
          lambda_D = {p['lam']!r}
          Omega_Lambda = 0.
          model = 2.
          N_ur = 3.046
          N_ncdm = 0
          Omega_k = 0.
          Omega_fld = 0.
          Omega_scf = 0.
          recombination = RECFAST
          reio_parametrization = reio_camb
          z_reio = {p['zre']!r}
          output = mPk,dTk,vTk
          gauge = newtonian
          A_s = {p['As']!r}
          n_s = {p['ns']!r}
          P_k_max_h/Mpc = 1.0
          z_pk = 0
          k_output_values = {kvals}
          background_verbose = 1
          perturbations_verbose = 0
          spectra_verbose = 0
          '''
          for name,key in [('ultra','historical_ultra'),('tight','tight_diagnostic')]:
              q=t['precision_tiers'][key]
              precision=f'''k_max_tau0_over_l_max = {q['k_max_tau0_over_l_max']}
              k_per_decade_for_bao = {q['k_per_decade_for_bao']}
              k_per_decade_for_pk = {q['k_per_decade_for_pk']}
              l_linstep = {q['l_linstep']}
              l_logstep = {q['l_logstep']}
              perturb_sampling_stepsize = {q['perturb_sampling_stepsize']}
              tol_background_integration = {q['tol_background_integration']}
              tol_perturb_integration = {q['tol_perturb_integration']}
              tol_thermo_integration = {q['tol_thermo_integration']}
              root = output/c10conv_{name}_
              '''
              pathlib.Path('class_conv',f'{name}.ini').write_text(common+precision)
          pathlib.Path('class_conv/output').mkdir(exist_ok=True)
          PY

      - name: Run historical frozen ultra precision
        run: |
          set -euo pipefail
          (cd class_conv && ./class ultra.ini) > c10_small_k_ultra.log 2>&1
          grep 'RTK_LOG_GAMMA_ROOT' c10_small_k_ultra.log | tail -1 | tee c10_small_k_ultra_gamma.txt
          find class_conv/output -maxdepth 1 -type f -name 'c10conv_ultra_*perturbations*' -print | sort | tee c10_small_k_ultra_files.txt
          test "$(wc -l < c10_small_k_ultra_files.txt)" -eq 12

      - name: Run four-times tighter diagnostic precision
        run: |
          set -euo pipefail
          (cd class_conv && ./class tight.ini) > c10_small_k_tight.log 2>&1
          grep 'RTK_LOG_GAMMA_ROOT' c10_small_k_tight.log | tail -1 | tee c10_small_k_tight_gamma.txt
          find class_conv/output -maxdepth 1 -type f -name 'c10conv_tight_*perturbations*' -print | sort | tee c10_small_k_tight_files.txt
          test "$(wc -l < c10_small_k_tight_files.txt)" -eq 12

      - name: Evaluate frozen convergence diagnosis
        run: |
          set -euo pipefail
          python3 research/shadow/rtk_c10_small_k_precision_convergence.py \
            --baseline research/theory_results/RTK_C10_PARAMETER_FREE_SMALL_K_SOURCE_COMPATIBILITY_CONFIRM_RESULT_v1.json \
            --ultra-glob 'class_conv/output/c10conv_ultra_*perturbations*' \
            --tight-glob 'class_conv/output/c10conv_tight_*perturbations*' \
            --target research/theory_targets/RTK_C10_SMALL_K_PRECISION_CONVERGENCE_TARGET_v1.json \
            --output c10_small_k_precision_convergence_result.json | tee c10_small_k_precision_analysis.log
          cat c10_small_k_precision_convergence_result.json

      - name: Add immutable provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          p='c10_small_k_precision_convergence_result.json'; d=json.load(open(p))
          def gamma(path):
              m=re.search(r'gamma=([0-9.eE+\-]+)',open(path).read())
              return float(m.group(1)) if m else None
          d['provenance']={
            'class_upstream_sha':'36cf283628c4a3330ec9fd3d84239bf775f77317',
            'repo_head_at_job_start':open('c10_small_k_precision_repo_head.txt').read().strip(),
            'production_score_eff':1050.249912429787,
            'gamma_ultra':gamma('c10_small_k_ultra_gamma.txt'),
            'gamma_tight':gamma('c10_small_k_tight_gamma.txt'),
            'workflow':'rtk-c10-small-k-precision-convergence.yml',
            'direct_export_patch':'rtk/apply_rtk_c10_direct_regularity_export_patch.py',
            'analyzer':'research/shadow/rtk_c10_small_k_precision_convergence.py'
          }
          open(p,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY

      - name: Persist convergence result
        run: |
          set -euo pipefail
          cp c10_small_k_precision_convergence_result.json /tmp/result.json
          for attempt in 1 2 3 4 5; do
            git fetch origin rtk-class-build
            git reset --hard origin/rtk-class-build
            cp /tmp/result.json research/theory_results/RTK_C10_SMALL_K_PRECISION_CONVERGENCE_RESULT_v1.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/theory_results/RTK_C10_SMALL_K_PRECISION_CONVERGENCE_RESULT_v1.json
            git commit -m 'Record C10 small-k precision convergence diagnosis' || exit 0
            if git push origin HEAD:rtk-class-build; then exit 0; fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c10-small-k-precision-convergence
          path: |
            c10_small_k_ultra.log
            c10_small_k_tight.log
            c10_small_k_ultra_gamma.txt
            c10_small_k_tight_gamma.txt
            c10_small_k_precision_analysis.log
            c10_small_k_precision_convergence_result.json
            class_conv/output/c10conv_ultra_*perturbations*
            class_conv/output/c10conv_tight_*perturbations*
          if-no-files-found: warn
