name: RTK C10 legacy RT 00 initial first-integral audit

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/workflows/rtk-c10-legacy-rt-00-initial-first-integral.yml'
      - 'research/theory_targets/RTK_C10_LEGACY_RT_00_INITIAL_FIRST_INTEGRAL_PROPAGATION_TARGET_v1.json'
      - 'research/shadow/rtk_c10_legacy_rt_00_initial_first_integral.py'
      - 'rtk/apply_rtk_c10_native_rt_control_export_patch.py'

permissions:
  contents: write

jobs:
  first-integral:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Verify frozen target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_LEGACY_RT_00_INITIAL_FIRST_INTEGRAL_PROPAGATION_TARGET_v1.json'))
          assert t['status']=='FROZEN_BEFORE_EXECUTION'
          assert t['start_variants']['default']=={'start_small_k_at_tau_c_over_tau_h':0.0015,'start_large_k_at_tau_h_over_tau_k':0.07}
          assert t['start_variants']['earlier_x4']=={'start_small_k_at_tau_c_over_tau_h':0.000375,'start_large_k_at_tau_h_over_tau_k':0.0175}
          print('FIRST_INTEGRAL_TARGET_PASS')
          PY
          python3 -m py_compile research/shadow/rtk_c10_legacy_rt_00_initial_first_integral.py rtk/apply_rtk_c10_native_rt_control_export_patch.py
          git rev-parse HEAD > repo_head_at_job_start.txt

      - name: Prepare untouched upstream model2 tree
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_native_fi
          git -C class_native_fi reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          python3 rtk/apply_rtk_c10_native_rt_control_export_patch.py class_native_fi
          make -C class_native_fi -j2 class

      - name: Prepare historical production RTK tree
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_rtk_fi
          git -C class_rtk_fi reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_rtk_fi/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_rtk_fi/include/
          python3 rtk/apply_rtk_class_patch.py class_rtk_fi
          python3 rtk/upgrade_rtk_inputs.py class_rtk_fi
          python3 rtk/upgrade_rtk_nonlocal_initial_conditions.py class_rtk_fi
          python3 rtk/upgrade_rtk_initial_conditions.py class_rtk_fi
          python3 rtk/upgrade_rtk_matter_sources.py class_rtk_fi
          python3 rtk/upgrade_rtk_gamma_root.py class_rtk_fi
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_rtk_fi
          python3 rtk/apply_rtk_c10_native_rt_control_export_patch.py class_rtk_fi
          make -C class_rtk_fi -j2 class

      - name: Write six frozen inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          t=json.load(open('research/theory_targets/RTK_C10_LEGACY_RT_00_INITIAL_FIRST_INTEGRAL_PROPAGATION_TARGET_v1.json'))
          p=json.load(open('research/state/current.json'))['final_replay_result']['rtk']['params']
          ks=', '.join(format(float(x),'.17g') for x in t['k_ladder_Mpc_inv']); q=t['precision']
          common=f'''h = {p['h']!r}\nT_cmb = 2.7255\nOmega_b = {p['Ob']!r}\nmodel = 2.\nN_ur = 3.046\nN_ncdm = 0\nOmega_k = 0.\nOmega_fld = 0.\nOmega_scf = 0.\nrecombination = RECFAST\nreio_parametrization = reio_camb\nz_reio = {p['zre']!r}\noutput = mPk,dTk,vTk\ngauge = newtonian\nA_s = {p['As']!r}\nn_s = {p['ns']!r}\nP_k_max_h/Mpc = 1.0\nz_pk = 0\nk_output_values = {ks}\nperturb_sampling_stepsize = {q['perturb_sampling_stepsize']}\ntol_background_integration = {q['tol_background_integration']}\ntol_perturb_integration = {q['tol_perturb_integration']}\ntol_thermo_integration = {q['tol_thermo_integration']}\nbackground_verbose = 0\nperturbations_verbose = 0\nspectra_verbose = 0\n'''
          pathlib.Path('class_native_fi/output').mkdir(exist_ok=True); pathlib.Path('class_rtk_fi/output').mkdir(exist_ok=True)
          for label,v in t['start_variants'].items():
              starts=f"start_small_k_at_tau_c_over_tau_h = {v['start_small_k_at_tau_c_over_tau_h']}\nstart_large_k_at_tau_h_over_tau_k = {v['start_large_k_at_tau_h_over_tau_k']}\n"
              native=common+starts+f'Omega_cdm = {p["Om"]!r}\nroot = output/fi_{label}_\n'
              rtk=common+starts+f'Omega_khronon = {p["Om"]!r}\nlambda_D = {p["lam"]!r}\nOmega_Lambda = 0.\nroot = output/fi_{label}_\n'
              pathlib.Path(f'class_native_fi/fi_{label}.ini').write_text(native)
              pathlib.Path(f'class_rtk_fi/fi_{label}.ini').write_text(rtk)
          PY

      - name: Run start variants
        run: |
          set -euo pipefail
          for v in default earlier_x2 earlier_x4; do
            (cd class_native_fi && ./class "fi_${v}.ini") > "native_${v}.log" 2>&1
            (cd class_rtk_fi && ./class "fi_${v}.ini") > "rtk_${v}.log" 2>&1
            test "$(find class_native_fi/output -maxdepth 1 -type f -name "fi_${v}_*perturbations*" | wc -l)" -eq 6
            test "$(find class_rtk_fi/output -maxdepth 1 -type f -name "fi_${v}_*perturbations*" | wc -l)" -eq 6
          done

      - name: Analyze initial and propagated 00 residual
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check numpy==2.5.2
          python3 research/shadow/rtk_c10_legacy_rt_00_initial_first_integral.py \
            --upstream-dir class_native_fi/output \
            --rtk-dir class_rtk_fi/output \
            --target research/theory_targets/RTK_C10_LEGACY_RT_00_INITIAL_FIRST_INTEGRAL_PROPAGATION_TARGET_v1.json \
            --output legacy_rt_00_first_integral_result.json | tee first_integral_analysis.log
          cat legacy_rt_00_first_integral_result.json

      - name: Persist result
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='legacy_rt_00_first_integral_result.json'; d=json.load(open(p))
          d['provenance']={'upstream_sha':'36cf283628c4a3330ec9fd3d84239bf775f77317','repo_head_at_job_start':open('repo_head_at_job_start.txt').read().strip(),'workflow':'rtk-c10-legacy-rt-00-initial-first-integral.yml','export_patch':'rtk/apply_rtk_c10_native_rt_control_export_patch.py'}
          open(p,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          cp legacy_rt_00_first_integral_result.json /tmp/result.json
          for attempt in 1 2 3 4 5; do
            git fetch origin rtk-class-build
            git reset --hard origin/rtk-class-build
            cp /tmp/result.json research/theory_results/RTK_C10_LEGACY_RT_00_INITIAL_FIRST_INTEGRAL_PROPAGATION_RESULT_v1.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/theory_results/RTK_C10_LEGACY_RT_00_INITIAL_FIRST_INTEGRAL_PROPAGATION_RESULT_v1.json
            git commit -m 'Record C10 legacy RT 00 initial first-integral audit' || exit 0
            if git push origin HEAD:rtk-class-build; then exit 0; fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c10-legacy-rt-00-initial-first-integral
          path: |
            *_*.log
            first_integral_analysis.log
            legacy_rt_00_first_integral_result.json
            class_native_fi/output/fi_*perturbations*
            class_rtk_fi/output/fi_*perturbations*
          if-no-files-found: warn
