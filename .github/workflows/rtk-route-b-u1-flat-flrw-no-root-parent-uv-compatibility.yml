name: RTK Route-B U1 flat FLRW no-root parent UV compatibility

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-flat-flrw-no-root-parent-uv-compatibility-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run parent-UV compatibility theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_flat_flrw_no_root_parent_uv_compatibility_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_flat_flrw_no_root_parent_uv_compatibility_provenance.txt
          python3 rtk/route_b_u1_flat_flrw_no_root_parent_uv_compatibility_gate.py | tee u1_flat_flrw_no_root_parent_uv_compatibility.log
          grep -q '^RTK_ROUTE_B_U1_FLAT_FLRW_NO_ROOT_PARENT_UV_COMPATIBILITY_PASS ' u1_flat_flrw_no_root_parent_uv_compatibility.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_flat_flrw_no_root_parent_uv_compatibility_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_FLAT_FLRW_NO_ROOT_PARENT_UV_COMPATIBILITY_PASS'
          assert any('beta8=-zeta^4 b1^2' in x for x in r['parent_relations'])
          assert any('does not freeze lambda' in x for x in r['non_claims'])
          print('U1_FLAT_FLRW_NO_ROOT_PARENT_UV_COMPATIBILITY_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-flat-flrw-no-root-parent-uv-compatibility
          path: |
            u1_flat_flrw_no_root_parent_uv_compatibility.log
            u1_flat_flrw_no_root_parent_uv_compatibility_result.json
            u1_flat_flrw_no_root_parent_uv_compatibility_provenance.txt
            rtk/route_b_u1_flat_flrw_no_root_parent_uv_compatibility_gate.py
          if-no-files-found: error
