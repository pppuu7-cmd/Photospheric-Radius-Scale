name: RTK Route-B clock operator discriminator

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-clock-operator-discriminator-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Run exact derivative-fingerprint theorem
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
          python3 -m py_compile rtk/route_b_clock_operator_discriminator.py
          python3 rtk/route_b_clock_operator_discriminator.py | tee route_b_clock_operator_discriminator.log
          grep -q RTK_ROUTE_B_CLOCK_OPERATOR_DISCRIMINATOR_PASS route_b_clock_operator_discriminator.log
      - uses: actions/upload-artifact@v4
        with:
          name: rtk-route-b-clock-operator-discriminator
          path: route_b_clock_operator_discriminator.log
          if-no-files-found: error
