name: RTK C10.65s6fX independent action-selection requirement

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - 'research/theory_targets/RTK_C10_65S6FX_INDEPENDENT_ACTION_SELECTION_REQUIREMENT_TARGET_v1.json'
      - 'research/shadow/rtk_c10_65s6fx_independent_action_selection_requirement.py'
      - '.github/workflows/rtk-c10-65s6fx-independent-action-selection-requirement.yml'
      - '.github/rtk-c10-65s6fx-independent-action-selection-requirement-trigger.txt'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - name: Verify frozen target
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='research/theory_targets/RTK_C10_65S6FX_INDEPENDENT_ACTION_SELECTION_REQUIREMENT_TARGET_v1.json'
          t=json.load(open(p))
          assert t['gate']=='C10.65s6fX'
          assert t['guards']['threshold_changed'] is False
          assert t['guards']['no_soft_s_retest'] is True
          assert t['guards']['no_k003_production'] is True
          PY
      - name: Run frozen action-selection admissibility audit
        run: python research/shadow/rtk_c10_65s6fx_independent_action_selection_requirement.py
      - name: Add provenance and checkpoint
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('research/theory_results/RTK_C10_65S6FX_INDEPENDENT_ACTION_SELECTION_REQUIREMENT_RESULT_v1.json')
          r=json.loads(p.read_text())
          r['provenance'].update({
            'github_actions_run_id': int(os.environ['GITHUB_RUN_ID']),
            'github_actions_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
            'repo_head_at_job_start': os.environ['GITHUB_SHA'],
          })
          p.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          cp=Path('research/checkpoints/RTK_C10_65S6FX_ACTION_SELECTION_REQUIREMENT_2026-08-27.md')
          cp.write_text(f'''# RTK C10.65s6fX — independent action-selection requirement\n\nClassification: **{r['classification']}**\n\nThis gate combines two already frozen source-identifiability results: s6fV proves the rank-one one-pole class does not uniquely determine the full embedding, while s6fW finds no independent pre-soft-s selector in the source-locked C8/C9 archive.\n\nResult: no preferred full nonlinear action may be invented or fitted to the observed soft-s obstruction. The s6fT embedding blocker remains active. This is not a no-go for RTK or rank-one completions.\n\nSoft-s retest allowed: `{r['soft_s_retest_allowed']}`. k=0.03 production unblocked: `{r['production_k003_unblocked']}`.\n\nNext gate: {r['next_gate']}\n\nProvenance: GitHub Actions run `{os.environ['GITHUB_RUN_ID']}`, attempt `{os.environ['GITHUB_RUN_ATTEMPT']}`, start SHA `{os.environ['GITHUB_SHA']}`. Thresholds changed: false.\n''')
          PY
      - name: Persist result and checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C10_65S6FX_INDEPENDENT_ACTION_SELECTION_REQUIREMENT_RESULT_v1.json research/checkpoints/RTK_C10_65S6FX_ACTION_SELECTION_REQUIREMENT_2026-08-27.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record C10.65s6fX independent action-selection requirement'
            git push origin HEAD:rtk-class-build
          fi
