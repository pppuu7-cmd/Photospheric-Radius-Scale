name: RTK C10 full action source channel decomposition

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/workflows/rtk-c10-full-action-source-channel-decomposition.yml'
      - 'research/shadow/rtk_c10_full_action_source_channel_decomposition.py'
      - 'research/theory_targets/RTK_C10_FULL_ACTION_SOURCE_CHANNEL_DECOMPOSITION_TARGET_v1.json'

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - run: pip install 'sympy==1.13.3'
      - name: Verify target and run source-channel proof
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_FULL_ACTION_SOURCE_CHANNEL_DECOMPOSITION_TARGET_v1.json'))
          assert t['status']=='FROZEN_BEFORE_EXECUTION'
          print('TARGET_FROZEN_PASS')
          PY
          python3 research/shadow/rtk_c10_full_action_source_channel_decomposition.py > /tmp/result.json
          cat /tmp/result.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/result.json'))
          assert d['classification']=='C10_FULL_ACTION_SOURCE_CHANNEL_DECOMPOSITION_PASS_PROJECTOR_SOURCE_REWIRE_REQUIRED_SCOPED'
          assert all(v=='0' for v in d['machine_residuals'].values())
          print('SOURCE_CHANNEL_DECOMPOSITION_PASS')
          PY
      - name: Persist certificate
        run: |
          set -euo pipefail
          cp /tmp/result.json /tmp/c10_source_channel.json
          for attempt in 1 2 3 4 5; do
            git fetch origin rtk-class-build
            git reset --hard origin/rtk-class-build
            cp /tmp/c10_source_channel.json research/theory_results/RTK_C10_FULL_ACTION_SOURCE_CHANNEL_DECOMPOSITION_RESULT_v1.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/theory_results/RTK_C10_FULL_ACTION_SOURCE_CHANNEL_DECOMPOSITION_RESULT_v1.json
            git commit -m 'Record C10 full-action source channel decomposition' || exit 0
            if git push origin HEAD:rtk-class-build; then exit 0; fi
          done
          exit 1
