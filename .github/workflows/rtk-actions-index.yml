name: RTK lightweight Actions run index

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rtk-actions-index.yml'
      - '.github/rtk-actions-index-trigger.txt'

permissions:
  contents: write
  actions: read

concurrency:
  group: rtk-actions-index
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0

      - name: Capture recent RTK Actions runs without a manual name allowlist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p research/runtime
          python3 - <<'PY'
          import datetime
          import json
          import os
          import subprocess

          repo=os.environ['GITHUB_REPOSITORY']
          raw=subprocess.check_output(
              ['gh','api',f'repos/{repo}/actions/runs?per_page=100'],
              text=True,
          )
          data=json.loads(raw)

          # Architecture rule: research workflows are discovered by the stable
          # RTK name prefix.  Do not maintain a fragile hard-coded allowlist;
          # new B4/B9/B10/C8/home workflows must appear automatically.
          rows=[]
          for r in data.get('workflow_runs',[]):
              name=str(r.get('name') or '')
              if not name.startswith('RTK '):
                  continue
              rows.append({
                  k:r.get(k) for k in (
                      'id','name','display_title','workflow_id','run_number',
                      'run_attempt','event','status','conclusion','head_branch',
                      'head_sha','created_at','updated_at','html_url'
                  )
              })

          out={
              'schema':'RTK_ACTIONS_INDEX_V2',
              'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'repository':repo,
              'selection':'all recent workflow runs whose name starts with RTK ',
              'api_window':100,
              'runs':rows,
          }
          open('research/runtime/actions_index.json','w').write(
              json.dumps(out,indent=2,sort_keys=True)+'\n'
          )
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Commit index to research branch
        run: |
          set -euo pipefail
          git config user.name 'rtk-actions-index'
          git config user.email 'actions@users.noreply.github.com'
          git add research/runtime/actions_index.json
          if git diff --cached --quiet; then
            echo 'No index change'
          else
            git commit -m 'Update RTK Actions runtime index v2'
            git pull --rebase origin rtk-class-build
            git push origin HEAD:rtk-class-build
          fi
