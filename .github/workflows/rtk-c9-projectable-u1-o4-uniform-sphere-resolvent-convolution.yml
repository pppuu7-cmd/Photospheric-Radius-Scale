name: RTK C9 projectable O4 uniform-sphere resolvent convolution

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c9-projectable-u1-o4-uniform-sphere-resolvent-convolution-trigger.txt'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install pinned numerical runtime
        run: python -m pip install --disable-pip-version-check 'numpy==2.5.2'
      - name: Run heavy O4 uniform-sphere convolution scan
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/c9_projectable_u1_o4_uniform_sphere_resolvent_convolution_scan.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee c9_projectable_u1_o4_uniform_sphere_resolvent_convolution_provenance.txt
          python3 rtk/c9_projectable_u1_o4_uniform_sphere_resolvent_convolution_scan.py | tee c9_projectable_u1_o4_uniform_sphere_resolvent_convolution.log
          grep -q '^RTK_C9_PROJECTABLE_U1_O4_UNIFORM_SPHERE_RESOLVENT_CONVOLUTION_SCAN_COMPLETE ' c9_projectable_u1_o4_uniform_sphere_resolvent_convolution.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c9-projectable-u1-o4-uniform-sphere-resolvent-convolution
          path: |
            c9_projectable_u1_o4_uniform_sphere_resolvent_convolution.log
            c9_projectable_u1_o4_uniform_sphere_resolvent_convolution_scan_result.json
            c9_projectable_u1_o4_uniform_sphere_resolvent_convolution_provenance.txt
            rtk/c9_projectable_u1_o4_uniform_sphere_resolvent_convolution_scan.py
          if-no-files-found: error
