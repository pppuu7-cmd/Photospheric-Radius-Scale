name: RTK Route-B U1 elliptic compensator Dirac projection

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-elliptic-compensator-dirac-projection-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Require frozen canonical parent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/RTK_U1_ELLIPTIC_MATTER_COMPENSATOR_CANONICAL_v1.json'))
          assert t['status']=='FROZEN_BEFORE_FULL_COUPLED_DIRAC'
          assert t['parent_canonical_run_id']==32597148540
          print('ELLIPTIC_CANONICAL_PARENT_PASS')
          PY
      - name: Run exact auxiliary Dirac projection
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_elliptic_compensator_dirac_projection_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_elliptic_compensator_dirac_projection_provenance.txt
          python3 rtk/route_b_u1_elliptic_compensator_dirac_projection_gate.py | tee u1_elliptic_compensator_dirac_projection.log
          grep -q '^RTK_ROUTE_B_U1_ELLIPTIC_COMPENSATOR_DIRAC_PROJECTION_PASS ' u1_elliptic_compensator_dirac_projection.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_elliptic_compensator_dirac_projection_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_ELLIPTIC_COMPENSATOR_DIRAC_PROJECTION_PASS'
          assert r['auxiliary_physical_dof_count'].startswith('0:')
          assert 'J_A^(g)-a1_eff H0' in r['projected_constraints']['Jhat']
          print('U1_ELLIPTIC_DIRAC_PROJECTION_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-elliptic-compensator-dirac-projection
          path: |
            u1_elliptic_compensator_dirac_projection.log
            u1_elliptic_compensator_dirac_projection_result.json
            u1_elliptic_compensator_dirac_projection_provenance.txt
            research/RTK_U1_ELLIPTIC_MATTER_COMPENSATOR_CANONICAL_v1.json
            rtk/route_b_u1_elliptic_compensator_dirac_projection_gate.py
          if-no-files-found: error
