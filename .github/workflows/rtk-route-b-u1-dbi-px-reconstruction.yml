name: RTK Route-B U1 DBI P(X) reconstruction

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-dbi-px-reconstruction-trigger.txt'

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run exact P(X) reconstruction
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_dbi_px_reconstruction_gate.py
          python3 rtk/route_b_u1_dbi_px_reconstruction_gate.py | tee u1_dbi_px_reconstruction.log
          grep -q 'RTK_ROUTE_B_U1_DBI_PX_RECONSTRUCTION_PASS' u1_dbi_px_reconstruction.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_dbi_px_reconstruction_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_DBI_PX_RECONSTRUCTION_PASS'
          assert 'P=p_production' in r['exact_checks']
          print('U1_DBI_PX_RECONSTRUCTION_ARTIFACT_ASSERTIONS_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rtk-route-b-u1-dbi-px-reconstruction
          path: |
            u1_dbi_px_reconstruction.log
            u1_dbi_px_reconstruction_result.json
          if-no-files-found: error
