name: RTK C9 intended scalar DBI derivative edge

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c9-rtk-scalar-dbi-derivative-edge-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run exact DBI derivative-edge theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/c9_rtk_scalar_dbi_derivative_edge_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee c9_rtk_scalar_dbi_derivative_edge_provenance.txt
          python3 rtk/c9_rtk_scalar_dbi_derivative_edge_gate.py | tee c9_rtk_scalar_dbi_derivative_edge.log
          grep -q '^RTK_C9_RTK_SCALAR_DBI_DERIVATIVE_EDGE_PASS ' c9_rtk_scalar_dbi_derivative_edge.log
          python3 - <<'PY'
          import json
          r=json.load(open('c9_rtk_scalar_dbi_derivative_edge_result.json'))
          assert r['classification']=='RTK_C9_RTK_SCALAR_DBI_DERIVATIVE_EDGE_PASS'
          assert '5/2' in r['edge_relation']
          assert 'finite a>0' in r['production_edge_identity']
          assert r['status_scope']=='GREEN_EXACT_DBI_DERIVATIVES_AND_EDGE_SCALING_UNITARITY_CUTOFF_PENDING'
          print('C9_RTK_SCALAR_DBI_DERIVATIVE_EDGE_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c9-rtk-scalar-dbi-derivative-edge
          path: |
            c9_rtk_scalar_dbi_derivative_edge.log
            c9_rtk_scalar_dbi_derivative_edge_result.json
            c9_rtk_scalar_dbi_derivative_edge_provenance.txt
            rtk/c9_rtk_scalar_dbi_derivative_edge_gate.py
          if-no-files-found: error
