name: RTK current-center standard-siren prediction

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-post-axis-diagnostics-trigger.txt'

permissions:
  contents: read

jobs:
  standard-siren:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      RTK_NUMPY_VERSION: '2.5.2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1

      - name: Require axis-certified current RTK center
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          s=json.load(open('research/state/current.json'))
          a=s['rtk'].get('axis_result')
          assert isinstance(a,dict), 'axis_result missing'
          assert a.get('center')==s['rtk']['accepted_center'], 'axis center != accepted center'
          assert a.get('objective')==s['objective']['name'], 'axis objective mismatch'
          assert float(a.get('best_improvement_eff',1e99))<=float(s['objective']['recenter_tolerance_S'])
          print('RTK_STANDARD_SIREN_AXIS_CERTIFIED_CENTER_PASS', (s['rtk'].get('axis_run') or {}).get('run_id'))
          PY

      - name: Prepare pinned hardened RTK CLASS tree
        run: |
          set -euo pipefail
          echo "RTK_SOURCE_SHA=$(git rev-parse HEAD)" | tee standard_siren_provenance.txt
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_public
          git -C class_public reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          test "$(git -C class_public rev-parse HEAD)" = "$RTK_CLASS_UPSTREAM_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_nonlocal_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          grep -q 'pba->V_prime_ini_nlde = 0.;' class_public/source/input.c
          python3 - <<'PY'
          from pathlib import Path
          s=Path('class_public/source/perturbations.c').read_text()
          assert 'else if (pba->model == 2.)' in s
          assert '3.*(pba->H0)*(pba->H0)*(pba->gnl)*(ppw->pvecback[pba->index_bg_V_nlde])' in s
          print('RTK_MODEL2_TENSOR_FRICTION_SOURCE_CONFIRMED')
          PY
          cp rtk/gw_standard_siren_current_center.py class_public/

      - name: Build CLASS and install parser dependency
        run: |
          set -euo pipefail
          make -C class_public -j2 class
          python3 -m pip install --disable-pip-version-check "numpy==$RTK_NUMPY_VERSION"
          python3 - <<'PY'
          import numpy, os
          assert numpy.__version__ == os.environ['RTK_NUMPY_VERSION']
          PY

      - name: Generate state-driven current-center background input
        run: |
          set -euo pipefail
          mkdir -p class_public/output
          python3 - <<'PY'
          import json, pathlib
          s=json.load(open('research/state/current.json'))
          p=s['rtk']['accepted_center']
          text=f'''h = {p['h']!r}
          T_cmb = 2.7255
          Omega_b = {p['Ob']!r}
          Omega_khronon = {p['Om']!r}
          lambda_D = {p['lam']!r}
          Omega_Lambda = 0.
          model = 2.
          N_ur = 3.046
          N_ncdm = 0
          Omega_k = 0.
          Omega_fld = 0.
          Omega_scf = 0.
          recombination = RECFAST
          reio_parametrization = reio_camb
          z_reio = {p['zre']!r}
          gauge = newtonian
          A_s = {p['As']!r}
          n_s = {p['ns']!r}
          root = output/rtk_gw_
          write background = yes
          background_verbose = 1
          thermodynamics_verbose = 0
          perturbations_verbose = 0
          output_verbose = 1
          '''
          pathlib.Path('class_public/rtk_gw_current.ini').write_text(text)
          pathlib.Path('standard_siren_state.json').write_text(json.dumps({
              'state_iteration':s.get('iteration'),
              'objective':s['objective']['name'],
              'center':p,
              'axis_run_id':(s['rtk'].get('axis_run') or {}).get('run_id'),
          },indent=2,sort_keys=True)+'\n')
          PY

      - name: Solve RTK background and compute standard-siren ratio
        working-directory: class_public
        run: |
          set -euo pipefail
          ./class rtk_gw_current.ini > ../standard_siren_class.log 2>&1
          grep 'RTK_LOG_GAMMA_ROOT' ../standard_siren_class.log | tail -1 | tee ../standard_siren_gamma.txt
          python3 - <<'PY'
          import json, re, subprocess
          p=json.load(open('../standard_siren_state.json'))['center']
          line=open('../standard_siren_gamma.txt').read()
          m=re.search(r'gamma=([0-9.eE+\-]+)',line)
          if not m: raise SystemExit('gamma parse failed')
          H0=100.0*float(p['h'])/299792.458
          subprocess.run([
              'python3','gw_standard_siren_current_center.py',
              '--background','output/rtk_gw_background.dat',
              '--gamma',m.group(1),'--H0',repr(H0),
              '--output','../standard_siren.json'],check=True)
          PY
          python3 - <<'PY'
          import json, math
          s=json.load(open('../standard_siren.json'))
          assert s['classification']=='RTK_CURRENT_CENTER_STANDARD_SIREN_PREDICTION'
          assert s['c_gw_over_c']==1.0
          z0=s['targets'][0]
          assert z0['z']==0.0 and abs(z0['dL_gw_over_dL_em']-1.0)<1e-12
          assert all(math.isfinite(r['dL_gw_over_dL_em']) and r['dL_gw_over_dL_em']>0 for r in s['targets'])
          print('RTK_STANDARD_SIREN_FAIL_CLOSED_CHECKS_PASS')
          PY
          cat ../standard_siren.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-current-standard-siren
          path: |
            standard_siren.json
            standard_siren_state.json
            standard_siren_provenance.txt
            standard_siren_class.log
            standard_siren_gamma.txt
            class_public/rtk_gw_current.ini
            class_public/output/rtk_gw_background.dat
          if-no-files-found: error
