name: RTK C10.65s5e next-k multibranch trajectory-sampled constraints
on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths: ['research/triggers/RTK_C10_65S5E_TRIGGER_v1.txt']
permissions: {contents: write, actions: read}
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with: {ref: rtk-class-build, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.3'}
      - name: Install frozen-analysis dependency
        run: python3 -m pip install 'mpmath==1.3.0'
      - name: Verify frozen parents branches times and bounds
        run: |
          set -euo pipefail
          git rev-parse HEAD > s5e_head.txt
          python3 - <<'PY'
          import json
          L=lambda p:json.load(open(p))
          t=L('research/theory_targets/RTK_C10_65S5E_NEXT_K_MULTIBRANCH_TRAJECTORY_SAMPLED_CONSTRAINT_TARGET_v1.json')
          d=L('research/theory_results/RTK_C10_65S5D_NEXT_K_MULTIBRANCH_ONE_STEP_PRODUCTION_CANARY_RESULT_v1.json')
          c=L('research/theory_results/RTK_C10_65S5C_NEXT_K_OMITTED_ORDER_SENSITIVITY_RESULT_v1.json')
          s=L('research/theory_results/RTK_C10_65S3B_TRAJECTORY_SAMPLED_CONSTRAINT_RESULT_v1.json')
          e=L('research/theory_results/RTK_C10_65S2E_CURRENT_STATE_DERIVATIVE_SLIP_CLOSURE_RESULT_v1.json')
          assert t['status']=='FROZEN_BEFORE_IMPLEMENTATION'
          assert d['classification']==t['parents']['C10.65s5d'];assert c['classification']==t['parents']['C10.65s5c'];assert s['classification']==t['parents']['C10.65s3b_method'];assert e['classification']==t['parents']['C10.65s2e_historical']
          assert [x['id'] for x in t['domain']['branches']]==['baseline','joint_extremum','phi_extremum']
          assert t['sample_elapsed_tau_Mpc']==[1e-9,3e-9,1e-8,3e-8,1e-7,3e-7,1e-6]
          assert t['constraint_policy']['max_abs_normalized_each_sample']==1e-10
          assert t['constraint_policy']['max_abs_normalized_change_from_onset']==1e-10
          assert t['domain']['k_Mpc_inv']==0.01 and t['threshold_changed'] is False
          print('C10_65S5E_FROZEN_CONTRACT_VERIFIED')
          PY
      - name: Prepare pinned control and three fixed branch trees
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_control
          git -C class_control reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_control/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_control/include/
          for x in apply_rtk_class_patch.py upgrade_rtk_inputs.py upgrade_rtk_nonlocal_initial_conditions.py upgrade_rtk_initial_conditions.py upgrade_rtk_matter_sources.py upgrade_rtk_gamma_root.py upgrade_rtk_spectra_endpoint.py apply_rtk_c10_source_export_patch.py apply_rtk_c10_65a_species_control_patch.py apply_rtk_c10_65e_tca_coefficient_export_patch.py apply_rtk_c10_65r0_opt_in_local_environment_export_patch.py apply_rtk_c10_65r1_in_class_completed_projector_parity_patch.py stabilize_rtk_c10_65r1_conditioned_projector.py; do python3 "rtk/$x" class_control; done
          make -C class_control -j2 class
          for b in baseline joint_extremum phi_extremum; do
            cp -a class_control "class_$b"
            python3 rtk/apply_rtk_c10_65s2_production_canary_patch_v3.py "class_$b"
            python3 rtk/apply_rtk_c10_65s5d_branch_seed_patch.py "class_$b" "$b"
            grep -q 'static const s2seed S\[1\]' "class_$b/source/rtk_c10_65s2_class_bridge.c"
            grep -q 'for(i=0;i<1;i++)' "class_$b/source/rtk_c10_65s2_class_bridge.c"
            make -C "class_$b" clean
            make -C "class_$b" -j2 class
          done
      - name: Write frozen k=0.01 inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          L=lambda p:json.load(open(p));t=L('research/theory_targets/RTK_C10_65S5E_NEXT_K_MULTIBRANCH_TRAJECTORY_SAMPLED_CONSTRAINT_TARGET_v1.json');p=L('research/state/current.json')['final_replay_result']['rtk']['params'];d=t['domain'];k=float(d['k_Mpc_inv'])
          common=f'''h = {p['h']!r}\nT_cmb = 2.7255\nOmega_b = {p['Ob']!r}\nOmega_khronon = {p['Om']!r}\nlambda_D = {p['lam']!r}\nOmega_Lambda = 0.\nmodel = 2.\nN_ur = 3.046\nN_ncdm = 0\nOmega_k = 0.\nOmega_fld = 0\nOmega_scf = 0\nrecombination = RECFAST\nreio_parametrization = reio_camb\nz_reio = {p['zre']!r}\noutput = mPk,dTk,vTk\ngauge = newtonian\nA_s = {p['As']!r}\nn_s = {p['ns']!r}\nP_k_max_1/Mpc = 0.0101\nz_pk = 0\nk_output_values = {k:.17g}\nwrite parameters = no\nbackground_verbose = 0\nperturbations_verbose = 0\nspectra_verbose = 0\nevolver = 0\nl_max_ur = 17\nc10_65r0_diag = 0\nc10_65r1_diag = 0\nc10_65r1_lambda_HL = {float(d['lambda_HL']):.17g}\nc10_65r1_Mc = {float(d['M_c_Mpc_inv']):.17g}\n'''
          pathlib.Path('class_control/output').mkdir(exist_ok=True);pathlib.Path('class_control/control.ini').write_text(common+'root = output/control_\n')
          extra=f'''c10_65s2_lambda_HL = {float(d['lambda_HL']):.17g}\nc10_65s2_Mc = {float(d['M_c_Mpc_inv']):.17g}\nc10_65s2_a_on = {float(d['a_on']):.17g}\n'''
          for b in ['baseline','joint_extremum','phi_extremum']:
            q=pathlib.Path('class_'+b);(q/'output').mkdir(exist_ok=True);(q/'off.ini').write_text(common+'c10_65s2_canary = 0\n'+extra+'root = output/off_\n');(q/'on.ini').write_text(common+'c10_65s2_canary = 1\n'+extra+'root = output/on_\n')
          PY
      - name: Verify exact dormant OFF rollback every branch
        run: |
          set -euo pipefail
          (cd class_control && ./class control.ini)>s5e_control.log 2>&1
          python3 - <<'PY'
          import glob,hashlib,json,pathlib,subprocess,os
          def dig(p):return hashlib.sha256(('\n'.join(x.strip() for x in pathlib.Path(p).read_text().splitlines() if x.strip() and not x.lstrip().startswith('#'))+'\n').encode()).hexdigest()
          A=glob.glob('class_control/output/control_*perturbations*');assert len(A)==1,A;ref=dig(A[0]);records=[];ok=True
          for b in ['baseline','joint_extremum','phi_extremum']:
            with open(f's5e_off_{b}.log','w') as h:subprocess.run(['./class','off.ini'],cwd='class_'+b,stdout=h,stderr=subprocess.STDOUT,check=True,env={k:v for k,v in os.environ.items() if k!='RTK_C10_65S2_OBSERVER_FILE'})
            B=glob.glob(f'class_{b}/output/off_*perturbations*');assert len(B)==1,B;sha=dig(B[0]);z=sha==ref;ok &= z;records.append({'branch':b,'control_sha256':ref,'off_sha256':sha,'identical':z})
          pathlib.Path('s5e_off_identity.json').write_text(json.dumps({'all_branches_identical':bool(ok),'records':records},indent=2,sort_keys=True)+'\n');assert ok
          PY
      - name: Recover s5d parent observers
        run: |
          set -euo pipefail
          mkdir -p s5d_parent
          gh run download 33023782012 --repo pppuu7-cmd/Photospheric-Radius-Scale --name rtk-c10-65s5d-next-k-multibranch-one-step-production-canary --dir s5d_parent
          for b in baseline joint_extremum phi_extremum;do test -s "s5d_parent/s5d_observers/$b.csv";done
      - name: Execute seven frozen endpoints for each fixed branch
        run: |
          set -euo pipefail
          mapfile -t widths < <(python3 - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_65S5E_NEXT_K_MULTIBRANCH_TRAJECTORY_SAMPLED_CONSTRAINT_TARGET_v1.json'))
          for x in t['sample_elapsed_tau_Mpc']:print(format(float(x),'.17g'))
          PY
          )
          test "${#widths[@]}" -eq 7
          mkdir -p s5e_observers
          printf '[\n' > s5e_manifest.json
          n=0
          for b in baseline joint_extremum phi_extremum;do
            for w in "${widths[@]}";do
              python3 rtk/apply_rtk_c10_65s5e_sample_interval_patch.py "class_$b" --width "$w" </dev/null
              make -C "class_$b" -j2 class </dev/null >/dev/null
              f="$(pwd)/s5e_observers/${b}_${n}.csv";rm -f "$f"
              (cd "class_$b" && RTK_C10_65S2_OBSERVER_FILE="$f" ./class on.ini </dev/null)>"s5e_on_${b}_${n}.log" 2>&1
              test -s "$f"
              [ "$n" -eq 0 ] || printf ',\n' >> s5e_manifest.json
              printf '{"branch":"%s","width":%.17g,"observer":"%s"}' "$b" "$w" "$f" >> s5e_manifest.json
              n=$((n+1))
            done
          done
          printf '\n]\n' >> s5e_manifest.json
          python3 - <<'PY'
          import json,glob
          m=json.load(open('s5e_manifest.json'));assert len(m)==21;assert len(glob.glob('s5e_observers/*.csv'))==21
          print('C10_65S5E_21_ENDPOINT_MANIFEST_PASS')
          PY
      - name: Analyze frozen s5e trajectory samples
        run: |
          set -euo pipefail
          python3 research/shadow/rtk_c10_65s5e_multibranch_trajectory_sample_analyzer.py --manifest s5e_manifest.json --s5d-parent-dir s5d_parent --off-identity s5e_off_identity.json --patch rtk/apply_rtk_c10_65s5e_sample_interval_patch.py --bridge-root . --output research/theory_results/RTK_C10_65S5E_NEXT_K_MULTIBRANCH_TRAJECTORY_SAMPLED_CONSTRAINT_RESULT_v1.json | tee s5e.log
      - name: Add immutable provenance
        if: always()
        run: |
          set -euo pipefail
          p=research/theory_results/RTK_C10_65S5E_NEXT_K_MULTIBRANCH_TRAJECTORY_SAMPLED_CONSTRAINT_RESULT_v1.json;[ -f "$p" ] || exit 0
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          p=pathlib.Path('research/theory_results/RTK_C10_65S5E_NEXT_K_MULTIBRANCH_TRAJECTORY_SAMPLED_CONSTRAINT_RESULT_v1.json');d=json.loads(p.read_text());d['provenance']={'repo_head_at_job_start':pathlib.Path('s5e_head.txt').read_text().strip(),'class_upstream_sha':os.environ['RTK_CLASS_UPSTREAM_SHA'],'workflow':'rtk-c10-65s5e-next-k-multibranch-trajectory-sampling.yml','github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'sample_interval_patch':'rtk/apply_rtk_c10_65s5e_sample_interval_patch.py','analyzer':'research/shadow/rtk_c10_65s5e_multibranch_trajectory_sample_analyzer.py','base_production_patch':'rtk/apply_rtk_c10_65s2_production_canary_patch_v3.py','branch_patch':'rtk/apply_rtk_c10_65s5d_branch_seed_patch.py','s5d_parent_run_id':33023782012,'s3b_method_parent':'C10_65S3B_TRAJECTORY_SAMPLED_CONSTRAINT_PASS_SCOPED','observer_hashes':[hashlib.sha256(x.read_bytes()).hexdigest() for x in sorted(pathlib.Path('s5e_observers').glob('*.csv'))],'threshold_changed':False};p.write_text(json.dumps(d,indent=2,sort_keys=True,allow_nan=False)+'\n')
          PY
      - name: Persist result and checkpoint
        if: always()
        run: |
          set -euo pipefail
          p=research/theory_results/RTK_C10_65S5E_NEXT_K_MULTIBRANCH_TRAJECTORY_SAMPLED_CONSTRAINT_RESULT_v1.json;[ -f "$p" ] || exit 0
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('research/theory_results/RTK_C10_65S5E_NEXT_K_MULTIBRANCH_TRAJECTORY_SAMPLED_CONSTRAINT_RESULT_v1.json');d=json.loads(p.read_text());c=pathlib.Path('research/checkpoints/RTK_C10_65S5E_MULTIBRANCH_TRAJECTORY_RESULT_2026-08-27T0250Z.md');c.write_text(f"# RTK C10.65s5e multibranch sampled trajectory result\n\nClassification: `{d['classification']}`.\n\nAt k=0.01 Mpc^-1, the three prospectively frozen C10.65s5d branches were each sampled at seven independently restarted elapsed times from 1e-9 to 1e-6 Mpc. Maximum absolute normalized A/H/M/T residual: `{d['max_abs_normalized_constraint']:.17e}`; maximum normalized change from onset: `{d['max_abs_normalized_constraint_change']:.17e}`; frozen bound: `{d['frozen_bound']:.17e}`. Thresholds were not changed.\n\nThe s5c omitted-order envelope remains a non-probabilistic pointwise stress test. This is sampled finite-short-trajectory evidence only, not a continuous-time supremum, long-time stability, UV matching derivation, broad-k validation, or spectra/likelihood evidence.\n")
          PY
          cp "$p" /tmp/s5e_r.json;cp research/checkpoints/RTK_C10_65S5E_MULTIBRANCH_TRAJECTORY_RESULT_2026-08-27T0250Z.md /tmp/s5e_c.md
          for n in 1 2 3 4 5;do git fetch origin rtk-class-build;git reset --hard origin/rtk-class-build;cp /tmp/s5e_r.json "$p";cp /tmp/s5e_c.md research/checkpoints/RTK_C10_65S5E_MULTIBRANCH_TRAJECTORY_RESULT_2026-08-27T0250Z.md;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add "$p" research/checkpoints/RTK_C10_65S5E_MULTIBRANCH_TRAJECTORY_RESULT_2026-08-27T0250Z.md;git commit -m 'Record C10.65s5e multibranch trajectory result' || exit 0;git push origin HEAD:rtk-class-build && exit 0;done;exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c10-65s5e-next-k-multibranch-trajectory-sampling
          path: |
            s5e_manifest.json
            s5e_observers/*.csv
            s5e_*.log
            s5e_off_identity.json
            research/theory_results/RTK_C10_65S5E_NEXT_K_MULTIBRANCH_TRAJECTORY_SAMPLED_CONSTRAINT_RESULT_v1.json
      - name: Enforce scientific classification
        if: always()
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('research/theory_results/RTK_C10_65S5E_NEXT_K_MULTIBRANCH_TRAJECTORY_SAMPLED_CONSTRAINT_RESULT_v1.json'));assert d['checks']['threshold_changed'] is False;assert d['classification']=='C10_65S5E_NEXT_K_MULTIBRANCH_TRAJECTORY_SAMPLED_CONSTRAINT_PASS_SCOPED',d
          print(d['classification'])
          PY
