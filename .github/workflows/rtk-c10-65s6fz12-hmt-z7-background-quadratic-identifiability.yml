name: RTK C10.65s6fZ12 HMT Z7 background quadratic identifiability

on:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/rtk-c10-65s6fz12-hmt-z7-background-quadratic-identifiability-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - name: Verify frozen target and parent
        run: |
          python - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_65S6FZ12_HMT_Z7_BACKGROUND_QUADRATIC_IDENTIFIABILITY_TARGET_v1.json'))
          p=json.load(open('research/theory_results/RTK_C10_65S6FZ11_FIXED_PROJECTABLE_U1_ACTION_SCALAR_DOF_PREFLIGHT_RESULT_v1.json'))
          assert p['classification']==t['parent_required']
          assert t['threshold_changed'] is False
          assert t['soft_s_retest_allowed'] is False
          assert t['production_k003_unblocked'] is False
          assert len(t['required_same_action_inputs_for_match_ready']) >= 5
          PY
      - name: Run frozen background-quadratic identifiability audit
        run: python research/shadow/rtk_c10_65s6fz12_hmt_z7_background_quadratic_identifiability.py
      - name: Verify result semantics
        run: |
          python - <<'PY'
          import json
          r=json.load(open('research/theory_results/RTK_C10_65S6FZ12_HMT_Z7_BACKGROUND_QUADRATIC_IDENTIFIABILITY_RESULT_v1.json'))
          assert r['classification'] in {
            'C10_65S6FZ12_BACKGROUND_QUADRATIC_MATCH_READY_PASS_SCOPED',
            'C10_65S6FZ12_BACKGROUND_QUADRATIC_UNDERSPECIFIED_BLOCKED_SCOPED'}
          assert r['checks']['z11_parent_exact'] is True
          assert r['checks']['no_posthoc_matching_performed'] is True
          assert r['checks']['no_soft_s_or_k003'] is True
          assert r['checks']['threshold_unchanged'] is True
          assert r['threshold_changed'] is False
          assert r['soft_s_retest_allowed'] is False
          assert r['production_k003_unblocked'] is False
          if r['classification'].endswith('UNDERSPECIFIED_BLOCKED_SCOPED'):
              assert r['source_lock']['missing_required_inputs']
              assert r['checks']['finite_k_quadratic_kernels_differ'] or r['checks']['background_equations_differ']
          PY
      - name: Persist provenance and checkpoint
        run: |
          RUN_ID='${{ github.run_id }}' RUN_ATTEMPT='${{ github.run_attempt }}' HEAD_SHA='${{ github.sha }}' python - <<'PY'
          import json,os,datetime,pathlib
          rp=pathlib.Path('research/theory_results/RTK_C10_65S6FZ12_HMT_Z7_BACKGROUND_QUADRATIC_IDENTIFIABILITY_RESULT_v1.json')
          r=json.loads(rp.read_text())
          r['provenance']={
            'github_actions_run_id':int(os.environ['RUN_ID']),
            'github_actions_run_attempt':int(os.environ['RUN_ATTEMPT']),
            'trigger_head_sha':os.environ['HEAD_SHA'],
            'workflow':'rtk-c10-65s6fz12-hmt-z7-background-quadratic-identifiability.yml',
            'threshold_changed':False}
          rp.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          d=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H%MZ')
          cp=pathlib.Path(f'research/checkpoints/RTK_C10_65S6FZ12_HMT_Z7_BACKGROUND_QUADRATIC_IDENTIFIABILITY_{d}.md')
          cp.write_text(
            '# RTK C10.65s6fZ12 checkpoint\n\n'
            'Classification: `'+r['classification']+'`.\n\n'
            +r['interpretation']+'\n\n'
            +'Missing same-action inputs: '+', '.join(r['source_lock']['missing_required_inputs'])+'.\n\n'
            +'Frozen guards remain: no soft-s retest and no k=0.03 production.\n\n'
            +'Next: '+r['next_gate']+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C10_65S6FZ12_HMT_Z7_BACKGROUND_QUADRATIC_IDENTIFIABILITY_RESULT_v1.json research/checkpoints/
          git commit -m 'Record C10.65s6fZ12 background quadratic identifiability audit'
          git push origin HEAD:rtk-class-build
