name: RTK C9 HMT lambda1 S3 reduced scalar FS block
on:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/rtk-c9-hmt-lambda1-s3-reduced-scalar-fs-block-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen target ancestry
        run: |
          git cat-file -e a2b81b7808cf4928bef5ae9e000d6c2b18a94adc^{commit}
          git merge-base --is-ancestor a2b81b7808cf4928bef5ae9e000d6c2b18a94adc HEAD
      - name: Run exact reduced scalar FS-block audit
        run: python research/shadow/rtk_c9_hmt_lambda1_s3_reduced_scalar_fs_block.py
      - name: Verify scoped semantics
        run: |
          python - <<'PY'
          import json
          p='research/theory_results/RTK_C9_HMT_LAMBDA1_S3_REDUCED_SCALAR_FS_BLOCK_RESULT_v1.json'
          d=json.load(open(p))
          f=d['findings']
          assert d['classification'].endswith('PASS_SCOPED')
          assert d['target_frozen_commit']=='a2b81b7808cf4928bef5ae9e000d6c2b18a94adc'
          assert f['ell1_four_dimensional_gauge_sector_projected_out']
          assert not f['reduced_scalar_C12_has_remaining_zero_modes']
          assert f['ell0_eigenvalue_negative_but_nonzero']
          assert f['ell_ge2_eigenvalues_positive']
          assert f['reduced_scalar_C12_block_nondegenerate']
          assert f['FS_2x2_mode_determinant_is_mu_squared']
          assert f['FS_2x2_mode_determinant_positive_on_reduced_domain']
          assert not f['regularized_scalar_FS_determinant_computed']
          assert not f['full_HMT_gauge_fixed_constraint_matrix_constructed']
          assert not f['complete_zero_mode_quotient_constructed']
          assert not f['full_FS_determinant_computed']
          assert not f['full_HMT_one_loop_evaluable']
          assert not f['full_C9_closed']
          assert not f['ordinary_projectable_parent_beta_functions_imported']
          assert not f['unresolved_HMT_matter_coefficients_chosen']
          assert not f['soft_s_retest_allowed']
          assert not f['production_k003_unblocked']
          assert not f['threshold_changed']
          assert f['no_DSIR']
          assert not d['diagnostic_only']['is_regularized_determinant']
          PY
      - name: Persist result checkpoint provenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C9_HMT_LAMBDA1_S3_REDUCED_SCALAR_FS_BLOCK_RESULT_v1.json research/checkpoints/RTK_C9_HMT_LAMBDA1_S3_REDUCED_SCALAR_FS_BLOCK_2026-08-28.md research/provenance/RTK_C9_HMT_LAMBDA1_S3_REDUCED_SCALAR_FS_BLOCK_PROVENANCE_v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record C9 HMT lambda=1 S3 reduced scalar FS block audit'
            git push origin HEAD:rtk-class-build
          fi
