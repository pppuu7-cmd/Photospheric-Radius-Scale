name: RTK C9 HMT lambda1 S3 ell1 gauge classification
on:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/rtk-c9-hmt-lambda1-s3-ell1-gauge-classification-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact ell1 gauge-classification audit
        run: python research/shadow/rtk_c9_hmt_lambda1_s3_ell1_gauge_classification.py
      - name: Verify scoped semantics
        run: |
          python - <<'PY'
          import json
          p='research/theory_results/RTK_C9_HMT_LAMBDA1_S3_ELL1_GAUGE_CLASSIFICATION_RESULT_v1.json'
          d=json.load(open(p))
          f=d['findings']
          assert d['classification'].endswith('PASS_SCOPED')
          assert f['every_scalar_ell1_conformal_zero_mode_in_frozen_block_is_tangent_to_spatial_diffeomorphism_orbit']
          assert f['ell1_zero_modes_are_gauge_in_this_frozen_scalar_conformal_sector']
          assert not f['ell1_zero_modes_demonstrate_physical_second_class_rank_loss']
          assert not f['full_HMT_gauge_fixed_constraint_matrix_constructed']
          assert not f['complete_zero_mode_quotient_constructed']
          assert not f['full_FS_determinant_computed']
          assert not f['full_HMT_one_loop_evaluable']
          assert not f['full_C9_closed']
          assert not f['soft_s_retest_allowed']
          assert not f['production_k003_unblocked']
          assert not f['threshold_changed']
          assert f['no_DSIR']
          PY
      - name: Persist result checkpoint provenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C9_HMT_LAMBDA1_S3_ELL1_GAUGE_CLASSIFICATION_RESULT_v1.json research/checkpoints/RTK_C9_HMT_LAMBDA1_S3_ELL1_GAUGE_CLASSIFICATION_2026-08-28.md research/provenance/RTK_C9_HMT_LAMBDA1_S3_ELL1_GAUGE_CLASSIFICATION_PROVENANCE_v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record C9 HMT lambda=1 S3 ell=1 gauge classification'
            git push origin HEAD:rtk-class-build
          fi
