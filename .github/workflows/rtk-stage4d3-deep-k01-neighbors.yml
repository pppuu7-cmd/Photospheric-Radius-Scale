name: RTK Stage 4D3 deep k01 neighbors

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rtk-stage4d3-deep-k01-neighbors.yml'

jobs:
  refine:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - lambda_D: '20000'
            h: '0.6905139658249151'
            Ob: '0.046852024357501486'
            Om: '0.2530049948992043'
            As: '2.0663503910042617e-9'
            ns: '0.9641885967161564'
            zre: '6.767875445413517'
          - lambda_D: '25000'
            h: '0.6905176217813563'
            Ob: '0.046851717594118776'
            Om: '0.25301759148463693'
            As: '2.066522632792506e-9'
            ns: '0.9643648033328527'
            zre: '6.7725475162194355'
          - lambda_D: '40000'
            h: '0.6905577799581045'
            Ob: '0.0468426607343907'
            Om: '0.2529765872395884'
            As: '2.0664558473565713e-9'
            ns: '0.9642279965442674'
            zre: '6.769797936392963'
          - lambda_D: '60000'
            h: '0.6904938238202009'
            Ob: '0.04684091970802406'
            Om: '0.25303388038389657'
            As: '2.0663696342829795e-9'
            ns: '0.9643086405164835'
            zre: '6.7720746456624745'
          - lambda_D: '80000'
            h: '0.6905129506257679'
            Ob: '0.04684218789418541'
            Om: '0.2530054827261049'
            As: '2.0664325467603983e-9'
            ns: '0.9642878568076969'
            zre: '6.772414447298907'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
      - name: Prepare exact likelihood tree
        run: |
          git clone --depth 1 --branch nonlocal https://github.com/dirian/class_public.git class_public
          git clone --depth 1 https://github.com/dscolnic/Pantheon.git class_public/pantheon
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py class_public/joint_profile_runner.py
          cp rtk/prepare_inference_core.py class_public/prepare_inference_core.py
          cp rtk/stage4d1_cobyqa_refine.py class_public/stage4d1_cobyqa_refine.py
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
      - name: Build CLASS
        working-directory: class_public
        run: make -j2 class
      - name: Install likelihood dependencies
        run: python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' numpy scipy
      - name: Download Planck package
        working-directory: class_public
        run: |
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          mkdir planck_data
          tar -xzf planck.tar.gz -C planck_data
      - name: Run equal-depth k01 second pass
        working-directory: class_public
        run: |
          python3 stage4d1_cobyqa_refine.py planck_data '${{ matrix.lambda_D }}' k01 \
            '${{ matrix.h }}' '${{ matrix.Ob }}' '${{ matrix.Om }}' '${{ matrix.As }}' '${{ matrix.ns }}' '${{ matrix.zre }}' \
            | tee '../deep_k01_${{ matrix.lambda_D }}.log'
          grep -q STAGE4D1_COBYQA_PASS '../deep_k01_${{ matrix.lambda_D }}.log'
          cat output/stage4d1_cobyqa/k01/${{ matrix.lambda_D }}/cobyqa_summary.json || find output/stage4d1_cobyqa/k01 -name cobyqa_summary.json -exec cat {} \;
      - name: Upload deep-k01 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtk-stage4d3-deep-k01-${{ matrix.lambda_D }}
          path: |
            deep_k01_${{ matrix.lambda_D }}.log
            class_public/output/stage4d1_cobyqa/k01/**/cobyqa_summary.json
            class_public/output/stage4d1_cobyqa/k01/**/cobyqa_trace.csv
          if-no-files-found: error
