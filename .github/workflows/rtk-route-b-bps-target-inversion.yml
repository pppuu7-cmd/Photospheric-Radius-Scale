name: RTK Route-B BPS target inversion

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-bps-target-inversion-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Run exact BPS target inversion theorem
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
          python3 -m py_compile rtk/route_b_bps_target_inversion.py
          python3 rtk/route_b_bps_target_inversion.py | tee route_b_bps_target_inversion.log
          grep -q RTK_ROUTE_B_BPS_TARGET_INVERSION_PASS route_b_bps_target_inversion.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-bps-target-inversion
          path: route_b_bps_target_inversion.log
          if-no-files-found: warn
