name: RTK A5 LCDM B9-seed stationarity

on:
  workflow_dispatch:
    inputs:
      scale:
        description: 'Frozen stencil scale'
        required: true
        default: '1.0'
        type: choice
        options:
          - '1.0'
          - '0.5'

permissions:
  contents: write

concurrency:
  group: rtk-a5-lcdm-b9-seed-stationarity-${{ inputs.scale }}
  cancel-in-progress: false

jobs:
  stationarity:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '300'
      RTK_CACHE_KEY_VERSION: 'clean-room-exact-float-v2'
      RTK_A5_LCDM_STENCIL_SCALE: ${{ inputs.scale }}
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      RTK_PANTHEON_SHA: '7eb29dc87ba223b4ec8457cd3cccba1216c36fb7'
      RTK_PLANCK_SHA256: '0b73171e3acc671c28184466a45485a2d1c1d93676b832abdfe688c7b04024e6'
      RTK_NUMPY_VERSION: '2.5.2'
      RTK_SCIPY_VERSION: '1.18.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Verify conditional prerequisite and frozen target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          t=json.load(open('research/robustness/A5_LCDM_B9_SEED_STATIONARITY_TARGET_v1.json'))
          p=json.load(open(t['prerequisite']['result']))
          assert t['status']=='CONDITIONAL_PREREGISTRATION_BEFORE_CROSS_BASIN_REPLAY_RESULT'
          assert p['classification']==t['prerequisite']['required_classification']
          assert t['objective']=='matched-ultra-linstep2+dense-BOSS'
          assert t['recenter_tolerance_S']==0.005
          assert float(os.environ['RTK_A5_LCDM_STENCIL_SCALE']) in t['required_scales']
          print('A5_LCDM_B9_SEED_STATIONARITY_PRECONDITION_PASS')
          PY
          python3 -m py_compile rtk/a5_lcdm_b9_seed_stationarity.py rtk/prepare_inference_core.py
          git rev-parse HEAD | tee a5_lcdm_b9_seed_stationarity_source.txt

      - name: Build genuinely fresh pinned CLASS tree
        run: |
          set -euo pipefail
          rm -rf class_public
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_public
          git -C class_public reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          git clone https://github.com/dscolnic/Pantheon.git class_public/pantheon
          git -C class_public/pantheon reset --hard "$RTK_PANTHEON_SHA"
          test "$(git -C class_public rev-parse HEAD)" = "$RTK_CLASS_UPSTREAM_SHA"
          test "$(git -C class_public/pantheon rev-parse HEAD)" = "$RTK_PANTHEON_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_nonlocal_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py rtk/prepare_inference_core.py rtk/a5_lcdm_b9_seed_stationarity.py class_public/
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'A_s_ad\|n_s_ad' inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py
          grep -q 'RTK_PLANCK_DATA' inference_core.py

      - name: Build CLASS and install locked likelihood stack
        run: |
          set -euo pipefail
          make -C class_public -j2 class
          python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' "numpy==$RTK_NUMPY_VERSION" "scipy==$RTK_SCIPY_VERSION"
          python3 -m pip freeze | sort | tee a5_lcdm_b9_seed_stationarity_pip_freeze.txt

      - name: Download and verify official Planck baseline fresh
        working-directory: class_public
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          echo "$RTK_PLANCK_SHA256  planck.tar.gz" | sha256sum -c -
          mkdir planck_data && tar -xzf planck.tar.gz -C planck_data

      - name: Run exact stationarity Hessian
        working-directory: class_public
        run: |
          set -euo pipefail
          python3 a5_lcdm_b9_seed_stationarity.py | tee ../a5_lcdm_b9_seed_stationarity.log
          grep -q 'A5_LCDM_B9_SEED_STATIONARITY_HESSIAN_COMPLETE' ../a5_lcdm_b9_seed_stationarity.log
          scale_dir="$(python3 - <<'PY'
          import os
          print(f"{float(os.environ['RTK_A5_LCDM_STENCIL_SCALE']):g}")
          PY
          )"
          test -s "../output/a5_lcdm_b9_seed_stationarity/scale_${scale_dir}/summary.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-a5-lcdm-b9-seed-stationarity-${{ inputs.scale }}
          path: |
            a5_lcdm_b9_seed_stationarity.log
            a5_lcdm_b9_seed_stationarity_source.txt
            a5_lcdm_b9_seed_stationarity_pip_freeze.txt
            output/a5_lcdm_b9_seed_stationarity/
          if-no-files-found: warn

      - name: Persist exact stationarity result
        if: success()
        run: |
          set -euo pipefail
          safe_scale="${{ inputs.scale }}"
          scale_dir="$(python3 - <<'PY'
          import os
          print(f"{float(os.environ['RTK_A5_LCDM_STENCIL_SCALE']):g}")
          PY
          )"
          cp "output/a5_lcdm_b9_seed_stationarity/scale_${scale_dir}/summary.json" /tmp/a5_lcdm_stationarity.json
          git fetch origin rtk-class-build
          git reset --hard origin/rtk-class-build
          if [ "$safe_scale" = "1.0" ]; then
            dest='research/robustness/A5_LCDM_B9_SEED_BASE_RESULT_v1.json'
          else
            dest='research/robustness/A5_LCDM_B9_SEED_HALF_RESULT_v1.json'
          fi
          cp /tmp/a5_lcdm_stationarity.json "$dest"
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          scale=float(os.environ['RTK_A5_LCDM_STENCIL_SCALE'])
          path='research/robustness/A5_LCDM_B9_SEED_BASE_RESULT_v1.json' if scale==1.0 else 'research/robustness/A5_LCDM_B9_SEED_HALF_RESULT_v1.json'
          r=json.load(open(path))
          e=r['eff']
          decision=(
            'RECENTER_REQUIRED' if e['best_improvement']>r['recenter_tolerance_S'] else
            'RECENTER_CLEAR_PD' if e['positive_definite'] else
            'RECENTER_CLEAR_NONPD_RAYS_REQUIRED'
          )
          state={
            'schema':'A5_LCDM_B9_SEED_STATIONARITY_CURRENT_v1',
            'updated_utc':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'scale':scale,
            'decision':decision,
            'S_center':e['S_center'],
            'best_exact_S':e['best_exact_S'],
            'best_improvement':e['best_improvement'],
            'positive_definite':e['positive_definite'],
            'min_eigenvalue':min(e['eigenvalues_y']),
            'best_label':e['best_label'],
            'best_params':e['best_params'],
            'result':path,
            'recenter_tolerance_S':r['recenter_tolerance_S'],
            'warning':r['warning']
          }
          json.dump(state,open('research/state/A5_LCDM_cross_basin_stationarity_current.json','w'),indent=2,sort_keys=True)
          open('research/state/A5_LCDM_cross_basin_stationarity_current.json','a').write('\n')
          PY
          git config user.name 'rtk-a5-lcdm-stationarity'
          git config user.email 'actions@users.noreply.github.com'
          git add "$dest" research/state/A5_LCDM_cross_basin_stationarity_current.json
          git commit -m "Record A5 LCDM B9-seed stationarity scale ${safe_scale}"
          git push origin HEAD:rtk-class-build
