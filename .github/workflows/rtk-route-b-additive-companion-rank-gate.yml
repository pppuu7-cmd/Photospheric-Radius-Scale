name: RTK Route-B additive companion rank gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-additive-companion-rank-gate-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run additive companion rank theorem
        run: |
          set -euo pipefail
          echo "RTK_SOURCE_SHA=$(git rev-parse HEAD)" | tee rtk_additive_companion_rank_provenance.txt
          python -m py_compile rtk/route_b_additive_companion_rank_gate.py
          python rtk/route_b_additive_companion_rank_gate.py | tee rtk_additive_companion_rank.log
          grep -q '^RTK_ROUTE_B_ADDITIVE_COMPANION_RANK_GATE_PASS ' rtk_additive_companion_rank.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-additive-companion-rank-gate
          path: |
            rtk_additive_companion_rank.log
            rtk_additive_companion_rank_provenance.txt
          if-no-files-found: error
