name: RTK Stage 4D3 v6 recenter both

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rtk-stage4d3-v6-recenter-both.yml'

jobs:
  hessian:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {mapping: eff, scale: '1.0', expected: '1050.0475038880681'}
          - {mapping: eff, scale: '0.5', expected: '1050.0475038880681'}
          - {mapping: eff, scale: '0.25', expected: '1050.0475038880681'}
          - {mapping: k01, scale: '1.0', expected: '1050.0618892996533'}
          - {mapping: k01, scale: '0.5', expected: '1050.0618892996533'}
          - {mapping: k01, scale: '0.25', expected: '1050.0618892996533'}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '120'
      RTK_CACHE_KEY_VERSION: 'exact-float-v1'
      RTK_STATIONARITY_GRAD_TOL: '0.03'
      RTK_STATIONARITY_IMPROVEMENT_TOL: '0.005'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
      - name: Prepare exact likelihood tree
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch nonlocal https://github.com/dirian/class_public.git class_public
          git clone --depth 1 https://github.com/dscolnic/Pantheon.git class_public/pantheon
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py class_public/joint_profile_runner.py
          cp rtk/prepare_inference_core.py class_public/prepare_inference_core.py
          cp rtk/stage4d3_joint_stationarity.py class_public/stage4d3_joint_stationarity.py
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py
          ! grep -q 'A_s_ad\|n_s_ad' inference_core.py
      - name: Build CLASS
        working-directory: class_public
        run: make -j2 class
      - name: Install likelihood dependencies
        run: python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' numpy scipy
      - name: Download Planck package
        working-directory: class_public
        run: |
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          mkdir planck_data
          tar -xzf planck.tar.gz -C planck_data
      - name: Run strict multiscale stationarity at v6 Newton center
        shell: bash
        working-directory: class_public
        run: |
          set -o pipefail
          python3 stage4d3_joint_stationarity.py planck_data '${{ matrix.mapping }}' 287930.95430552866 \
            0.6904668858782219 0.046835996338062985 0.2530185206833107 \
            2.0836316905673827e-9 0.9644013704702473 7.218930610576525 \
            '${{ matrix.expected }}' '${{ matrix.scale }}' | tee '../v6_${{ matrix.mapping }}_${{ matrix.scale }}.log'
          grep -E 'STAGE4D3_JOINT_STATIONARITY_(PASS|FAIL)' '../v6_${{ matrix.mapping }}_${{ matrix.scale }}.log'
          find output/stage4d3_joint_stationarity -name joint_stationarity_summary.json -print -exec cat {} \;
      - name: Upload v6 Hessian artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtk-stage4d3-v6-${{ matrix.mapping }}-s${{ matrix.scale }}
          path: |
            v6_${{ matrix.mapping }}_${{ matrix.scale }}.log
            class_public/output/stage4d3_joint_stationarity/**/joint_stationarity_summary.json
            class_public/output/stage4d3_joint_stationarity/**/joint_stationarity_points.csv
          if-no-files-found: error
