name: RTK Route-B Dirac lapse-shift Schur bridge

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-dirac-lapse-shift-schur-bridge-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run Dirac lapse-shift bridge theorem
        run: |
          set -euo pipefail
          echo "RTK_SOURCE_SHA=$(git rev-parse HEAD)" | tee rtk_dirac_schur_bridge_provenance.txt
          python -m py_compile rtk/route_b_dirac_lapse_shift_schur_bridge.py
          python rtk/route_b_dirac_lapse_shift_schur_bridge.py | tee rtk_dirac_schur_bridge.log
          grep -q '^RTK_ROUTE_B_DIRAC_LAPSE_SHIFT_SCHUR_BRIDGE_PASS ' rtk_dirac_schur_bridge.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-dirac-lapse-shift-schur-bridge
          path: |
            rtk_dirac_schur_bridge.log
            rtk_dirac_schur_bridge_provenance.txt
          if-no-files-found: error
