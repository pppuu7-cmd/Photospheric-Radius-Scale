name: RTK C9 projectable finite-Mc moving O3 transfer

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c9-projectable-u1-finite-mc-moving-o3-transfer-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run finite-Mc moving O3 source-transfer theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/c9_projectable_u1_finite_mc_moving_o3_transfer_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee c9_projectable_u1_finite_mc_moving_o3_transfer_provenance.txt
          python3 rtk/c9_projectable_u1_finite_mc_moving_o3_transfer_gate.py | tee c9_projectable_u1_finite_mc_moving_o3_transfer.log
          grep -q '^RTK_C9_PROJECTABLE_U1_FINITE_MC_MOVING_O3_TRANSFER_PASS ' c9_projectable_u1_finite_mc_moving_o3_transfer.log
          python3 - <<'PY'
          import json
          r=json.load(open('c9_projectable_u1_finite_mc_moving_o3_transfer_result.json'))
          assert r['classification']=='RTK_C9_PROJECTABLE_U1_FINITE_MC_MOVING_O3_TRANSFER_PASS'
          assert '8 M_c^2/k^2' in r['O3_results']['alpha1']
          assert 'lambda_HL-1' in r['O3_results']['alpha2_minus_zeta1_plus_2xi']
          assert r['constraint_consistency']['result']=='identical exactly'
          print('C9_PROJECTABLE_U1_FINITE_MC_MOVING_O3_TRANSFER_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c9-projectable-u1-finite-mc-moving-o3-transfer
          path: |
            c9_projectable_u1_finite_mc_moving_o3_transfer.log
            c9_projectable_u1_finite_mc_moving_o3_transfer_result.json
            c9_projectable_u1_finite_mc_moving_o3_transfer_provenance.txt
            rtk/c9_projectable_u1_finite_mc_moving_o3_transfer_gate.py
          if-no-files-found: error
