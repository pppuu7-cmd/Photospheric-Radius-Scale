name: RTK C9 scalar partial-wave phase-space unitarity

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c9-rtk-scalar-partial-wave-phase-space-unitarity-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install pinned symbolic numerical runtime
        run: python -m pip install --disable-pip-version-check 'numpy==2.5.2' 'sympy==1.14.0'
      - name: Run partial-wave phase-space theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/c9_rtk_scalar_partial_wave_phase_space_unitarity_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee c9_rtk_scalar_partial_wave_phase_space_unitarity_provenance.txt
          python3 rtk/c9_rtk_scalar_partial_wave_phase_space_unitarity_gate.py | tee c9_rtk_scalar_partial_wave_phase_space_unitarity.log
          grep -q '^RTK_C9_RTK_SCALAR_PARTIAL_WAVE_PHASE_SPACE_UNITARITY_PASS ' c9_rtk_scalar_partial_wave_phase_space_unitarity.log
          python3 - <<'PY'
          import json
          r=json.load(open('c9_rtk_scalar_partial_wave_phase_space_unitarity_result.json'))
          assert r['classification']=='RTK_C9_RTK_SCALAR_PARTIAL_WAVE_PHASE_SPACE_UNITARITY_PASS'
          assert 1.9e-4 < r['early_edge']['k_unitarity_eV'] < 2.1e-4
          assert r['crossing_rows'][0]['dominant_partial_wave']=='l=0'
          assert abs(r['early_edge']['g_a2_over_g_a0']-1/145)<1e-15
          print('C9_RTK_SCALAR_PARTIAL_WAVE_PHASE_SPACE_UNITARITY_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c9-rtk-scalar-partial-wave-phase-space-unitarity
          path: |
            c9_rtk_scalar_partial_wave_phase_space_unitarity.log
            c9_rtk_scalar_partial_wave_phase_space_unitarity_result.json
            c9_rtk_scalar_partial_wave_phase_space_unitarity_provenance.txt
            rtk/c9_rtk_scalar_partial_wave_phase_space_unitarity_gate.py
          if-no-files-found: error
