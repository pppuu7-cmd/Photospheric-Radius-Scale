name: RTK B4 paired minimal-neutrino base stationarity

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-b4-neutrino-base-stationarity-trigger.txt'

permissions:
  contents: read

concurrency:
  group: rtk-b4-neutrino-base-stationarity
  cancel-in-progress: false

jobs:
  base-hessian:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [RTK, LCDM]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '300'
      RTK_PLANCK_DATA: 'planck_data'
      RTK_B4_STENCIL_SCALE: '1.0'
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      RTK_PANTHEON_SHA: '7eb29dc87ba223b4ec8457cd3cccba1216c36fb7'
      RTK_PLANCK_SHA256: '0b73171e3acc671c28184466a45485a2d1c1d93676b832abdfe688c7b04024e6'
      RTK_NUMPY_VERSION: '2.5.2'
      RTK_SCIPY_VERSION: '1.18.0'
      RTK_PYTHON_VERSION: '3.12.3'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Require frozen B4 stationarity protocol
        run: |
          set -euo pipefail
          test -f research/robustness/B4_NEUTRINO_STATIONARITY_PROTOCOL_v1.md
          test -f research/robustness/b4_neutrino_stationarity_targets_v1.json
          python3 - <<'PY'
          import json
          t=json.load(open('research/robustness/b4_neutrino_stationarity_targets_v1.json'))
          assert t['classification']=='B4_NEUTRINO_STATIONARITY_TARGETS_V1_FROZEN'
          assert t['source_seed_run_id']==32190997977
          assert t['objective']=='matched-ultra-linstep2+dense-BOSS+nu0p06-additive-v1'
          assert t['models']['RTK']['diagnostic_poll_best_improvement']==0.0
          assert t['models']['LCDM']['diagnostic_poll_best_improvement']==0.0
          print('B4_NEUTRINO_STATIONARITY_PREREG_PASS')
          PY
          python3 -m py_compile rtk/neutrino_stationarity_hessian.py rtk/prepare_inference_core.py

      - name: Prepare pinned hardened CLASS tree
        run: |
          set -euo pipefail
          echo "research_source_commit=$(git rev-parse HEAD)" | tee "b4_neutrino_base_${{ matrix.model }}_provenance.txt"
          echo "model=${{ matrix.model }}" | tee -a "b4_neutrino_base_${{ matrix.model }}_provenance.txt"
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_public
          git -C class_public reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          git clone https://github.com/dscolnic/Pantheon.git class_public/pantheon
          git -C class_public/pantheon reset --hard "$RTK_PANTHEON_SHA"
          test "$(git -C class_public rev-parse HEAD)" = "$RTK_CLASS_UPSTREAM_SHA"
          test "$(git -C class_public/pantheon rev-parse HEAD)" = "$RTK_PANTHEON_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_nonlocal_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          grep -q 'pba->V_prime_ini_nlde = 0.;' class_public/source/input.c
          cp rtk/joint_profile_runner.py rtk/prepare_inference_core.py rtk/neutrino_stationarity_hessian.py class_public/
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'A_s_ad\|n_s_ad' inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py
          grep -q "if r.get('ok')" inference_core.py
          grep -q "RTK_PLANCK_DATA" inference_core.py

      - name: Build CLASS
        working-directory: class_public
        run: make -j2 class

      - name: Install and verify locked runtime
        run: |
          set -euo pipefail
          test "$(python3 -c 'import platform;print(platform.python_version())')" = "$RTK_PYTHON_VERSION"
          python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' "numpy==$RTK_NUMPY_VERSION" "scipy==$RTK_SCIPY_VERSION"
          python3 - <<'PY'
          import numpy,scipy,os,platform
          assert platform.python_version()==os.environ['RTK_PYTHON_VERSION']
          assert numpy.__version__==os.environ['RTK_NUMPY_VERSION']
          assert scipy.__version__==os.environ['RTK_SCIPY_VERSION']
          PY
          python3 -m pip freeze | sort | tee "b4_neutrino_base_${{ matrix.model }}_pip_freeze.txt"
          python3 --version | tee "b4_neutrino_base_${{ matrix.model }}_python_version.txt"

      - name: Download and verify Planck baseline
        working-directory: class_public
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          sha256sum planck.tar.gz | tee "../b4_neutrino_base_${{ matrix.model }}_planck_sha256.txt"
          echo "$RTK_PLANCK_SHA256  planck.tar.gz" | sha256sum -c -
          mkdir planck_data && tar -xzf planck.tar.gz -C planck_data

      - name: Run exact B4 base Hessian
        working-directory: class_public
        run: |
          set -euo pipefail
          python3 neutrino_stationarity_hessian.py '${{ matrix.model }}' | tee "../b4_neutrino_base_${{ matrix.model }}.log"
          grep -q "B4_NEUTRINO_STATIONARITY_HESSIAN_COMPLETE ${{ matrix.model }} 1.0" "../b4_neutrino_base_${{ matrix.model }}.log"
          python3 - <<'PY'
          import json
          model='${{ matrix.model }}'
          p=f'../output/b4_neutrino_stationarity/{model.lower()}/scale_1/summary.json'
          s=json.load(open(p));t=json.load(open('../research/robustness/b4_neutrino_stationarity_targets_v1.json'))
          assert s['classification']=='B4_NEUTRINO_STATIONARITY_HESSIAN_COMPLETE'
          assert s['model']==model
          assert s['objective']==t['objective']
          assert s['center']==t['models'][model]['center']
          assert abs(float(s['stencil_scale'])-1.0)<1e-15
          assert s['source_seed_run_id']==32190997977
          assert len(s['eff']['eigenvalues_y'])==(7 if model=='RTK' else 6)
          print('B4_NEUTRINO_BASE_HESSIAN_ARTIFACT_PASS',model,s['eff']['best_exact_S'],s['eff']['best_improvement'],s['eff']['positive_definite'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-b4-neutrino-base-stationarity-${{ matrix.model }}
          path: |
            b4_neutrino_base_${{ matrix.model }}.log
            b4_neutrino_base_${{ matrix.model }}_provenance.txt
            b4_neutrino_base_${{ matrix.model }}_pip_freeze.txt
            b4_neutrino_base_${{ matrix.model }}_python_version.txt
            b4_neutrino_base_${{ matrix.model }}_planck_sha256.txt
            output/b4_neutrino_stationarity/${{ matrix.model == 'RTK' && 'rtk' || 'lcdm' }}/scale_1/
          if-no-files-found: warn
