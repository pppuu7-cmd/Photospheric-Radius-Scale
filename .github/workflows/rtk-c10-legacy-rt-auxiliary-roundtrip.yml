name: RTK C10 legacy RT auxiliary constraint roundtrip

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/workflows/rtk-c10-legacy-rt-auxiliary-roundtrip.yml'
      - 'research/theory_targets/RTK_C10_LEGACY_RT_AUXILIARY_COMOVING_CONSTRAINT_TARGET_v1.json'
      - 'research/shadow/rtk_c10_legacy_rt_auxiliary_roundtrip.py'
      - 'rtk/apply_rtk_c10_rt_auxiliary_roundtrip_export_patch.py'

permissions:
  contents: write

jobs:
  roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Verify frozen target and immutable parent states
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_LEGACY_RT_AUXILIARY_COMOVING_CONSTRAINT_TARGET_v1.json'))
          c=json.load(open('research/theory_results/RTK_C10_PARAMETER_FREE_SMALL_K_SOURCE_COMPATIBILITY_CONFIRM_RESULT_v1.json'))
          q=json.load(open('research/theory_results/RTK_C10_SMALL_K_PRECISION_CONVERGENCE_RESULT_v1.json'))
          s=json.load(open('research/state/current.json'))['final_replay_result']
          assert t['status']=='FROZEN_BEFORE_AUXILIARY_ROUNDTRIP_EXECUTION'
          assert c['classification']=='C10_PARAMETER_FREE_SMALL_K_SOURCE_COMPATIBILITY_FAIL_CORE_EPOCHS_SCOPED'
          assert q['classification']=='C10_SMALL_K_PRECISION_CONVERGENCE_INCONCLUSIVE'
          assert s['status']=='PASS'
          assert abs(float(s['rtk']['expected_score_eff'])-1050.249912429787)<1e-12
          print('C10_RT_AUX_ROUNDTRIP_TARGET_PASS')
          PY
          python3 -m py_compile research/shadow/rtk_c10_legacy_rt_auxiliary_roundtrip.py rtk/apply_rtk_c10_rt_auxiliary_roundtrip_export_patch.py
          git rev-parse HEAD | tee c10_rt_aux_repo_head.txt

      - name: Prepare disposable pinned RT-CLASS tree
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_rtaux
          git -C class_rtaux reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_rtaux/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_rtaux/include/
          python3 rtk/apply_rtk_class_patch.py class_rtaux
          python3 rtk/upgrade_rtk_inputs.py class_rtaux
          python3 rtk/upgrade_rtk_nonlocal_initial_conditions.py class_rtaux
          python3 rtk/upgrade_rtk_initial_conditions.py class_rtaux
          python3 rtk/upgrade_rtk_matter_sources.py class_rtaux
          python3 rtk/upgrade_rtk_gamma_root.py class_rtaux
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_rtaux
          python3 rtk/apply_rtk_c10_source_export_patch.py class_rtaux
          python3 rtk/apply_rtk_c10_direct_regularity_export_patch.py class_rtaux
          python3 rtk/apply_rtk_c10_rt_auxiliary_roundtrip_export_patch.py class_rtaux
          grep -q 'RTK_C10_RT_AUXILIARY_ROUNDTRIP_EXPORT_V1' class_rtaux/source/perturbations.c
          make -C class_rtaux -j2 class

      - name: Write frozen tight diagnostic input
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          t=json.load(open('research/theory_targets/RTK_C10_LEGACY_RT_AUXILIARY_COMOVING_CONSTRAINT_TARGET_v1.json'))
          p=json.load(open('research/state/current.json'))['final_replay_result']['rtk']['params']
          q=t['precision']; kvals=', '.join(format(float(x),'.17g') for x in t['k_ladder_Mpc_inv'])
          body=f'''h = {p['h']!r}
          T_cmb = 2.7255
          Omega_b = {p['Ob']!r}
          Omega_khronon = {p['Om']!r}
          lambda_D = {p['lam']!r}
          Omega_Lambda = 0.
          model = 2.
          N_ur = 3.046
          N_ncdm = 0
          Omega_k = 0.
          Omega_fld = 0.
          Omega_scf = 0.
          recombination = RECFAST
          reio_parametrization = reio_camb
          z_reio = {p['zre']!r}
          output = mPk,dTk,vTk
          gauge = newtonian
          A_s = {p['As']!r}
          n_s = {p['ns']!r}
          P_k_max_h/Mpc = 1.0
          z_pk = 0
          k_output_values = {kvals}
          k_max_tau0_over_l_max = {q['k_max_tau0_over_l_max']}
          k_per_decade_for_bao = {q['k_per_decade_for_bao']}
          k_per_decade_for_pk = {q['k_per_decade_for_pk']}
          l_linstep = {q['l_linstep']}
          l_logstep = {q['l_logstep']}
          perturb_sampling_stepsize = {q['perturb_sampling_stepsize']}
          tol_background_integration = {q['tol_background_integration']}
          tol_perturb_integration = {q['tol_perturb_integration']}
          tol_thermo_integration = {q['tol_thermo_integration']}
          root = output/rtaux_
          background_verbose = 1
          perturbations_verbose = 0
          spectra_verbose = 0
          '''
          pathlib.Path('class_rtaux/rtaux.ini').write_text(body)
          pathlib.Path('class_rtaux/output').mkdir(exist_ok=True)
          PY

      - name: Run read-only legacy RT auxiliary export
        run: |
          set -euo pipefail
          (cd class_rtaux && ./class rtaux.ini) > c10_rt_aux.log 2>&1
          grep 'RTK_LOG_GAMMA_ROOT' c10_rt_aux.log | tail -1 | tee c10_rt_aux_gamma.txt
          find class_rtaux/output -maxdepth 1 -type f -name 'rtaux_*perturbations*' -print | sort | tee c10_rt_aux_files.txt
          test "$(wc -l < c10_rt_aux_files.txt)" -eq 12

      - name: Evaluate frozen RT 00 plus code 0i roundtrip
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check numpy==2.5.2
          python3 research/shadow/rtk_c10_legacy_rt_auxiliary_roundtrip.py \
            --glob 'class_rtaux/output/rtaux_*perturbations*' \
            --target research/theory_targets/RTK_C10_LEGACY_RT_AUXILIARY_COMOVING_CONSTRAINT_TARGET_v1.json \
            --output c10_legacy_rt_auxiliary_roundtrip_result.json | tee c10_rt_aux_analysis.log
          cat c10_legacy_rt_auxiliary_roundtrip_result.json

      - name: Add provenance and persist result
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          p='c10_legacy_rt_auxiliary_roundtrip_result.json'; d=json.load(open(p))
          txt=open('c10_rt_aux_gamma.txt').read(); m=re.search(r'gamma=([0-9.eE+\-]+)',txt)
          d['provenance']={
            'class_upstream_sha':'36cf283628c4a3330ec9fd3d84239bf775f77317',
            'repo_head_at_job_start':open('c10_rt_aux_repo_head.txt').read().strip(),
            'production_score_eff':1050.249912429787,
            'gamma_root':float(m.group(1)) if m else None,
            'workflow':'rtk-c10-legacy-rt-auxiliary-roundtrip.yml',
            'export_patch':'rtk/apply_rtk_c10_rt_auxiliary_roundtrip_export_patch.py',
            'analyzer':'research/shadow/rtk_c10_legacy_rt_auxiliary_roundtrip.py'
          }
          open(p,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          cp c10_legacy_rt_auxiliary_roundtrip_result.json /tmp/result.json
          for attempt in 1 2 3 4 5; do
            git fetch origin rtk-class-build
            git reset --hard origin/rtk-class-build
            cp /tmp/result.json research/theory_results/RTK_C10_LEGACY_RT_AUXILIARY_COMOVING_CONSTRAINT_RESULT_v1.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/theory_results/RTK_C10_LEGACY_RT_AUXILIARY_COMOVING_CONSTRAINT_RESULT_v1.json
            git commit -m 'Record C10 legacy RT auxiliary comoving-constraint roundtrip' || exit 0
            if git push origin HEAD:rtk-class-build; then exit 0; fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c10-legacy-rt-auxiliary-roundtrip
          path: |
            c10_rt_aux.log
            c10_rt_aux_gamma.txt
            c10_rt_aux_analysis.log
            c10_legacy_rt_auxiliary_roundtrip_result.json
            class_rtaux/output/rtaux_*perturbations*
          if-no-files-found: warn
