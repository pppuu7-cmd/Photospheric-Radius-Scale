name: RTK C9 projectable finite-Mc uniform-sphere Yukawa

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c9-projectable-u1-finite-mc-uniform-sphere-yukawa-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run uniform-sphere Yukawa theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/c9_projectable_u1_finite_mc_uniform_sphere_yukawa_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee c9_projectable_u1_finite_mc_uniform_sphere_yukawa_provenance.txt
          python3 rtk/c9_projectable_u1_finite_mc_uniform_sphere_yukawa_gate.py | tee c9_projectable_u1_finite_mc_uniform_sphere_yukawa.log
          grep -q '^RTK_C9_PROJECTABLE_U1_FINITE_MC_UNIFORM_SPHERE_YUKAWA_PASS ' c9_projectable_u1_finite_mc_uniform_sphere_yukawa.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c9-projectable-u1-finite-mc-uniform-sphere-yukawa
          path: |
            c9_projectable_u1_finite_mc_uniform_sphere_yukawa.log
            c9_projectable_u1_finite_mc_uniform_sphere_yukawa_result.json
            c9_projectable_u1_finite_mc_uniform_sphere_yukawa_provenance.txt
            rtk/c9_projectable_u1_finite_mc_uniform_sphere_yukawa_gate.py
          if-no-files-found: error
