name: RTK C10 S_mix lapse-source ratio

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - 'rtk/route_b_u1_smix_lapse_source_ratio_gate.py'
      - 'research/theory_targets/RTK_C10_SMIX_LAPSE_SOURCE_RATIO_TARGET_v1.json'
      - '.github/rtk-c10-smix-lapse-source-ratio-trigger.txt'
      - '.github/workflows/rtk-c10-smix-lapse-source-ratio.yml'

permissions:
  contents: write

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_smix_lapse_source_ratio_gate.py
          python3 rtk/route_b_u1_smix_lapse_source_ratio_gate.py | tee c10_smix_lapse_source_ratio.log
          grep -q '^C10_SMIX_LAPSE_SOURCE_RATIO_AND_RATIONAL_INERTIA_PASS_SCOPED ' c10_smix_lapse_source_ratio.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_smix_lapse_source_ratio_result.json'))
          assert r['classification']=='C10_SMIX_LAPSE_SOURCE_RATIO_AND_RATIONAL_INERTIA_PASS_SCOPED'
          assert r['lapse_ratio_to_pure_DBI_density']=='1+k_phys^2/M_K^2'
          print('C10_SMIX_LAPSE_SOURCE_RATIO_ARTIFACT_PASS')
          PY
      - name: Persist result
        run: |
          set -euo pipefail
          cp u1_smix_lapse_source_ratio_result.json /tmp/result.json
          git fetch origin rtk-class-build
          git reset --hard origin/rtk-class-build
          cp /tmp/result.json research/theory_results/RTK_C10_SMIX_LAPSE_SOURCE_RATIO_RESULT_v1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C10_SMIX_LAPSE_SOURCE_RATIO_RESULT_v1.json
          git commit -m 'Record C10 S_mix lapse-source ratio result' || true
          git push origin HEAD:rtk-class-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c10-smix-lapse-source-ratio
          path: |
            c10_smix_lapse_source_ratio.log
            u1_smix_lapse_source_ratio_result.json
          if-no-files-found: error
