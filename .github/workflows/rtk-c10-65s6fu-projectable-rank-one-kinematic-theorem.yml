name: RTK C10.65s6fU projectable rank-one kinematic theorem

on:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/rtk-c10-65s6fu-projectable-rank-one-kinematic-theorem-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  theorem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy==1.13.3
      - name: Execute frozen C10.65s6fU theorem
        run: |
          set -euo pipefail
          python research/shadow/rtk_c10_65s6fu_projectable_rank_one_kinematic_embedding_theorem.py | tee /tmp/s6fu.log
      - name: Add provenance and recovery checkpoint
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_AT_JOB_START: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          rp=Path('research/theory_results/RTK_C10_65S6FU_PROJECTABLE_RANK_ONE_KINEMATIC_EMBEDDING_THEOREM_RESULT_v1.json')
          d=json.loads(rp.read_text())
          d['provenance']={
            'workflow':'rtk-c10-65s6fu-projectable-rank-one-kinematic-theorem.yml',
            'github_actions_run_id':int(os.environ['RUN_ID']),
            'github_actions_run_attempt':int(os.environ['RUN_ATTEMPT']),
            'repo_head_at_job_start':os.environ['HEAD_AT_JOB_START'],
            'threshold_changed':False
          }
          rp.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          cp=Path('research/checkpoints/RTK_C10_65S6FU_PROJECTABLE_RANK_ONE_KINEMATIC_THEOREM_2026-08-27T1323Z.md')
          cp.write_text('''# RTK C10.65s6fU projectable rank-one kinematic embedding theorem\n\nParent s6fT remains `BLOCKED_NO_FULL_PROJECTABLE_ADM_EMBEDDING_SCOPED`: no full RTK ADM action has been supplied or inferred. This gate instead asks a narrower exact question: what kinematic structure must any local two-scalar projectable-ADM realization of the historical rank-one candidate have?\n\nFor normal velocities `v_phi=(dot(phi)-N^i partial_i phi)/N` and `v_chi=(dot(chi)-N^i partial_i chi)/N`, write the general quadratic kinetic density as `N sqrt(gamma)/2 [A v_phi^2+2B v_phi v_chi+C v_chi^2]`. Its velocity Hessian is proportional to `K=[[A,B],[B,C]]`; rank one requires `AC-B^2=0`. On the `A!=0` patch, `a=B/A`, `C=a^2 A`, so the kinetic term is exactly proportional to `(v_phi+a v_chi)^2` and the canonical primary constraint is `p_chi-a p_phi=0`.\n\nFor any symmetric algebraic/potential matrix `M`, `det(M-zK)` with `z=omega^2` is affine in `z` on the rank-one locus because the quadratic coefficient is exactly `det K=0`. Thus this kinematic class carries at most one finite dynamical pole unless the remaining affine coefficient also degenerates.\n\nThis is only a necessary-structure/constructive kinematic theorem. It does not choose the RTK field map, potential sector, source direction, background coefficient functions or nonlinear Dirac completion; it does not rerun soft-s and does not unblock `k=0.03 Mpc^-1`. The next fixed-action construction must be independently motivated and then rerun s6fT unchanged.\n''')
          PY
      - name: Commit result and checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C10_65S6FU_PROJECTABLE_RANK_ONE_KINEMATIC_EMBEDDING_THEOREM_RESULT_v1.json research/checkpoints/RTK_C10_65S6FU_PROJECTABLE_RANK_ONE_KINEMATIC_THEOREM_2026-08-27T1323Z.md
          git commit -m 'Record C10.65s6fU projectable rank-one kinematic theorem'
          git push origin HEAD:rtk-class-build
