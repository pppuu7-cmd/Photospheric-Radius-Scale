name: RTK Route-B U1 flat FLRW total d4 DeWitt square

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-flat-flrw-total-d4-dewitt-square-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run total d4 DeWitt-square theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_flat_flrw_total_d4_dewitt_square_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_flat_flrw_total_d4_dewitt_square_provenance.txt
          python3 rtk/route_b_u1_flat_flrw_total_d4_dewitt_square_gate.py | tee u1_flat_flrw_total_d4_dewitt_square.log
          grep -q '^RTK_ROUTE_B_U1_FLAT_FLRW_TOTAL_D4_DEWITT_SQUARE_PASS ' u1_flat_flrw_total_d4_dewitt_square.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_flat_flrw_total_d4_dewitt_square_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_FLAT_FLRW_TOTAL_D4_DEWITT_SQUARE_PASS'
          assert 'lambda rho-tau_rho/d' in r['cross_closed_form']
          assert 'O(q^3)' in r['filter_remainder_order']
          print('U1_FLAT_FLRW_TOTAL_D4_DEWITT_SQUARE_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-flat-flrw-total-d4-dewitt-square
          path: |
            u1_flat_flrw_total_d4_dewitt_square.log
            u1_flat_flrw_total_d4_dewitt_square_result.json
            u1_flat_flrw_total_d4_dewitt_square_provenance.txt
            rtk/route_b_u1_flat_flrw_total_d4_dewitt_square_gate.py
          if-no-files-found: error
