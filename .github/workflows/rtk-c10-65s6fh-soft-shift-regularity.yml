name: RTK C10.65s6fH soft-shift regularity theorem

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - 'research/theory_targets/RTK_C10_65S6FH_SOFT_SHIFT_REGULARITY_TARGET_v1.json'
      - 'research/shadow/rtk_c10_65s6fh_soft_shift_regularity.py'
      - '.github/workflows/rtk-c10-65s6fh-soft-shift-regularity.yml'

permissions:
  contents: write

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Verify parents and execute frozen theorem
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          g=json.load(open('research/theory_results/RTK_C10_65S6FG_INHERITED_SCALAR_SHIFT_SOURCE_LOCK_RESULT_v1.json'))
          f=json.load(open('research/theory_results/RTK_C10_65S6FF_CONDITIONAL_FULL_SHIFT_REDUCTION_RESULT_v1.json'))
          t=json.load(open('research/theory_targets/RTK_C10_65S6FH_SOFT_SHIFT_REGULARITY_TARGET_v1.json'))
          assert g['classification']=='C10_65S6FG_INHERITED_SCALAR_SHIFT_SOURCE_LOCK_PASS_SCOPED'
          assert f['classification']=='C10_65S6FF_CONDITIONAL_FULL_SHIFT_REDUCTION_BLOCKED_ACTION_SOURCE_LOCK_INCOMPLETE_SCOPED'
          assert t['status']=='FROZEN_BEFORE_IMPLEMENTATION'
          assert t['candidate_branch']=='MINIMAL_PROJECTABLE_N2_S1HALF_v1'
          PY
          python3 -m py_compile research/shadow/rtk_c10_65s6fh_soft_shift_regularity.py
          python3 research/shadow/rtk_c10_65s6fh_soft_shift_regularity.py | tee s6fh.log
          grep -q '^C10_65S6FH_SOFT_SHIFT_REGULARITY_PASS_SCOPED' s6fh.log
      - name: Add immutable provenance and checkpoint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,datetime,pathlib
          p=pathlib.Path('research/theory_results/RTK_C10_65S6FH_SOFT_SHIFT_REGULARITY_RESULT_v1.json')
          r=json.loads(p.read_text())
          r['provenance']={
            'github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),
            'repo_head_at_job_start':os.environ['GITHUB_SHA'],
            'workflow':'rtk-c10-65s6fh-soft-shift-regularity.yml',
            'threshold_changed':False
          }
          p.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          now=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H%MZ')
          cp=pathlib.Path(f'research/checkpoints/RTK_C10_65S6FH_SOFT_SHIFT_REGULARITY_{now}.md')
          cp.write_text(f'''# C10.65s6fH soft-shift regularity checkpoint\n\nClassification: `{r["classification"]}`.\n\nThe inherited `F(t,N)` direct shift source is already zero by s6fG. For the frozen projectable ADM kinetic sector, the scalar-shift kernel scales as `q^4`, while both the linear soft source and the hard-hard quadratic source scale as `q^2`. The exact hard-hard soft coefficient is\n\n`J2/q^2 -> -(omega(k)+k v_g(k) mu^2)`.\n\nTherefore `J1 J2/K_beta = O(q^0)`: the reduced soft contribution can remain finite even though every unreduced shift term vanishes when `q_s=0` is substituted prematurely. Final ZERO/NONZERO classification remains forbidden until the cubic beta^2*zeta kernel variation and alpha6(X) state-function terms are combined.\n\nNext: C10.65s6fI complete cubic reduced scalar vertex on the same frozen candidate branch. k=0.03 production remains blocked.\n''')
          print(cp)
          PY
      - name: Persist result and checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C10_65S6FH_SOFT_SHIFT_REGULARITY_RESULT_v1.json research/checkpoints/RTK_C10_65S6FH_SOFT_SHIFT_REGULARITY_*.md
          git commit -m 'Record C10.65s6fH soft-shift regularity theorem'
          git push origin HEAD:rtk-class-build
