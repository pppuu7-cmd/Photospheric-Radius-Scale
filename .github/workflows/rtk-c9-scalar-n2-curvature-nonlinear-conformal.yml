name: RTK C9 scalar n2 curvature nonlinear conformal

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c9-scalar-n2-curvature-nonlinear-conformal-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run nonlinear conformal n2 curvature theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/c9_rtk_scalar_n2_curvature_nonlinear_conformal_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee c9_rtk_scalar_n2_curvature_nonlinear_conformal_provenance.txt
          python3 rtk/c9_rtk_scalar_n2_curvature_nonlinear_conformal_gate.py | tee c9_rtk_scalar_n2_curvature_nonlinear_conformal.log
          grep -q '^RTK_C9_RTK_SCALAR_N2_CURVATURE_NONLINEAR_CONFORMAL_PASS ' c9_rtk_scalar_n2_curvature_nonlinear_conformal.log
          python3 - <<'PY'
          import json
          r=json.load(open('c9_rtk_scalar_n2_curvature_nonlinear_conformal_result.json'))
          assert r['classification']=='RTK_C9_RTK_SCALAR_N2_CURVATURE_NONLINEAR_CONFORMAL_PASS'
          assert '320 k^6(9-2 cos^2 theta)' in r['elastic_com_quartic_contact_kernel']
          assert r['elastic_channel_cubic_kernels']['s']=='-96 k^6'
          print('C9_RTK_SCALAR_N2_CURVATURE_NONLINEAR_CONFORMAL_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c9-scalar-n2-curvature-nonlinear-conformal
          path: |
            c9_rtk_scalar_n2_curvature_nonlinear_conformal.log
            c9_rtk_scalar_n2_curvature_nonlinear_conformal_result.json
            c9_rtk_scalar_n2_curvature_nonlinear_conformal_provenance.txt
            rtk/c9_rtk_scalar_n2_curvature_nonlinear_conformal_gate.py
          if-no-files-found: error
