name: RTK Route-B auxiliary acceleration equivalence

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-auxiliary-acceleration-equivalence-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Run exact auxiliary elimination theorem
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
          python3 -m py_compile rtk/route_b_auxiliary_acceleration_equivalence.py
          python3 rtk/route_b_auxiliary_acceleration_equivalence.py | tee route_b_auxiliary_acceleration_equivalence.log
          grep -q RTK_ROUTE_B_AUXILIARY_ACCELERATION_EQUIVALENCE_PASS route_b_auxiliary_acceleration_equivalence.log
          python3 - <<'PY'
          import platform,sympy
          assert platform.python_version()=='3.12.3'
          assert sympy.__version__=='1.14.0'
          print('RTK_ROUTE_B_AUXILIARY_RUNTIME_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rtk-route-b-auxiliary-acceleration-equivalence
          path: route_b_auxiliary_acceleration_equivalence.log
          if-no-files-found: error
