name: RTK C10.65s3a finite-short-interval endpoint stability
on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths: ['research/triggers/RTK_C10_65S3A_TRIGGER_v1.txt']
permissions:
  contents: write
  actions: read
jobs:
  stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      OMP_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: rtk-class-build, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.3'}
      - name: Verify frozen s3a parents
        run: |
          set -euo pipefail
          git rev-parse HEAD > c10_65s3a_head.txt
          python3 - <<'PY'
          import json
          L=lambda p: json.load(open(p)); t=L('research/theory_targets/RTK_C10_65S3A_FINITE_SHORT_INTERVAL_ENDPOINT_STABILITY_TARGET_v1.json'); k=L('research/theory_results/RTK_C10_65S2K_ONE_ACCEPTED_STEP_RETRY_RESULT_v1.json'); s=L('research/theory_results/RTK_C10_65S2_DIRECT_ONSET_ONE_STEP_PRODUCTION_CANARY_RESULT_v1.json')
          assert t['status']=='FROZEN_BEFORE_EXECUTION'; assert t['prospective_interval']['delta_tau_Mpc']==1e-6; assert t['constraint_policy']['frozen_max_abs_endpoint_normalized_residual']==1e-10; assert t['constraint_policy']['frozen_max_abs_normalized_change']==1e-10; assert k['classification']=='C10_65S2K_ONE_ACCEPTED_STEP_RETRY_PASS_SCOPED'; assert s['classification']=='C10_65S2_DIRECT_ONSET_ONE_STEP_PRODUCTION_CANARY_FAIL_SCOPED'
          print('C10_65S3A_FROZEN_PARENT_PASS')
          PY
      - name: Prepare pinned control and s3a trees
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_control
          git -C class_control reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_control/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_control/include/
          for x in apply_rtk_class_patch.py upgrade_rtk_inputs.py upgrade_rtk_nonlocal_initial_conditions.py upgrade_rtk_initial_conditions.py upgrade_rtk_matter_sources.py upgrade_rtk_gamma_root.py upgrade_rtk_spectra_endpoint.py apply_rtk_c10_source_export_patch.py apply_rtk_c10_65a_species_control_patch.py apply_rtk_c10_65e_tca_coefficient_export_patch.py apply_rtk_c10_65r0_opt_in_local_environment_export_patch.py apply_rtk_c10_65r1_in_class_completed_projector_parity_patch.py stabilize_rtk_c10_65r1_conditioned_projector.py; do python3 "rtk/$x" class_control; done
          make -C class_control -j2 class
          cp -a class_control class_s3a
          python3 rtk/apply_rtk_c10_65s2_production_canary_patch_v3.py class_s3a
          python3 rtk/apply_rtk_c10_65s3a_interval_patch.py class_s3a
          python3 rtk/apply_rtk_c10_65s2i_adaptive_trace_patch.py class_s3a
          make -C class_s3a clean && make -C class_s3a -j2 class
      - name: Write unchanged frozen-domain inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          L=lambda p:json.load(open(p)); plan=L('research/theory_targets/RTK_C10_65S2_PRODUCTION_IMPLEMENTATION_PLAN_v1.json'); p=L('research/state/current.json')['final_replay_result']['rtk']['params']; d=plan['scope']; ks=', '.join(format(float(x),'.17g') for x in d['k_Mpc_inv'])
          common=f'''h = {p['h']!r}\nT_cmb = 2.7255\nOmega_b = {p['Ob']!r}\nOmega_khronon = {p['Om']!r}\nlambda_D = {p['lam']!r}\nOmega_Lambda = 0.\nmodel = 2.\nN_ur = 3.046\nN_ncdm = 0\nOmega_k = 0.\nOmega_fld = 0.\nOmega_scf = 0.\nrecombination = RECFAST\nreio_parametrization = reio_camb\nz_reio = {p['zre']!r}\noutput = mPk,dTk,vTk\ngauge = newtonian\nA_s = {p['As']!r}\nn_s = {p['ns']!r}\nP_k_max_1/Mpc = 0.00031\nz_pk = 0\nk_output_values = {ks}\nwrite parameters = no\nbackground_verbose = 0\nperturbations_verbose = 0\nspectra_verbose = 0\nevolver = 0\nl_max_ur = 17\nc10_65r0_diag = 0\nc10_65r1_diag = 0\nc10_65r1_lambda_HL = {float(d['lambda_HL']):.17g}\nc10_65r1_Mc = {float(d['M_c_Mpc_inv']):.17g}\n'''
          for q in ('class_control/output','class_s3a/output'): pathlib.Path(q).mkdir(exist_ok=True)
          pathlib.Path('class_control/control.ini').write_text(common+'root = output/control_\n')
          extra=f'''c10_65s2_lambda_HL = {float(d['lambda_HL']):.17g}\nc10_65s2_Mc = {float(d['M_c_Mpc_inv']):.17g}\nc10_65s2_a_on = {float(d['a_on']):.17g}\n'''
          pathlib.Path('class_s3a/off.ini').write_text(common+'c10_65s2_canary = 0\n'+extra+'root = output/off_\n'); pathlib.Path('class_s3a/on.ini').write_text(common+'c10_65s2_canary = 1\n'+extra+'root = output/on_\n')
          PY
      - name: Verify exact dormant OFF identity
        run: |
          set -euo pipefail
          (cd class_control && ./class control.ini) > c10_65s3a_control.log 2>&1
          (cd class_s3a && env -u RTK_C10_65S2_OBSERVER_FILE -u RTK_C10_65S2I_TRACE_FILE ./class off.ini) > c10_65s3a_off.log 2>&1
          python3 - <<'PY'
          import glob,hashlib,json,pathlib
          def d(p): return hashlib.sha256(('\n'.join(x.strip() for x in pathlib.Path(p).read_text().splitlines() if x.strip() and not x.lstrip().startswith('#'))+'\n').encode()).hexdigest()
          A=sorted(glob.glob('class_control/output/control_*perturbations*'));B=sorted(glob.glob('class_s3a/output/off_*perturbations*'));assert len(A)==len(B)==4; rec=[];ok=True
          for x,y in zip(A,B): a,b=d(x),d(y); z=a==b;ok &= z;rec.append({'control':x,'s3a_off':y,'control_sha256':a,'s3a_off_sha256':b,'identical':z})
          pathlib.Path('c10_65s3a_off_identity.json').write_text(json.dumps({'all_four_numeric_rows_sha256_identical':bool(ok),'records':rec},indent=2,sort_keys=True)+'\n');assert ok
          PY
      - name: Recover s2k observer and execute s3a
        run: |
          set -euo pipefail
          mkdir -p s2k_artifact
          gh run download 33004868239 --repo pppuu7-cmd/Photospheric-Radius-Scale --name rtk-c10-65s2k-one-accepted-step-retry --dir s2k_artifact
          test -s s2k_artifact/c10_65s2k_observer.csv
          rm -f c10_65s3a_observer.csv c10_65s3a_trace.csv
          (cd class_s3a && RTK_C10_65S2_OBSERVER_FILE="$(pwd)/../c10_65s3a_observer.csv" RTK_C10_65S2I_TRACE_FILE="$(pwd)/../c10_65s3a_trace.csv" ./class on.ini) > c10_65s3a_on.log 2>&1
          test -s c10_65s3a_observer.csv; test -s c10_65s3a_trace.csv
      - name: Analyze frozen endpoint stability
        run: |
          set -euo pipefail
          python3 research/shadow/rtk_c10_65s3a_endpoint_stability_analyzer.py --observer c10_65s3a_observer.csv --trace c10_65s3a_trace.csv --s2k-observer s2k_artifact/c10_65s2k_observer.csv --off-identity c10_65s3a_off_identity.json --interval-patch rtk/apply_rtk_c10_65s3a_interval_patch.py --trace-patch rtk/apply_rtk_c10_65s2i_adaptive_trace_patch.py --output research/theory_results/RTK_C10_65S3A_FINITE_SHORT_INTERVAL_ENDPOINT_STABILITY_RESULT_v1.json | tee c10_65s3a.log
          grep -q '^C10_65S3A_FINITE_SHORT_INTERVAL_ENDPOINT_STABILITY_PASS_SCOPED$' c10_65s3a.log
      - name: Add provenance and checkpoint
        if: always()
        run: |
          set -euo pipefail
          p='research/theory_results/RTK_C10_65S3A_FINITE_SHORT_INTERVAL_ENDPOINT_STABILITY_RESULT_v1.json'; [ -f "$p" ] || exit 0
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          p=pathlib.Path('research/theory_results/RTK_C10_65S3A_FINITE_SHORT_INTERVAL_ENDPOINT_STABILITY_RESULT_v1.json');d=json.loads(p.read_text()); ob=pathlib.Path('c10_65s3a_observer.csv').read_bytes();tr=pathlib.Path('c10_65s3a_trace.csv').read_bytes()
          d['provenance']={'repo_head_at_job_start':pathlib.Path('c10_65s3a_head.txt').read_text().strip(),'class_upstream_sha':os.environ['RTK_CLASS_UPSTREAM_SHA'],'workflow':'rtk-c10-65s3a-endpoint-stability.yml','github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'observer_sha256':hashlib.sha256(ob).hexdigest(),'trace_sha256':hashlib.sha256(tr).hexdigest(),'source_s2k_run_id':33004868239,'interval_patch':'rtk/apply_rtk_c10_65s3a_interval_patch.py','trace_patch':'rtk/apply_rtk_c10_65s2i_adaptive_trace_patch.py','analyzer':'research/shadow/rtk_c10_65s3a_endpoint_stability_analyzer.py','threshold_changed':False}; p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          lines='\n'.join(f"- k={r['k']:.8g}: accepted={r['accepted_substeps']}, rejected={r['rejected_trials']}, min_hdid={r['minimum_hdid']:.17e}, max_hdid={r['maximum_hdid']:.17e}" for r in d['trace_records'])
          pathlib.Path('research/checkpoints/RTK_C10_65S3A_ENDPOINT_STABILITY_2026-08-26T1929Z.md').write_text(f"# RTK C10.65s3a endpoint stability checkpoint\n\nClassification: `{d['classification']}`. Original s2 remains `{d['original_s2_classification_preserved']}`; s2k remains `{d['s2k_classification_preserved']}`.\n\nFrozen interval: `{d['interval_delta_tau_Mpc']:.17e}` Mpc, unchanged production kernel/tolerance.\n\n{lines}\n\nMaximum endpoint normalized A/H/M residual: `{d['max_abs_endpoint_normalized_residual']:.17e}`; maximum normalized change: `{d['max_abs_normalized_constraint_change']:.17e}`; frozen bound: `{d['frozen_constraint_bound']:.17e}`.\n\nThis is endpoint-only scoped stability, not a full-trajectory or cosmological stability theorem.\n")
          PY
      - name: Persist result and checkpoint
        if: always()
        run: |
          set -euo pipefail
          p='research/theory_results/RTK_C10_65S3A_FINITE_SHORT_INTERVAL_ENDPOINT_STABILITY_RESULT_v1.json'; ck='research/checkpoints/RTK_C10_65S3A_ENDPOINT_STABILITY_2026-08-26T1929Z.md'; [ -f "$p" ] || exit 0; cp "$p" /tmp/r.json;cp "$ck" /tmp/c.md
          for n in 1 2 3 4 5; do git fetch origin rtk-class-build;git reset --hard origin/rtk-class-build;cp /tmp/r.json "$p";cp /tmp/c.md "$ck";git config user.name github-actions[bot];git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add "$p" "$ck";git commit -m 'Record C10.65s3a endpoint stability' || exit 0;git push origin HEAD:rtk-class-build && exit 0;done;exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c10-65s3a-endpoint-stability
          path: |
            c10_65s3a_observer.csv
            c10_65s3a_trace.csv
            c10_65s3a_off_identity.json
            c10_65s3a_on.log
            c10_65s3a.log
            research/theory_results/RTK_C10_65S3A_FINITE_SHORT_INTERVAL_ENDPOINT_STABILITY_RESULT_v1.json
