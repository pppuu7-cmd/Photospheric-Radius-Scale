name: RTK Route-B gradK static regularity gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-gradk-static-regularity-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run gradK regularity theorem
        run: |
          set -euo pipefail
          echo "RTK_SOURCE_SHA=$(git rev-parse HEAD)" | tee rtk_gradk_static_regularity_provenance.txt
          python -m py_compile rtk/route_b_gradK_static_regularity_gate.py
          python rtk/route_b_gradK_static_regularity_gate.py | tee rtk_gradk_static_regularity.log
          grep -q '^RTK_ROUTE_B_GRADK_STATIC_REGULARITY_GATE_PASS ' rtk_gradk_static_regularity.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-gradk-static-regularity-gate
          path: |
            rtk_gradk_static_regularity.log
            rtk_gradk_static_regularity_provenance.txt
          if-no-files-found: error
