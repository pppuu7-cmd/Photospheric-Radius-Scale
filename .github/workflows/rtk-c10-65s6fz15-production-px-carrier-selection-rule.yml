name: RTK C10.65s6fZ15 production P(X) carrier selection rule

on:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/rtk-c10-65s6fz15-production-px-carrier-selection-rule-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - name: Verify frozen target and parent
        run: |
          python - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_65S6FZ15_PRODUCTION_PX_CARRIER_SELECTION_RULE_TARGET_v1.json'))
          p=json.load(open('research/theory_results/RTK_C10_65S6FZ14_PROJECTABLE_CARRIER_SPATIAL_OPERATOR_CLASS_RESULT_v1.json'))
          assert p['classification']==t['parent_required']
          assert t['threshold_changed'] is False
          assert t['soft_s_retest_allowed'] is False
          assert t['production_k003_unblocked'] is False
          PY
      - name: Install symbolic dependency
        run: pip install sympy==1.13.3
      - name: Run frozen P(X) selection audit
        run: python research/shadow/rtk_c10_65s6fz15_production_px_carrier_selection_rule.py
      - name: Verify result semantics
        run: |
          python - <<'PY'
          import json
          r=json.load(open('research/theory_results/RTK_C10_65S6FZ15_PRODUCTION_PX_CARRIER_SELECTION_RULE_RESULT_v1.json'))
          assert r['classification'] in {'C10_65S6FZ15_PX_INTRINSIC_CARRIER_SECTOR_FIXED_PARTIAL_PASS_SCOPED','C10_65S6FZ15_PX_SELECTION_RULE_NOT_SOURCE_LOCKED_BLOCKED_SCOPED'}
          assert all(r['checks'].values())
          assert r['threshold_changed'] is False
          assert r['soft_s_retest_allowed'] is False
          assert r['production_k003_unblocked'] is False
          PY
      - name: Persist provenance and checkpoint
        run: |
          RUN_ID='${{ github.run_id }}' RUN_ATTEMPT='${{ github.run_attempt }}' HEAD_SHA='${{ github.sha }}' python - <<'PY'
          import json,os,datetime,pathlib
          rp=pathlib.Path('research/theory_results/RTK_C10_65S6FZ15_PRODUCTION_PX_CARRIER_SELECTION_RULE_RESULT_v1.json')
          r=json.loads(rp.read_text())
          r['provenance']={'github_actions_run_id':int(os.environ['RUN_ID']),'github_actions_run_attempt':int(os.environ['RUN_ATTEMPT']),'trigger_head_sha':os.environ['HEAD_SHA'],'workflow':'rtk-c10-65s6fz15-production-px-carrier-selection-rule.yml','threshold_changed':False}
          rp.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          d=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H%MZ')
          cp=pathlib.Path(f'research/checkpoints/RTK_C10_65S6FZ15_PRODUCTION_PX_CARRIER_SELECTION_RULE_{d}.md')
          cp.write_text('# RTK C10.65s6fZ15 checkpoint\n\nClassification: `'+r['classification']+'`.\n\n'+r['interpretation']+'\n\nOpen interfaces: '+', '.join(r['still_open_same_action_interfaces'])+'.\n\nFrozen guards remain: no soft-s retest and no k=0.03 production.\n\nNext: '+r['next_gate']+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C10_65S6FZ15_PRODUCTION_PX_CARRIER_SELECTION_RULE_RESULT_v1.json research/checkpoints/
          git commit -m 'Record C10.65s6fZ15 production P(X) carrier selection audit'
          git push origin HEAD:rtk-class-build
