name: RTK C9 projectable finite-Mc O4 resolvent potential map

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c9-projectable-u1-finite-mc-o4-resolvent-potential-map-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run O4 resolvent potential mapping theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/c9_projectable_u1_finite_mc_o4_resolvent_potential_map_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee c9_projectable_u1_finite_mc_o4_resolvent_potential_map_provenance.txt
          python3 rtk/c9_projectable_u1_finite_mc_o4_resolvent_potential_map_gate.py | tee c9_projectable_u1_finite_mc_o4_resolvent_potential_map.log
          grep -q '^RTK_C9_PROJECTABLE_U1_FINITE_MC_O4_RESOLVENT_POTENTIAL_MAP_PASS ' c9_projectable_u1_finite_mc_o4_resolvent_potential_map.log
          python3 - <<'PY'
          import json
          r=json.load(open('c9_projectable_u1_finite_mc_o4_resolvent_potential_map_result.json'))
          assert r['classification']=='RTK_C9_PROJECTABLE_U1_FINITE_MC_O4_RESOLVENT_POTENTIAL_MAP_PASS'
          assert r['exact_map']['delta_h00_a1_1']=='-Delta^-1 S_res'
          assert 'true mode mixing' in r['nonseparability_proof']['consequence']
          print('C9_PROJECTABLE_U1_FINITE_MC_O4_RESOLVENT_POTENTIAL_MAP_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c9-projectable-u1-finite-mc-o4-resolvent-potential-map
          path: |
            c9_projectable_u1_finite_mc_o4_resolvent_potential_map.log
            c9_projectable_u1_finite_mc_o4_resolvent_potential_map_result.json
            c9_projectable_u1_finite_mc_o4_resolvent_potential_map_provenance.txt
            rtk/c9_projectable_u1_finite_mc_o4_resolvent_potential_map_gate.py
          if-no-files-found: error
