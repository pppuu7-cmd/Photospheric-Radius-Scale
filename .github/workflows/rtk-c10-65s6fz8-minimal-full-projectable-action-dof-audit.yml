name: RTK C10.65s6fZ8 minimal full projectable action DOF audit

on:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/rtk-c10-65s6fz8-minimal-full-projectable-action-dof-audit-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  theorem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact symbolic dependency
        run: python -m pip install --quiet sympy
      - name: Verify frozen parent and target guards
        run: |
          python - <<'PY'
          import json
          parent=json.load(open('research/theory_results/RTK_C10_65S6FZ7_SYMMETRY_FIRST_REPRESENTATION_CLASS_RESULT_v1.json'))
          assert parent['classification']=='C10_65S6FZ7_REPRESENTATION_CLASS_EXISTS_PASS_SCOPED'
          assert parent['production_k003_unblocked'] is False
          assert parent['soft_s_retest_allowed'] is False
          t=json.load(open('research/theory_targets/RTK_C10_65S6FZ8_MINIMAL_FULL_PROJECTABLE_ACTION_DOF_AUDIT_TARGET_v1.json'))
          assert t['threshold_changed'] is False
          assert t['hypothesis_status']=='NEW_NONLINEAR_COMPLETION_HYPOTHESIS_NOT_ARCHIVAL_INHERITANCE'
          assert t['frozen_action_template']['no_extra_A_multiplier'] is True
          assert t['frozen_action_template']['no_extra_local_constraint_field'] is True
          assert 'post-hoc addition of a local constraint multiplier' in t['forbidden']
          PY
      - name: Run frozen same-action DOF audit
        run: python research/shadow/rtk_c10_65s6fz8_minimal_full_projectable_action_dof_audit.py
      - name: Verify frozen classification semantics
        run: |
          python - <<'PY'
          import json
          p='research/theory_results/RTK_C10_65S6FZ8_MINIMAL_FULL_PROJECTABLE_ACTION_DOF_AUDIT_RESULT_v1.json'
          r=json.load(open(p))
          assert r['classification'] in {
            'C10_65S6FZ8_MINIMAL_FULL_ACTION_ONE_SCALAR_PASS_SCOPED',
            'C10_65S6FZ8_MINIMAL_FULL_ACTION_EXTRA_SCALAR_OBSTRUCTION_PASS_SCOPED'}
          assert all(r['checks'].values())
          assert r['threshold_changed'] is False
          assert r['soft_s_retest_allowed'] is False
          assert r['production_k003_unblocked'] is False
          PY
      - name: Persist result provenance and checkpoint
        run: |
          RUN_ID='${{ github.run_id }}' RUN_ATTEMPT='${{ github.run_attempt }}' HEAD_SHA='${{ github.sha }}' python - <<'PY'
          import json,os,datetime,pathlib
          rp=pathlib.Path('research/theory_results/RTK_C10_65S6FZ8_MINIMAL_FULL_PROJECTABLE_ACTION_DOF_AUDIT_RESULT_v1.json')
          r=json.loads(rp.read_text())
          r['provenance']={
            'github_actions_run_id':int(os.environ['RUN_ID']),
            'github_actions_run_attempt':int(os.environ['RUN_ATTEMPT']),
            'trigger_head_sha':os.environ['HEAD_SHA'],
            'workflow':'rtk-c10-65s6fz8-minimal-full-projectable-action-dof-audit.yml',
            'frozen_target_commit':'921b071920e7626a36827c5eb7300a7de99bf4c7',
            'threshold_changed':False}
          rp.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          d=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H%MZ')
          cp=pathlib.Path(f'research/checkpoints/RTK_C10_65S6FZ8_MINIMAL_FULL_ACTION_DOF_AUDIT_{d}.md')
          cp.write_text(
            '# RTK C10.65s6fZ8 checkpoint\n\n'
            f"Classification: `{r['classification']}`.\n\n"
            'Frozen before execution: minimal local projectable action built from the Z7 invariant shift `Nbar_i` and invariant carrier `Phi`, with no extra A-like/local constraint multiplier and no soft-s-derived term.\n\n'
            f"Exact finite-k shift solution: `{r['exact_symbolics']['q_solution']}`. Reduced gravity scalar kinetic term: `{r['exact_symbolics']['L_gravity_scalar_reduced']}`. Combined `(zdot,Phidot)` velocity Hessian determinant: `{r['exact_symbolics']['velocity_hessian_determinant']}`; generic rank = {r['exact_symbolics']['generic_velocity_rank']}.\n\n"
            +r['interpretation']+'\n\n'
            'No soft-s retest or k=0.03 production is authorized. Historical blockers remain preserved.\n\nNext: '+r['next_gate']+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C10_65S6FZ8_MINIMAL_FULL_PROJECTABLE_ACTION_DOF_AUDIT_RESULT_v1.json research/checkpoints/
          git commit -m 'Record C10.65s6fZ8 minimal full-action DOF audit'
          git push origin HEAD:rtk-class-build
