name: RTK C10.65s2l finite-short-interval endpoint stability
on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - 'research/theory_targets/RTK_C10_65S2L_FINITE_SHORT_INTERVAL_ENDPOINT_STABILITY_TARGET_v1.json'
      - 'rtk/apply_rtk_c10_65s2l_finite_interval_patch.py'
      - 'research/shadow/rtk_c10_65s2l_finite_short_interval_endpoint_stability_analyzer.py'
      - '.github/workflows/rtk-c10-65s2l-finite-short-interval-endpoint-stability.yml'
permissions:
  contents: write
  actions: read
jobs:
  stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      OMP_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: rtk-class-build, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.3'}
      - name: Verify frozen s2l contract and parents
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee c10_65s2l_head.txt
          python3 - <<'PY'
          import json
          L=lambda p: json.load(open(p))
          t=L('research/theory_targets/RTK_C10_65S2L_FINITE_SHORT_INTERVAL_ENDPOINT_STABILITY_TARGET_v1.json')
          k=L('research/theory_results/RTK_C10_65S2K_ONE_ACCEPTED_STEP_RETRY_RESULT_v1.json')
          s=L('research/theory_results/RTK_C10_65S2_DIRECT_ONSET_ONE_STEP_PRODUCTION_CANARY_RESULT_v1.json')
          assert t['status']=='FROZEN_BEFORE_EXECUTION'
          assert k['classification']=='C10_65S2K_ONE_ACCEPTED_STEP_RETRY_PASS_SCOPED'
          assert s['classification']=='C10_65S2_DIRECT_ONSET_ONE_STEP_PRODUCTION_CANARY_FAIL_SCOPED'
          assert t['execution']['interval_multiplier']==100
          assert t['execution']['finite_short_interval_Mpc']==t['execution']['base_retry_width_Mpc']*100
          assert t['frozen_checks']['terminal_constraint_normalized_abs_max']==1e-8
          assert t['frozen_checks']['first_rhs_relative_tolerance_inherited']==5e-9
          print('C10_65S2L_FROZEN_CONTRACT_PASS')
          PY
      - name: Prepare pinned control and finite-interval trees
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_control
          git -C class_control reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_control/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_control/include/
          for x in apply_rtk_class_patch.py upgrade_rtk_inputs.py upgrade_rtk_nonlocal_initial_conditions.py upgrade_rtk_initial_conditions.py upgrade_rtk_matter_sources.py upgrade_rtk_gamma_root.py upgrade_rtk_spectra_endpoint.py apply_rtk_c10_source_export_patch.py apply_rtk_c10_65a_species_control_patch.py apply_rtk_c10_65e_tca_coefficient_export_patch.py apply_rtk_c10_65r0_opt_in_local_environment_export_patch.py apply_rtk_c10_65r1_in_class_completed_projector_parity_patch.py stabilize_rtk_c10_65r1_conditioned_projector.py; do python3 "rtk/$x" class_control; done
          make -C class_control -j2 class
          cp -a class_control class_s2l
          python3 rtk/apply_rtk_c10_65s2_production_canary_patch_v3.py class_s2l
          python3 rtk/apply_rtk_c10_65s2l_finite_interval_patch.py class_s2l
          python3 rtk/apply_rtk_c10_65s2i_adaptive_trace_patch.py class_s2l
          make -C class_s2l clean
          make -C class_s2l -j2 class
      - name: Write frozen-domain inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          L=lambda p: json.load(open(p)); plan=L('research/theory_targets/RTK_C10_65S2_PRODUCTION_IMPLEMENTATION_PLAN_v1.json'); p=L('research/state/current.json')['final_replay_result']['rtk']['params']; d=plan['scope']; ks=', '.join(format(float(x),'.17g') for x in d['k_Mpc_inv'])
          common=f'''h = {p['h']!r}\nT_cmb = 2.7255\nOmega_b = {p['Ob']!r}\nOmega_khronon = {p['Om']!r}\nlambda_D = {p['lam']!r}\nOmega_Lambda = 0.\nmodel = 2.\nN_ur = 3.046\nN_ncdm = 0\nOmega_k = 0.\nOmega_fld = 0.\nOmega_scf = 0.\nrecombination = RECFAST\nreio_parametrization = reio_camb\nz_reio = {p['zre']!r}\noutput = mPk,dTk,vTk\ngauge = newtonian\nA_s = {p['As']!r}\nn_s = {p['ns']!r}\nP_k_max_1/Mpc = 0.00031\nz_pk = 0\nk_output_values = {ks}\nwrite parameters = no\nbackground_verbose = 0\nperturbations_verbose = 0\nspectra_verbose = 0\nevolver = 0\nl_max_ur = 17\nc10_65r0_diag = 0\nc10_65r1_diag = 0\nc10_65r1_lambda_HL = {float(d['lambda_HL']):.17g}\nc10_65r1_Mc = {float(d['M_c_Mpc_inv']):.17g}\n'''
          for q in ('class_control/output','class_s2l/output'): pathlib.Path(q).mkdir(exist_ok=True)
          pathlib.Path('class_control/control.ini').write_text(common+'root = output/control_\n')
          extra=f'''c10_65s2_lambda_HL = {float(d['lambda_HL']):.17g}\nc10_65s2_Mc = {float(d['M_c_Mpc_inv']):.17g}\nc10_65s2_a_on = {float(d['a_on']):.17g}\n'''
          pathlib.Path('class_s2l/off.ini').write_text(common+'c10_65s2_canary = 0\n'+extra+'root = output/off_\n')
          pathlib.Path('class_s2l/on.ini').write_text(common+'c10_65s2_canary = 1\n'+extra+'root = output/on_\n')
          PY
      - name: Verify exact dormant OFF numeric-text identity
        run: |
          set -euo pipefail
          (cd class_control && ./class control.ini) > c10_65s2l_control.log 2>&1
          (cd class_s2l && env -u RTK_C10_65S2_OBSERVER_FILE -u RTK_C10_65S2I_TRACE_FILE ./class off.ini) > c10_65s2l_off.log 2>&1
          python3 - <<'PY'
          import glob,hashlib,json,pathlib
          def dig(p):
            q='\n'.join(x.strip() for x in pathlib.Path(p).read_text().splitlines() if x.strip() and not x.lstrip().startswith('#'))+'\n'; return hashlib.sha256(q.encode()).hexdigest()
          A=sorted(glob.glob('class_control/output/control_*perturbations*')); B=sorted(glob.glob('class_s2l/output/off_*perturbations*')); assert len(A)==len(B)==4
          rec=[]; ok=True
          for x,y in zip(A,B):
            dx,dy=dig(x),dig(y); z=dx==dy; ok &= z; rec.append({'control':x,'s2l_off':y,'control_sha256':dx,'s2l_off_sha256':dy,'identical':z})
          pathlib.Path('c10_65s2l_off_identity.json').write_text(json.dumps({'all_four_numeric_rows_sha256_identical':bool(ok),'records':rec},indent=2,sort_keys=True)+'\n')
          print(json.dumps(rec,indent=2)); assert ok
          PY
      - name: Recover s2k observer and execute finite short interval
        run: |
          set -euo pipefail
          mkdir -p s2k_artifact
          gh run download 33004868239 --repo pppuu7-cmd/Photospheric-Radius-Scale --name rtk-c10-65s2k-one-accepted-step-retry --dir s2k_artifact
          test -s s2k_artifact/c10_65s2k_observer.csv
          rm -f c10_65s2l_observer.csv c10_65s2l_trace.csv
          (cd class_s2l && RTK_C10_65S2_OBSERVER_FILE="$(pwd)/../c10_65s2l_observer.csv" RTK_C10_65S2I_TRACE_FILE="$(pwd)/../c10_65s2l_trace.csv" ./class on.ini) > c10_65s2l_on.log 2>&1
          test -s c10_65s2l_observer.csv
          test -s c10_65s2l_trace.csv
      - name: Analyze frozen finite-short-interval gate
        run: |
          set -euo pipefail
          python3 research/shadow/rtk_c10_65s2l_finite_short_interval_endpoint_stability_analyzer.py --observer c10_65s2l_observer.csv --s2k-observer s2k_artifact/c10_65s2k_observer.csv --trace c10_65s2l_trace.csv --off-identity c10_65s2l_off_identity.json --interval-patch rtk/apply_rtk_c10_65s2l_finite_interval_patch.py --trace-patch rtk/apply_rtk_c10_65s2i_adaptive_trace_patch.py --output research/theory_results/RTK_C10_65S2L_FINITE_SHORT_INTERVAL_ENDPOINT_STABILITY_RESULT_v1.json | tee c10_65s2l.log
          grep -q '^C10_65S2L_FINITE_SHORT_INTERVAL_ENDPOINT_STABILITY_PASS_SCOPED$' c10_65s2l.log
      - name: Add provenance and checkpoint
        if: always()
        run: |
          set -euo pipefail
          p='research/theory_results/RTK_C10_65S2L_FINITE_SHORT_INTERVAL_ENDPOINT_STABILITY_RESULT_v1.json'; [ -f "$p" ] || exit 0
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          p=pathlib.Path('research/theory_results/RTK_C10_65S2L_FINITE_SHORT_INTERVAL_ENDPOINT_STABILITY_RESULT_v1.json'); d=json.loads(p.read_text())
          d['provenance']={'repo_head_at_job_start':pathlib.Path('c10_65s2l_head.txt').read_text().strip(),'class_upstream_sha':os.environ['RTK_CLASS_UPSTREAM_SHA'],'workflow':'rtk-c10-65s2l-finite-short-interval-endpoint-stability.yml','github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'observer_sha256':hashlib.sha256(pathlib.Path('c10_65s2l_observer.csv').read_bytes()).hexdigest(),'trace_sha256':hashlib.sha256(pathlib.Path('c10_65s2l_trace.csv').read_bytes()).hexdigest(),'source_s2k_run_id':33004868239,'interval_patch':'rtk/apply_rtk_c10_65s2l_finite_interval_patch.py','trace_patch':'rtk/apply_rtk_c10_65s2i_adaptive_trace_patch.py','analyzer':'research/shadow/rtk_c10_65s2l_finite_short_interval_endpoint_stability_analyzer.py','threshold_changed':False}
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          lines=[]
          for k,q in sorted(d.get('adaptive_trace',{}).items()): lines.append(f"- k={k}: accepted={q['accepted_substeps']}, rejected={q['rejected_trials']}, min_hdid={q['minimum_hdid']}")
          tc=[]
          for k,q in sorted(d.get('terminal_constraints',{}).items()): tc.append(f"- k={k}: A={q['A_norm']:.3e}, H={q['H_norm']:.3e}, M={q['M_norm']:.3e}")
          ck=pathlib.Path('research/checkpoints/RTK_C10_65S2L_FINITE_SHORT_INTERVAL_ENDPOINT_STABILITY_2026-08-26T1932Z.md')
          ck.write_text('# RTK C10.65s2l finite-short-interval endpoint stability checkpoint\n\nClassification: `'+d['classification']+'`. Original C10.65s2 remains `'+d['original_s2_classification_preserved']+'`; C10.65s2k remains `'+d['s2k_classification_preserved']+'`.\n\nThe interval and terminal normalized constraint bound were frozen before execution: interval `3.53993611477497e-08` Mpc (100 x s2k width), endpoint |A|,|H|,|M| <= `1e-8`. Equations, state ownership, approximation criteria and perturbation tolerance were unchanged.\n\nAdaptive trace:\n'+'\n'.join(lines)+'\n\nTerminal normalized constraints:\n'+'\n'.join(tc)+'\n\nThis gate does not bound intra-step or accepted-step peak constraints and is not a long-time stability claim.\n')
          PY
      - name: Persist result and checkpoint
        if: always()
        run: |
          set -euo pipefail
          p='research/theory_results/RTK_C10_65S2L_FINITE_SHORT_INTERVAL_ENDPOINT_STABILITY_RESULT_v1.json'; ck='research/checkpoints/RTK_C10_65S2L_FINITE_SHORT_INTERVAL_ENDPOINT_STABILITY_2026-08-26T1932Z.md'; [ -f "$p" ] || exit 0
          cp "$p" /tmp/r.json; [ -f "$ck" ] && cp "$ck" /tmp/c.md || true
          for n in 1 2 3 4 5; do
            git fetch origin rtk-class-build; git reset --hard origin/rtk-class-build; cp /tmp/r.json "$p"; [ -f /tmp/c.md ] && cp /tmp/c.md "$ck" || true
            git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add "$p"; [ -f "$ck" ] && git add "$ck" || true; git commit -m 'Record C10.65s2l finite-short-interval endpoint stability' || exit 0; git push origin HEAD:rtk-class-build && exit 0
          done; exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c10-65s2l-finite-short-interval-endpoint-stability
          path: |
            c10_65s2l_control.log
            c10_65s2l_off.log
            c10_65s2l_on.log
            c10_65s2l.log
            c10_65s2l_observer.csv
            c10_65s2l_trace.csv
            c10_65s2l_off_identity.json
            research/theory_results/RTK_C10_65S2L_FINITE_SHORT_INTERVAL_ENDPOINT_STABILITY_RESULT_v1.json
          if-no-files-found: warn
