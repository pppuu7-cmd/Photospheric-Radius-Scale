name: RTK B9 LCDM recenter-v7 half-scale stationarity

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-b9-lcdm-recenter-v7-half-scale-trigger.txt'

permissions:
  contents: read

concurrency:
  group: rtk-b9-lcdm-recenter-v7-half-scale-stationarity
  cancel-in-progress: false

jobs:
  half-scale-hessian:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '300'
      RTK_PLANCK_DATA: 'planck_data'
      RTK_B9_STENCIL_SCALE: '0.5'
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      RTK_PANTHEON_SHA: '7eb29dc87ba223b4ec8457cd3cccba1216c36fb7'
      RTK_PLANCK_SHA256: '0b73171e3acc671c28184466a45485a2d1c1d93676b832abdfe688c7b04024e6'
      RTK_NUMPY_VERSION: '2.5.2'
      RTK_SCIPY_VERSION: '1.18.0'
      RTK_PYTHON_VERSION: '3.12.3'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Require frozen v7 half-scale audit target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          a=json.load(open('research/robustness/B9_LCDM_RECENTER_V7_HALF_SCALE_AUDIT_TARGET_v1.json'))
          t=json.load(open('research/robustness/B9_LCDM_RECENTER_TARGET_v7.json'))
          assert a['classification']=='B9_LCDM_RECENTER_V7_HALF_SCALE_AUDIT_TARGET_V1_FROZEN'
          assert a['status']=='FROZEN_AFTER_V7_BASE_AND_EIGENMODE_RAYS_BEFORE_HALF_SCALE_HESSIAN'
          assert a['parent_rays']['classification']=='B9_LCDM_RECENTER_V7_BASE_EIGENMODE_RAYS_NO_DESCENT_GT_0P005'
          assert a['parent_rays']['max_exact_improvement_eff']<=a['recenter_tolerance_S']==0.005
          assert a['audit_stencil_scale']==0.5
          assert a['center']==t['center']
          assert a['decision_rule']['center_must_remain_unchanged'] is True
          print('B9_LCDM_V7_HALF_SCALE_TARGET_PASS',a['center'])
          PY
          python3 -m py_compile rtk/b9_rtk_stationarity_hessian.py rtk/prepare_inference_core.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee b9_lcdm_recenter_v7_half_scale_provenance.txt

      - name: Prepare pinned hardened CLASS tree and derive audited LCDM worker
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_public
          git -C class_public reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          git clone https://github.com/dscolnic/Pantheon.git class_public/pantheon
          git -C class_public/pantheon reset --hard "$RTK_PANTHEON_SHA"
          test "$(git -C class_public rev-parse HEAD)" = "$RTK_CLASS_UPSTREAM_SHA"
          test "$(git -C class_public/pantheon rev-parse HEAD)" = "$RTK_PANTHEON_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_nonlocal_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py rtk/prepare_inference_core.py class_public/
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cp rtk/b9_rtk_stationarity_hessian.py class_public/b9_lcdm_stationarity_hessian.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('class_public/b9_lcdm_stationarity_hessian.py')
          s=p.read_text()
          reps={
            "MODEL='RTK'":"MODEL='LCDM'",
            "B9_RTK_RECENTER_TARGET_v1.json":"B9_LCDM_RECENTER_TARGET_v7.json",
            "FROZEN_AFTER_RTK_REOPTIMIZATION_BEFORE_LCDM_RESULT_AND_BEFORE_RTK_STATIONARITY":"FROZEN_AFTER_LCDM_RECENTER_V6_HALF_IMPROVEMENT_BEFORE_V7_STATIONARITY",
            "AXES=['loglam','h','Ob','Om','As','ns','zre']":"AXES=['h','Ob','Om','As','ns','zre']",
            "'b9_rtk_stationarity'":"'b9_lcdm_recenter_v7_stationarity'",
            "'classification':'B9_RTK_STATIONARITY_HESSIAN_COMPLETE'":"'classification':'B9_LCDM_RECENTER_V7_STATIONARITY_HESSIAN_COMPLETE'",
            "B9_RTK_STATIONARITY_HESSIAN_COMPLETE":"B9_LCDM_RECENTER_V7_STATIONARITY_HESSIAN_COMPLETE",
            "'model':'RTK'":"'model':'LCDM'",
            "RTK {label}: failed":"LCDM {label}: failed",
          }
          for a,b in reps.items():
            if a not in s: raise SystemExit(f'expected worker token missing: {a}')
            s=s.replace(a,b)
          p.write_text(s)
          PY
          python3 -m py_compile class_public/b9_lcdm_stationarity_hessian.py
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'A_s_ad\|n_s_ad' inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py
          grep -q 'RTK_PLANCK_DATA' inference_core.py

      - name: Build CLASS and install locked likelihood stack
        run: |
          set -euo pipefail
          make -C class_public -j2 class
          test "$(python3 -c 'import platform;print(platform.python_version())')" = "$RTK_PYTHON_VERSION"
          python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' "numpy==$RTK_NUMPY_VERSION" "scipy==$RTK_SCIPY_VERSION"
          python3 -m pip freeze | sort | tee b9_lcdm_recenter_v7_half_scale_pip_freeze.txt

      - name: Download and verify Planck R3 baseline
        working-directory: class_public
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          echo "$RTK_PLANCK_SHA256  planck.tar.gz" | sha256sum -c -
          mkdir planck_data && tar -xzf planck.tar.gz -C planck_data
          test -d planck_data/baseline/plc_3.0/lensing/smicadx12_Dec5_ftl_mv2_ndclpp_p_teb_consext8.clik_lensing

      - name: Run exact B9 LCDM recenter-v7 half-scale Hessian
        working-directory: class_public
        run: |
          set -euo pipefail
          python3 b9_lcdm_stationarity_hessian.py | tee ../b9_lcdm_recenter_v7_half_scale.log
          grep -q 'B9_LCDM_RECENTER_V7_STATIONARITY_HESSIAN_COMPLETE 0.5' ../b9_lcdm_recenter_v7_half_scale.log
          python3 - <<'PY'
          import json
          s=json.load(open('../output/b9_lcdm_recenter_v7_stationarity/scale_0.5/summary.json'))
          a=json.load(open('../research/robustness/B9_LCDM_RECENTER_V7_HALF_SCALE_AUDIT_TARGET_v1.json'))
          assert s['model']=='LCDM' and s['center']==a['center'] and s['objective']==a['objective']
          assert s['stencil_scale']==0.5
          assert s['center_replay_abs_error']<=a['fresh_tree_replay_abs_tolerance']
          imp=s['eff']['best_improvement']; pd=s['eff']['positive_definite']
          if imp>a['recenter_tolerance_S']:
              cls='B9_LCDM_V7_HALF_SCALE_RECENTER_REQUIRED'
          elif pd:
              cls='B9_LCDM_V7_HALF_SCALE_STATIONARITY_RESOLUTION_PASS'
          else:
              cls='B9_LCDM_V7_HALF_SCALE_NO_DESCENT_BUT_NON_PD'
          print('B9_LCDM_V7_HALF_SCALE_COMPLETE',cls,s['eff']['best_exact_S'],imp,pd,s['eff']['eigenvalues_y'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-b9-lcdm-recenter-v7-half-scale-stationarity
          path: |
            b9_lcdm_recenter_v7_half_scale.log
            b9_lcdm_recenter_v7_half_scale_provenance.txt
            b9_lcdm_recenter_v7_half_scale_pip_freeze.txt
            class_public/b9_lcdm_stationarity_hessian.py
            output/b9_lcdm_recenter_v7_stationarity/scale_0.5/
          if-no-files-found: warn
