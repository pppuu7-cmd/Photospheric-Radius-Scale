name: RTK C9 projectable HMT A constraint measure audit

on:
  push:
    branches: [rtk-class-build]
    paths:
      - 'research/triggers/RTK_C9_PROJECTABLE_HMT_A_CONSTRAINT_MEASURE_TRIGGER_v1.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - name: Verify frozen target exists
        run: |
          test -f research/theory_targets/RTK_C9_PROJECTABLE_HMT_A_CONSTRAINT_MEASURE_TARGET_v1.json
          python - <<'PY'
          import json
          x=json.load(open('research/theory_targets/RTK_C9_PROJECTABLE_HMT_A_CONSTRAINT_MEASURE_TARGET_v1.json'))
          assert x['frozen_before_execution'] is True
          assert 'do not close full C9' in x['frozen_nonclaims']
          print('frozen target verified')
          PY
      - name: Run A-constraint measure audit
        run: python research/shadow/rtk_c9_projectable_hmt_a_constraint_measure_audit.py
      - name: Verify scoped semantics
        run: |
          python - <<'PY'
          import json
          x=json.load(open('research/theory_results/RTK_C9_PROJECTABLE_HMT_A_CONSTRAINT_MEASURE_RESULT_v1.json'))
          assert x['pass_scoped'] is True
          assert x['classification']=='RTK_C9_PROJECTABLE_HMT_A_CONSTRAINT_FORMAL_DELTA_REDUCTION_PASS_SCOPED_REDUCED_MEASURE_OPEN'
          c=x['checks']
          assert c['formal_linear_multiplier_integration_imposes_delta_constraint'] is True
          assert c['unique_full_second_class_functional_determinant_source_locked'] is False
          assert c['full_HMT_one_loop_evaluable'] is False
          assert c['full_C9_closed'] is False
          assert c['soft_s_retest_allowed'] is False
          assert c['production_k003_unblocked'] is False
          print('scoped semantics verified')
          PY
      - name: Persist result checkpoint provenance
        run: |
          git config user.name 'rtk-c9-actions'
          git config user.email 'actions@users.noreply.github.com'
          git add research/theory_results/RTK_C9_PROJECTABLE_HMT_A_CONSTRAINT_MEASURE_RESULT_v1.json \
                  research/checkpoints/RTK_C9_PROJECTABLE_HMT_A_CONSTRAINT_MEASURE_CHECKPOINT_v1.json \
                  research/provenance/RTK_C9_PROJECTABLE_HMT_A_CONSTRAINT_MEASURE_PROVENANCE_v1.json
          if git diff --cached --quiet; then
            echo 'No persisted changes required'
          else
            git commit -m 'Record C9 HMT A-constraint measure audit'
            for i in 1 2 3 4 5; do
              if git push origin HEAD:rtk-class-build; then exit 0; fi
              git pull --rebase origin rtk-class-build
              sleep 2
            done
            exit 1
          fi
