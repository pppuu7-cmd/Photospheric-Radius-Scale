name: RTK B4 neutrino RTK recenter base stationarity

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-b4-neutrino-rtk-recenter-base-trigger.txt'

permissions:
  contents: read

concurrency:
  group: rtk-b4-neutrino-rtk-recenter-base
  cancel-in-progress: false

jobs:
  recentered-base-hessian:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '300'
      RTK_PLANCK_DATA: 'planck_data'
      RTK_B4_STENCIL_SCALE: '1.0'
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      RTK_PANTHEON_SHA: '7eb29dc87ba223b4ec8457cd3cccba1216c36fb7'
      RTK_PLANCK_SHA256: '0b73171e3acc671c28184466a45485a2d1c1d93676b832abdfe688c7b04024e6'
      RTK_NUMPY_VERSION: '2.5.2'
      RTK_SCIPY_VERSION: '1.18.0'
      RTK_PYTHON_VERSION: '3.12.3'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Require frozen RTK recenter target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='research/robustness/b4_neutrino_rtk_recenter_target_v1.json'
          t=json.load(open(p))
          assert t['classification']=='B4_NEUTRINO_RTK_RECENTER_TARGET_V1_FROZEN'
          assert t['parent_base_run_id']==32236524767
          assert t['parent_artifact_id']==9364818690
          assert t['parent_best_improvement_eff']>t['recenter_tolerance_S']
          assert t['parent_best_label']=='newton_trust_eff'
          assert t['objective']=='matched-ultra-linstep2+dense-BOSS+nu0p06-additive-v1'
          print('B4_RTK_RECENTER_TARGET_PASS',t['models']['RTK']['center'])
          PY
          cp research/robustness/b4_neutrino_rtk_recenter_target_v1.json research/robustness/b4_neutrino_stationarity_targets_v1.json
          python3 -m py_compile rtk/neutrino_stationarity_hessian.py rtk/prepare_inference_core.py

      - name: Prepare pinned hardened CLASS tree
        run: |
          set -euo pipefail
          echo "research_source_commit=$(git rev-parse HEAD)" | tee b4_rtk_recenter_provenance.txt
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_public
          git -C class_public reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          git clone https://github.com/dscolnic/Pantheon.git class_public/pantheon
          git -C class_public/pantheon reset --hard "$RTK_PANTHEON_SHA"
          test "$(git -C class_public rev-parse HEAD)" = "$RTK_CLASS_UPSTREAM_SHA"
          test "$(git -C class_public/pantheon rev-parse HEAD)" = "$RTK_PANTHEON_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_nonlocal_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py rtk/prepare_inference_core.py rtk/neutrino_stationarity_hessian.py class_public/
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'A_s_ad\|n_s_ad' inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py
          grep -q "if r.get('ok')" inference_core.py
          grep -q 'RTK_PLANCK_DATA' inference_core.py

      - name: Build CLASS and locked runtime
        run: |
          set -euo pipefail
          make -C class_public -j2 class
          test "$(python3 -c 'import platform;print(platform.python_version())')" = "$RTK_PYTHON_VERSION"
          python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' "numpy==$RTK_NUMPY_VERSION" "scipy==$RTK_SCIPY_VERSION"
          python3 -m pip freeze | sort | tee b4_rtk_recenter_pip_freeze.txt

      - name: Download and verify Planck baseline
        working-directory: class_public
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          echo "$RTK_PLANCK_SHA256  planck.tar.gz" | sha256sum -c -
          mkdir planck_data && tar -xzf planck.tar.gz -C planck_data

      - name: Run recentered exact RTK base Hessian
        working-directory: class_public
        run: |
          set -euo pipefail
          python3 neutrino_stationarity_hessian.py RTK | tee ../b4_rtk_recenter_base.log
          grep -q 'B4_NEUTRINO_STATIONARITY_HESSIAN_COMPLETE RTK 1.0' ../b4_rtk_recenter_base.log
          python3 - <<'PY'
          import json
          s=json.load(open('../output/b4_neutrino_stationarity/rtk/scale_1/summary.json'))
          t=json.load(open('../research/robustness/b4_neutrino_rtk_recenter_target_v1.json'))
          assert s['center']==t['models']['RTK']['center']
          assert s['objective']==t['objective']
          print('B4_RTK_RECENTER_BASE_COMPLETE',s['eff']['best_exact_S'],s['eff']['best_improvement'],s['eff']['positive_definite'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-b4-neutrino-rtk-recenter-base
          path: |
            b4_rtk_recenter_base.log
            b4_rtk_recenter_provenance.txt
            b4_rtk_recenter_pip_freeze.txt
            output/b4_neutrino_stationarity/rtk/scale_1/
          if-no-files-found: warn
