name: RTK Route-B U1 filtered-matter antisymmetric leading rank window

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-filtered-matter-antisymmetric-leading-rank-window-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run conditional antisymmetric leading-rank theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_filtered_matter_antisymmetric_leading_rank_window_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_filtered_matter_antisymmetric_leading_rank_window_provenance.txt
          python3 rtk/route_b_u1_filtered_matter_antisymmetric_leading_rank_window_gate.py | tee u1_filtered_matter_antisymmetric_leading_rank_window.log
          grep -q '^RTK_ROUTE_B_U1_FILTERED_MATTER_ANTISYMMETRIC_LEADING_RANK_WINDOW_PASS ' u1_filtered_matter_antisymmetric_leading_rank_window.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_filtered_matter_antisymmetric_leading_rank_window_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_FILTERED_MATTER_ANTISYMMETRIC_LEADING_RANK_WINDOW_PASS'
          assert r['exact_determinant']=='det B_lead=(b+x/M_c^2)^2'
          assert any('does not establish physical k22=0' in z for z in r['non_claims'])
          print('U1_FILTERED_MATTER_ANTISYMMETRIC_LEADING_RANK_WINDOW_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-filtered-matter-antisymmetric-leading-rank-window
          path: |
            u1_filtered_matter_antisymmetric_leading_rank_window.log
            u1_filtered_matter_antisymmetric_leading_rank_window_result.json
            u1_filtered_matter_antisymmetric_leading_rank_window_provenance.txt
            rtk/route_b_u1_filtered_matter_antisymmetric_leading_rank_window_gate.py
          if-no-files-found: error
