name: RTK current observable signature pair

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rtk-signature-atlas-current-pair.yml'

permissions:
  contents: read

jobs:
  signature-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1

      - name: Prepare pinned patched CLASS
        run: |
          set -euo pipefail
          echo "RTK_SOURCE_SHA=$(git rev-parse HEAD)" | tee signature_provenance.txt
          grep -q 'required exact P(k,z) output' rtk/build_signature_atlas_pair.py
          grep -q 'baryon drag stops at z' rtk/build_signature_atlas_pair.py
          echo 'HARDENED_SIGNATURE_BUILDER=exact-z+drag-epoch-v1' | tee -a signature_provenance.txt
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_public
          git -C class_public reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          test "$(git -C class_public rev-parse HEAD)" = "$RTK_CLASS_UPSTREAM_SHA"
          echo "CLASS_UPSTREAM_SHA=$(git -C class_public rev-parse HEAD)" | tee -a signature_provenance.txt
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/build_signature_atlas_pair.py class_public/

      - name: Build CLASS
        working-directory: class_public
        run: make -j2 class

      - name: Build matched current-center signature pair
        working-directory: class_public
        run: |
          set -o pipefail
          python3 build_signature_atlas_pair.py | tee ../signature_pair.log
          grep -q RTK_SIGNATURE_ATLAS_COMPLETE ../signature_pair.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-signature-atlas-current-pair
          path: |
            signature_pair.log
            signature_provenance.txt
            class_public/output/signature_atlas/current_pair.json
            class_public/signature_rtk.log
            class_public/signature_lcdm.log
          if-no-files-found: warn
