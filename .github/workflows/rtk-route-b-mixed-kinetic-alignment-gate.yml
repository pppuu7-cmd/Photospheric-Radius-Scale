name: RTK Route-B mixed-kinetic alignment gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-mixed-kinetic-alignment-gate-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run mixed-kinetic alignment theorem
        run: |
          set -euo pipefail
          echo "RTK_SOURCE_SHA=$(git rev-parse HEAD)" | tee rtk_mixed_kinetic_alignment_provenance.txt
          python -m py_compile rtk/route_b_mixed_kinetic_alignment_gate.py
          python rtk/route_b_mixed_kinetic_alignment_gate.py | tee rtk_mixed_kinetic_alignment.log
          grep -q '^RTK_ROUTE_B_MIXED_KINETIC_ALIGNMENT_GATE_PASS ' rtk_mixed_kinetic_alignment.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-mixed-kinetic-alignment-gate
          path: |
            rtk_mixed_kinetic_alignment.log
            rtk_mixed_kinetic_alignment_provenance.txt
          if-no-files-found: error
