name: RTK Route-B U1 elliptic compensator primary mixing Dirac audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-elliptic-compensator-primary-mixing-dirac-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Require frozen canonical parent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/RTK_U1_ELLIPTIC_MATTER_COMPENSATOR_CANONICAL_v1.json'))
          assert t['status']=='FROZEN_BEFORE_FULL_COUPLED_DIRAC'
          assert t['parent_canonical_run_id']==32597148540
          print('ELLIPTIC_CANONICAL_PARENT_PASS')
          PY
      - name: Run primary-mixing Dirac audit
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_elliptic_compensator_primary_mixing_dirac_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_elliptic_compensator_primary_mixing_dirac_provenance.txt
          python3 rtk/route_b_u1_elliptic_compensator_primary_mixing_dirac_gate.py | tee u1_elliptic_compensator_primary_mixing_dirac.log
          grep -q '^RTK_ROUTE_B_U1_ELLIPTIC_COMPENSATOR_PRIMARY_MIXING_DIRAC_AUDIT_PASS ' u1_elliptic_compensator_primary_mixing_dirac.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_elliptic_compensator_primary_mixing_dirac_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_ELLIPTIC_COMPENSATOR_PRIMARY_MIXING_DIRAC_AUDIT_PASS'
          assert r['exact_nonzero_primary_bracket'].startswith('{G,p_Q}=+1')
          assert 'not yet justified' in r['basis_correction']
          print('U1_ELLIPTIC_PRIMARY_MIXING_DIRAC_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-elliptic-compensator-primary-mixing-dirac
          path: |
            u1_elliptic_compensator_primary_mixing_dirac.log
            u1_elliptic_compensator_primary_mixing_dirac_result.json
            u1_elliptic_compensator_primary_mixing_dirac_provenance.txt
            research/RTK_U1_ELLIPTIC_MATTER_COMPENSATOR_CANONICAL_v1.json
            rtk/route_b_u1_elliptic_compensator_primary_mixing_dirac_gate.py
          if-no-files-found: error
