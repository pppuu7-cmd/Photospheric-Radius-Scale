name: RTK Route-B U1 filtered-matter ordinary multifluid scope

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-filtered-matter-ordinary-multifluid-scope-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run ordinary-matter multifluid scope theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_filtered_matter_ordinary_multifluid_scope_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_filtered_matter_ordinary_multifluid_scope_provenance.txt
          python3 rtk/route_b_u1_filtered_matter_ordinary_multifluid_scope_gate.py | tee u1_filtered_matter_ordinary_multifluid_scope.log
          grep -q '^RTK_ROUTE_B_U1_FILTERED_MATTER_ORDINARY_MULTIFLUID_SCOPE_PASS ' u1_filtered_matter_ordinary_multifluid_scope.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_filtered_matter_ordinary_multifluid_scope_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_FILTERED_MATTER_ORDINARY_MULTIFLUID_SCOPE_PASS'
          assert 'neutral RTK scalar' in r['frozen_candidate_scope']['excluded_by_architecture']
          assert r['d3_weights']['radiation_w1over3']=='(3/2)*rho'
          assert any('does not choose M_c' in z for z in r['non_claims'])
          print('U1_FILTERED_MATTER_ORDINARY_MULTIFLUID_SCOPE_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-filtered-matter-ordinary-multifluid-scope
          path: |
            u1_filtered_matter_ordinary_multifluid_scope.log
            u1_filtered_matter_ordinary_multifluid_scope_result.json
            u1_filtered_matter_ordinary_multifluid_scope_provenance.txt
            rtk/route_b_u1_filtered_matter_ordinary_multifluid_scope_gate.py
          if-no-files-found: error
