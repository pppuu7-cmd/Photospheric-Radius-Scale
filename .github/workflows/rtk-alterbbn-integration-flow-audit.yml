name: RTK pinned AlterBBN integration-flow audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-alterbbn-integration-flow-audit-trigger.txt'

permissions:
  contents: read

concurrency:
  group: rtk-alterbbn-integration-flow-audit
  cancel-in-progress: true

jobs:
  source-flow-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ALTERBBN_URL: 'https://data.mendeley.com/public-files/datasets/k7j3b9zyvf/files/62eaf2d8-31d4-448c-8a8c-6c291a67a3f5/file_downloaded'
      ALTERBBN_SHA256: '2bcb7d2e3f4a74f59cd589e60f0923892bb90296a793f80016897405920c5fae'
      ALTERBBN_BYTES: '2586656'
      ALTERBBN_FILENAME: 'alterbbn_v2.2.tar.xz'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - name: Verify exact published source lock
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/audit_alterbbn_integration_flow.py
          curl -L --fail --retry 3 --retry-delay 2 -o "$ALTERBBN_FILENAME" "$ALTERBBN_URL"
          test "$(stat -c %s "$ALTERBBN_FILENAME")" = "$ALTERBBN_BYTES"
          echo "$ALTERBBN_SHA256  $ALTERBBN_FILENAME" | sha256sum -c -
          tar -xJf "$ALTERBBN_FILENAME"
          grep -q 'AlterBBN Version 2.2 (16th July 2019)' alterbbn_v2.2/README
      - name: Audit central-call and accepted-step integration flow
        run: |
          set -euo pipefail
          python3 rtk/audit_alterbbn_integration_flow.py alterbbn_v2.2 | tee alterbbn_integration_flow_audit.log
          grep -q ALTERBBN_V2_2_INTEGRATION_FLOW_AUDIT_PASS alterbbn_integration_flow_audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-alterbbn-integration-flow-audit
          path: |
            alterbbn_integration_flow_audit.json
            alterbbn_integration_flow_audit.log
          if-no-files-found: error
