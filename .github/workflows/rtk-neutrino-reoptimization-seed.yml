name: RTK minimal-neutrino paired reoptimization seed

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-neutrino-reoptimization-trigger.txt'

permissions:
  contents: read

concurrency:
  group: rtk-neutrino-reoptimization-seed
  cancel-in-progress: false

jobs:
  seed:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [RTK, LCDM]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '300'
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      RTK_PANTHEON_SHA: '7eb29dc87ba223b4ec8457cd3cccba1216c36fb7'
      RTK_PLANCK_SHA256: '0b73171e3acc671c28184466a45485a2d1c1d93676b832abdfe688c7b04024e6'
      RTK_NUMPY_VERSION: '2.5.2'
      RTK_SCIPY_VERSION: '1.18.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1

      - name: Require frozen B4 protocol and A4/A5 state
        run: |
          set -euo pipefail
          test -f research/robustness/RTK_MINIMAL_NEUTRINO_REOPTIMIZATION_PROTOCOL_v1.md
          python3 - <<'PY'
          import json
          s=json.load(open('research/state/current.json'))
          assert s['comparison']['interior_minimum_certified'] is True
          assert s['comparison']['final_replay_certified'] is True
          assert s['comparison']['final_replay_run_id']==32148894768
          print('B4_MASSLESS_FREEZE_PREREQUISITES_PASS')
          PY
          python3 -m py_compile rtk/neutrino_reoptimization_seed.py rtk/prepare_inference_core.py

      - name: Prepare pinned hardened CLASS tree
        run: |
          set -euo pipefail
          echo "research_source_commit=$(git rev-parse HEAD)" | tee neutrino_seed_provenance.txt
          echo "model=${{ matrix.model }}" | tee -a neutrino_seed_provenance.txt
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_public
          git -C class_public reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          git clone https://github.com/dscolnic/Pantheon.git class_public/pantheon
          git -C class_public/pantheon reset --hard "$RTK_PANTHEON_SHA"
          test "$(git -C class_public rev-parse HEAD)" = "$RTK_CLASS_UPSTREAM_SHA"
          test "$(git -C class_public/pantheon rev-parse HEAD)" = "$RTK_PANTHEON_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_nonlocal_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py rtk/prepare_inference_core.py rtk/neutrino_reoptimization_seed.py class_public/
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'A_s_ad\|n_s_ad' inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py
          grep -q "if r.get('ok')" inference_core.py
          grep -q 'pba->V_prime_ini_nlde = 0.;' source/input.c

      - name: Build CLASS
        working-directory: class_public
        run: make -j2 class

      - name: Install pinned likelihood dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            'clipy-like==0.15' \
            "numpy==$RTK_NUMPY_VERSION" \
            "scipy==$RTK_SCIPY_VERSION"
          python3 - <<'PY'
          import numpy,scipy,os
          assert numpy.__version__==os.environ['RTK_NUMPY_VERSION']
          assert scipy.__version__==os.environ['RTK_SCIPY_VERSION']
          PY

      - name: Download and verify Planck baseline
        working-directory: class_public
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          echo "$RTK_PLANCK_SHA256  planck.tar.gz" | sha256sum -c -
          mkdir planck_data && tar -xzf planck.tar.gz -C planck_data

      - name: Run exact neutrino seed reoptimization
        working-directory: class_public
        run: |
          set -euo pipefail
          python3 neutrino_reoptimization_seed.py '${{ matrix.model }}' | tee '../neutrino_seed_${{ matrix.model }}.log'
          grep -q "B4_NEUTRINO_REOPTIMIZATION_SEED_COMPLETE ${{ matrix.model }}" '../neutrino_seed_${{ matrix.model }}.log'
          python3 - <<'PY'
          import json
          m='${{ matrix.model }}'.lower()
          p=f'../output/neutrino_reoptimization_seed/{m}/summary.json'
          s=json.load(open(p))
          assert s['status']=='complete'
          assert s['objective']=='matched-ultra-linstep2+dense-BOSS+nu0p06-additive-v1'
          assert s['neutrino']['m_ncdm_eV']==0.06
          assert s['warning'].startswith('Seed optimization only')
          print('B4_NEUTRINO_SEED_ARTIFACT_PASS',s['model'],s['best_score_eff'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-neutrino-reoptimization-seed-${{ matrix.model }}
          path: |
            neutrino_seed_provenance.txt
            neutrino_seed_${{ matrix.model }}.log
            output/neutrino_reoptimization_seed/rtk/
            output/neutrino_reoptimization_seed/lcdm/
          if-no-files-found: warn
