name: RTK Stage 4D1 symmetric tight profile

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rtk-stage4d1-symmetric-tight.yml'

jobs:
  refine:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - mapping: eff
            lambda_D: '100000000'
            h: '0.6904528082085615'
            Ob: '0.04688114994443272'
            Om: '0.2532317274593179'
            As: '2.0611028771123516e-9'
            ns: '0.9640631421252662'
            zre: '6.613591982233826'
          - mapping: k01
            lambda_D: '100000000'
            h: '0.6904831824209583'
            Ob: '0.04688439086484019'
            Om: '0.25322450671130364'
            As: '2.0634761115937965e-9'
            ns: '0.963638188101714'
            zre: '6.668120242815578'
          - mapping: k01
            lambda_D: '30000'
            h: '0.6905802910391277'
            Ob: '0.04684163640622535'
            Om: '0.2529201285589534'
            As: '2.0630563560740213e-9'
            ns: '0.9640474757333444'
            zre: '6.6839724497605335'
          - mapping: k01
            lambda_D: '100000'
            h: '0.6901873895028806'
            Ob: '0.04688758336412194'
            Om: '0.253421603515163'
            As: '2.062306350250812e-9'
            ns: '0.9638955372522343'
            zre: '6.647719070471404'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
      - name: Prepare exact likelihood tree
        run: |
          git clone --depth 1 --branch nonlocal https://github.com/dirian/class_public.git class_public
          git clone --depth 1 https://github.com/dscolnic/Pantheon.git class_public/pantheon
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py class_public/joint_profile_runner.py
          cp rtk/prepare_inference_core.py class_public/prepare_inference_core.py
          cp rtk/stage4d1_tight_refine.py class_public/stage4d1_tight_refine.py
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
      - name: Build CLASS
        working-directory: class_public
        run: make -j2 class
      - name: Install likelihood dependencies
        run: python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' numpy scipy
      - name: Download Planck package
        working-directory: class_public
        run: |
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          mkdir planck_data
          tar -xzf planck.tar.gz -C planck_data
      - name: Run symmetric tight refinement
        working-directory: class_public
        run: |
          python3 stage4d1_tight_refine.py planck_data '${{ matrix.lambda_D }}' '${{ matrix.mapping }}' \
            '${{ matrix.h }}' '${{ matrix.Ob }}' '${{ matrix.Om }}' '${{ matrix.As }}' '${{ matrix.ns }}' '${{ matrix.zre }}' \
            | tee ../symmetric_tight_${{ matrix.mapping }}_${{ matrix.lambda_D }}.log
          grep -q STAGE4D1_TIGHT_PASS ../symmetric_tight_${{ matrix.mapping }}_${{ matrix.lambda_D }}.log
          find output/stage4d1_tight/${{ matrix.mapping }} -name refine_summary.json -print -exec cat {} \;
      - name: Upload refinement artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtk-stage4d1-symmetric-tight-${{ matrix.mapping }}-${{ matrix.lambda_D }}
          path: |
            symmetric_tight_${{ matrix.mapping }}_${{ matrix.lambda_D }}.log
            class_public/output/stage4d1_tight/${{ matrix.mapping }}/**/refine_summary.json
            class_public/output/stage4d1_tight/${{ matrix.mapping }}/**/refine_trace.csv
          if-no-files-found: error
