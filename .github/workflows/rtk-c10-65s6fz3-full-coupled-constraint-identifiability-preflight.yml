name: RTK C10.65s6fZ3 full coupled constraint identifiability preflight

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - 'research/theory_targets/RTK_C10_65S6FZ3_FULL_COUPLED_CONSTRAINT_IDENTIFIABILITY_PREFLIGHT_TARGET_v1.json'
      - 'research/shadow/rtk_c10_65s6fz3_full_coupled_constraint_identifiability_preflight.py'
      - '.github/workflows/rtk-c10-65s6fz3-full-coupled-constraint-identifiability-preflight.yml'
      - '.github/rtk-c10-65s6fz3-full-coupled-constraint-identifiability-preflight-trigger.txt'

permissions:
  contents: write

jobs:
  theorem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact-symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy==1.13.3
      - name: Verify frozen target
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_65S6FZ3_FULL_COUPLED_CONSTRAINT_IDENTIFIABILITY_PREFLIGHT_TARGET_v1.json'))
          assert t['gate']=='C10.65s6fZ3'
          assert t['parent']=='C10_65S6FZ2_PROJECTABLE_GAUGE_REALIZATION_TEMPLATE_CLASS_PASS_SCOPED'
          g=t['guards']
          assert g['no_soft_s_retest'] is True
          assert g['no_k003_production'] is True
          assert g['no_failed_observable_fitting'] is True
          assert g['no_choice_of_lambda_as_rtk_value'] is True
          assert g['no_claim_full_dirac_count'] is True
          assert g['threshold_changed'] is False
          PY
      - name: Run exact frozen theorem
        run: python research/shadow/rtk_c10_65s6fz3_full_coupled_constraint_identifiability_preflight.py
      - name: Add provenance and checkpoint
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('research/theory_results/RTK_C10_65S6FZ3_FULL_COUPLED_CONSTRAINT_IDENTIFIABILITY_PREFLIGHT_RESULT_v1.json')
          r=json.loads(p.read_text())
          r['provenance'].update({'github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'github_actions_run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'repo_head_at_job_start':os.environ['GITHUB_SHA'],'frozen_target_commit':'6d903d73615c8c50d052460fd496d4256e3aa5b7'})
          p.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          Path('research/checkpoints/RTK_C10_65S6FZ3_FULL_COUPLED_CONSTRAINT_IDENTIFIABILITY_PREFLIGHT_2026-08-27.md').write_text(f'''# RTK C10.65s6fZ3 — full coupled constraint identifiability preflight\n\nClassification: **{r['classification']}**\n\nThe s6fZ2 field-space null symmetry does not by itself determine the full projectable-ADM constraint rank. The exact witness family `K_ij K^ij - lambda K^2` leaves the two-field symmetry unchanged but has trace kinetic coefficient `1/3-lambda`: it vanishes at `lambda=1/3` and is nonzero at `lambda=1`. Thus different gravitational kinetic/constraint structures occupy the still-unfixed `L_ADM` slot of s6fZ2.\n\nThis is an identifiability result, not a choice of either lambda value and not a no-go. A unique total scalar DOF count requires an independently selected gravitational sector followed by a full coupled reduction. s6fT is not reopened; no soft-s retest or k=0.03 production is authorized.\n\nNext gate: {r['next_gate']}\n\nProvenance: frozen target commit `6d903d73615c8c50d052460fd496d4256e3aa5b7`; run `{os.environ['GITHUB_RUN_ID']}`, attempt `{os.environ['GITHUB_RUN_ATTEMPT']}`, start SHA `{os.environ['GITHUB_SHA']}`. Thresholds changed: false.\n''')
          PY
      - name: Persist result and checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C10_65S6FZ3_FULL_COUPLED_CONSTRAINT_IDENTIFIABILITY_PREFLIGHT_RESULT_v1.json research/checkpoints/RTK_C10_65S6FZ3_FULL_COUPLED_CONSTRAINT_IDENTIFIABILITY_PREFLIGHT_2026-08-27.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record C10.65s6fZ3 coupled constraint identifiability preflight'
            git pull --rebase origin rtk-class-build
            git push origin HEAD:rtk-class-build
          fi
