name: RTK Route-B U1 finite-k rank-domain consolidation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-finite-k-rank-domain-consolidation-trigger.txt'

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Verify frozen target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_ROUTE_B_U1_FINITE_K_RANK_DOMAIN_CONSOLIDATION_TARGET_v1.json'))
          assert t['classification']=='RTK_ROUTE_B_U1_FINITE_K_RANK_DOMAIN_CONSOLIDATION_TARGET_V1_FROZEN'
          assert t['status']=='FROZEN_BEFORE_CURRENT_LINEAGE_FINITE_K_REPLAY'
          print('FINITE_K_RANK_DOMAIN_TARGET_PASS')
          PY
          python3 -m py_compile rtk/route_b_u1_finite_k_rank_domain_consolidation_gate.py
          git rev-parse HEAD | tee u1_finite_k_rank_domain_consolidation_source.txt
      - name: Replay finite-k and all-q rank domain
        run: |
          set -euo pipefail
          python3 rtk/route_b_u1_finite_k_rank_domain_consolidation_gate.py | tee u1_finite_k_rank_domain_consolidation.log
          grep -q '^RTK_ROUTE_B_U1_FINITE_K_RANK_DOMAIN_CURRENT_LINEAGE_REPLAY_PASS ' u1_finite_k_rank_domain_consolidation.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_finite_k_rank_domain_consolidation_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_FINITE_K_RANK_DOMAIN_CURRENT_LINEAGE_REPLAY_PASS'
          assert r['critical_remaining_boundaries']['production_CLASS'].startswith('OPEN:')
          assert 'det B(q)=F(q)^2+a(q)d(q)>0' in r['all_q_constructive_domain']['rank']
          print('FINITE_K_RANK_DOMAIN_RESULT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-finite-k-rank-domain-consolidation
          path: |
            u1_finite_k_rank_domain_consolidation.log
            u1_finite_k_rank_domain_consolidation_result.json
            u1_finite_k_rank_domain_consolidation_source.txt
            research/theory_targets/RTK_ROUTE_B_U1_FINITE_K_RANK_DOMAIN_CONSOLIDATION_TARGET_v1.json
          if-no-files-found: error
      - name: Persist result
        if: success()
        run: |
          set -euo pipefail
          cp u1_finite_k_rank_domain_consolidation_result.json /tmp/result.json
          git fetch origin rtk-class-build
          git reset --hard origin/rtk-class-build
          mkdir -p research/theory_results
          cp /tmp/result.json research/theory_results/RTK_ROUTE_B_U1_FINITE_K_RANK_DOMAIN_CONSOLIDATION_RESULT_v1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_ROUTE_B_U1_FINITE_K_RANK_DOMAIN_CONSOLIDATION_RESULT_v1.json
          git commit -m 'Record finite-k rank-domain consolidation replay'
          git push origin HEAD:rtk-class-build
