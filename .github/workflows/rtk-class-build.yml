name: RTK CLASS build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RTK integration branch
        uses: actions/checkout@v4
        with:
          ref: rtk-class-build
      - name: Fetch public RT-CLASS nonlocal branch
        run: git clone --depth 1 --branch nonlocal https://github.com/dirian/class_public.git class_public
      - name: Stage and patch RT+DBI-Khronon
        shell: bash
        run: |
          cp rtk/khronon_background.c class_public/source/
          cp rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h class_public/include/
          cp rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/rtk_lambda1000.ini class_public/rtk_lambda1000.ini
          cp rtk/rtk_lambda2000.ini class_public/rtk_lambda2000.ini
          cp rtk/rtk_lambda3000.ini class_public/rtk_lambda3000.ini
          cp rtk/rtk_lambda4000.ini class_public/rtk_lambda4000.ini
          cp rtk/rtk_lambda5000.ini class_public/rtk_lambda5000.ini
          cp rtk/rtk_lambda6000.ini class_public/rtk_lambda6000.ini
          cp rtk/rtk_lambda7000.ini class_public/rtk_lambda7000.ini
          cp rtk/rtk_lambda8000.ini class_public/rtk_lambda8000.ini
          cp rtk/rtk_baseline.ini class_public/rtk_baseline.ini
          cp rtk/rtk_lambda12500.ini class_public/rtk_lambda12500.ini
          cp rtk/rtk_lambda15000.ini class_public/rtk_lambda15000.ini
          cp rtk/rtk_lambda20000.ini class_public/rtk_lambda20000.ini
          cp rtk/lcdm_baseline.ini class_public/lcdm_baseline.ini
          python3 rtk/enable_background_output.py class_public
          cp rtk/compare_outputs.py class_public/compare_outputs.py
          cp rtk/analyze_growth_scan.py class_public/analyze_growth_scan.py
          cp rtk/coarse_likelihood.py class_public/coarse_likelihood.py
          python3 rtk/extend_lower_lambda_scan.py class_public
          cp rtk/data/pantheon_binned_lcparam_DS17f.txt class_public/pantheon_binned_lcparam_DS17f.txt
      - name: Build patched CLASS
        working-directory: class_public
        run: make -j2 class
      - name: Verify Khronon integration points and precision guards
        working-directory: class_public
        run: |
          nm class | grep khr_background
          nm class | grep khr_perturb_derivs_newtonian
          grep -q 'lambda_D' include/background.h
          grep -q 'Omega_khronon' source/input.c
          grep -q 'RT+DBI-Khronon currently supports adiabatic initial conditions only' source/perturbations.c
          grep -q 'delta rho_m,K=delta rho_K-3 delta P_K' source/perturbations.c
          grep -q 'RTK_LOG_GAMMA_ROOT' source/background.c
          grep -q 'RTK precision guard' source/spectra.c
          ! grep -q 'pba->gnl > 0. ? pba->gnl : 1.e-14' source/background.c
          ! grep -q 'pba->gnl>0.?pba->gnl:1.e-14' source/perturbations.c
          grep -q 'write background = yes' rtk_lambda1000.ini
          grep -q 'thermodynamics_verbose = 1' rtk_lambda1000.ini
          grep -q "('RTK', 1000.0, 'rtk1'" coarse_likelihood.py
          grep -q '(1000,  "rtk1_"' analyze_growth_scan.py
          grep -q 'parse_drag_horizon' coarse_likelihood.py
          ! grep -q 'import numpy' coarse_likelihood.py
          ! grep -q 'import pandas' coarse_likelihood.py
      - name: Run stock smoke test
        working-directory: class_public
        run: |
          mkdir -p output
          ./class explanatory.ini > ../class_smoke.log 2>&1
      - name: Run RT+DBI-Khronon lambda grid
        working-directory: class_public
        shell: bash
        run: |
          set -euo pipefail
          ./class rtk_lambda1000.ini  > ../rtk1_run.log   2>&1 || (cat ../rtk1_run.log; exit 1)
          ./class rtk_lambda2000.ini  > ../rtk2_run.log   2>&1 || (cat ../rtk2_run.log; exit 1)
          ./class rtk_lambda3000.ini  > ../rtk3_run.log   2>&1 || (cat ../rtk3_run.log; exit 1)
          ./class rtk_lambda4000.ini  > ../rtk4_run.log   2>&1 || (cat ../rtk4_run.log; exit 1)
          ./class rtk_lambda5000.ini  > ../rtk5_run.log   2>&1 || (cat ../rtk5_run.log; exit 1)
          ./class rtk_lambda6000.ini  > ../rtk6_run.log   2>&1 || (cat ../rtk6_run.log; exit 1)
          ./class rtk_lambda7000.ini  > ../rtk7_run.log   2>&1 || (cat ../rtk7_run.log; exit 1)
          ./class rtk_lambda8000.ini  > ../rtk8_run.log   2>&1 || (cat ../rtk8_run.log; exit 1)
          ./class rtk_baseline.ini    > ../rtk_run.log    2>&1 || (cat ../rtk_run.log; exit 1)
          ./class rtk_lambda12500.ini > ../rtk125_run.log 2>&1 || (cat ../rtk125_run.log; exit 1)
          ./class rtk_lambda15000.ini > ../rtk15_run.log  2>&1 || (cat ../rtk15_run.log; exit 1)
          ./class rtk_lambda20000.ini > ../rtk20_run.log  2>&1 || (cat ../rtk20_run.log; exit 1)
          for f in ../rtk1_run.log ../rtk2_run.log ../rtk3_run.log ../rtk4_run.log ../rtk5_run.log ../rtk6_run.log ../rtk7_run.log ../rtk8_run.log ../rtk_run.log ../rtk125_run.log ../rtk15_run.log ../rtk20_run.log; do
            grep 'RTK_LOG_GAMMA_ROOT' "$f"
            grep 'baryon drag stops at z' "$f"
            grep 'with comoving sound horizon rs' "$f"
          done
      - name: Assert explicit Khronon inputs were consumed
        working-directory: class_public
        run: |
          for f in output/rtk1_unused_parameters output/rtk2_unused_parameters output/rtk3_unused_parameters output/rtk4_unused_parameters output/rtk5_unused_parameters output/rtk6_unused_parameters output/rtk7_unused_parameters output/rtk8_unused_parameters output/rtk_unused_parameters output/rtk125_unused_parameters output/rtk15_unused_parameters output/rtk20_unused_parameters; do
            if test -f "$f"; then ! grep -qE '^(Omega_khronon|lambda_D)' "$f"; fi
          done
      - name: Run matched LCDM control
        working-directory: class_public
        run: |
          ./class lcdm_baseline.ini > ../lcdm_run.log 2>&1 || (cat ../lcdm_run.log; exit 1)
          grep 'baryon drag stops at z' ../lcdm_run.log
          grep 'with comoving sound horizon rs' ../lcdm_run.log
      - name: Compare lambda 10000 baseline with LCDM
        working-directory: class_public
        run: |
          python3 compare_outputs.py > ../comparison.txt
          cat ../comparison.txt
      - name: Analyze P(k,z) and growth scan
        working-directory: class_public
        run: |
          python3 analyze_growth_scan.py > ../growth_analysis.txt
          cat ../growth_analysis.txt
      - name: Run dependency-free coarse CMB BAO SN RSD diagnostic
        working-directory: class_public
        run: |
          python3 coarse_likelihood.py > ../coarse_likelihood.txt
          cat ../coarse_likelihood.txt
          grep -q 'COARSE_LIKELIHOOD_PASS' ../coarse_likelihood.txt
      - name: Inventory outputs
        working-directory: class_public
        run: find output -maxdepth 1 -type f -printf '%f\n' | sort > ../rtk_outputs.txt
      - name: Upload logs, spectra, growth and coarse likelihood tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtk-class-coarse-likelihood
          path: |
            class_public/class
            class_smoke.log
            rtk1_run.log
            rtk2_run.log
            rtk3_run.log
            rtk4_run.log
            rtk5_run.log
            rtk6_run.log
            rtk7_run.log
            rtk8_run.log
            rtk_run.log
            rtk125_run.log
            rtk15_run.log
            rtk20_run.log
            lcdm_run.log
            comparison.txt
            growth_analysis.txt
            coarse_likelihood.txt
            rtk_outputs.txt
            class_public/output/
