name: RTK Route-B pole-residue distinction

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-pole-residue-distinction-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Run exact pole-residue distinction theorem
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
          python3 -m py_compile rtk/route_b_pole_residue_distinction.py
          python3 rtk/route_b_pole_residue_distinction.py | tee route_b_pole_residue_distinction.log
          grep -q RTK_ROUTE_B_POLE_RESIDUE_DISTINCTION_PASS route_b_pole_residue_distinction.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-pole-residue-distinction
          path: route_b_pole_residue_distinction.log
          if-no-files-found: warn
