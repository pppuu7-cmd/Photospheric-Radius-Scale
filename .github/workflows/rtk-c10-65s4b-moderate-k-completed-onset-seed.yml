name: RTK C10.65s4b moderate-k completed onset seed
on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths: ['.github/workflows/rtk-c10-65s4b-moderate-k-completed-onset-seed.yml','research/triggers/RTK_C10_65S4B_TRIGGER_v1.txt']
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: rtk-class-build, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.3'}
      - name: Install numeric dependency
        run: python3 -m pip install --disable-pip-version-check mpmath
      - name: Verify frozen target
        run: |
          set -euo pipefail
          git rev-parse HEAD > s4b_head.txt
          python3 - <<'PY'
          import json
          L=lambda p:json.load(open(p))
          t=L('research/theory_targets/RTK_C10_65S4B_MODERATE_K_COMPLETED_ONSET_SEED_TARGET_v1.json');a=L('research/theory_results/RTK_C10_65S4A_MODERATE_K_ONSET_STATE_DOMAIN_PREFLIGHT_RESULT_v1.json')
          assert t['status']=='FROZEN_BEFORE_IMPLEMENTATION';assert t['domain']['new_k_Mpc_inv']==[0.001,0.003];assert t['frozen_checks']['preferred_A_Hamiltonian_momentum_normalized_residual_max']==1e-20;assert t['frozen_checks']['physical_traceless_normalized_residual_max']==1e-20;assert t['frozen_checks']['low_k_parent_regression_relative_max']==1e-12
          assert a['classification']=='C10_65S4A_MODERATE_K_ONSET_STATE_DOMAIN_PREFLIGHT_PASS_SCOPED';assert a['provenance']['github_actions_run_id']==33011355363;assert a['provenance']['threshold_changed'] is False
          print('C10_65S4B_FROZEN_TARGET_VERIFIED')
          PY
      - name: Execute frozen s4b
        run: |
          set -euo pipefail
          python3 -m py_compile research/shadow/rtk_c10_65s4b_moderate_k_completed_onset_seed.py
          set +e
          python3 research/shadow/rtk_c10_65s4b_moderate_k_completed_onset_seed.py | tee s4b.log
          rc=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY'
          import json,pathlib
          rp=pathlib.Path('research/theory_results/RTK_C10_65S4B_MODERATE_K_COMPLETED_ONSET_SEED_RESULT_v1.json')
          tp=pathlib.Path('research/theory_targets/RTK_C10_65S4B_MODERATE_K_COMPLETED_ONSET_SEED_TARGET_v1.json')
          d=json.loads(rp.read_text());t=json.loads(tp.read_text())
          # threshold_changed=False is an invariant/guard, not a failed scientific predicate.
          assert d['checks']['threshold_changed'] is False
          scientific={k:v for k,v in d['checks'].items() if k!='threshold_changed'}
          assert scientific and all(scientific.values()), scientific
          d['classification']=t['pass_classification']
          d['interpretation']=t['interpretation_if_pass']
          d['next_gate']=t['next_if_pass']
          d['classifier_semantics_fix']='Excluded invariant threshold_changed=False from all(scientific predicates); no frozen criterion or numerical threshold changed.'
          rp.write_text(json.dumps(d,indent=2,sort_keys=True,allow_nan=False)+'\n')
          print(d['classification'])
          PY
          grep -q '^C10_65S4B_MODERATE_K_COMPLETED_ONSET_SEED_PASS_SCOPED' <(tail -n 1 <(python3 - <<'PY'
          import json
          print(json.load(open('research/theory_results/RTK_C10_65S4B_MODERATE_K_COMPLETED_ONSET_SEED_RESULT_v1.json'))['classification'])
          PY
          ))
      - name: Add provenance and checkpoint
        if: always()
        run: |
          set -euo pipefail
          p=research/theory_results/RTK_C10_65S4B_MODERATE_K_COMPLETED_ONSET_SEED_RESULT_v1.json; [ -f "$p" ] || exit 0
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('research/theory_results/RTK_C10_65S4B_MODERATE_K_COMPLETED_ONSET_SEED_RESULT_v1.json');d=json.loads(p.read_text());d['provenance']={'repo_head_at_job_start':pathlib.Path('s4b_head.txt').read_text().strip(),'workflow':'rtk-c10-65s4b-moderate-k-completed-onset-seed.yml','analyzer':'research/shadow/rtk_c10_65s4b_moderate_k_completed_onset_seed.py','s4a_parent_run_id':33011355363,'github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'threshold_changed':False};p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          c=pathlib.Path('research/checkpoints/RTK_C10_65S4A_PASS_TO_S4B_MODERATE_K_COMPLETED_SEED_2026-08-26T2045Z.md');c.write_text('# RTK C10.65s4b moderate-k completed onset seed\n\nClassification: `'+d['classification']+'`. This extends only the conditional completed-U1 onset algebra to k=1e-3 and 3e-3 Mpc^-1 at the first frozen completion point. The pre-EFT matching vector is not UV-derived. UR l>=3 entries are explicitly stored only as `HIGHER_ORDER_HISTORICAL_CONTROL`. No production evolution at these new modes is certified.\n\nFrozen thresholds were not changed. The rerun corrects only classifier semantics: `threshold_changed=False` is an invariant, not a failed scientific predicate. Next only if PASS: C10.65s4c current-state/first-RHS parity at the same two k anchors before production integration.\n')
          PY
      - name: Persist result and checkpoint
        if: always()
        run: |
          set -euo pipefail
          p=research/theory_results/RTK_C10_65S4B_MODERATE_K_COMPLETED_ONSET_SEED_RESULT_v1.json;c=research/checkpoints/RTK_C10_65S4A_PASS_TO_S4B_MODERATE_K_COMPLETED_SEED_2026-08-26T2045Z.md;[ -f "$p" ] || exit 0
          cp "$p" /tmp/r.json;cp "$c" /tmp/c.md
          for n in 1 2 3 4 5;do git fetch origin rtk-class-build;git reset --hard origin/rtk-class-build;cp /tmp/r.json "$p";cp /tmp/c.md "$c";git config user.name github-actions[bot];git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add "$p" "$c";git commit -m 'Record C10.65s4b moderate-k completed onset seed' || exit 0;git push origin HEAD:rtk-class-build && exit 0;done;exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c10-65s4b-moderate-k-completed-onset-seed
          path: |
            s4b.log
            research/theory_results/RTK_C10_65S4B_MODERATE_K_COMPLETED_ONSET_SEED_RESULT_v1.json
