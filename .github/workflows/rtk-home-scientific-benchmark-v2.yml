name: RTK Home Scientific Benchmark

on:
  workflow_dispatch:

concurrency:
  group: rtk-home3-exclusive
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: [self-hosted, Linux, X64, rtk-home3]
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System resources
        run: |
          set -euo pipefail
          echo "[0%] Starting RTK scientific benchmark"
          echo "Logical CPUs: $(nproc)"
          free -h

      - name: Parallel CPU benchmark
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python3 - <<'PY'
          import multiprocessing as mp
          import os, time

          workers = mp.cpu_count()
          def f(n):
              x = 0
              for i in range(2_000_000):
                  x += (i * i + n) % 1000003
              return x

          print(f"[10%] Workers={workers}; inner BLAS/OMP threads=1")
          t = time.time()
          with mp.Pool(workers) as pool:
              pool.map(f, range(workers))
          print(f"[95%] Parallel seconds={time.time()-t:.3f}")
          print("[100%] RTK_HOME_SCIENTIFIC_BENCHMARK_PASS")
          PY
