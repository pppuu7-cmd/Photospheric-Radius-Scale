name: RTK Home Scientific Benchmark v2

on:
  push:

jobs:
  benchmark:
    runs-on: [self-hosted, Linux, X64, rtk-home]
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System resources
        run: |
          echo '=== CPU ==='
          nproc
          lscpu | head -25
          echo '=== MEMORY ==='
          free -h

      - name: Python exact rational benchmark
        run: |
          python3 - <<'PY'
          from fractions import Fraction
          import time
          a=Fraction(1,3)
          b=Fraction(2,7)
          t=time.time()
          for i in range(500000):
              a=(a*b)+(a/b)
          print('Fraction seconds:', time.time()-t)
          print('digits:', len(str(a.numerator)))
          PY

      - name: Decimal precision benchmark
        run: |
          python3 - <<'PY'
          from decimal import Decimal, getcontext
          import time
          getcontext().prec=100
          x=Decimal(1)
          t=time.time()
          for i in range(200000):
              x=(x*Decimal('1.000001'))/Decimal('1.0000001')
          print('Decimal seconds:', time.time()-t)
          PY

      - name: Matrix benchmark
        run: |
          python3 - <<'PY'
          import time
          try:
              import numpy as np
              a=np.random.rand(800,800)
              t=time.time()
              a@a
              print('NumPy matrix seconds:', time.time()-t)
          except Exception as e:
              print('NumPy unavailable:', e)
          PY

      - name: Parallel CPU benchmark
        run: |
          python3 - <<'PY'
          import multiprocessing as mp
          import time
          def f(n):
              x=0
              for i in range(3000000):
                  x += i*i
              return x
          t=time.time()
          with mp.Pool(mp.cpu_count()) as p:
              p.map(f, range(mp.cpu_count()))
          print('Parallel seconds:', time.time()-t)
          print('Workers:', mp.cpu_count())
          PY

      - name: Finish marker
        run: echo RTK_HOME_SCIENTIFIC_BENCHMARK_V2_PASS
