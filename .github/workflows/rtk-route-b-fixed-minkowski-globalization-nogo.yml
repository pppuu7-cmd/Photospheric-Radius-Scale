name: RTK Route-B fixed Minkowski globalization no-go

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-fixed-minkowski-globalization-nogo-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Run fixed-Minkowski globalization no-go
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
          python3 -m py_compile rtk/route_b_fixed_minkowski_globalization_nogo.py
          python3 rtk/route_b_fixed_minkowski_globalization_nogo.py | tee route_b_fixed_minkowski_globalization_nogo.log
          grep -q RTK_ROUTE_B_FIXED_MINKOWSKI_GLOBALIZATION_NOGO_PASS route_b_fixed_minkowski_globalization_nogo.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-fixed-minkowski-globalization-nogo
          path: route_b_fixed_minkowski_globalization_nogo.log
          if-no-files-found: error
