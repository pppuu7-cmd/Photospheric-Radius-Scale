name: RTK Route-B U1 filtered-matter k22 flat constraint suppression

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-filtered-matter-k22-flat-constraint-suppression-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run flat-FLRW filtered-matter k22 suppression theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_filtered_matter_k22_flat_constraint_suppression_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_filtered_matter_k22_flat_constraint_suppression_provenance.txt
          python3 rtk/route_b_u1_filtered_matter_k22_flat_constraint_suppression_gate.py | tee u1_filtered_matter_k22_flat_constraint_suppression.log
          grep -q '^RTK_ROUTE_B_U1_FILTERED_MATTER_K22_FLAT_CONSTRAINT_SUPPRESSION_PASS ' u1_filtered_matter_k22_flat_constraint_suppression.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_filtered_matter_k22_flat_constraint_suppression_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_FILTERED_MATTER_K22_FLAT_CONSTRAINT_SUPPRESSION_PASS'
          assert 'k22=0' in r['leading_K22']
          assert 'K=[[0,-x],[x,0]]' in r['combined_leading_matrix']
          assert r['leading_K_operator_norm']=='||K||_2=|x| exactly'
          assert any('does not choose M_c' in x for x in r['non_claims'])
          print('U1_FILTERED_MATTER_K22_FLAT_CONSTRAINT_SUPPRESSION_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-filtered-matter-k22-flat-constraint-suppression
          path: |
            u1_filtered_matter_k22_flat_constraint_suppression.log
            u1_filtered_matter_k22_flat_constraint_suppression_result.json
            u1_filtered_matter_k22_flat_constraint_suppression_provenance.txt
            rtk/route_b_u1_filtered_matter_k22_flat_constraint_suppression_gate.py
          if-no-files-found: error
