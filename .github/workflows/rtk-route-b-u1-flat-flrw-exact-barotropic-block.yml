name: RTK Route-B U1 flat FLRW exact barotropic block

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-flat-flrw-exact-barotropic-block-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run exact flat-FLRW barotropic block theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_flat_flrw_exact_barotropic_block_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_flat_flrw_exact_barotropic_block_provenance.txt
          python3 rtk/route_b_u1_flat_flrw_exact_barotropic_block_gate.py | tee u1_flat_flrw_exact_barotropic_block.log
          grep -q '^RTK_ROUTE_B_U1_FLAT_FLRW_EXACT_BAROTROPIC_BLOCK_PASS ' u1_flat_flrw_exact_barotropic_block.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_flat_flrw_exact_barotropic_block_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_FLAT_FLRW_EXACT_BAROTROPIC_BLOCK_PASS'
          assert r['matrix']=='B(q)=[[a(q),-F(q)],[F(q),d(q)]]'
          assert r['det_exact']=='det B(q)=F(q)^2+a(q)d(q)'
          assert any('does not freeze beta2+beta4 or beta8' in x for x in r['non_claims'])
          print('U1_FLAT_FLRW_EXACT_BAROTROPIC_BLOCK_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-flat-flrw-exact-barotropic-block
          path: |
            u1_flat_flrw_exact_barotropic_block.log
            u1_flat_flrw_exact_barotropic_block_result.json
            u1_flat_flrw_exact_barotropic_block_provenance.txt
            rtk/route_b_u1_flat_flrw_exact_barotropic_block_gate.py
          if-no-files-found: error
