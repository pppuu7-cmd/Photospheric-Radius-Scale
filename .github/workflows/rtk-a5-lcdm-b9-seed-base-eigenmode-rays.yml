name: RTK A5 LCDM B9-seed base eigenmode rays

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-a5-lcdm-b9-seed-base-eigenmode-rays-trigger.txt'

permissions:
  contents: write
  actions: write

concurrency:
  group: rtk-a5-lcdm-b9-seed-base-eigenmode-rays
  cancel-in-progress: false

jobs:
  exact-rays:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '300'
      RTK_PLANCK_DATA: 'planck_data'
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      RTK_PANTHEON_SHA: '7eb29dc87ba223b4ec8457cd3cccba1216c36fb7'
      RTK_PLANCK_SHA256: '0b73171e3acc671c28184466a45485a2d1c1d93676b832abdfe688c7b04024e6'
      RTK_NUMPY_VERSION: '2.5.2'
      RTK_SCIPY_VERSION: '1.18.0'
      RTK_PYTHON_VERSION: '3.12.3'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Require frozen A5 eigenmode-ray target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/robustness/A5_LCDM_B9_SEED_BASE_EIGENMODE_RAYS_TARGET_v1.json'))
          p=json.load(open(t['parent_result']))
          assert t['classification']=='A5_LCDM_B9_SEED_BASE_EIGENMODE_RAYS_TARGET_V1_FROZEN'
          assert t['objective']=='matched-ultra-linstep2+dense-BOSS'
          assert t['parent_stencil_scale']==1.0
          assert p['eff']['best_improvement']<=t['recenter_tolerance_S']==0.005
          assert p['eff']['positive_definite'] is False
          assert len(t['eigenmodes'])==1 and t['eigenmodes'][0]['eigenvalue_y']<0
          assert abs(sum(x*x for x in t['eigenmodes'][0]['eigenvector_y'])-1.0)<1e-10
          assert t['decision_rule']['no_clipping'] is True
          print('A5_LCDM_B9_SEED_EIGENMODE_TARGET_PASS')
          PY
          python3 -m py_compile rtk/a5_lcdm_b9_seed_base_eigenmode_rays.py rtk/prepare_inference_core.py
          git rev-parse HEAD | tee a5_lcdm_b9_seed_base_eigenmode_rays_source.txt

      - name: Build genuinely fresh pinned CLASS tree
        run: |
          set -euo pipefail
          rm -rf class_public
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_public
          git -C class_public reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          git clone https://github.com/dscolnic/Pantheon.git class_public/pantheon
          git -C class_public/pantheon reset --hard "$RTK_PANTHEON_SHA"
          test "$(git -C class_public rev-parse HEAD)" = "$RTK_CLASS_UPSTREAM_SHA"
          test "$(git -C class_public/pantheon rev-parse HEAD)" = "$RTK_PANTHEON_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_nonlocal_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py rtk/prepare_inference_core.py rtk/a5_lcdm_b9_seed_base_eigenmode_rays.py class_public/
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'A_s_ad\|n_s_ad' inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py
          grep -q 'RTK_PLANCK_DATA' inference_core.py

      - name: Build CLASS and install locked likelihood stack
        run: |
          set -euo pipefail
          make -C class_public -j2 class
          test "$(python3 -c 'import platform;print(platform.python_version())')" = "$RTK_PYTHON_VERSION"
          python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' "numpy==$RTK_NUMPY_VERSION" "scipy==$RTK_SCIPY_VERSION"
          python3 -m pip freeze | sort | tee a5_lcdm_b9_seed_base_eigenmode_rays_pip_freeze.txt

      - name: Download and verify official Planck baseline
        working-directory: class_public
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          echo "$RTK_PLANCK_SHA256  planck.tar.gz" | sha256sum -c -
          mkdir planck_data && tar -xzf planck.tar.gz -C planck_data

      - name: Evaluate frozen negative-eigenmode rays
        working-directory: class_public
        run: |
          set -euo pipefail
          python3 a5_lcdm_b9_seed_base_eigenmode_rays.py | tee ../a5_lcdm_b9_seed_base_eigenmode_rays.log
          grep -q '^A5_LCDM_B9_SEED_BASE_EIGENMODE_RAYS_COMPLETE ' ../a5_lcdm_b9_seed_base_eigenmode_rays.log
          python3 - <<'PY'
          import json
          s=json.load(open('../output/a5_lcdm_b9_seed_base_eigenmode_rays/summary.json'))
          assert s['classification'] in ('A5_LCDM_B9_SEED_BASE_EIGENMODE_RECENTER_REQUIRED','A5_LCDM_B9_SEED_BASE_EIGENMODE_RAYS_NO_DESCENT_GT_0P005')
          print('A5_LCDM_B9_SEED_EIGENMODE_RESULT',s['classification'],s['max_exact_improvement_eff'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-a5-lcdm-b9-seed-base-eigenmode-rays
          path: |
            a5_lcdm_b9_seed_base_eigenmode_rays.log
            a5_lcdm_b9_seed_base_eigenmode_rays_source.txt
            a5_lcdm_b9_seed_base_eigenmode_rays_pip_freeze.txt
            output/a5_lcdm_b9_seed_base_eigenmode_rays/
          if-no-files-found: warn

      - name: Persist decision and route next frozen gate
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp output/a5_lcdm_b9_seed_base_eigenmode_rays/summary.json /tmp/a5_rays.json
          git fetch origin rtk-class-build
          git reset --hard origin/rtk-class-build
          cp /tmp/a5_rays.json research/robustness/A5_LCDM_B9_SEED_BASE_EIGENMODE_RAYS_RESULT_v1.json
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          r=json.load(open('research/robustness/A5_LCDM_B9_SEED_BASE_EIGENMODE_RAYS_RESULT_v1.json'))
          if r['classification']=='A5_LCDM_B9_SEED_BASE_EIGENMODE_RAYS_NO_DESCENT_GT_0P005':
              decision='BASE_NONPD_RAYS_CLEAR_HALF_SCALE_REQUIRED'
          else:
              decision='BASE_EIGENMODE_RECENTER_REQUIRED'
          s={
            'schema':'A5_LCDM_B9_SEED_STATIONARITY_CURRENT_v1',
            'updated_utc':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'scale':1.0,
            'decision':decision,
            'S_center':r['S_center_eff'],
            'best_exact_S':r['best_exact_S_eff'],
            'best_improvement':r['max_exact_improvement_eff'],
            'positive_definite':False,
            'min_eigenvalue':r['mode_eigenvalue_y'],
            'best_label':r['best_label'],
            'best_params':r['best_params'],
            'result':'research/robustness/A5_LCDM_B9_SEED_BASE_EIGENMODE_RAYS_RESULT_v1.json',
            'recenter_tolerance_S':r['recenter_tolerance_S'],
            'warning':r['warning']
          }
          json.dump(s,open('research/state/A5_LCDM_cross_basin_stationarity_current.json','w'),indent=2,sort_keys=True)
          open('research/state/A5_LCDM_cross_basin_stationarity_current.json','a').write('\n')
          PY
          git config user.name 'rtk-a5-lcdm-rays'
          git config user.email 'actions@users.noreply.github.com'
          git add research/robustness/A5_LCDM_B9_SEED_BASE_EIGENMODE_RAYS_RESULT_v1.json research/state/A5_LCDM_cross_basin_stationarity_current.json
          git commit -m 'Record A5 LCDM cross-basin base eigenmode rays'
          git push origin HEAD:rtk-class-build
          classification=$(python3 -c "import json;print(json.load(open('research/robustness/A5_LCDM_B9_SEED_BASE_EIGENMODE_RAYS_RESULT_v1.json'))['classification'])")
          if [ "$classification" = 'A5_LCDM_B9_SEED_BASE_EIGENMODE_RAYS_NO_DESCENT_GT_0P005' ]; then
            gh workflow run rtk-a5-lcdm-b9-seed-stationarity.yml --ref main -f scale=0.5
          fi
