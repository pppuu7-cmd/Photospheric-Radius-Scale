name: RTK matched final-objective COBYQA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rtk-final-objective-matched-cobyqa.yml'

jobs:
  refine:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {model: RTK, mapping: eff, h: '0.6904692350128682', Ob: '0.04683552900298674', Om: '0.25301548428566323', As: '2.083631213860309e-9', ns: '0.9644009156458047', zre: '7.218996521149225', lambda_D: '284357.3770256277'}
          - {model: RTK, mapping: k01, h: '0.6904692350128682', Ob: '0.04683552900298674', Om: '0.25301548428566323', As: '2.083631213860309e-9', ns: '0.9644009156458047', zre: '7.218996521149225', lambda_D: '284357.3770256277'}
          - {model: LCDM, mapping: eff, h: '0.6779337587382693', Ob: '0.04872764689799632', Om: '0.26187225794495356', As: '2.1094040998203598e-9', ns: '0.9649685632254442', zre: '7.8583129349509475', lambda_D: '0'}
          - {model: LCDM, mapping: k01, h: '0.6779337587382693', Ob: '0.04872764689799632', Om: '0.26187225794495356', As: '2.1094040998203598e-9', ns: '0.9649685632254442', zre: '7.8583129349509475', lambda_D: '0'}
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '300'
      RTK_CACHE_KEY_VERSION: 'exact-float-v1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
      - name: Prepare final objective tree
        run: |
          set -euo pipefail
          git clone --depth 1 --branch nonlocal https://github.com/dirian/class_public.git class_public
          git clone --depth 1 https://github.com/dscolnic/Pantheon.git class_public/pantheon
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py class_public/joint_profile_runner.py
          cp rtk/prepare_inference_core.py class_public/prepare_inference_core.py
          cp rtk/prepare_final_inference_core.py class_public/prepare_final_inference_core.py
          cp rtk/final_objective_cobyqa_refine.py class_public/final_objective_cobyqa_refine.py
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_final_inference_core.py joint_profile_runner.py inference_core_final.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core_final.py
          ! grep -q 'A_s_ad\|n_s_ad' inference_core_final.py
          grep -q 'l_linstep = 2' inference_core_final.py
          grep -q 'z_pk = 0.,0.25,0.30,0.34' inference_core_final.py
      - name: Build CLASS
        working-directory: class_public
        run: make -j2 class
      - name: Install exact likelihood dependencies
        run: python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' numpy scipy
      - name: Download official Planck baseline
        working-directory: class_public
        run: |
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          mkdir planck_data
          tar -xzf planck.tar.gz -C planck_data
      - name: Run matched final-objective navigation
        working-directory: class_public
        run: |
          set -o pipefail
          if [ '${{ matrix.model }}' = 'RTK' ]; then
            python3 final_objective_cobyqa_refine.py planck_data RTK '${{ matrix.mapping }}' \
              '${{ matrix.h }}' '${{ matrix.Ob }}' '${{ matrix.Om }}' '${{ matrix.As }}' '${{ matrix.ns }}' '${{ matrix.zre }}' '${{ matrix.lambda_D }}' \
              | tee ../final_${{ matrix.model }}_${{ matrix.mapping }}.log
          else
            python3 final_objective_cobyqa_refine.py planck_data LCDM '${{ matrix.mapping }}' \
              '${{ matrix.h }}' '${{ matrix.Ob }}' '${{ matrix.Om }}' '${{ matrix.As }}' '${{ matrix.ns }}' '${{ matrix.zre }}' \
              | tee ../final_${{ matrix.model }}_${{ matrix.mapping }}.log
          fi
          grep -q FINAL_OBJECTIVE_COBYQA_PASS ../final_${{ matrix.model }}_${{ matrix.mapping }}.log
          find output/final_objective_cobyqa/${{ matrix.model == 'RTK' && 'rtk' || 'lcdm' }}/${{ matrix.mapping }} -name summary.json -print -exec cat {} \;
      - name: Upload matched result
        uses: actions/upload-artifact@v4
        with:
          name: rtk-final-objective-${{ matrix.model }}-${{ matrix.mapping }}
          path: |
            final_${{ matrix.model }}_${{ matrix.mapping }}.log
            class_public/output/final_objective_cobyqa/**/summary.json
            class_public/output/final_objective_cobyqa/**/trace.csv
          if-no-files-found: error
