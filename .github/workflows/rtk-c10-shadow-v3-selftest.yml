name: RTK C10 CLASS-normalized shadow v3 selftest

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/workflows/rtk-c10-shadow-v3-selftest.yml'
      - 'research/shadow/rtk_c10_completed_metric_shadow_v3_class_units.py'
      - 'research/theory_targets/RTK_C10_CLASS_NORMALIZED_SHADOW_V3_TARGET_v1.json'

permissions:
  contents: write

jobs:
  selftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Verify frozen target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_CLASS_NORMALIZED_SHADOW_V3_TARGET_v1.json'))
          assert t['status']=='FROZEN_BEFORE_EXECUTION'
          assert t['pass_classification']=='C10_CLASS_NORMALIZED_SHADOW_V3_REFERENCE_PASS_SCOPED'
          print('C10_SHADOW_V3_TARGET_PASS')
          PY
      - name: Execute committed self-test
        run: |
          set -euo pipefail
          python3 research/shadow/rtk_c10_completed_metric_shadow_v3_class_units.py | tee c10_shadow_v3_selftest.json
          python3 - <<'PY'
          import json
          d=json.load(open('c10_shadow_v3_selftest.json'))
          assert d['classification']=='C10_CLASS_NORMALIZED_SHADOW_V3_SELFTEST_PASS'
          assert d['physical_v2_regression_max_abs_error'] < 2e-14
          assert d['determinant_factorization_abs_error'] < 3e-15
          assert d['lambda_cancellation_conservation_consistent_abs_error'] < 3e-15
          assert abs(d['conservation_consistent_momentum_residual']) < 1e-12
          assert abs(d['conservation_consistent_hamiltonian_residual']) < 1e-12
          assert d['k0_routed_to_homogeneous_bridge'] is True
          print('C10_SHADOW_V3_EXECUTION_PASS')
          PY
      - name: Build result certificate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          s=json.load(open('c10_shadow_v3_selftest.json'))
          out={
            'schema':'RTK_C10_CLASS_NORMALIZED_SHADOW_V3_RESULT_v1',
            'classification':'C10_CLASS_NORMALIZED_SHADOW_V3_REFERENCE_PASS_SCOPED',
            'status_scope':'GREEN_EXECUTABLE_CLASS_NORMALIZED_DETACHED_METRIC_REFERENCE',
            'target':'research/theory_targets/RTK_C10_CLASS_NORMALIZED_SHADOW_V3_TARGET_v1.json',
            'implementation':'research/shadow/rtk_c10_completed_metric_shadow_v3_class_units.py',
            'implementation_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'selftest':s,
            'interpretation':'Native CLASS hatted source units reproduce the prior physical-unit reference under exact 8piG/3 conversion; lambda cancellation is separately certified only on a background-conservation-consistent control sample.',
            'production_modified':False,
            'next_gate':'Run the parameter-independent small-k matter regularity test on immutable physical RT-CLASS source histories before choosing completion parameters.',
            'non_claims':['not a physical history replay','not a completion parameter selection','not a completed-U1 Boltzmann integration','not a spectra or likelihood result']
          }
          open('c10_shadow_v3_result.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - name: Persist result
        run: |
          set -euo pipefail
          cp c10_shadow_v3_result.json /tmp/result.json
          for attempt in 1 2 3 4 5; do
            git fetch origin rtk-class-build
            git reset --hard origin/rtk-class-build
            cp /tmp/result.json research/theory_results/RTK_C10_CLASS_NORMALIZED_SHADOW_V3_RESULT_v1.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/theory_results/RTK_C10_CLASS_NORMALIZED_SHADOW_V3_RESULT_v1.json
            git commit -m 'Record C10 CLASS-normalized shadow v3 self-test' || exit 0
            if git push origin HEAD:rtk-class-build; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c10-shadow-v3-selftest
          path: |
            c10_shadow_v3_selftest.json
            c10_shadow_v3_result.json
          if-no-files-found: warn
