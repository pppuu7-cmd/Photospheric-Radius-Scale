name: RTK Route-B U-DHOST PPN nonzero beta3 window

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-udhost-ppn-nonzero-beta3-window-trigger.txt'
      - 'rtk/route_b_udhost_ppn_nonzero_beta3_window.py'

permissions:
  contents: read

jobs:
  symbolic-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install symbolic dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Run sourced U-DHOST PPN nonzero-beta3 gate
        run: |
          set -euo pipefail
          python rtk/route_b_udhost_ppn_nonzero_beta3_window.py | tee route_b_udhost_ppn_nonzero_beta3_window.log
          grep 'RTK_ROUTE_B_UDHOST_PPN_NONZERO_BETA3_WINDOW_PASS' route_b_udhost_ppn_nonzero_beta3_window.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-udhost-ppn-nonzero-beta3-window
          path: route_b_udhost_ppn_nonzero_beta3_window.log
          if-no-files-found: error
