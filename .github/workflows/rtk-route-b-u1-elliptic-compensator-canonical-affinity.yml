name: RTK Route-B U1 elliptic compensator canonical affinity

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-elliptic-compensator-canonical-affinity-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run canonical-affinity theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_elliptic_compensator_canonical_affinity_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_elliptic_compensator_canonical_affinity_provenance.txt
          python3 rtk/route_b_u1_elliptic_compensator_canonical_affinity_gate.py | tee u1_elliptic_compensator_canonical_affinity.log
          grep -q '^RTK_ROUTE_B_U1_ELLIPTIC_COMPENSATOR_CANONICAL_AFFINITY_PASS ' u1_elliptic_compensator_canonical_affinity.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_elliptic_compensator_canonical_affinity_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_ELLIPTIC_COMPENSATOR_CANONICAL_AFFINITY_PASS'
          assert r['exact_primary_results']['p_nu_total_plus_J_A_total']=='0'
          assert r['auxiliary_constraints']['four_constraint_det']=='ell^4'
          print('U1_ELLIPTIC_COMPENSATOR_CANONICAL_AFFINITY_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-elliptic-compensator-canonical-affinity
          path: |
            u1_elliptic_compensator_canonical_affinity.log
            u1_elliptic_compensator_canonical_affinity_result.json
            u1_elliptic_compensator_canonical_affinity_provenance.txt
            rtk/route_b_u1_elliptic_compensator_canonical_affinity_gate.py
          if-no-files-found: error
