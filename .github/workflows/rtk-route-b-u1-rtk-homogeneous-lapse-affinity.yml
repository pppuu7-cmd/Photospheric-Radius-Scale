name: RTK Route-B U1 RTK homogeneous lapse affinity

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-rtk-homogeneous-lapse-affinity-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Require prior RTK U1 support theorems
        run: |
          set -euo pipefail
          test -f rtk/route_b_u1_mixed_velocity_support_gate.py
          test -f rtk/route_b_u1_rtk_crossblock_source_support_gate.py
          echo RTK_U1_SUPPORT_PARENTS_PASS
      - name: Run homogeneous RTK lapse-affinity theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_rtk_homogeneous_lapse_affinity_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_rtk_homogeneous_lapse_affinity_provenance.txt
          python3 rtk/route_b_u1_rtk_homogeneous_lapse_affinity_gate.py | tee u1_rtk_homogeneous_lapse_affinity.log
          grep -q '^RTK_ROUTE_B_U1_RTK_HOMOGENEOUS_LAPSE_AFFINITY_PASS ' u1_rtk_homogeneous_lapse_affinity.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_rtk_homogeneous_lapse_affinity_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_RTK_HOMOGENEOUS_LAPSE_AFFINITY_PASS'
          assert r['homogeneous_scalar']['delta_{pi_N,Hperp}_RTK']=='0'
          assert 'B_gravity' in r['homogeneous_crossblock_consequence']
          print('U1_RTK_HOMOGENEOUS_LAPSE_AFFINITY_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-rtk-homogeneous-lapse-affinity
          path: |
            u1_rtk_homogeneous_lapse_affinity.log
            u1_rtk_homogeneous_lapse_affinity_result.json
            u1_rtk_homogeneous_lapse_affinity_provenance.txt
            rtk/route_b_u1_rtk_homogeneous_lapse_affinity_gate.py
            rtk/route_b_u1_mixed_velocity_support_gate.py
            rtk/route_b_u1_rtk_crossblock_source_support_gate.py
          if-no-files-found: error
