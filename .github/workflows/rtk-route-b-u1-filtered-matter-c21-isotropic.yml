name: RTK Route-B U1 filtered-matter c21 isotropic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-filtered-matter-c21-isotropic-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run isotropic filtered-matter c21 theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_filtered_matter_c21_isotropic_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_filtered_matter_c21_isotropic_provenance.txt
          python3 rtk/route_b_u1_filtered_matter_c21_isotropic_gate.py | tee u1_filtered_matter_c21_isotropic.log
          grep -q '^RTK_ROUTE_B_U1_FILTERED_MATTER_C21_ISOTROPIC_PASS ' u1_filtered_matter_c21_isotropic.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_filtered_matter_c21_isotropic_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_FILTERED_MATTER_C21_ISOTROPIC_PASS'
          assert r['K21']=='k21=V(H0-tau_H)'
          assert any('does not choose M_c' in x for x in r['non_claims'])
          print('U1_FILTERED_MATTER_C21_ISOTROPIC_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-filtered-matter-c21-isotropic
          path: |
            u1_filtered_matter_c21_isotropic.log
            u1_filtered_matter_c21_isotropic_result.json
            u1_filtered_matter_c21_isotropic_provenance.txt
            rtk/route_b_u1_filtered_matter_c21_isotropic_gate.py
          if-no-files-found: error
