name: RTK B4 recenter-v4 base eigenmode rays

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-b4-recenter-v4-base-eigenmode-rays-trigger.txt'

permissions:
  contents: read

concurrency:
  group: rtk-b4-recenter-v4-base-eigenmode-rays
  cancel-in-progress: false

jobs:
  exact-rays:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '300'
      RTK_PLANCK_DATA: 'planck_data'
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      RTK_PANTHEON_SHA: '7eb29dc87ba223b4ec8457cd3cccba1216c36fb7'
      RTK_PLANCK_SHA256: '0b73171e3acc671c28184466a45485a2d1c1d93676b832abdfe688c7b04024e6'
      RTK_NUMPY_VERSION: '2.5.2'
      RTK_SCIPY_VERSION: '1.18.0'
      RTK_PYTHON_VERSION: '3.12.3'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Require frozen v4 base eigenmode target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/robustness/b4_neutrino_rtk_recenter_v4_base_eigenmode_rays_target_v1.json'))
          assert t['classification']=='B4_NEUTRINO_RTK_RECENTER_V4_BASE_EIGENMODE_RAYS_TARGET_V1_FROZEN'
          assert t['parent_base_run_id']==32565150038
          assert t['parent_base_artifact_id']==9475903472
          assert t['parent_stencil_scale']==1.0
          assert t['parent_positive_definite_eff'] is False
          assert t['best_improvement_eff']<=t['recenter_tolerance_S']==0.005
          assert len(t['eigenmodes'])==1 and t['eigenmodes'][0]['eigenvalue_y']<0
          assert t['decision_rule']['no_clipping'] is True
          print('B4_RECENTER_V4_BASE_EIGENMODE_TARGET_PASS')
          PY
          python3 -m py_compile rtk/b4_neutrino_recenter_v4_base_eigenmode_rays.py rtk/prepare_inference_core.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee b4_recenter_v4_base_eigenmode_rays_provenance.txt

      - name: Prepare pinned hardened CLASS tree
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_public
          git -C class_public reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          git clone https://github.com/dscolnic/Pantheon.git class_public/pantheon
          git -C class_public/pantheon reset --hard "$RTK_PANTHEON_SHA"
          test "$(git -C class_public rev-parse HEAD)" = "$RTK_CLASS_UPSTREAM_SHA"
          test "$(git -C class_public/pantheon rev-parse HEAD)" = "$RTK_PANTHEON_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_nonlocal_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py rtk/prepare_inference_core.py rtk/b4_neutrino_recenter_v4_base_eigenmode_rays.py class_public/
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'A_s_ad\|n_s_ad' inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py
          grep -q 'RTK_PLANCK_DATA' inference_core.py

      - name: Build CLASS and locked runtime
        run: |
          set -euo pipefail
          make -C class_public -j2 class
          test "$(python3 -c 'import platform;print(platform.python_version())')" = "$RTK_PYTHON_VERSION"
          python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' "numpy==$RTK_NUMPY_VERSION" "scipy==$RTK_SCIPY_VERSION"
          python3 -m pip freeze | sort | tee b4_recenter_v4_base_eigenmode_rays_pip_freeze.txt

      - name: Download and verify Planck baseline
        working-directory: class_public
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          echo "$RTK_PLANCK_SHA256  planck.tar.gz" | sha256sum -c -
          mkdir planck_data && tar -xzf planck.tar.gz -C planck_data

      - name: Evaluate frozen v4 base eigenmode rays
        working-directory: class_public
        run: |
          set -euo pipefail
          python3 b4_neutrino_recenter_v4_base_eigenmode_rays.py | tee ../b4_recenter_v4_base_eigenmode_rays.log
          grep -q B4_RECENTER_V4_BASE_EIGENMODE_RAYS_COMPLETE ../b4_recenter_v4_base_eigenmode_rays.log
          python3 - <<'PY'
          import json
          s=json.load(open('../output/b4_neutrino_recenter_v4_base_eigenmode_rays/summary.json'))
          assert s['classification'] in ('B4_RECENTER_V4_BASE_EIGENMODE_RECENTER_V5_REQUIRED','B4_RECENTER_V4_BASE_EIGENMODE_RAYS_NO_DESCENT_GT_0P005')
          assert len(s['mode_results'])==1
          print('B4_RECENTER_V4_BASE_EIGENMODE_ARTIFACT_PASS',s['classification'],s['max_exact_improvement_eff'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-b4-recenter-v4-base-eigenmode-rays
          path: |
            b4_recenter_v4_base_eigenmode_rays.log
            b4_recenter_v4_base_eigenmode_rays_provenance.txt
            b4_recenter_v4_base_eigenmode_rays_pip_freeze.txt
            output/b4_neutrino_recenter_v4_base_eigenmode_rays/
          if-no-files-found: warn
