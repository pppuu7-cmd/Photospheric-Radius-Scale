name: RTK C10.65c common-curvature adiabatic boundary

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - 'research/theory_targets/RTK_C10_65C_COMMON_CURVATURE_ADIABATIC_BOUNDARY_TARGET_v1.json'
      - 'research/shadow/rtk_c10_65c_common_curvature_adiabatic_boundary.py'
      - '.github/workflows/rtk-c10-65c-common-curvature-adiabatic-boundary.yml'

permissions:
  contents: write

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Verify frozen target and parents
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_65C_COMMON_CURVATURE_ADIABATIC_BOUNDARY_TARGET_v1.json'))
          pre=json.load(open('research/theory_results/RTK_C10_65B0_ZERO_CHARGE_ADIABATIC_PREFLIGHT_RESULT_v1.json'))
          assert t['status']=='FROZEN_BEFORE_EVALUATION'
          assert pre['classification']=='C10_65B0_ZERO_CHARGE_ADIABATIC_INCOMPATIBLE_SCOPED'
          print('C10_65C_TARGET_AND_PARENTS_PASS')
          PY
          git rev-parse HEAD | tee c10_65c_repo_head.txt
      - name: Run corrected boundary theorem
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'sympy==1.14.0'
          python3 -m py_compile research/shadow/rtk_c10_65c_common_curvature_adiabatic_boundary.py
          python3 research/shadow/rtk_c10_65c_common_curvature_adiabatic_boundary.py | tee c10_65c.log
          grep -q '^C10_65C_COMMON_CURVATURE_ADIABATIC_BOUNDARY_PASS_SCOPED ' c10_65c.log
      - name: Add immutable provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='c10_65c_common_curvature_adiabatic_boundary_result.json'
          d=json.load(open(p))
          d['provenance']={
            'repo_head_at_job_start':open('c10_65c_repo_head.txt').read().strip(),
            'workflow':'rtk-c10-65c-common-curvature-adiabatic-boundary.yml',
            'worker':'research/shadow/rtk_c10_65c_common_curvature_adiabatic_boundary.py',
            'sympy':'1.14.0'
          }
          open(p,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - name: Persist result
        run: |
          set -euo pipefail
          cp c10_65c_common_curvature_adiabatic_boundary_result.json /tmp/result.json
          for attempt in 1 2 3 4 5; do
            git fetch origin rtk-class-build
            git reset --hard origin/rtk-class-build
            cp /tmp/result.json research/theory_results/RTK_C10_65C_COMMON_CURVATURE_ADIABATIC_BOUNDARY_RESULT_v1.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/theory_results/RTK_C10_65C_COMMON_CURVATURE_ADIABATIC_BOUNDARY_RESULT_v1.json
            git commit -m 'Record C10.65c common-curvature adiabatic boundary result' || exit 0
            if git push origin HEAD:rtk-class-build; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c10-65c-common-curvature-adiabatic-boundary
          path: |
            c10_65c.log
            c10_65c_common_curvature_adiabatic_boundary_result.json
          if-no-files-found: warn
