name: RTK Route-B FDiff companion Dirac action gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-fdiffeo-companion-dirac-action-gate-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run FDiff companion Dirac action theorem
        run: |
          set -euo pipefail
          echo "RTK_SOURCE_SHA=$(git rev-parse HEAD)" | tee rtk_fdiffeo_companion_dirac_action_provenance.txt
          python -m py_compile rtk/route_b_fdiffeo_companion_dirac_action_gate.py
          python rtk/route_b_fdiffeo_companion_dirac_action_gate.py | tee rtk_fdiffeo_companion_dirac_action.log
          grep -q '^RTK_ROUTE_B_FDIFFEO_COMPANION_DIRAC_ACTION_GATE_PASS ' rtk_fdiffeo_companion_dirac_action.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-fdiffeo-companion-dirac-action-gate
          path: |
            rtk_fdiffeo_companion_dirac_action.log
            rtk_fdiffeo_companion_dirac_action_provenance.txt
          if-no-files-found: error
