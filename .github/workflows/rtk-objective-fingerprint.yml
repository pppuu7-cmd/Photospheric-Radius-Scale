name: RTK candidate production objective fingerprint

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rtk-objective-fingerprint.yml'

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: rtk-class-build}
      - name: Capture production head
        id: prod
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare exact candidate objective tree
        run: |
          set -euo pipefail
          git clone --depth 1 --branch nonlocal https://github.com/dirian/class_public.git class_public
          git clone --depth 1 https://github.com/dscolnic/Pantheon.git class_public/pantheon
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py class_public/joint_profile_runner.py
          cp rtk/prepare_inference_core.py class_public/prepare_inference_core.py
          cp rtk/objective_fingerprint.py class_public/objective_fingerprint.py
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py
          python3 objective_fingerprint.py '${{ steps.prod.outputs.sha }}' | tee ../objective_fingerprint.log
          grep -q OBJECTIVE_FINGERPRINT_COMPLETE ../objective_fingerprint.log
      - uses: actions/upload-artifact@v4
        with:
          name: rtk-candidate-objective-fingerprint
          path: |
            objective_fingerprint.log
            class_public/objective_fingerprint.json
          if-no-files-found: error
