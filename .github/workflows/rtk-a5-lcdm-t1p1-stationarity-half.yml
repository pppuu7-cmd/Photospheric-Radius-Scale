name: RTK A5 LCDM t1p1 stationarity half

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rtk-a5-lcdm-t1p1-stationarity-half
  cancel-in-progress: false

jobs:
  stationarity-half:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '300'
      RTK_CACHE_KEY_VERSION: 'clean-room-exact-float-v2'
      RTK_A5_LCDM_STENCIL_SCALE: '0.5'
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      RTK_PANTHEON_SHA: '7eb29dc87ba223b4ec8457cd3cccba1216c36fb7'
      RTK_PLANCK_SHA256: '0b73171e3acc671c28184466a45485a2d1c1d93676b832abdfe688c7b04024e6'
      RTK_NUMPY_VERSION: '2.5.2'
      RTK_SCIPY_VERSION: '1.18.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Enforce persisted base prerequisite and frozen half target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/robustness/A5_LCDM_T1P1_HALF_STATIONARITY_TARGET_v1.json'))
          b=json.load(open(t['prerequisite']['result']))
          assert t['classification']=='A5_LCDM_T1P1_HALF_STATIONARITY_TARGET_V1_FROZEN'
          assert t['status']=='CONDITIONAL_PREREGISTRATION_BEFORE_T1P1_BASE_RESULT'
          assert float(b['stencil_scale'])==1.0
          assert b['center']==t['center']
          assert abs(float(b['eff']['S_center'])-t['expected_center_S_eff'])<=t['center_replay_abs_tolerance']
          assert float(b['eff']['best_improvement'])<=t['recenter_tolerance_S']
          assert b['eff']['positive_definite'] is True
          print('A5_T1P1_HALF_PREREQUISITE_PASS')
          PY
          cp research/robustness/A5_LCDM_T1P1_STATIONARITY_TARGET_v1.json research/robustness/A5_LCDM_B9_SEED_STATIONARITY_TARGET_v1.json
          python3 -m py_compile rtk/a5_lcdm_b9_seed_stationarity.py rtk/prepare_inference_core.py
          git rev-parse HEAD | tee a5_t1p1_half_source.txt
      - name: Prepare fresh pinned CLASS tree
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_public
          git -C class_public reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          git clone https://github.com/dscolnic/Pantheon.git class_public/pantheon
          git -C class_public/pantheon reset --hard "$RTK_PANTHEON_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_nonlocal_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py rtk/prepare_inference_core.py rtk/a5_lcdm_b9_seed_stationarity.py class_public/
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py
      - name: Build locked runtime
        run: |
          set -euo pipefail
          make -C class_public -j2 class
          python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' "numpy==$RTK_NUMPY_VERSION" "scipy==$RTK_SCIPY_VERSION"
          python3 -m pip freeze | sort | tee a5_t1p1_half_pip_freeze.txt
      - name: Download and verify Planck baseline
        working-directory: class_public
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          echo "$RTK_PLANCK_SHA256  planck.tar.gz" | sha256sum -c -
          mkdir planck_data && tar -xzf planck.tar.gz -C planck_data
      - name: Run exact t1p1 half Hessian
        working-directory: class_public
        run: |
          set -euo pipefail
          python3 a5_lcdm_b9_seed_stationarity.py | tee ../a5_t1p1_half_stationarity.log
          test -s ../output/a5_lcdm_b9_seed_stationarity/scale_0.5/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-a5-lcdm-t1p1-stationarity-half
          path: |
            a5_t1p1_half_stationarity.log
            a5_t1p1_half_source.txt
            a5_t1p1_half_pip_freeze.txt
            output/a5_lcdm_b9_seed_stationarity/scale_0.5/
          if-no-files-found: warn
      - name: Persist exact half result
        if: success()
        run: |
          set -euo pipefail
          cp output/a5_lcdm_b9_seed_stationarity/scale_0.5/summary.json /tmp/a5_t1p1_half.json
          git fetch origin rtk-class-build
          git reset --hard origin/rtk-class-build
          cp /tmp/a5_t1p1_half.json research/robustness/A5_LCDM_T1P1_HALF_RESULT_v1.json
          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          r=json.load(open('research/robustness/A5_LCDM_T1P1_HALF_RESULT_v1.json')); e=r['eff']
          d='HALF_RECENTER_REQUIRED' if e['best_improvement']>0.005 else ('HALF_RECENTER_CLEAR_PD_FRESH_TREE_REQUIRED' if e['positive_definite'] else 'HALF_RECENTER_CLEAR_NONPD_RAYS_REQUIRED')
          s={'schema':'A5_LCDM_T1P1_STATIONARITY_CURRENT_v2','updated_utc':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),'status':d,'center':r['center'],'scale':r['stencil_scale'],'S_center':e['S_center'],'best_exact_S':e['best_exact_S'],'best_improvement':e['best_improvement'],'best_label':e['best_label'],'best_params':e['best_params'],'positive_definite':e['positive_definite'],'min_eigenvalue':min(e['eigenvalues_y']),'recenter_tolerance_S':0.005,'result':'research/robustness/A5_LCDM_T1P1_HALF_RESULT_v1.json','guard':'Local stationarity only; no global or model-selection claim.'}
          json.dump(s,open('research/state/A5_LCDM_cross_basin_stationarity_current.json','w'),indent=2,sort_keys=True); open('research/state/A5_LCDM_cross_basin_stationarity_current.json','a').write('\n')
          PY
          git config user.name 'rtk-a5-t1p1-half'
          git config user.email 'actions@users.noreply.github.com'
          git add research/robustness/A5_LCDM_T1P1_HALF_RESULT_v1.json research/state/A5_LCDM_cross_basin_stationarity_current.json
          git commit -m 'Record A5 LCDM t1p1 half stationarity'
          git push origin HEAD:rtk-class-build
