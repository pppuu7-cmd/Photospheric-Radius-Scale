name: RTK Route-B spatial-covariant FLRW exact match

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-spatial-covariant-flrw-exact-match-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Run exact fixed-action FLRW scalar theorem
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
          python3 -m py_compile rtk/route_b_spatial_covariant_flrw_exact_match.py
          python3 rtk/route_b_spatial_covariant_flrw_exact_match.py | tee route_b_spatial_covariant_flrw_exact_match.log
          grep -q RTK_ROUTE_B_SPATIAL_COVARIANT_FLRW_EXACT_MATCH_PASS route_b_spatial_covariant_flrw_exact_match.log
          printf 'research_source_commit=%s\npython=%s\n' "$(git rev-parse HEAD)" "$(python3 --version)" > route_b_spatial_covariant_flrw_exact_match_provenance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-spatial-covariant-flrw-exact-match
          path: |
            route_b_spatial_covariant_flrw_exact_match.log
            route_b_spatial_covariant_flrw_exact_match_provenance.txt
          if-no-files-found: error
