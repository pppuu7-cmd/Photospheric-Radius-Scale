name: RTK C9 scalar P(X) tree power-counting scan

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c9-rtk-scalar-px-tree-powercount-scan-trigger.txt'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install pinned numerical runtime
        run: python -m pip install --disable-pip-version-check 'numpy==2.5.2'
      - name: Run tree power-counting scan
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/c9_rtk_scalar_px_tree_powercount_scan.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee c9_rtk_scalar_px_tree_powercount_scan_provenance.txt
          python3 rtk/c9_rtk_scalar_px_tree_powercount_scan.py | tee c9_rtk_scalar_px_tree_powercount_scan.log
          grep -q '^RTK_C9_RTK_SCALAR_PX_TREE_POWERCOUNT_SCAN_COMPLETE ' c9_rtk_scalar_px_tree_powercount_scan.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c9-rtk-scalar-px-tree-powercount-scan
          path: |
            c9_rtk_scalar_px_tree_powercount_scan.log
            c9_rtk_scalar_px_tree_powercount_scan_result.json
            c9_rtk_scalar_px_tree_powercount_scan_provenance.txt
            rtk/c9_rtk_scalar_px_tree_powercount_scan.py
          if-no-files-found: error
