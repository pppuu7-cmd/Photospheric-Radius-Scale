name: RTK autonomous research orchestrator

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-autonomous-orchestrator-trigger.txt'

permissions:
  contents: write
  actions: write

concurrency:
  group: rtk-autonomous-research-orchestrator
  cancel-in-progress: false

jobs:
  iterate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0

      - name: Configure repository writer
        run: |
          git config user.name 'rtk-autonomous-orchestrator'
          git config user.email 'actions@users.noreply.github.com'

      - name: Reconcile control-plane state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 rtk/reconcile_autonomous_state.py | tee autonomous_reconcile.log
          grep -q RTK_STATE_RECONCILE autonomous_reconcile.log

      - name: Enforce scientific invariants
        run: |
          set -euo pipefail
          python3 rtk/audit_invariants.py | tee autonomous_audit.log
          grep -q RTK_AUDIT_INVARIANTS_PASS autonomous_audit.log

      - name: Test Stage4D3 negative-eigenray state machine
        run: |
          set -euo pipefail
          python3 rtk/test_stage4d3_negative_eigenray_gate.py | tee autonomous_negative_eigenray_unit.log
          grep -q RTK_STAGE4D3_NEGATIVE_EIGENRAY_UNIT_PASS autonomous_negative_eigenray_unit.log

      - name: Test adaptive quarter state machine
        run: |
          set -euo pipefail
          python3 rtk/test_adaptive_quarter_gate.py | tee autonomous_adaptive_quarter_unit.log
          grep -q RTK_ADAPTIVE_QUARTER_GATE_UNIT_PASS autonomous_adaptive_quarter_unit.log

      - name: Test final matched replay gate
        run: |
          set -euo pipefail
          python3 rtk/test_final_replay_gate.py | tee autonomous_final_replay_unit.log
          grep -q RTK_FINAL_REPLAY_GATE_UNIT_PASS autonomous_final_replay_unit.log

      - name: Test crash-safe idempotent dispatch guard
        run: |
          set -euo pipefail
          python3 rtk/test_idempotent_dispatch_guard.py | tee autonomous_idempotent_dispatch_unit.log
          grep -q RTK_IDEMPOTENT_DISPATCH_GUARD_UNIT_PASS autonomous_idempotent_dispatch_unit.log

      - name: Enforce measured reproducibility extensions
        run: |
          set -euo pipefail
          python3 rtk/audit_reproducibility_extensions.py | tee autonomous_repro_ext.log
          grep -q RTK_REPRO_EXT_AUDIT_PASS autonomous_repro_ext.log

      - name: Validate completed artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 rtk/validate_artifact_identity.py | tee autonomous_identity.log
          grep -q RTK_ARTIFACT_IDENTITY_PASS autonomous_identity.log

      - name: Run one synchronized research-control iteration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 rtk/autonomous_orchestrator.py | tee autonomous_iteration.log
          grep -q RTK_AUTONOMOUS_ITERATION autonomous_iteration.log

      - name: Enforce Stage4D3 multiscale stationarity gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 rtk/enforce_stage4d3_multiscale_gate.py | tee autonomous_multiscale.log
          grep -q RTK_STAGE4D3_MULTISCALE_GATE autonomous_multiscale.log

      - name: Enforce adaptive quarter convergence gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 rtk/enforce_adaptive_quarter_gate.py | tee autonomous_adaptive_quarter.log
          grep -q RTK_ADAPTIVE_QUARTER_GATE autonomous_adaptive_quarter.log

      - name: Enforce independent final matched-minima replay gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 rtk/enforce_final_replay_gate.py | tee autonomous_final_replay.log
          grep -q RTK_FINAL_REPLAY_GATE autonomous_final_replay.log

      - name: Commit centralized state and journal
        run: |
          set -euo pipefail
          git add research/state research/iterations
          if git diff --cached --quiet; then
            echo 'No state changes to commit'
          else
            git commit -m "RTK autonomous iteration state update"
            git pull --rebase origin rtk-class-build
            git push origin HEAD:rtk-class-build
          fi

      - name: Dispatch at most one requested heavy worker crash-safely
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f research/state/dispatch_request.json ]; then
            echo 'No heavy dispatch requested this iteration'
            exit 0
          fi
          python3 rtk/idempotent_dispatch_guard.py | tee autonomous_idempotent_dispatch.log
          grep -Eq 'RTK_IDEMPOTENT_DISPATCH_(NEW|REUSED)' autonomous_idempotent_dispatch.log
          git add research/state
          if git diff --cached --quiet; then
            echo 'ERROR: dispatch guard returned success but did not consume request' >&2
            exit 1
          fi
          git commit -m "RTK autonomous dispatch consumed idempotently"
          git pull --rebase origin rtk-class-build
          git push origin HEAD:rtk-class-build
