name: RTK C10.65s6fK homogeneous quadratic channel

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - 'research/theory_targets/RTK_C10_65S6FK_HOMOGENEOUS_QUADRATIC_CHANNEL_TARGET_v1.json'
      - 'research/shadow/rtk_c10_65s6fk_homogeneous_quadratic_channel.py'
      - '.github/workflows/rtk-c10-65s6fk-homogeneous-quadratic-channel.yml'

permissions:
  contents: write

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Verify parents and execute frozen theorem
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          j=json.load(open('research/theory_results/RTK_C10_65S6FJ_HOMOGENEOUS_VS_PUNCTURED_CHANNEL_RESULT_v1.json'))
          s=json.load(open('research/RTK_C8_U1_FIXED_SCALAR_ACTION_v1.json'))
          t=json.load(open('research/theory_targets/RTK_C10_65S6FK_HOMOGENEOUS_QUADRATIC_CHANNEL_TARGET_v1.json'))
          assert j['classification']=='C10_65S6FJ_EXACT_HOMOGENEOUS_CHANNEL_SEPARATE_PASS_SCOPED'
          assert s['classification']=='RTK_C8_U1_FIXED_SHIFT_SYMMETRIC_SCALAR_ACTION_V1'
          assert t['status']=='FROZEN_BEFORE_IMPLEMENTATION'
          PY
          python3 -m py_compile research/shadow/rtk_c10_65s6fk_homogeneous_quadratic_channel.py
          python3 research/shadow/rtk_c10_65s6fk_homogeneous_quadratic_channel.py | tee /tmp/s6fk.log
          grep -q '^C10_65S6FK_HOMOGENEOUS_QUADRATIC_CHANNEL_PASS_SCOPED$' /tmp/s6fk.log
      - name: Add immutable provenance and checkpoint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,datetime,pathlib
          p=pathlib.Path('research/theory_results/RTK_C10_65S6FK_HOMOGENEOUS_QUADRATIC_CHANNEL_RESULT_v1.json')
          r=json.loads(p.read_text())
          r['provenance']={'github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'repo_head_at_job_start':os.environ['GITHUB_SHA'],'workflow':'rtk-c10-65s6fk-homogeneous-quadratic-channel.yml','threshold_changed':False}
          p.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          stamp=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H%MZ')
          cp=pathlib.Path(f'research/checkpoints/RTK_C10_65S6FK_HOMOGENEOUS_QUADRATIC_CHANNEL_{stamp}.md')
          cp.write_text(f'''# C10.65s6fK homogeneous quadratic channel checkpoint\n\nClassification: `{r["classification"]}`.\n\nThe exact spatial-q=0 projectable sector was derived from the fixed C8 P(X_U) action rather than from the finite-q momentum constraint. With `A=(3/2)Mstar^2(1-3 lambda_HL)` and `D=K_phys/2=Mstar^2 M_K^2`, the homogeneous quadratic block is\n\n`L2/a^3 = A dot(zeta_0)^2 - 2 A H n_0 dot(zeta_0) + (A H^2 + D)n_0^2`.\n\nThe global-lapse denominator is `Delta_N=A H^2+D`. Away from `Delta_N=0`,\n\n`n_0=A H dot(zeta_0)/Delta_N`,\n`Q_hom=A D/Delta_N`.\n\nThis is not the punctured finite-q coefficient `D/H^2`; their ratio is `A H^2/Delta_N`. No sign/ghost interpretation is made because q=0 is the homogeneous/global sector.\n\nNext: C10.65s6fL hard-hard-homogeneous cubic source/global-lapse exchange. k=0.03 production remains blocked.\n''')
          print(cp)
          PY
      - name: Persist result and checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C10_65S6FK_HOMOGENEOUS_QUADRATIC_CHANNEL_RESULT_v1.json research/checkpoints/RTK_C10_65S6FK_HOMOGENEOUS_QUADRATIC_CHANNEL_*.md
          git commit -m 'Record C10.65s6fK homogeneous quadratic channel'
          git push origin HEAD:rtk-class-build
