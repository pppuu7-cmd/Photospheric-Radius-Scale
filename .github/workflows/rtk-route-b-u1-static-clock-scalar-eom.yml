name: RTK Route-B U1 static clock scalar EOM

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-static-clock-scalar-eom-trigger.txt'

permissions:
  contents: write

concurrency:
  group: rtk-route-b-u1-static-clock-scalar-eom
  cancel-in-progress: false

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Verify frozen target and execute theorem
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'sympy==1.14.0'
          python3 - <<'PY'
          import json
          t=json.load(open('research/RTK_ROUTE_B_U1_STATIC_CLOCK_SCALAR_EOM_TARGET_v1.json'))
          a=json.load(open('research/RTK_C8_U1_FIXED_SCALAR_ACTION_v1.json'))
          assert t['classification']=='RTK_ROUTE_B_U1_STATIC_CLOCK_SCALAR_EOM_TARGET_V1_FROZEN'
          assert a['classification']=='RTK_C8_U1_FIXED_SHIFT_SYMMETRIC_SCALAR_ACTION_V1'
          assert a['mixed_operator']['C']=='M_Pl^2/(2 X_U)'
          print('FROZEN_STATIC_CLOCK_SCALAR_EOM_TARGET_PASS')
          PY
          python3 -m py_compile rtk/route_b_u1_static_clock_scalar_eom_gate.py
          python3 rtk/route_b_u1_static_clock_scalar_eom_gate.py | tee u1_static_clock_scalar_eom.log
          grep -q '^RTK_ROUTE_B_U1_STATIC_CLOCK_SCALAR_EOM_EXACT_PASS ' u1_static_clock_scalar_eom.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_static_clock_scalar_eom_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_STATIC_CLOCK_SCALAR_EOM_EXACT_PASS'
          assert r['first_variation']['contains_eta'] is False
          assert r['first_variation']['contains_Di_eta'] is False
          print('STATIC_CLOCK_SCALAR_EOM_ARTIFACT_PASS')
          PY
      - name: Persist scientific result to rtk-class-build
        run: |
          set -euo pipefail
          mkdir -p research/theory_results
          cp u1_static_clock_scalar_eom_result.json research/theory_results/RTK_ROUTE_B_U1_STATIC_CLOCK_SCALAR_EOM_RESULT_v1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_ROUTE_B_U1_STATIC_CLOCK_SCALAR_EOM_RESULT_v1.json
          if git diff --cached --quiet; then
            echo 'Result already persisted identically.'
          else
            git commit -m 'theory: persist static clock scalar EOM exact result'
            git push origin HEAD:rtk-class-build
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-static-clock-scalar-eom
          path: |
            u1_static_clock_scalar_eom.log
            u1_static_clock_scalar_eom_result.json
          if-no-files-found: error
