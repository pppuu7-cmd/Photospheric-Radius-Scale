name: RTK C9 scalar P(X) elastic 2to2 tree benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c9-rtk-scalar-px-elastic-2to2-tree-benchmark-trigger.txt'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install pinned symbolic/numerical runtime
        run: python -m pip install --disable-pip-version-check 'numpy==2.5.2' 'sympy==1.14.0'
      - name: Run exact P(X) elastic tree benchmark
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/c9_rtk_scalar_px_elastic_2to2_tree_benchmark.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee c9_rtk_scalar_px_elastic_2to2_tree_benchmark_provenance.txt
          python3 rtk/c9_rtk_scalar_px_elastic_2to2_tree_benchmark.py | tee c9_rtk_scalar_px_elastic_2to2_tree_benchmark.log
          grep -q '^RTK_C9_RTK_SCALAR_PX_ELASTIC_2TO2_TREE_BENCHMARK_COMPLETE ' c9_rtk_scalar_px_elastic_2to2_tree_benchmark.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c9-rtk-scalar-px-elastic-2to2-tree-benchmark
          path: |
            c9_rtk_scalar_px_elastic_2to2_tree_benchmark.log
            c9_rtk_scalar_px_elastic_2to2_tree_benchmark_result.json
            c9_rtk_scalar_px_elastic_2to2_tree_benchmark_provenance.txt
            rtk/c9_rtk_scalar_px_elastic_2to2_tree_benchmark.py
          if-no-files-found: error
