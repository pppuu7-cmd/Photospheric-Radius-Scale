name: RTK C10.65s6fZ symmetry-first projectable completion requirement

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - 'research/theory_targets/RTK_C10_65S6FZ_SYMMETRY_FIRST_PROJECTABLE_COMPLETION_REQUIREMENT_TARGET_v1.json'
      - 'research/shadow/rtk_c10_65s6fz_symmetry_first_projectable_completion_requirement.py'
      - '.github/workflows/rtk-c10-65s6fz-symmetry-first-projectable-completion-requirement.yml'
      - '.github/rtk-c10-65s6fz-symmetry-first-projectable-completion-requirement-trigger.txt'

permissions:
  contents: write

jobs:
  theorem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy==1.13.3
      - name: Verify frozen target
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_65S6FZ_SYMMETRY_FIRST_PROJECTABLE_COMPLETION_REQUIREMENT_TARGET_v1.json'))
          assert t['gate']=='C10.65s6fZ'
          g=t['guards']
          assert g['threshold_changed'] is False
          assert g['no_soft_s_retest'] is True
          assert g['no_k003_production'] is True
          assert g['no_new_fitted_coefficients'] is True
          assert g['no_claim_unique_full_action'] is True
          PY
      - name: Run frozen exact class theorem
        run: python research/shadow/rtk_c10_65s6fz_symmetry_first_projectable_completion_requirement.py
      - name: Add provenance and checkpoint
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('research/theory_results/RTK_C10_65S6FZ_SYMMETRY_FIRST_PROJECTABLE_COMPLETION_REQUIREMENT_RESULT_v1.json')
          r=json.loads(p.read_text())
          r['provenance'].update({'github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'github_actions_run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'repo_head_at_job_start':os.environ['GITHUB_SHA']})
          p.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          Path('research/checkpoints/RTK_C10_65S6FZ_SYMMETRY_FIRST_PROJECTABLE_COMPLETION_REQUIREMENT_2026-08-27.md').write_text(f'''# RTK C10.65s6fZ — symmetry-first projectable completion requirement/class theorem\n\nClassification: **{r['classification']}**\n\nExact result: a nonempty local symmetry-protected rank-one quadratic class exists. For `K = kappa u u^T`, the null direction `n=(-u2,u1)` is exact. Requiring local redundancy along `n` forces `M n=0` and `s.n=0`; for symmetric 2x2 `M`, this yields `M=m u u^T` and `s=sigma u`. After quotienting the null direction, the inverse scalar response is affine in `omega^2`, hence has at most one finite pole.\n\nThis is a structural class theorem only. It does not identify a unique nonlinear ADM/clock action, does not reopen s6fT, and does not authorize soft-s retest or k=0.03 production.\n\nNext gate: {r['next_gate']}\n\nProvenance: frozen target commit precedes analyzer/workflow execution; run `{os.environ['GITHUB_RUN_ID']}`, attempt `{os.environ['GITHUB_RUN_ATTEMPT']}`, start SHA `{os.environ['GITHUB_SHA']}`. Thresholds changed: false.\n''')
          PY
      - name: Persist result and checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/theory_results/RTK_C10_65S6FZ_SYMMETRY_FIRST_PROJECTABLE_COMPLETION_REQUIREMENT_RESULT_v1.json research/checkpoints/RTK_C10_65S6FZ_SYMMETRY_FIRST_PROJECTABLE_COMPLETION_REQUIREMENT_2026-08-27.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record C10.65s6fZ symmetry-first projectable class theorem'
            git push origin HEAD:rtk-class-build
          fi
