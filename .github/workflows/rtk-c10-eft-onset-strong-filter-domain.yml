name: RTK C10 EFT onset strong-filter domain

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/workflows/rtk-c10-eft-onset-strong-filter-domain.yml'
      - '.github/rtk-c10-eft-onset-strong-filter-domain-trigger.txt'
      - 'research/shadow/rtk_c10_eft_onset_strong_filter_domain.py'
      - 'research/theory_targets/RTK_C10_EFT_ONSET_STRONG_FILTER_DOMAIN_TARGET_v1.json'

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install symbolic dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.13.3'
      - name: Verify frozen target
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('research/theory_targets/RTK_C10_EFT_ONSET_STRONG_FILTER_DOMAIN_TARGET_v1.json'))
          assert d['status']=='FROZEN_BEFORE_EXECUTION'
          assert d['pass_classification']=='C10_EFT_ONSET_STRONG_FILTER_GRADIENT_DOMAIN_PASS_SCOPED'
          print('C10_55_TARGET_FROZEN_PASS')
          PY
          git rev-parse HEAD | tee c10_55_repo_head.txt
      - name: Execute exact domain proof
        run: |
          set -euo pipefail
          python research/shadow/rtk_c10_eft_onset_strong_filter_domain.py > c10_55_result.json
          python - <<'PY'
          import json
          d=json.load(open('c10_55_result.json'))
          assert d['classification']=='C10_EFT_ONSET_STRONG_FILTER_GRADIENT_DOMAIN_PASS_SCOPED'
          assert d['noncommuting_limits']['k_to_0_fixed_a']=='0'
          assert d['noncommuting_limits']['a_to_0_fixed_k']=='1'
          assert d['history_window_implication']['a1_eff_max']=='1/100'
          assert d['gradient_control']['K_relative_truncation_error_abs_max']=='1/9801'
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
      - name: Add provenance
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='c10_55_result.json'; d=json.load(open(p))
          d['provenance']={
            'repo_head_at_job_start':open('c10_55_repo_head.txt').read().strip(),
            'workflow':'rtk-c10-eft-onset-strong-filter-domain.yml',
            'proof_script':'research/shadow/rtk_c10_eft_onset_strong_filter_domain.py',
            'sympy':'1.13.3'
          }
          open(p,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - name: Persist immutable certificate
        run: |
          set -euo pipefail
          cp c10_55_result.json /tmp/c10_55_result.json
          for attempt in 1 2 3 4 5; do
            git fetch origin rtk-class-build
            git reset --hard origin/rtk-class-build
            cp /tmp/c10_55_result.json research/theory_results/RTK_C10_EFT_ONSET_STRONG_FILTER_DOMAIN_RESULT_v1.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/theory_results/RTK_C10_EFT_ONSET_STRONG_FILTER_DOMAIN_RESULT_v1.json
            git commit -m 'Record C10.55 EFT onset strong-filter domain' || exit 0
            if git push origin HEAD:rtk-class-build; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c10-eft-onset-strong-filter-domain
          path: |
            c10_55_result.json
            c10_55_repo_head.txt
          if-no-files-found: warn
