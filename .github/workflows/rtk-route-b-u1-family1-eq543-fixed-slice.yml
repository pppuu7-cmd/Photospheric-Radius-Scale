name: RTK Route-B U1 family-I Eq543 fixed-slice gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-family1-eq543-fixed-slice-trigger.txt'

permissions:
  contents: read

jobs:
  exact-algebra:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run Eq 5.43 fixed-slice factor gate
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_family1_eq543_factor_gate.py
          python3 rtk/route_b_u1_family1_eq543_factor_gate.py | tee u1_family1_eq543_fixed_slice.log
          grep -q 'RTK_ROUTE_B_U1_FAMILY1_EQ543_FIXED_SLICE_PASS' u1_family1_eq543_fixed_slice.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_family1_eq543_fixed_slice_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_FAMILY1_EQ543_FIXED_SLICE_PASS'
          assert r['rtk_eq543_residual']=='0'
          assert r['rtk_partial_slice']['beta0']==2
          assert r['rtk_partial_slice']['gamma1']==-1
          assert r['rtk_partial_slice']['lambda_HL'] is None
          print('U1_FAMILY1_EQ543_ARTIFACT_ASSERTIONS_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rtk-route-b-u1-family1-eq543-fixed-slice
          path: |
            u1_family1_eq543_fixed_slice.log
            u1_family1_eq543_fixed_slice_result.json
            research/RTK_C8_U1_FAMILY1_FIXED_IR_SLICE_v1.json
          if-no-files-found: error
