name: RTK C10.65r2d C double general projector directional port

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - 'research/theory_targets/RTK_C10_65R2D_C_DOUBLE_GENERAL_PROJECTOR_DIRECTIONAL_PORT_TARGET_v1.json'
      - 'rtk/c10_65r2d_general_projector_dual.c'
      - 'research/shadow/rtk_c10_65r2d_c_double_general_projector_directional_port.py'
      - '.github/workflows/rtk-c10-65r2d-c-double-general-projector-directional-port.yml'

permissions:
  contents: write

jobs:
  c-double-directional-port:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install high precision dependency
        run: python -m pip install --disable-pip-version-check mpmath
      - name: Verify frozen parents and target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          def L(p): return json.load(open(p))
          t=L('research/theory_targets/RTK_C10_65R2D_C_DOUBLE_GENERAL_PROJECTOR_DIRECTIONAL_PORT_TARGET_v1.json')
          r1=L('research/theory_results/RTK_C10_65R1_IN_CLASS_COMPLETED_PROJECTOR_PARITY_RESULT_v1.json')
          q=L('research/theory_results/RTK_C10_65Q_NUMERIC_BPRIME_SLIP_CLOSURE_RESULT_v1.json')
          c=L('research/theory_results/RTK_C10_65R2C_GENERAL_PROJECTOR_DIRECTIONAL_EQUIVALENCE_RESULT_v1.json')
          r2=L('research/theory_targets/RTK_C10_65R2_IN_CLASS_FIRST_RHS_DIAGNOSTIC_PARITY_TARGET_v1.json')
          assert t['status']=='FROZEN_BEFORE_EXECUTION'
          assert r1['classification']=='C10_65R1_IN_CLASS_COMPLETED_PROJECTOR_PARITY_PASS_SCOPED'
          assert q['classification']=='C10_65Q_NUMERIC_BPRIME_SLIP_CLOSURE_PASS_SCOPED'
          assert c['classification']=='C10_65R2C_GENERAL_PROJECTOR_DIRECTIONAL_EQUIVALENCE_PASS_SCOPED'
          assert r2['status']=='FROZEN_BEFORE_IMPLEMENTATION'
          assert r2['frozen_checks']['max_C_vs_independent_local_rhs_relative']==5e-9
          PY
          git rev-parse HEAD | tee c10_65r2d_repo_head.txt
      - name: Compile and execute frozen C-double parity gate
        run: |
          set -euo pipefail
          python3 -m py_compile research/shadow/rtk_c10_65r2d_c_double_general_projector_directional_port.py
          python3 research/shadow/rtk_c10_65r2d_c_double_general_projector_directional_port.py | tee c10_65r2d.log
          grep -q '^C10_65R2D_C_DOUBLE_GENERAL_PROJECTOR_DIRECTIONAL_PORT_PASS_SCOPED ' c10_65r2d.log
      - name: Add provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,datetime
          p='research/theory_results/RTK_C10_65R2D_C_DOUBLE_GENERAL_PROJECTOR_DIRECTIONAL_PORT_RESULT_v1.json'
          d=json.load(open(p)); d['provenance']={'repo_head_at_job_start':open('c10_65r2d_repo_head.txt').read().strip(),'class_upstream_sha':'36cf283628c4a3330ec9fd3d84239bf775f77317','workflow':'rtk-c10-65r2d-c-double-general-projector-directional-port.yml','C_source':'rtk/c10_65r2d_general_projector_dual.c','worker':'research/shadow/rtk_c10_65r2d_c_double_general_projector_directional_port.py','threshold_changed':False,'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          open(p,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - name: Persist result
        run: |
          set -euo pipefail
          cp research/theory_results/RTK_C10_65R2D_C_DOUBLE_GENERAL_PROJECTOR_DIRECTIONAL_PORT_RESULT_v1.json /tmp/r2d.json
          for attempt in 1 2 3 4 5; do
            git fetch origin rtk-class-build
            git reset --hard origin/rtk-class-build
            cp /tmp/r2d.json research/theory_results/RTK_C10_65R2D_C_DOUBLE_GENERAL_PROJECTOR_DIRECTIONAL_PORT_RESULT_v1.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/theory_results/RTK_C10_65R2D_C_DOUBLE_GENERAL_PROJECTOR_DIRECTIONAL_PORT_RESULT_v1.json
            git commit -m 'Record C10.65r2d C double directional port' || exit 0
            if git push origin HEAD:rtk-class-build; then exit 0; fi
          done
          exit 1
