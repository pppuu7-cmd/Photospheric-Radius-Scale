name: RTK Route-B U1 low-k rank perturbation bound

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-lowk-rank-perturbation-bound-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run low-k rank perturbation theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_lowk_rank_perturbation_bound_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_lowk_rank_perturbation_bound_provenance.txt
          python3 rtk/route_b_u1_lowk_rank_perturbation_bound_gate.py | tee u1_lowk_rank_perturbation_bound.log
          grep -q '^RTK_ROUTE_B_U1_LOWK_RANK_PERTURBATION_BOUND_PASS ' u1_lowk_rank_perturbation_bound.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_lowk_rank_perturbation_bound_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_LOWK_RANK_PERTURBATION_BOUND_PASS'
          assert 'sigma_min' in r['sufficient_operator_norm_condition']
          assert '2 eps0' in r['entrywise_sufficient_condition']
          print('U1_LOWK_RANK_PERTURBATION_BOUND_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-lowk-rank-perturbation-bound
          path: |
            u1_lowk_rank_perturbation_bound.log
            u1_lowk_rank_perturbation_bound_result.json
            u1_lowk_rank_perturbation_bound_provenance.txt
            rtk/route_b_u1_lowk_rank_perturbation_bound_gate.py
          if-no-files-found: error
