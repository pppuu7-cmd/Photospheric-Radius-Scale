name: RTK C10 diagnostic completion onset protocol

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - 'research/theory_targets/RTK_C10_DIAGNOSTIC_COMPLETION_ONSET_PROTOCOL_TARGET_v1.json'
      - 'research/shadow/rtk_c10_diagnostic_completion_onset_protocol.py'
      - '.github/workflows/rtk-c10-diagnostic-completion-onset-protocol.yml'

permissions:
  contents: write

jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Run frozen protocol
        run: |
          set -euo pipefail
          python3 -m py_compile research/shadow/rtk_c10_diagnostic_completion_onset_protocol.py
          python3 research/shadow/rtk_c10_diagnostic_completion_onset_protocol.py | tee c10_diagnostic_completion_onset_protocol.log
          grep -q '^C10_DIAGNOSTIC_COMPLETION_ONSET_PROTOCOL_PASS_SCOPED ' c10_diagnostic_completion_onset_protocol.log
      - name: Persist result
        run: |
          set -euo pipefail
          cp c10_diagnostic_completion_onset_protocol_result.json /tmp/result.json
          for attempt in 1 2 3 4 5; do
            git fetch origin rtk-class-build
            git reset --hard origin/rtk-class-build
            cp /tmp/result.json research/theory_results/RTK_C10_DIAGNOSTIC_COMPLETION_ONSET_PROTOCOL_RESULT_v1.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/theory_results/RTK_C10_DIAGNOSTIC_COMPLETION_ONSET_PROTOCOL_RESULT_v1.json
            git commit -m 'Record C10.62a diagnostic completion onset protocol' || exit 0
            if git push origin HEAD:rtk-class-build; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c10-diagnostic-completion-onset-protocol
          path: |
            c10_diagnostic_completion_onset_protocol.log
            c10_diagnostic_completion_onset_protocol_result.json
          if-no-files-found: error
