name: RTK B4 recenter-v4 quarter stationarity

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rtk-b4-recenter-v4-quarter-stationarity
  cancel-in-progress: false

jobs:
  quarter-hessian:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '300'
      RTK_PLANCK_DATA: 'planck_data'
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      RTK_PANTHEON_SHA: '7eb29dc87ba223b4ec8457cd3cccba1216c36fb7'
      RTK_PLANCK_SHA256: '0b73171e3acc671c28184466a45485a2d1c1d93676b832abdfe688c7b04024e6'
      RTK_NUMPY_VERSION: '2.5.2'
      RTK_SCIPY_VERSION: '1.18.0'
      RTK_PYTHON_VERSION: '3.12.3'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Require frozen conditional quarter target and persisted ray clearance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/robustness/B4_NEUTRINO_RTK_RECENTER_V4_QUARTER_STATIONARITY_TARGET_v1.json'))
          r=json.load(open('research/robustness/B4_NEUTRINO_RTK_RECENTER_V4_HALF_EIGENMODE_RAYS_RESULT_v1.json'))
          assert t['classification']=='B4_NEUTRINO_RTK_RECENTER_V4_QUARTER_STATIONARITY_TARGET_V1_FROZEN'
          assert t['stencil_scale']==0.25
          assert r['classification']==t['prerequisite']['required_classification']
          assert r['max_exact_improvement_eff']<=0.005
          assert r['center']==t['center']
          print('B4_V4_QUARTER_PREREQUISITE_PASS')
          PY
          python3 -m py_compile rtk/b4_neutrino_recenter_v4_quarter_stationarity.py rtk/prepare_inference_core.py

      - name: Prepare pinned hardened CLASS tree
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_public
          git -C class_public reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          git clone https://github.com/dscolnic/Pantheon.git class_public/pantheon
          git -C class_public/pantheon reset --hard "$RTK_PANTHEON_SHA"
          test "$(git -C class_public rev-parse HEAD)" = "$RTK_CLASS_UPSTREAM_SHA"
          test "$(git -C class_public/pantheon rev-parse HEAD)" = "$RTK_PANTHEON_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_nonlocal_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py rtk/prepare_inference_core.py rtk/b4_neutrino_recenter_v4_quarter_stationarity.py class_public/
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'A_s_ad\|n_s_ad' inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py
          grep -q 'RTK_PLANCK_DATA' inference_core.py

      - name: Build CLASS and locked runtime
        run: |
          set -euo pipefail
          make -C class_public -j2 class
          test "$(python3 -c 'import platform;print(platform.python_version())')" = "$RTK_PYTHON_VERSION"
          python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' "numpy==$RTK_NUMPY_VERSION" "scipy==$RTK_SCIPY_VERSION"
          python3 -m pip freeze | sort | tee b4_recenter_v4_quarter_pip_freeze.txt

      - name: Download and verify Planck baseline
        working-directory: class_public
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          echo "$RTK_PLANCK_SHA256  planck.tar.gz" | sha256sum -c -
          mkdir planck_data && tar -xzf planck.tar.gz -C planck_data

      - name: Evaluate conditional frozen quarter Hessian
        working-directory: class_public
        run: |
          set -euo pipefail
          python3 b4_neutrino_recenter_v4_quarter_stationarity.py | tee ../b4_recenter_v4_quarter.log
          grep -q B4_RECENTER_V4_QUARTER_STATIONARITY_COMPLETE ../b4_recenter_v4_quarter.log
          python3 - <<'PY'
          import json
          s=json.load(open('../output/b4_neutrino_recenter_v4_quarter_stationarity/summary.json'))
          assert s['classification']=='B4_NEUTRINO_RTK_RECENTER_V4_QUARTER_STATIONARITY_COMPLETE'
          assert s['stencil_scale']==0.25
          assert s['center_replay_abs_error']<=2e-6
          assert s['decision'] in ('RECENTER_REQUIRED','RECENTER_CLEAR_NONPD_QUARTER_EIGENMODE_RAYS_REQUIRED','RECENTER_CLEAR_PD_FRESH_TREE_REQUIRED')
          print('B4_V4_QUARTER_ARTIFACT_PASS',s['decision'],s['eff']['best_improvement'],s['eff']['positive_definite'],s['eff']['eigenvalues_y'][0])
          PY

      - name: Persist scientific result on research branch
        if: success()
        run: |
          set -euo pipefail
          cp output/b4_neutrino_recenter_v4_quarter_stationarity/summary.json research/robustness/B4_NEUTRINO_RTK_RECENTER_V4_QUARTER_RESULT_v1.json
          python3 - <<'PY'
          import json, datetime
          r=json.load(open('research/robustness/B4_NEUTRINO_RTK_RECENTER_V4_QUARTER_RESULT_v1.json'))
          s={
            'schema':'RTK_B4_CURRENT_STATE_v3',
            'updated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
            'status':'RECENTER_V4_QUARTER_STATIONARITY_COMPLETE',
            'objective':r['objective'], 'current_center':r['center'],
            'S_center_eff':r['eff']['S_center'], 'stencil_scale':0.25,
            'best_exact_S_eff':r['eff']['best_exact_S'], 'best_improvement_eff':r['eff']['best_improvement'],
            'positive_definite':r['eff']['positive_definite'], 'min_eigenvalue_y':r['eff']['eigenvalues_y'][0],
            'decision':r['decision'],
            'source_result':'research/robustness/B4_NEUTRINO_RTK_RECENTER_V4_QUARTER_RESULT_v1.json',
            'guard':'B4 minimal-neutrino objective only; no absolute comparison to massless A5 and no global evidence.'
          }
          open('research/state/B4_current.json','w').write(json.dumps(s,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/robustness/B4_NEUTRINO_RTK_RECENTER_V4_QUARTER_RESULT_v1.json research/state/B4_current.json
          git commit -m 'Persist B4 v4 quarter stationarity result'
          git push origin HEAD:rtk-class-build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-b4-recenter-v4-quarter-stationarity
          path: |
            b4_recenter_v4_quarter.log
            b4_recenter_v4_quarter_pip_freeze.txt
            output/b4_neutrino_recenter_v4_quarter_stationarity/
          if-no-files-found: warn
