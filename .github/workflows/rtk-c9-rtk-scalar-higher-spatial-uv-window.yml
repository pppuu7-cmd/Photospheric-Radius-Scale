name: RTK C9 scalar higher-spatial UV window

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-c9-rtk-scalar-higher-spatial-uv-window-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run higher-spatial UV window theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/c9_rtk_scalar_higher_spatial_uv_window_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee c9_rtk_scalar_higher_spatial_uv_window_provenance.txt
          python3 rtk/c9_rtk_scalar_higher_spatial_uv_window_gate.py | tee c9_rtk_scalar_higher_spatial_uv_window.log
          grep -q '^RTK_C9_RTK_SCALAR_HIGHER_SPATIAL_UV_WINDOW_PASS ' c9_rtk_scalar_higher_spatial_uv_window.log
          python3 - <<'PY'
          import json
          r=json.load(open('c9_rtk_scalar_higher_spatial_uv_window_result.json'))
          assert r['classification']=='RTK_C9_RTK_SCALAR_HIGHER_SPATIAL_UV_WINDOW_PASS'
          assert r['conservative_B9_illustration']['k_unit_over_k_obs']>1e15
          print('C9_RTK_SCALAR_HIGHER_SPATIAL_UV_WINDOW_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c9-rtk-scalar-higher-spatial-uv-window
          path: |
            c9_rtk_scalar_higher_spatial_uv_window.log
            c9_rtk_scalar_higher_spatial_uv_window_result.json
            c9_rtk_scalar_higher_spatial_uv_window_provenance.txt
            rtk/c9_rtk_scalar_higher_spatial_uv_window_gate.py
          if-no-files-found: error
