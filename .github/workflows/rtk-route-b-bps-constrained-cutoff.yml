name: RTK Route-B BPS constrained cutoff theorem

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-bps-constrained-cutoff-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Run exact constrained BPS cutoff theorem
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
          python3 -m py_compile rtk/route_b_bps_constrained_cutoff.py
          python3 rtk/route_b_bps_constrained_cutoff.py | tee route_b_bps_constrained_cutoff.log
          grep -q RTK_ROUTE_B_BPS_CONSTRAINED_CUTOFF_PASS route_b_bps_constrained_cutoff.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-bps-constrained-cutoff
          path: route_b_bps_constrained_cutoff.log
          if-no-files-found: error
