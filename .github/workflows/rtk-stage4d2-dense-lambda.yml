name: RTK Stage 4D2 shared-basin lambda profile

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rtk-stage4d2-dense-lambda.yml'

jobs:
  profile:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        mapping: [eff, k01]
        lambda_D: ['50000','52500','55000','57500','60000']
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '120'
      RTK_CACHE_KEY_VERSION: 'exact-float-v1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
      - name: Prepare exact likelihood tree
        run: |
          git clone --depth 1 --branch nonlocal https://github.com/dirian/class_public.git class_public
          git clone --depth 1 https://github.com/dscolnic/Pantheon.git class_public/pantheon
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py class_public/joint_profile_runner.py
          cp rtk/prepare_inference_core.py class_public/prepare_inference_core.py
          cp rtk/stage4d1_cobyqa_refine.py class_public/stage4d1_cobyqa_refine.py
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py
      - name: Build CLASS
        working-directory: class_public
        run: make -j2 class
      - name: Install likelihood dependencies
        run: python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' numpy scipy
      - name: Download Planck package
        working-directory: class_public
        run: |
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          mkdir planck_data
          tar -xzf planck.tar.gz -C planck_data
      - name: Run shared-basin fixed-lambda COBYQA profile
        working-directory: class_public
        run: |
          python3 stage4d1_cobyqa_refine.py planck_data '${{ matrix.lambda_D }}' '${{ matrix.mapping }}' \
            0.6905121965689395 0.046831928061712685 0.2529636778757895 \
            2.069477450200849e-9 0.9641699662731723 6.855358068811081 \
            | tee ../shared_${{ matrix.mapping }}_${{ matrix.lambda_D }}.log
          grep -q STAGE4D1_COBYQA_RESULT ../shared_${{ matrix.mapping }}_${{ matrix.lambda_D }}.log
          find output/stage4d1_cobyqa/${{ matrix.mapping }} -name cobyqa_summary.json -print -exec cat {} \;
      - name: Upload shared-basin profile artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtk-stage4d2-shared-${{ matrix.mapping }}-${{ matrix.lambda_D }}
          path: |
            shared_${{ matrix.mapping }}_${{ matrix.lambda_D }}.log
            class_public/output/stage4d1_cobyqa/${{ matrix.mapping }}/**/cobyqa_summary.json
            class_public/output/stage4d1_cobyqa/${{ matrix.mapping }}/**/cobyqa_trace.csv
          if-no-files-found: error
