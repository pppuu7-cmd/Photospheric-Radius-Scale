name: RTK Route-B U1 PPN family-II RTK slice gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-ppn-family2-rtk-slice-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run U1 family-II RTK slice theorem
        run: |
          set -euo pipefail
          echo "RTK_SOURCE_SHA=$(git rev-parse HEAD)" | tee rtk_u1_ppn_family2_provenance.txt
          python -m py_compile rtk/route_b_u1_ppn_family2_rtk_slice_gate.py
          python rtk/route_b_u1_ppn_family2_rtk_slice_gate.py | tee rtk_u1_ppn_family2.log
          grep -q '^RTK_ROUTE_B_U1_PPN_FAMILY2_RTK_SLICE_GATE_PASS ' rtk_u1_ppn_family2.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-ppn-family2-rtk-slice
          path: |
            rtk_u1_ppn_family2.log
            rtk_u1_ppn_family2_provenance.txt
          if-no-files-found: error
