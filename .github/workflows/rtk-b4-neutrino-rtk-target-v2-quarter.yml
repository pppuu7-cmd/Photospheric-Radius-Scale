name: RTK B4 neutrino RTK target-v2 quarter stationarity

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rtk-b4-neutrino-rtk-target-v2-quarter
  cancel-in-progress: false

jobs:
  quarter-hessian:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CLIPY_NOJAX: '1'
      OMP_NUM_THREADS: '2'
      RTK_CLASS_TIMEOUT: '300'
      RTK_PLANCK_DATA: 'planck_data'
      RTK_B4_STENCIL_SCALE: '0.25'
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      RTK_PANTHEON_SHA: '7eb29dc87ba223b4ec8457cd3cccba1216c36fb7'
      RTK_PLANCK_SHA256: '0b73171e3acc671c28184466a45485a2d1c1d93676b832abdfe688c7b04024e6'
      RTK_NUMPY_VERSION: '2.5.2'
      RTK_SCIPY_VERSION: '1.18.0'
      RTK_PYTHON_VERSION: '3.12.3'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Require frozen conditional quarter target and ray precondition
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          q=json.load(open('research/robustness/B4_NEUTRINO_RTK_TARGET_V2_QUARTER_STATIONARITY_TARGET_v1.json'))
          r=json.load(open(q['dispatch_precondition']['result']))
          t=json.load(open(q['parent_center_target']))
          assert q['classification']=='B4_NEUTRINO_RTK_TARGET_V2_QUARTER_STATIONARITY_TARGET_V1_FROZEN'
          assert q['status']=='CONDITIONAL_PREREGISTRATION_BEFORE_HALF_EIGENMODE_RAY_RESULT'
          assert r['classification']==q['dispatch_precondition']['required_classification']=='B4_TARGET_V2_HALF_EIGENMODE_RAYS_NO_DESCENT_GT_0P005'
          assert r['max_exact_improvement_eff']<=q['dispatch_precondition']['required_max_exact_improvement_le']==0.005
          assert q['stencil_scale']==0.25
          assert q['center']==t['models']['RTK']['center']
          assert q['objective']==t['objective']=='matched-ultra-linstep2+dense-BOSS+nu0p06-additive-v1'
          print('B4_TARGET_V2_QUARTER_PRECONDITION_PASS')
          PY
          cp research/robustness/b4_neutrino_rtk_ray_recenter_target_v2.json research/robustness/b4_neutrino_stationarity_targets_v1.json
          python3 -m py_compile rtk/neutrino_stationarity_hessian.py rtk/prepare_inference_core.py
          git rev-parse HEAD | tee b4_target_v2_quarter_source.txt
      - name: Prepare pinned hardened CLASS tree
        run: |
          set -euo pipefail
          rm -rf class_public
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_public
          git -C class_public reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          git clone https://github.com/dscolnic/Pantheon.git class_public/pantheon
          git -C class_public/pantheon reset --hard "$RTK_PANTHEON_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_public/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_public/include/
          python3 rtk/apply_rtk_class_patch.py class_public
          python3 rtk/upgrade_rtk_inputs.py class_public
          python3 rtk/upgrade_rtk_nonlocal_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_initial_conditions.py class_public
          python3 rtk/upgrade_rtk_matter_sources.py class_public
          python3 rtk/upgrade_rtk_gamma_root.py class_public
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_public
          cp rtk/joint_profile_runner.py rtk/prepare_inference_core.py rtk/neutrino_stationarity_hessian.py class_public/
          cp rtk/data/boss_DR12Consensus_final.dat rtk/data/final_consensus_covtot_dM_Hz_fsig.txt class_public/
          cd class_public
          python3 prepare_inference_core.py joint_profile_runner.py inference_core.py
          ! grep -q 'round(float(p\[k\]),12)' inference_core.py
      - name: Build and install locked runtime
        run: |
          set -euo pipefail
          make -C class_public -j2 class
          test "$(python3 -c 'import platform;print(platform.python_version())')" = "$RTK_PYTHON_VERSION"
          python3 -m pip install --disable-pip-version-check 'clipy-like==0.15' "numpy==$RTK_NUMPY_VERSION" "scipy==$RTK_SCIPY_VERSION"
          python3 -m pip freeze | sort | tee b4_target_v2_quarter_pip_freeze.txt
      - name: Download and verify Planck baseline
        working-directory: class_public
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 -o planck.tar.gz 'https://pla.esac.esa.int/pla/aio/product-action?COSMOLOGY.FILE_ID=COM_Likelihood_Data-baseline_R3.00.tar.gz'
          echo "$RTK_PLANCK_SHA256  planck.tar.gz" | sha256sum -c -
          mkdir planck_data && tar -xzf planck.tar.gz -C planck_data
      - name: Run exact quarter-scale Hessian
        working-directory: class_public
        run: |
          set -euo pipefail
          python3 neutrino_stationarity_hessian.py RTK | tee ../b4_target_v2_quarter.log
          grep -q 'B4_NEUTRINO_STATIONARITY_HESSIAN_COMPLETE RTK 0.25' ../b4_target_v2_quarter.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-b4-neutrino-rtk-target-v2-quarter
          path: |
            b4_target_v2_quarter.log
            b4_target_v2_quarter_source.txt
            b4_target_v2_quarter_pip_freeze.txt
            output/b4_neutrino_stationarity/rtk/scale_0.25/
          if-no-files-found: warn
      - name: Persist quarter result
        if: success()
        run: |
          set -euo pipefail
          cp output/b4_neutrino_stationarity/rtk/scale_0.25/summary.json /tmp/b4_quarter.json
          git fetch origin rtk-class-build
          git reset --hard origin/rtk-class-build
          cp /tmp/b4_quarter.json research/robustness/B4_NEUTRINO_RTK_TARGET_V2_QUARTER_RESULT_v1.json
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          r=json.load(open('research/robustness/B4_NEUTRINO_RTK_TARGET_V2_QUARTER_RESULT_v1.json'))
          e=r['eff']; tol=0.005
          if e['best_improvement']>tol:
              decision='QUARTER_RECENTER_REQUIRED'
          elif e['positive_definite']:
              decision='QUARTER_RECENTER_CLEAR_PD_FRESH_TREE_REQUIRED'
          else:
              decision='QUARTER_RECENTER_CLEAR_NONPD_RAYS_REQUIRED'
          s={
            'schema':'RTK_B4_CURRENT_STATE_v2',
            'updated_utc':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'objective':r['objective'],
            'status':decision,
            'center':r['center'],
            'S_center_eff':e['S_center'],
            'best_exact_S_eff':e['best_exact_S'],
            'best_improvement_eff':e['best_improvement'],
            'positive_definite_eff':e['positive_definite'],
            'min_eigenvalue_eff':min(e['eigenvalues_y']),
            'quarter_result':'research/robustness/B4_NEUTRINO_RTK_TARGET_V2_QUARTER_RESULT_v1.json',
            'recenter_tolerance_S':tol,
            'next_gate':('independent fresh-tree quarter-scale replay' if decision=='QUARTER_RECENTER_CLEAR_PD_FRESH_TREE_REQUIRED' else 'freeze the required recenter or exact eigenmode-ray target before further execution'),
            'guard':'B4 minimal-neutrino objective only; no massless/global/model-selection claim.'
          }
          json.dump(s,open('research/state/B4_current.json','w'),indent=2,sort_keys=True)
          open('research/state/B4_current.json','a').write('\n')
          PY
          git config user.name 'rtk-b4-quarter'
          git config user.email 'actions@users.noreply.github.com'
          git add research/robustness/B4_NEUTRINO_RTK_TARGET_V2_QUARTER_RESULT_v1.json research/state/B4_current.json
          git commit -m 'Record B4 target-v2 quarter-scale stationarity result'
          git push origin HEAD:rtk-class-build
