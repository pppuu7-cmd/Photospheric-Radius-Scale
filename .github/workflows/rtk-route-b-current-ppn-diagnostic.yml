name: RTK Route-B current PPN diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-current-ppn-diagnostic-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Run current pointwise PPN diagnostic
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
          python3 -m py_compile rtk/route_b_current_ppn_diagnostic.py
          python3 rtk/route_b_current_ppn_diagnostic.py | tee route_b_current_ppn_diagnostic.log
          grep -q RTK_ROUTE_B_CURRENT_PPN_DIAGNOSTIC_PASS route_b_current_ppn_diagnostic.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-current-ppn-diagnostic
          path: route_b_current_ppn_diagnostic.log
          if-no-files-found: error
