name: RTK Route-B U1 neutral-RTK low-k e11 rank immunity

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-rtk-lowk-e11-rank-immunity-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run neutral-RTK low-k e11 rank-immunity theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_rtk_lowk_e11_rank_immunity_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_rtk_lowk_e11_rank_immunity_provenance.txt
          python3 rtk/route_b_u1_rtk_lowk_e11_rank_immunity_gate.py | tee u1_rtk_lowk_e11_rank_immunity.log
          grep -q '^RTK_ROUTE_B_U1_RTK_LOWK_E11_RANK_IMMUNITY_PASS ' u1_rtk_lowk_e11_rank_immunity.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_rtk_lowk_e11_rank_immunity_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_RTK_LOWK_E11_RANK_IMMUNITY_PASS'
          assert 'b2^2 |k|^4' in r['leading_determinant']
          assert 'O(|k|^6)' in r['order_identity']
          assert 'filtered-matter' in r['next_gate']
          print('U1_RTK_LOWK_E11_RANK_IMMUNITY_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-rtk-lowk-e11-rank-immunity
          path: |
            u1_rtk_lowk_e11_rank_immunity.log
            u1_rtk_lowk_e11_rank_immunity_result.json
            u1_rtk_lowk_e11_rank_immunity_provenance.txt
            rtk/route_b_u1_rtk_lowk_e11_rank_immunity_gate.py
          if-no-files-found: error
