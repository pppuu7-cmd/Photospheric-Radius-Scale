name: RTK Route-B U1 coordinate-compensator perturbation obstruction

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/rtk-route-b-u1-coordinate-compensator-perturbation-obstruction-trigger.txt'

permissions:
  contents: read

jobs:
  theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install exact symbolic runtime
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run perturbation obstruction theorem
        run: |
          set -euo pipefail
          python3 -m py_compile rtk/route_b_u1_coordinate_compensator_perturbation_obstruction_gate.py
          echo "research_source_commit=$(git rev-parse HEAD)" | tee u1_coordinate_compensator_perturbation_obstruction_provenance.txt
          python3 rtk/route_b_u1_coordinate_compensator_perturbation_obstruction_gate.py | tee u1_coordinate_compensator_perturbation_obstruction.log
          grep -q '^RTK_ROUTE_B_U1_COORDINATE_COMPENSATOR_PERTURBATION_OBSTRUCTION ' u1_coordinate_compensator_perturbation_obstruction.log
          python3 - <<'PY'
          import json
          r=json.load(open('u1_coordinate_compensator_perturbation_obstruction_result.json'))
          assert r['classification']=='RTK_ROUTE_B_U1_COORDINATE_COMPENSATOR_PERTURBATION_OBSTRUCTION'
          assert r['status_scope']=='BLACK_SCOPED_COORDINATE_ONLY_FULL_PERTURBATIVE_A_SOURCE_CANCELLATION'
          assert 'delta Sigma=0' in r['counterdirection']
          print('U1_COORDINATE_COMPENSATOR_PERTURBATION_OBSTRUCTION_ARTIFACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-route-b-u1-coordinate-compensator-perturbation-obstruction
          path: |
            u1_coordinate_compensator_perturbation_obstruction.log
            u1_coordinate_compensator_perturbation_obstruction_result.json
            u1_coordinate_compensator_perturbation_obstruction_provenance.txt
            rtk/route_b_u1_coordinate_compensator_perturbation_obstruction_gate.py
          if-no-files-found: error
