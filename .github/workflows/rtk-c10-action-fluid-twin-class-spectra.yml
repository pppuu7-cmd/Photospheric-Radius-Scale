name: RTK C10 action-fluid twin CLASS spectra

on:
  workflow_dispatch:
  push:
    branches: [rtk-class-build]
    paths:
      - '.github/rtk-c10-action-fluid-twin-class-spectra-trigger.txt'
      - '.github/workflows/rtk-c10-action-fluid-twin-class-spectra.yml'
      - 'rtk/apply_rtk_action_fluid_shadow_patch.py'
      - 'research/theory_targets/RTK_C10_ACTION_FLUID_TWIN_CLASS_SPECTRA_TARGET_v1.json'

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RTK_CLASS_UPSTREAM_SHA: '36cf283628c4a3330ec9fd3d84239bf775f77317'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rtk-class-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Verify frozen target and historical RTK reference
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('research/theory_targets/RTK_C10_ACTION_FLUID_TWIN_CLASS_SPECTRA_TARGET_v1.json'))
          s=json.load(open('research/state/current.json')); fr=s['final_replay_result']
          assert t['status']=='FROZEN_BEFORE_TWIN_CLASS_SPECTRA_RESULT'
          assert fr['status']=='PASS'
          assert abs(float(fr['rtk']['expected_score_eff'])-t['reference']['required_score'])<1e-12
          assert fr['provenance']['class_upstream_commit']==t['reference']['class_upstream_sha']
          print('C10_TWIN_CLASS_TARGET_PASS')
          PY
          git rev-parse HEAD | tee c10_twin_class_provenance.txt
      - name: Prepare identical pinned production and shadow trees
        run: |
          set -euo pipefail
          git clone --branch nonlocal https://github.com/dirian/class_public.git class_prod
          git -C class_prod reset --hard "$RTK_CLASS_UPSTREAM_SHA"
          test "$(git -C class_prod rev-parse HEAD)" = "$RTK_CLASS_UPSTREAM_SHA"
          cp rtk/khronon_background.c rtk/khronon_perturbations.c class_prod/source/
          cp rtk/khronon_background.h rtk/khronon_perturbations.h class_prod/include/
          python3 rtk/apply_rtk_class_patch.py class_prod
          python3 rtk/upgrade_rtk_inputs.py class_prod
          python3 rtk/upgrade_rtk_nonlocal_initial_conditions.py class_prod
          python3 rtk/upgrade_rtk_initial_conditions.py class_prod
          python3 rtk/upgrade_rtk_matter_sources.py class_prod
          python3 rtk/upgrade_rtk_gamma_root.py class_prod
          python3 rtk/upgrade_rtk_spectra_endpoint.py class_prod
          cp -a class_prod class_shadow
          python3 rtk/apply_rtk_action_fluid_shadow_patch.py class_shadow
          cmp rtk/khronon_perturbations.c class_prod/source/khronon_perturbations.c
          ! cmp -s class_prod/source/khronon_perturbations.c class_shadow/source/khronon_perturbations.c
      - name: Build both trees
        run: |
          set -euo pipefail
          make -C class_prod -j2 class
          make -C class_shadow -j2 class
      - name: Write identical RTK inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          t=json.load(open('research/theory_targets/RTK_C10_ACTION_FLUID_TWIN_CLASS_SPECTRA_TARGET_v1.json'))
          p=json.load(open('research/state/current.json'))['final_replay_result']['rtk']['params']
          z=','.join(map(str,t['spectra']['z_pk']))
          pr=t['precision']
          body=f'''h = {p['h']!r}
          T_cmb = 2.7255
          Omega_b = {p['Ob']!r}
          Omega_khronon = {p['Om']!r}
          lambda_D = {p['lam']!r}
          Omega_Lambda = 0.
          model = 2.
          N_ur = 3.046
          N_ncdm = 0
          Omega_k = 0.
          Omega_fld = 0.
          Omega_scf = 0.
          recombination = RECFAST
          reio_parametrization = reio_camb
          z_reio = {p['zre']!r}
          output = {t['spectra']['output']}
          lensing = yes
          gauge = newtonian
          A_s = {p['As']!r}
          n_s = {p['ns']!r}
          l_max_scalars = {t['spectra']['l_max_scalars']}
          P_k_max_h/Mpc = {t['spectra']['P_k_max_h_Mpc']}
          z_pk = {z}
          k_max_tau0_over_l_max = {pr['k_max_tau0_over_l_max']}
          k_per_decade_for_bao = {pr['k_per_decade_for_bao']}
          k_per_decade_for_pk = {pr['k_per_decade_for_pk']}
          l_linstep = {pr['l_linstep']}
          l_logstep = {pr['l_logstep']}
          perturb_sampling_stepsize = {pr['perturb_sampling_stepsize']}
          tol_background_integration = {pr['tol_background_integration']}
          tol_perturb_integration = {pr['tol_perturb_integration']}
          tol_thermo_integration = {pr['tol_thermo_integration']}
          root = output/twin_
          background_verbose = 1
          perturbations_verbose = 0
          spectra_verbose = 0
          '''
          for d in ('class_prod','class_shadow'):
              pathlib.Path(d,'twin.ini').write_text(body)
              pathlib.Path(d,'output').mkdir(exist_ok=True)
          PY
      - name: Run production and action-shadow spectra
        run: |
          set -euo pipefail
          (cd class_prod && ./class twin.ini) > c10_twin_prod.log 2>&1
          (cd class_shadow && ./class twin.ini) > c10_twin_shadow.log 2>&1
          grep 'RTK_LOG_GAMMA_ROOT' c10_twin_prod.log | tail -1 | tee c10_twin_prod_gamma.txt
          grep 'RTK_LOG_GAMMA_ROOT' c10_twin_shadow.log | tail -1 | tee c10_twin_shadow_gamma.txt
      - name: Compare spectra deterministically
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.5.2
          python3 - <<'PY'
          import glob,json,os,re
          import numpy as np
          def gamma(path):
              m=re.search(r'gamma=([0-9.eE+\-]+)',open(path).read());
              if not m: raise SystemExit('gamma missing '+path)
              return float(m.group(1))
          gp,gs=gamma('c10_twin_prod_gamma.txt'),gamma('c10_twin_shadow_gamma.txt')
          if abs(gp-gs)>1e-13*max(1.0,abs(gp)): raise SystemExit(f'gamma mismatch {gp} {gs}')
          pf={os.path.basename(x):x for x in glob.glob('class_prod/output/twin_*cl.dat')+glob.glob('class_prod/output/twin_*pk.dat')}
          sf={os.path.basename(x):x for x in glob.glob('class_shadow/output/twin_*cl.dat')+glob.glob('class_shadow/output/twin_*pk.dat')}
          if not pf or set(pf)!=set(sf): raise SystemExit(f'output file mismatch prod={sorted(pf)} shadow={sorted(sf)}')
          rows=[]; overall=0.0
          for name in sorted(pf):
              a=np.loadtxt(pf[name]); b=np.loadtxt(sf[name])
              if a.shape!=b.shape: raise SystemExit(f'shape mismatch {name} {a.shape} {b.shape}')
              if a.ndim==1: a=a[:,None]; b=b[:,None]
              # first column is coordinate; require numerical agreement and exclude from spectral metric
              coord=float(np.max(np.abs(a[:,0]-b[:,0])))
              vals=a[:,1:] if a.shape[1]>1 else a
              vals2=b[:,1:] if b.shape[1]>1 else b
              scale=float(np.max(np.abs(vals))) if vals.size else 0.0
              diff=float(np.max(np.abs(vals2-vals))) if vals.size else 0.0
              norm=diff/max(scale,1e-300)
              overall=max(overall,norm)
              rows.append({'file':name,'shape':list(a.shape),'coord_max_abs':coord,'max_abs_diff':diff,'reference_max_abs':scale,'max_norm_abs_diff':norm})
          cls=('TWIN_SPECTRA_NEGLIGIBLE_LT_1E8' if overall<1e-8 else
               'TWIN_SPECTRA_TINY_LT_1E6' if overall<1e-6 else
               'TWIN_SPECTRA_SMALL_LT_1E4' if overall<1e-4 else
               'TWIN_SPECTRA_MATERIAL_GE_1E4')
          out={'classification':'C10_ACTION_FLUID_TWIN_CLASS_SPECTRA_COMPLETE','difference_class':cls,
               'overall_max_normalized_abs_difference':overall,'gamma_prod':gp,'gamma_shadow':gs,
               'files':rows,'scope':'fixed historical RTK parameters; same pinned CLASS/background/precision; only lower-derivative Khronon perturbation formulas differ',
               'non_claims':['not a likelihood difference','not a completed U1 metric solver','not a refit','normalized file difference is not an experimental sigma']}
          open('c10_action_fluid_twin_class_spectra_result.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(out['classification'],cls,overall)
          PY
      - name: Persist result
        run: |
          set -euo pipefail
          cp c10_action_fluid_twin_class_spectra_result.json /tmp/result.json
          for attempt in 1 2 3 4 5; do
            git fetch origin rtk-class-build
            git reset --hard origin/rtk-class-build
            cp /tmp/result.json research/theory_results/RTK_C10_ACTION_FLUID_TWIN_CLASS_SPECTRA_RESULT_v1.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/theory_results/RTK_C10_ACTION_FLUID_TWIN_CLASS_SPECTRA_RESULT_v1.json
            git commit -m 'Record C10 action-fluid twin CLASS spectra' || exit 0
            if git push origin HEAD:rtk-class-build; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtk-c10-action-fluid-twin-class-spectra
          path: |
            c10_twin_prod.log
            c10_twin_shadow.log
            c10_twin_prod_gamma.txt
            c10_twin_shadow_gamma.txt
            c10_action_fluid_twin_class_spectra_result.json
            class_prod/output/twin_*cl.dat
            class_prod/output/twin_*pk.dat
            class_shadow/output/twin_*cl.dat
            class_shadow/output/twin_*pk.dat
          if-no-files-found: warn
